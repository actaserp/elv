<!DOCTYPE html>
<html lang="ko">
<style>
  .btn-clear { display: none !important; }
  .btn-close { display: none !important; }
  .card-list { padding: 8px 12px 80px; }
  .site-card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.10); margin-bottom:10px; padding:14px 16px; cursor:pointer; }
  .site-card:active { box-shadow:0 2px 8px rgba(0,0,0,0.18); }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .card-title { font-size:15px; font-weight:700; color:#222; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#e8f0fe; color:#2c4f9e; font-weight:600; flex-shrink:0; margin-left:8px; }
  .card-badge.img { background:#fff3e0; color:#e65100; }
  .card-row { display:flex; font-size:13px; color:#555; margin-top:3px; gap:4px; }
  .card-label { color:#999; min-width:55px; flex-shrink:0; }
  .card-value { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-count { padding:4px 14px; font-size:12px; color:#888; }
  .empty-msg { text-align:center; padding:60px 20px; color:#bbb; font-size:14px; }
  .popup-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:9000; justify-content:center; align-items:flex-end; }
  .popup-overlay.active { display:flex; }
  .popup-sheet { background:#fff; width:100%; max-height:80vh; border-radius:16px 16px 0 0; overflow:hidden; display:flex; flex-direction:column; }
  .popup-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #eee; font-weight:700; font-size:16px; flex-shrink:0; }
  .popup-close { width: 0%; background:none; border:none; font-size:24px; cursor:pointer; color:#666; line-height:1; }
  .popup-body { overflow-y:auto; flex:1; padding:16px 20px 30px; }
  .popup-footer { padding:12px 20px; border-top:1px solid #eee; display:flex; gap:8px; flex-shrink:0; }
  .btn-download-footer { flex:1; padding:12px; background:#2c4f9e; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .detail-section-title { font-size:13px; font-weight:700; color:#444; margin:14px 0 6px; padding-bottom:4px; border-bottom:2px solid #dce6f1; }
  .detail-section-title:first-child { margin-top:0; }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px solid #f0f0f0; font-size:14px; gap:12px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { color:#999; min-width:65px; flex-shrink:0; font-size:13px; }
  .detail-value { color:#222; flex:1; word-break:break-all; }
  .file-item { align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #f0f0f0; gap:10px; }
  .file-item:last-child { border-bottom:none; }
  .file-info { display:flex; align-items:center; gap:8px; flex:1; overflow:hidden; }
  .file-icon { font-size:18px; flex-shrink:0; }
  .file-name { font-size:13px; color:#333; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-size { font-size:11px; color:#999; flex-shrink:0; }
  .btn-file-dl { padding:5px 12px; background:#546e7a; color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .img-preview { width:100%; border-radius:8px; margin:8px 0; display:block; }

  /* ── AI 스마트 검색 ── */
  .ai-search { margin:10px 12px 6px; padding:12px; border-radius:12px; background:#f5f9ff; border:1px solid #c7d8fb; }
  .ai-search-label { font-size:14px; font-weight:700; color:#1e4fa8; margin-bottom:8px; }
  .ai-search-line { display:flex; gap:6px; }
  .ai-search-line input { flex:1; min-width:0; height:40px; padding:0 12px; border:1px solid #c7d8fb; border-radius:8px; font-size:14px; background:#fff; }
  .ai-search-line button { height:40px; padding:0 16px; border:none; border-radius:8px; background:#2c4f9e; color:#fff; font-size:14px; font-weight:600; white-space:nowrap; }
  .ai-search-hint { font-size:12px; color:#6b7280; margin-top:6px; }
  .ai-rel { font-size:11px; padding:2px 8px; border-radius:10px; background:#2c4f9e; color:#fff; font-weight:700; flex-shrink:0; margin-left:8px; }
  .ai-where { font-size:11px; color:#6b7280; margin-top:4px; }
  .ai-snippet { font-size:13px; color:#374151; margin-top:6px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ai-snippet mark, .card-title mark { background:#fff1a8; color:inherit; padding:0 1px; }
  .ai-back { display:inline-block; margin-left:8px; color:#2c4f9e; font-weight:600; cursor:pointer; }
  .ai-skel { height:74px; border-radius:10px; margin-bottom:10px; background:linear-gradient(90deg,#eef2f7 25%,#f7f9fc 37%,#eef2f7 63%); background-size:400% 100%; animation:aiSkel 1.2s ease infinite; }
  @keyframes aiSkel { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }
</style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTAS EMMS</title>
  <meta name="ctx" th:content="@{/}">
  <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
  <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
  <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script th:src="@{/assets_mobile/js/ui.js}"></script>
  <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/Mobile.js}"></script>
  <script th:src="@{/js/ai_fault.js}"></script>
</head>
<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">
  <div class="mobile-layout-header">
    <header>
      <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
      <div class="left" style="margin-left:35px; font-size:25px;"><h2>자료실</h2></div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>
  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>
  <div class="mobile-layout-contents" style="display:block;">
    <div class="layout-contents">
      <!-- 기술자료 지능형 검색: 증상·상황 문장으로 제목·내용·첨부파일명을 찾는다 -->
      <div class="ai-search">
        <div class="ai-search-label">🤖 AI 스마트 검색</div>
        <div class="ai-search-line">
          <input type="search" id="aiQuery" placeholder="예) 카 내 조명이 자꾸 꺼져요" enterkeyhint="search">
          <button type="button" onclick="aiSearch()">검색</button>
        </div>
        <div class="ai-search-hint">무엇이 궁금하신가요? 제목을 몰라도 증상이나 상황을 문장으로 입력하세요.</div>
      </div>
      <div class="search-wrap">
        <div class="srch-tit aco-hd">
          <p>기본검색</p>
          <a href="#" title="열기/닫기" class="btn-aco">
            <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
          </a>
        </div>
        <div class="srch-cont aco-cont">
          <dl>
            <dt>조회기간</dt>
            <dd style="display:flex; gap:6px; align-items:center;">
              <input type="date" id="searchFromDate" style="flex:1;">
              <span>~</span>
              <input type="date" id="searchToDate" style="flex:1;">
            </dd>
          </dl>
          <dl>
            <dt>제목</dt>
            <dd><input type="text" id="searchKeyword" placeholder="제목을 입력하세요"></dd>
          </dl>
          <div class="srch-btn">
            <button class="btn-dark" onclick="handleSearch()">조회</button>
          </div>
        </div>
      </div>
      <div class="result-count" id="resultCount"></div>
      <div class="card-list" id="cardList">
        <div class="empty-msg">조회 버튼을 눌러 목록을 조회하세요.</div>
      </div>
    </div>
  </div>
</div>

<!-- 상세 팝업 -->
<div class="popup-overlay" id="detailPopup">
  <div class="popup-sheet">
    <div class="popup-header">
      <span id="popupTitle">자료 상세</span>
      <button class="popup-close" onclick="closePopup('detailPopup')">×</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
    <div class="popup-footer" id="popupFooter" style="display:none;">
      <button class="btn-download-footer" id="btnDownloadAll" onclick="downloadAll()">다운로드</button>
    </div>
  </div>
</div>

<script type="text/javascript">
  var _fileList = [];

  $(document).ready(function () {
    const today = new Date();
    const yyyy  = today.getFullYear();
    const mm    = String(today.getMonth() + 1).padStart(2, '0');
    const dd    = String(today.getDate()).padStart(2, '0');
    const fromDate = new Date(today);
    fromDate.setMonth(fromDate.getMonth() - 3);
    const fyyyy = fromDate.getFullYear();
    const fmm   = String(fromDate.getMonth() + 1).padStart(2, '0');
    const fdd   = String(fromDate.getDate()).padStart(2, '0');
    document.getElementById('searchFromDate').value = fyyyy + '-' + fmm + '-' + fdd;
    document.getElementById('searchToDate').value   = yyyy  + '-' + mm  + '-' + dd;
    searchList();
  });

  function handleSearch() {
    searchList();
    document.querySelectorAll('.btn-aco').forEach(function (btn) { btn.click(); });
  }

  function searchList() {
    const fromDate = document.getElementById('searchFromDate').value.replace(/-/g, '');
    const toDate   = document.getElementById('searchToDate').value.replace(/-/g, '');
    const keyword  = document.getElementById('searchKeyword').value.trim();

    AjaxUtil.getAsyncData('/api/support/notice/read', {
      keyword     : keyword,
      srchStartDt : fromDate,
      srchEndDt   : toDate
    }, function (result) {
      if (result && result.success && result.data) {
        renderCardList(result.data);
      } else {
        document.getElementById('cardList').innerHTML = '<div class="empty-msg">조회 중 오류가 발생하였습니다.</div>';
      }
    });
  }

  // ── AI 스마트 검색 ────────────────────────────────────────
  //  2자 미만이면 기존 제목검색으로 처리, 3초 넘게 응답이 없으면 기본검색 안내 (정의서 4-4)
  var _aiResults = [];
  var _aiQueryText = '';
  var _aiSeq = 0;
  var AI_WHERE = {title: '제목에서 일치', content: '내용에서 일치', attachment: '첨부파일 내 일치'};

  $(document).on('keypress', '#aiQuery', function (e) { if (e.keyCode === 13) { e.preventDefault(); aiSearch(); } });

  function aiHighlight(text, terms) {
    let html = esc(text || '');
    (terms || []).filter(Boolean).sort(function (a, b) { return b.length - a.length; }).forEach(function (t) {
      const re = new RegExp(esc(t).replace(/[.*+?^${}()|\[\]\\]/g, '\\$&'), 'gi');
      html = html.replace(re, function (m) { return '<mark>' + m + '</mark>'; });
    });
    return html;
  }

  function aiSearch() {
    const input = document.getElementById('aiQuery');
    input.blur();
    const q = input.value.trim();
    if (q.replace(/\s/g, '').length < 2) {
      // 너무 짧으면 기존 제목검색으로
      document.getElementById('searchKeyword').value = q;
      searchList();
      return;
    }
    const my = ++_aiSeq;
    _aiQueryText = q;
    document.getElementById('resultCount').textContent = 'AI 검색 중…';
    document.getElementById('cardList').innerHTML = '<div class="ai-skel"></div><div class="ai-skel"></div><div class="ai-skel"></div>';

    AiFault.post('/api/ai/doc/search', {query: q, topN: 10, source: 'MOBILE'}, function (data) {
      if (my !== _aiSeq) return;
      renderAiResults((data && data.results) || []);
    }, function (err) {
      if (my !== _aiSeq) return;
      document.getElementById('resultCount').innerHTML = '';
      document.getElementById('cardList').innerHTML =
        '<div class="empty-msg">' + (err === 'timeout' ? 'AI 검색 응답이 늦어지고 있습니다.' : 'AI 검색을 할 수 없습니다.') +
        '<br>아래 기본검색으로 다시 시도해보세요.</div>';
    }, 3000);
  }

  function renderAiResults(list) {
    _aiResults = list;
    const container = document.getElementById('cardList');
    const countEl = document.getElementById('resultCount');
    countEl.innerHTML = '"' + esc(_aiQueryText) + '" AI 검색 ' + list.length + '건' +
      '<span class="ai-back" onclick="aiBack()">전체 목록</span>';
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-msg">관련 자료를 찾지 못했습니다.<br>기본검색으로 다시 시도해보세요.</div>';
      return;
    }
    container.innerHTML = list.map(function (item, i) {
      return '<div class="site-card" onclick="openAiResult(' + i + ')">'
        + '  <div class="card-header">'
        + '    <span class="card-title">' + aiHighlight(item.title, item.terms) + '</span>'
        + '    <span class="ai-rel">관련도 ' + item.relevance + '%</span>'
        + '  </div>'
        + (item.snippet ? '  <div class="ai-snippet">' + aiHighlight(item.snippet, item.terms) + '</div>' : '')
        + '  <div class="ai-where">' + (AI_WHERE[item.matched_in] || '') + ' · ' + esc(formatDate(item.write_date_time)) + '</div>'
        + '</div>';
    }).join('');
  }

  function openAiResult(i) {
    const item = _aiResults[i];
    if (!item) return;
    AiFault.log({source: 'MOBILE', feature: 'DOC', event: 'CLICK', query_text: _aiQueryText,
                 final_value: String(item.id), rank_no: i + 1, top_score: item.relevance, result_cnt: _aiResults.length});
    openDetail(item.id, item.title);
  }

  function aiBack() {
    _aiSeq++;
    document.getElementById('aiQuery').value = '';
    searchList();
  }

  function formatDate(d) {
    if (!d || d.length < 8) return d || '';
    return d.substring(0, 4) + '-' + d.substring(4, 6) + '-' + d.substring(6, 8);
  }

  function renderCardList(list) {
    const container = document.getElementById('cardList');
    const countEl   = document.getElementById('resultCount');
    if (!list || list.length === 0) {
      countEl.textContent = '';
      container.innerHTML = '<div class="empty-msg">조회된 데이터가 없습니다.</div>';
      return;
    }
    countEl.textContent = '총 ' + list.length + '건';
    let html = '';
    list.forEach(function (item) {
      const isImg    = item.notice_yn === 'I';
      const badgeCls = isImg ? 'card-badge img' : 'card-badge';
      const badgeTxt = isImg ? '이미지' : '파일';
      html += '<div class="site-card" onclick=\'openDetail(' + item.id + ', "' + esc(item.title) + '")\'>'
            + '  <div class="card-header">'
            + '    <span class="card-title">' + esc(item.title || '') + '</span>'
            + '    <span class="' + badgeCls + '">' + badgeTxt + '</span>'
            + '  </div>'
            + '  <div class="card-row"><span class="card-label">작성일</span><span class="card-value">' + esc(formatDate(item.write_date_time)) + '</span></div>'
            + '  <div class="card-row"><span class="card-label">작성자</span><span class="card-value">' + esc(item.writer || '') + '</span></div>'
            + '</div>';
    });
    container.innerHTML = html;
  }

  function openDetail(id, title) {
    _fileList = [];
    document.getElementById('popupTitle').textContent = title || '자료 상세';
    document.getElementById('popupBody').innerHTML    = '<div style="text-align:center; padding:30px; color:#bbb;">불러오는 중...</div>';
    document.getElementById('popupFooter').style.display = 'none';
    openPopup('detailPopup');

    AjaxUtil.getAsyncData('/api/support/notice/detail', { id: id }, function (result) {
      if (!result || !result.data) {
        document.getElementById('popupBody').innerHTML = '<div class="empty-msg">내용을 불러올 수 없습니다.</div>';
        return;
      }
      const data = result.data;

      AjaxUtil.getAsyncData('/api/common/attach_file/detailFiles', {
        TableName : 'NOTICE',
        DataPk    : id
      }, function (fileResult) {
        let html = '';

        // 본문
        html += '<div class="detail-section-title">내용</div>';
        if (data.content) {
          html += '<div style="font-size:14px; color:#333; line-height:1.7; word-break:break-word; padding:4px 0;">' + data.content + '</div>';
        } else {
          html += '<div style="font-size:13px; color:#bbb; padding:8px 0;">내용이 없습니다.</div>';
        }

        // 첨부파일
        if (fileResult && fileResult.data && fileResult.data.length > 0) {
          _fileList = fileResult.data;
          html += '<div class="detail-section-title">첨부파일 (' + _fileList.length + ')</div>';
          _fileList.forEach(function (file) {
            const ext     = (file.fileExt || '').toLowerCase();
            const isImage = ['jpg','jpeg','png','gif','bmp','webp'].indexOf(ext) >= 0;
            const icon    = isImage ? '🖼️' : getFileIcon(ext);
            const sizeStr = file.fileSize ? formatFileSize(file.fileSize) : '';
            const dlUrl   = window.CTX_PATH + '/api/files/download?file_id=' + file.fileId;

            if (isImage) {
              html += '<img src="' + dlUrl + '" class="img-preview" alt="' + esc(file.fileNm) + '" onerror="this.style.display=\'none\'">';
            }
            html += '<div class="file-item">'
                  + '  <div class="file-info"><span class="file-icon">' + icon + '</span><span class="file-name">' + esc(file.fileNm) + '</span></div>'
                  + '  <span class="file-size">' + sizeStr + '</span>'
                  + '</div>';
          });

          // footer 다운로드 버튼 표시
          document.getElementById('popupFooter').style.display = 'flex';
          document.getElementById('btnDownloadAll').textContent =
              _fileList.length > 1 ? '전체 다운로드 (' + _fileList.length + ')' : '다운로드';
        }

        document.getElementById('popupBody').innerHTML = html;
      });
    });
  }

  function downloadAll() {
    if (!_fileList || _fileList.length === 0) return;
    var btn = document.getElementById('btnDownloadAll');
    btn.disabled = true;
    btn.textContent = '다운로드 중...';

    var index = 0;

    function downloadNext() {
      if (index >= _fileList.length) {
        btn.disabled = false;
        btn.textContent = _fileList.length > 1
            ? '전체 다운로드 (' + _fileList.length + ')' : '다운로드';
        return;
      }
      var file = _fileList[index++];
      var url = window.CTX_PATH + '/api/files/download?file_id=' + file.fileId;

      // 모바일 WebView 호환: iframe을 이용한 다운로드 트리거
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);

      // 다음 파일은 1.5초 간격으로 순차 처리 (브라우저 다운로드 대화상자 충돌 방지)
      setTimeout(function () {
        document.body.removeChild(iframe);
        downloadNext();
      }, 1500);
    }

    downloadNext();
  }

  function getFileIcon(ext) {
    var icons = { pdf:'📄', xlsx:'📊', xls:'📊', pptx:'📋', ppt:'📋', docx:'📝', doc:'📝', hwp:'📝', zip:'🗜️', txt:'📃' };
    return icons[ext] || '📎';
  }

  function formatFileSize(bytes) {
    if (!bytes || bytes === 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function openPopup(id)  { document.getElementById(id).classList.add('active'); }
  function closePopup(id) { document.getElementById(id).classList.remove('active'); }

  document.getElementById('detailPopup').addEventListener('click', function (e) {
    if (e.target === this) closePopup('detailPopup');
  });

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
