<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear {
        display: none !important; /* 강제로 숨김 */
    }
    .btn-close {
        display: none !important; /* 강제로 숨김 */
    }
    /* 검색 영역 스타일 */
    #searcharea, #detailarea {
        position: relative;
        width: 100%;
        margin-top: 10px;
    }

    .search-container input {
        margin-top: 10px;
        margin-bottom: 10px;
        box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);
    }

    #searcharea input, #detailarea input {
        width: 100%;
        border: none;
        outline: none;
        font-size: 16px;
        padding: 10px;
    }

    /* 검색 가이드 스타일 */
    .search-guide {
        padding: 10px;
        font-size: 14px;
        color: #666;
    }

    /* 버튼 스타일 */
    .btn-select, .btn-login {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    /* 모달 오버레이 (배경 흐리게) */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5); /* 반투명한 검은색 배경 */
        z-index: 999; /* 모달보다 한 단계 아래 */
    }

    /* 모달 스타일 */
    .modal {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 650px;
        max-width: 90%;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        padding: 20px;
        border: none;
        z-index: 9999;
    }

    /* 모달 닫기 버튼 스타일 */
    .modal-close {
        position: absolute;
        top: 10px;
        right: 5px;
        width: 30px; /* 버튼 크기 */
        height: 25px;
        border: none;
        border-radius: 3px;
        background: none; !important; /* 배경 제거 */
        background-color: transparent; !important; /* 배경을 투명하게 */
        z-index: 1000;
        cursor: pointer; /* 클릭 가능한 버튼 스타일 */
    }

    #loadingSpinner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8); /* 배경 어둡게 */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    #loadingImage {
        width: 95%; /* 전체 화면의 80% 크기 */
        max-width: 900px; /* 최대 크기 제한 */
    }
    .contents-wrap h4{
        width: 100%;
        margin-bottom: 20px;
        text-align: center;
        line-height: 1.5;
        font-size: 18px;
        font-weight: bold;
        word-break: keep-all;
        overflow-wrap: break-word;
        white-space: normal;
    }
</style>
<head>

    <title>ACTAS MES</title>
    <meta name="ctx" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <script th:src="@{/assets_mobile/js/ui.js}"></script>

    <script th:inline="javascript">
        var sandanData = /*[[${session.sandanList}]]*/ [];
    </script>

    <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
    <script th:src="@{/js/common.js}"></script>

<body>

    <!-- [모바일] 컨텐츠  -->

</div>

<script th:inline="javascript">
    // Thymeleaf에서 컨텍스트 패스 추출
    var ctx = /*[[@{/}]]*/ '/';
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="text/javascript">

    $(document).ready(function () {
        loadAvailableYears().then(() => {
            searchDeductionData();
        });
    });

    // 파스텔톤 색상 리스트
    const colorPalette = [
        "#FFDDDD", "#B0E0E6", "#C1E1C1", "#FFF4B0", "#FFCCE5",
        "#AFE1AF", "#FFD8B1", "#D8BFD8", "#D4EDDA", "#C6DEFF",
        "#FFDEAD", "#e8b4c9", "#E4DBFF", "#FF6384"
    ];

    function shuffleColors(array) {
        let shuffled = array.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    let shuffledColors = shuffleColors(colorPalette);
    let colorIndex = 0;

    function getRandomColor() {
        if (colorIndex >= shuffledColors.length) {
            shuffledColors = shuffleColors(colorPalette);
            colorIndex = 0;
        }
        return shuffledColors[colorIndex++];
    }

    function searchDeductionData() {
        $.ajax({
            url: ctx + 'api/attendance_statistics/read',
            type: 'GET',
            data: {
                'searchYear': document.getElementById('searchYear').value,
            },
            success: function (response) {
                console.log(response);

                let chartWrap = document.querySelector(".chart-wrap");
                chartWrap.innerHTML = `<canvas id="SignupOfWeek" style="width: 740px; height: 550px;"></canvas>`;
                if (response.success && Array.isArray(response.data)) {
                    let data2 = response.data;
                    let labels = data2.map(item => `${item.HISNM} (${item.HISPOINT} 일)`);
                    let data = data2.map(item => item.HISPOINT);
                    let backgroundColors = labels.map(() => getRandomColor());

                    if (window.myPieChart) {
                        window.myPieChart.destroy();
                    }

                    let ctx2 = document.getElementById('SignupOfWeek').getContext('2d');
                    window.myPieChart = new Chart(ctx2, {
                        type: 'pie',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '차감 내역',
                                data: data,
                                backgroundColor: backgroundColors,
                                borderColor: '#ffffff',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'bottom' },
                                tooltip: {
                                    callbacks: {
                                        label: function (tooltipItem) {
                                            return `${tooltipItem.label}: ${tooltipItem.raw}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                } else {
                    console.error("데이터가 올바르지 않습니다.");
                }

                let contentsWrap = document.querySelector('.contents-wrap');
                if (contentsWrap) contentsWrap.style.display = 'block';

                let canvas = document.getElementById("SignupOfWeek");
                if (canvas) canvas.style.display = 'block';
                else console.error("SignupOfWeek 요소를 찾을 수 없습니다.");

                // ── contents-wrap 표시 후 userInfo 바인딩 ──
                searchUserData();
            },
            error: function (error) {
                console.error("데이터 불러오기 실패:", error);
            }
        });
    }

    function searchUserData() {
        $.ajax({
            url: ctx + 'api/attendance_statistics/getUserInfo',
            type: 'GET',
            success: function (response) {
                console.log(response);
                let searchYear = document.getElementById('searchYear').value;
                document.querySelector(".contents-wrap h4").innerText =
                    `${response.data.divinm} ${response.data.pernm} ${response.data.rspnm}\n${searchYear} 휴가통계`;
            },
            error: function (error) {
                console.error("데이터 불러오기 실패:", error);
            }
        });
    }

    async function loadAvailableYears() {
        try {
            const res = await fetch(ctx + 'api/attendance_current/years');
            const result = await res.json();
            const years = result.data;
            const select = document.getElementById('searchYear');
            select.innerHTML = '';

            if (!years || years.length === 0) {
                const opt = document.createElement('option');
                opt.text = new Date().getFullYear();
                opt.value = new Date().getFullYear();
                select.appendChild(opt);
                return;
            }

            years.forEach(y => {
                const opt = document.createElement('option');
                opt.text = y;
                opt.value = y;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error('연도 조회 실패:', e);
        }
    }
</script>
</body>
</html>
