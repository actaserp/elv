<!DOCTYPE html>
<html lang="ko">
<style>
  .btn-clear { display: none !important; }
  .btn-close { display: none !important; }
  #searcharea, #detailarea { position: relative; width: 100%; margin-top: 10px; }
  .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; }
  .search-guide { padding: 10px; font-size: 14px; color: #666; }
  .btn-select, .btn-login { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
  .modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; height: 650px; max-width: 90%; background-color: white; border-radius: 10px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); padding: 20px; border: none; z-index: 9999; }
  .modal-close { position: absolute; top: 10px; right: 5px; width: 30px; height: 25px; border: none; border-radius: 3px; background: none; z-index: 1000; cursor: pointer; }
  #loadingSpinner { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
  #loadingImage { width: 95%; max-width: 900px; }
  .contents-wrap dd { margin-bottom: 20px; }
  .contents-wrap dt { margin-left: 10px; margin-bottom: 5px; }
</style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTAS MES</title>
  <!-- ① /static → / 로 수정: common.js가 이 값으로 window.CTX_PATH=/elv 세팅 -->
  <meta name="ctx" th:content="@{/}">
  <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
  <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script th:src="@{/assets_mobile/js/ui.js}"></script>
  <script th:inline="javascript">
    var sandanData = /*[[${session.sandanList}]]*/ [];
  </script>
  <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script th:src="@{/js/Mobile.js}"></script>
  <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">
  <div class="mobile-layout-header">
    <header>
      <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
      <div class="left" style="margin-left:35px; font-size: 25px;"><h2>휴가등록</h2></div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>

  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

  <div class="mobile-layout-contents">
    <div class="layout-contents">
      <div class="search-wrap"></div>
      <div class="contents-wrap">
        <dl>
          <dt>사용자ID</dt>
          <dd>
            <div style="display: flex; gap: 10px">
              <div style="width: 100%"><input type="text" id="userId" readonly></div>
            </div>
          </dd>
          <dt>사용자명</dt>
          <dd>
            <div style="display: flex; gap: 10px">
              <div style="width: 100%"><input type="text" id="userName2" readonly></div>
            </div>
          </dd>
          <dt>휴가항목</dt>
          <dd>
            <div style="display: flex; gap: 10%">
              <select style="width: 70%" id="attKind" onchange="bindPeriod();"><option>휴가</option></select>
<!--              연차 표시 x (연차 관리 완벽구현되기 전까지)-->
              <label style="display: none; align-items: center">
                <input type="checkbox" style="margin: 0" id="isAnnual" disabled>&nbsp;&nbsp;연차
              </label>

            </div>
          </dd>
          <dt>기간</dt>
          <dd>
            <div style="display: flex; flex-direction: column; gap: 5px;">
              <div style="display: flex; gap: 10px;">
                <input type="date" id="startDate" style="width: 140px;">
                <input type="text" id="startTime" style="width: 140px;" inputmode="numeric"
                       maxlength="5" placeholder="HH:mm" oninput="formatTimeInput(this)">
              </div>
            </div>
            <span style="font-weight: bold;">~</span>
            <div style="display: flex; flex-direction: column; gap: 5px;">
              <div style="display: flex; gap: 10px;">
                <input type="date" id="endDate" style="width: 140px;">
                <input type="text" id="endTime" style="width: 140px;" inputmode="numeric"
                       maxlength="5" placeholder="HH:mm" oninput="formatTimeInput(this)">
              </div>
            </div>
          </dd>
          <div style="display: none;">
            <dt>사용일수</dt>
            <dt style="margin-left: auto">연차잔여일수</dt>
          </div>
          <dd>
            <div style="display: none; gap: 10px">
              <div style="width: 100%; display: flex;">
                <input type="number" id="useDate" style="width: 45%;" readonly>
                <input type="number" id="usedDate" style="width: 45%; margin-left: auto;" readonly>
              </div>
            </div>
          </dd>
          <dt>사유</dt>
          <dd>
            <div style="display: flex; gap: 10px">
              <div style="width: 100%"><input type="text" id="remark"></div>
            </div>
          </dd>
        </dl>
        <div class="srch-btn">
          <button class="btn-dark" onclick="saveAttendance()">등록</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">

  // 시간 입력 간소화: 숫자만 입력 → 자동 HH:mm (시계 다이얼 대신 키패드)
  function formatTimeInput(el) {
    const e = window.event;
    const deleting = e && e.inputType && e.inputType.indexOf('delete') === 0;
    let d = el.value.replace(/[^0-9]/g, '').slice(0, 4);
    if (d.length === 0)      el.value = '';
    else if (d.length <= 2)  el.value = deleting ? d : d + ':';
    else                     el.value = d.slice(0, 2) + ':' + d.slice(2);
  }

  $(document).ready(function (e) {
    searchMainData();
    AjaxUtil.fillSelectOptions($('#attKind'), 'workcd', 'choose', false, 'work_division', '');
    document.getElementById('startDate').addEventListener('change', calculateUseDays);
    document.getElementById('endDate').addEventListener('change', calculateUseDays);
  });

  function bindDate(userStartTime) {
    const today = new Date();
    const formattedDate = today.toISOString().split('T')[0];
    document.getElementById('startDate').value = formattedDate;
    document.getElementById('endDate').value = formattedDate;
  }

  function searchMainData() {
    // AjaxUtil → withCtx() → $.ajaxPrefilter 가 /elv 자동 추가
    let url = '/api/attendance_submit/read_userInfo';
    let fnsuccess = function (result) {
      if (result != null) {
        const userIdEl = document.getElementById('userId');
        const userNameEl = document.getElementById('userName2');
        const usedDateEl = document.getElementById('usedDate');
        if (userIdEl) userIdEl.value = result.data.username ?? '';
        if (userNameEl) userNameEl.value = result.data.first_name ?? '';
        if (usedDateEl) usedDateEl.value = result.data.restnum ?? '';
        bindDate(result.data.sttime);
      }
    };
    AjaxUtil.getAsyncData(url, {}, fnsuccess);
  }

  function saveAttendance() {
    // AjaxUtil → withCtx() → $.ajaxPrefilter 가 /elv 자동 추가
    let url = '/api/attendance_submit/submitAttendance';
    let data = {
      'userId': document.getElementById('userId').value,
      'userName': document.getElementById('userName2').value,
      'attKind': document.getElementById('attKind').value,
      'useDate': document.getElementById('useDate').value,
      'usedDate': document.getElementById('usedDate').value,
      'remark': document.getElementById('remark').value,
      'startDate': document.getElementById('startDate').value,
      'startTime': document.getElementById('startTime').value,
      'endDate': document.getElementById('endDate').value,
      'endTime': document.getElementById('endTime').value,
      'isAnnual': document.getElementById('isAnnual').checked ? "1" : "0"
    };
    let fnsuccess = function (result) {
      if (result != null) {
        if (result.success) {
          Alert.alert('', result.message, function () {
            // ② page redirect: /mobile/attendance_current → 변경된 경로 + CTX_PATH 적용
            window.location.href = window.CTX_PATH + '/mobile/attendance/attendance_current';
          });
        } else {
          Alert.alert('', "휴가 등록에 실패하였습니다.");
        }
      } else {
        Alert.alert('', "오류가 발생하였습니다.");
      }
    };
    AjaxUtil.postAsyncData(url, data, fnsuccess);
  }

  function calculateUseDays() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const useDateInput = document.getElementById('useDate');
    if (useDateInput.getAttribute('data-fixed') === 'true') return;
    if (startDate && endDate) {
      const dayDiff = (new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24);
      useDateInput.value = dayDiff === 0 ? "1.00" : (dayDiff > 0 ? (dayDiff + 1).toFixed(2) : '0.00');
    }
  }

  function bindPeriod() {
    // AjaxUtil → withCtx() → $.ajaxPrefilter 가 /elv 자동 추가
    let url = '/api/attendance_submit/bindPeriod';
    let data = { 'attKind': document.getElementById('attKind').value };
    let fnsuccess = function (result) {
      if (result != null) {
        let usenum = parseFloat(result.data.usenum);
        if (usenum > 0 && usenum < 1) {
          document.getElementById('useDate').value = usenum.toFixed(2);
          document.getElementById('useDate').setAttribute('data-fixed', 'true');
        } else {
          document.getElementById('useDate').removeAttribute('data-fixed');
        }
        document.getElementById('isAnnual').checked = result.data.yearflag === '1';
      } else {
        Alert.alert('', "오류가 발생하였습니다.");
      }
    };
    AjaxUtil.getAsyncData(url, data, fnsuccess);
  }
</script>
</body>
</html>
