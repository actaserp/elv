<!DOCTYPE html>
<html lang="ko">
<style>
  /* 탭 */
  .tab-bar { display:flex; border-bottom:2px solid #03428E; margin-bottom:14px; }
  .tab-bar button {
    flex:1; padding:10px 0; border:none; background:none;
    font-size:14px; font-weight:bold; color:#999; cursor:pointer;
  }
  .tab-bar button.active { color:#03428E; border-bottom:3px solid #03428E; margin-bottom:-2px; }

  /* 검색바 */
  .search-wrap { margin-bottom:12px; }

  /* 카드 */
  .att-card {
    background:#fff; border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    padding:12px 14px; margin-bottom:10px;
    border-left:4px solid #03428E;
  }
  .att-card.absent    { border-left-color:#c62828; }
  .att-card.late      { border-left-color:#e65100; }
  .att-card.holiday   { border-left-color:#1565c0; }

  .att-card .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .att-card .name { font-size:15px; font-weight:bold; color:#222; }
  .att-card .date { font-size:12px; color:#888; }
  .att-card .row2 { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:#555; margin-bottom:4px; }
  .att-card .row2 span b { color:#03428E; }
  .att-card .badge {
    display:inline-block; font-size:11px; padding:2px 7px;
    border-radius:10px; margin-right:4px; font-weight:bold;
  }
  .badge-late    { background:#fff3e0; color:#e65100; }
  .badge-absent  { background:#fce4ec; color:#c62828; }
  .badge-holiday { background:#e3f2fd; color:#1565c0; }
  .badge-leave   { background:#f3e5f5; color:#6a1b9a; }

  /* 월별 카드 */
  .monthly-card {
    background:#fff; border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    padding:14px 16px; margin-bottom:10px;
  }
  .monthly-card .mc-name { font-size:15px; font-weight:bold; color:#222; margin-bottom:8px; }
  .monthly-card .mc-grid {
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  }
  .mc-item { text-align:center; }
  .mc-item .mc-val { font-size:16px; font-weight:bold; color:#03428E; }
  .mc-item .mc-lbl { font-size:11px; color:#888; margin-top:2px; }

  .empty-msg { text-align:center; color:#999; padding:40px 0; font-size:14px; }

  /* 요약 바 */
  .summary-bar { display:flex; gap:8px; margin-bottom:12px; }
  .summary-item {
    flex:1; background:#f0f4f8; border-radius:8px;
    padding:8px; text-align:center;
  }
  .summary-item .s-val { font-size:18px; font-weight:bold; color:#03428E; }
  .summary-item .s-lbl { font-size:11px; color:#666; margin-top:2px; }

  /* 출퇴근 위치 지도 — 카드를 터치하면 아래에서 올라온다 */
  .att-card.has-loc { cursor:pointer; }
  .att-card.has-loc:active { background:#f4f7fb; }

  .loc-sheet {
    display:none; position:fixed; left:0; right:0; top:0; bottom:0;
    background:rgba(0,0,0,0.45); z-index:9999;
  }
  .loc-sheet.on { display:block; }
  .loc-sheet-inner {
    position:absolute; left:0; right:0; bottom:0;
    background:#fff; border-radius:14px 14px 0 0;
    padding:12px 14px 16px;
  }
  .loc-sheet-head {
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .loc-sheet-title { font-size:15px; font-weight:bold; color:#03428E; }
  .loc-sheet-close {
    border:none; background:#eee; border-radius:6px;
    width:30px; height:30px; font-size:15px; cursor:pointer;
  }
  #locMap { width:100%; height:56vh; border-radius:10px; background:#eceff3; }
  .loc-legend {
    display:flex; gap:12px; flex-wrap:wrap; font-size:12px; margin-top:10px; color:#444;
  }
  .loc-legend span { display:flex; align-items:center; gap:4px; }
  .loc-legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .loc-empty { padding:22px 10px; text-align:center; color:#888; font-size:13px; line-height:1.6; }
</style>

    /* 사업체별 중간보고 사용여부 (tb_tenant_db.use_mid_report).
       끄면 중간보고 마커를 찍지 않는다. 설정이 없으면 사용으로 본다. */
    var USE_MID_REPORT = /*[[${use_mid_report}]]*/ true;
  </script>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<div class="mobile-wrapper page-ticket-list">
  <!-- 헤더 -->
  <div class="mobile-layout-header">
    <header>
      <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
      <div class="left" style="margin-left:35px; font-size:20px;"><h2>근태현황</h2></div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>

  <!-- 메뉴 -->
  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

  <!-- 컨텐츠 -->
  <div class="mobile-layout-contents">
    <div class="layout-contents">

      <!-- 탭 -->
      <div class="tab-bar">
        <button class="active" onclick="switchTab('daily')">일별</button>
        <button onclick="switchTab('monthly')">월별</button>

      <!-- ─── 일별 탭 ─── -->

            <p>기본검색</p>
            <a href="#" title="열기/닫기" class="btn-aco">
              <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
            </a>
          </div>
          <div class="srch-cont aco-cont">
            <dl>
              <dt>조회일자</dt>
              <dd><input type="date" id="dailyDate" style="width:100%;"></dd>
            </dl>
            <dl>
              <dt>근태구분</dt>
              <dd><select id="dailyWorkcd" style="width:100%;"><option value="">전체</option></select></dd>
            </dl>
            <dl>
              <dt>부서</dt>
              <dd><select id="dailyDepart" style="width:100%;"><option value="">전체</option></select></dd>
            </dl>
            <dl>
              <dt>팀</dt>
              <dd><select id="dailyTeam" style="width:100%;"><option value="">전체</option></select></dd>
            </dl>
            <div class="srch-btn">
              <button class="btn-dark" onclick="handleSearch('daily')">조회</button>
            </div>
          </div>
        </div>

        <!-- 요약 -->
        <div class="summary-bar">
          <div class="summary-item"><div class="s-val" id="sCnt">-</div><div class="s-lbl">전체</div></div>
          <div class="summary-item"><div class="s-val" id="sLate">-</div><div class="s-lbl">지각</div></div>
          <div class="summary-item"><div class="s-val" id="sAbsent">-</div><div class="s-lbl">결근</div></div>
          <div class="summary-item"><div class="s-val" id="sLeave">-</div><div class="s-lbl">휴가</div></div>
        </div>

        <div id="dailyList"><div class="empty-msg">날짜를 선택하고 조회하세요.</div></div>
      </div>

      <!-- ─── 월별 탭 ─── -->
      <div id="tabMonthly" style="display:none;">
        <div class="search-wrap">
          <div class="srch-tit aco-hd">
            <p>기본검색</p>
            <a href="#" title="열기/닫기" class="btn-aco">
              <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
            </a>
          </div>
          <div class="srch-cont aco-cont">
            <dl>
              <dt>조회년월</dt>
              <dd><input type="month" id="monthlyYM" style="width:100%;"></dd>
            </dl>
            <dl>
              <dt>사원</dt>
              <dd><select id="monthlyPerson" style="width:100%;"><option value="">전체</option></select></dd>
            </dl>
            <dl>
              <dt>부서</dt>
              <dd><select id="monthlyDepart" style="width:100%;"><option value="">전체</option></select></dd>
            </dl>
            <dl>
              <dt>팀</dt>
              <dd><select id="monthlyTeam" style="width:100%;"><option value="">전체</option></select></dd>
            </dl>
            <div class="srch-btn">
              <button class="btn-dark" onclick="handleSearch('monthly')">조회</button>
            </div>

    </div>

</div>

<!-- 출퇴근 위치 지도 — 일별 카드를 터치하면 열린다 -->
<div class="loc-sheet" id="locSheet">
  <div class="loc-sheet-inner">
    <div class="loc-sheet-head">
      <span class="loc-sheet-title" id="locTitle">출퇴근 위치</span>
      <button type="button" class="loc-sheet-close" id="locClose">&#10005;</button>
    </div>
    <div id="locMap"></div>
    <div class="loc-legend" id="locLegend"></div>
  </div>
</div>

<script type="text/javascript">
  let currentTab = 'daily';
  const spjangcd = sessionStorage.getItem('spjangcd') || '';

  $(document).ready(function() {
    // 오늘 날짜 / 이번달 세팅
    const today = new Date();
    const ymd   = today.getFullYear() + '-'
                + String(today.getMonth()+1).padStart(2,'0') + '-'
                + String(today.getDate()).padStart(2,'0');
    const ym    = ymd.substring(0, 7);
    $('#dailyDate').val(ymd);
    $('#monthlyYM').val(ym);

    // Master 메뉴 노출
    $.get('/api/mobile_main/read_userInfo', function(res) {
      if (res && res.data && res.data.isMaster) {
        const menuEl = document.getElementById('menuApproval');
        if (menuEl) menuEl.style.display = '';
      }
    });

    // 근태구분 콤보
    AjaxUtil.fillSelectOptions($('#dailyWorkcd'), 'workcd', 'all', false, 'work_division', '');
    // 부서 콤보
    $.get('/api/clock/DayMonthly/departList', { spjangcd: spjangcd }, function(res) {
      if (!res || !res.data) return;
      res.data.forEach(function(d) {
        $('#dailyDepart, #monthlyDepart').append(
          '<option value="' + d.value + '">' + d.text + '</option>');
      });
    });

    // 팀 콤보 (TB_PZ012) — 웹 근태현황과 동일. 사원 소속팀은 TB_JA001.officecd
    $.get('/api/clock/DayMonthly/teamList', { spjangcd: spjangcd }, function(res) {
      if (!res || !res.data) return;
      res.data.forEach(function(d) {
        $('#dailyTeam, #monthlyTeam').append($('<option>').val(d.value).text(d.text));
      });
    });

    // 사원 콤보 (월별)
    AjaxUtil.fillSelectOptions($('#monthlyPerson'), 'person', 'all', false);

    // 초기 일별 조회
    loadDaily();
  });

  function switchTab(tab) {
    currentTab = tab;
    if (tab === 'daily') {
      $('#tabDaily').show();
      $('#tabMonthly').hide();
      $('.tab-bar button').eq(0).addClass('active');
      $('.tab-bar button').eq(1).removeClass('active');
    } else {
      $('#tabDaily').hide();
      $('#tabMonthly').show();
      $('.tab-bar button').eq(0).removeClass('active');
      $('.tab-bar button').eq(1).addClass('active');
      loadMonthly();
    }
  }

  // 조회 버튼: 조회 후 그 탭의 검색창만 접는다
  // (다른 화면처럼 .btn-aco 를 모두 click 하면 숨겨진 다른 탭의 검색창이 열려버린다)
  function handleSearch(tab) {
    const $wrap = $(tab === 'daily' ? '#tabDaily' : '#tabMonthly').find('.search-wrap');
    if (tab === 'daily') loadDaily(); else loadMonthly();
    $wrap.find('.aco-cont').slideUp();
    $wrap.find('.aco-hd').removeClass('active');
  }

  // ─── 일별 조회 ───
  function loadDaily() {
    const date    = $('#dailyDate').val();
    const workcd  = $('#dailyWorkcd').val();
    const depart  = $('#dailyDepart').val();
    const team    = $('#dailyTeam').val();

    if (!date) { Alert.alert('', '날짜를 선택해주세요.'); return; }

    $.get('/api/clock/DayMonthly/read', {
      serchday:      date,
      work_division: workcd,
      depart:        depart,
      officecd:      team,
      spjangcd:      spjangcd
    }, function(res) {
      const list = document.getElementById('dailyList');
      if (!res || !res.data || res.data.length === 0) {
        list.innerHTML = '<div class="empty-msg">근태 데이터가 없습니다.</div>';
        resetSummary();
        return;
      }

      // 요약 계산
      let lateCount = 0, absentCount = 0, leaveCount = 0;
      res.data.forEach(function(d) {
        if (d.jitime == 1) lateCount++;
        if (d.abtime == 1) absentCount++;
        if (d.yuntime == 1) leaveCount++;
      });
      $('#sCnt').text(res.data.length);
      $('#sLate').text(lateCount);
      $('#sAbsent').text(absentCount);
      $('#sLeave').text(leaveCount);

      // 지도에서 다시 쓰려고 조회 결과를 들고 있는다 (카드의 data-idx 로 찾는다)
      dailyData = res.data;

      // 카드 렌더링
      list.innerHTML = res.data.map(function(d, idx) {
        let cardCls = '';
        if (d.abtime == 1) cardCls = 'absent';
        else if (d.jitime == 1) cardCls = 'late';
        else if (d.yuntime == 1) cardCls = 'holiday';

        let badges = '';
        if (d.jitime  == 1) badges += '<span class="badge badge-late">지각</span>';
        if (d.jotime  == 1) badges += '<span class="badge badge-late">조퇴</span>';
        if (d.abtime  == 1) badges += '<span class="badge badge-absent">결근</span>';
        if (d.yuntime == 1) badges += '<span class="badge badge-leave">휴가</span>';
        if (d.bantime == 1) badges += '<span class="badge badge-leave">반차</span>';

        const dateStr = (d.workym || '') + (d.workday || '');
        const dispDate = dateStr.length === 8
          ? dateStr.substring(0,4)+'.'+dateStr.substring(4,6)+'.'+dateStr.substring(6,8) : '';

        // 좌표가 하나라도 있으면 터치해서 지도를 볼 수 있다.
        // 사내 출퇴근(inflag='0')은 좌표를 남기지 않아 대상이 아니다.
        const hasLoc = !!((d.latitude && d.longitude)
                       || (d.out_latitude && d.out_longitude)
                       || (USE_MID_REPORT && d.mid_latitude && d.mid_longitude));

        return '<div class="att-card ' + cardCls + (hasLoc ? ' has-loc' : '') + '" data-idx="' + idx + '">' +
          '<div class="row1">' +
            '<span class="name">' + (d.first_name || d.Name || '')
              + (hasLoc ? ' <span style="font-size:12px;">&#128205;</span>' : '') + '</span>' +
            '<span class="date">' + dispDate + '</span>' +
          '</div>' +
          '<div class="row2">' +
            '<span>🏢 ' + (d.RSPNM || '') + '</span>' +
            '<span>⏰ <b>' + (d.starttime || '--:--') + '</b> ~ <b>' + (d.endtime || '--:--') + '</b></span>' +
            '<span>🕐 ' + (d.worktime || '-') + 'h</span>' +
          '</div>' +
          (badges ? '<div>' + badges + '</div>' : '') +
          (d.remark ? '<div style="font-size:12px;color:#666;margin-top:4px;">📝 ' + d.remark + '</div>' : '') +
        '</div>';
      }).join('');
    }).fail(function() {
      document.getElementById('dailyList').innerHTML = '<div class="empty-msg">조회 중 오류가 발생했습니다.</div>';
    });
  }

  function resetSummary() {
    $('#sCnt, #sLate, #sAbsent, #sLeave').text('-');
  }

  // ─── 월별 조회 ───
  function loadMonthly() {
    const ym     = $('#monthlyYM').val();
    const person = $('#monthlyPerson').val();
    const depart = $('#monthlyDepart').val();
    const team   = $('#monthlyTeam').val();

    if (!ym) { Alert.alert('', '년월을 선택해주세요.'); return; }

    $.get('/api/clock/DayMonthly/MonthlyRead', {
      startdate:   ym,
      person_name: person,
      depart:      depart,
      officecd:    team,
      spjangcd:    spjangcd
    }, function(res) {
      const list = document.getElementById('monthlyList');
      if (!res || !res.data || res.data.length === 0) {
        list.innerHTML = '<div class="empty-msg">월별 근태 데이터가 없습니다.</div>';
        return;
      }

      list.innerHTML = res.data.map(function(d) {
        return '<div class="monthly-card">' +
          '<div class="mc-name">👤 ' + (d.first_name || '') +
            (d.RSPNM ? ' <span style="font-size:12px;color:#888;">(' + d.RSPNM + ')</span>' : '') +
          '</div>' +
          '<div class="mc-grid">' +
            '<div class="mc-item"><div class="mc-val">' + (d.workday  || 0) + '</div><div class="mc-lbl">근무일수</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.worktime || 0) + '</div><div class="mc-lbl">총근무</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.overtime || 0) + '</div><div class="mc-lbl">연장</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.jitime   || 0) + '</div><div class="mc-lbl">지각</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.abtime   || 0) + '</div><div class="mc-lbl">결근</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.yuntime  || 0) + '</div><div class="mc-lbl">휴가</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.nighttime|| 0) + '</div><div class="mc-lbl">야간</div></div>' +
            '<div class="mc-item"><div class="mc-val">' + (d.holitime || 0) + '</div><div class="mc-lbl">특근</div></div>' +
          '</div>' +
        '</div>';
      }).join('');
    }).fail(function() {
      document.getElementById('monthlyList').innerHTML = '<div class="empty-msg">조회 중 오류가 발생했습니다.</div>';
    });
  }

  /* ===== 출퇴근 위치 지도 =====
     조회 결과를 그대로 쓴다 — /api/clock/DayMonthly/read 가 좌표를 이미 내려주므로
     서버를 더 부르지 않는다. 월별 탭은 tb_pb203 집계라 좌표가 없어 대상이 아니다. */
  let dailyData = [];
  let locMap = null, locMarkers = [], locOpenInfo = null;

  // 핀 이미지. daymonthly·대시보드와 같은 모양·색을 쓴다.
  // 거기서는 Blob URL 을 쓰는데, 여닫기를 반복하는 화면이라 여기서는 data URI 로 둔다(URL 누수 없음).
  function locPin(color) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">'
      + '<path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 26 14 26S28 24.5 28 14C28 6.268 21.732 0 14 0z" fill="' + color + '"/>'
      + '<circle cx="14" cy="14" r="6" fill="white"/></svg>';
    return new kakao.maps.MarkerImage(
      'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
      new kakao.maps.Size(28, 40),
      { offset: new kakao.maps.Point(14, 40) }
    );
  }

  function addLocMarker(lat, lng, name, address, type, color, time, bounds) {
    const pos = new kakao.maps.LatLng(lat, lng);
    bounds.extend(pos);

    const marker = new kakao.maps.Marker({ position: pos, map: locMap, image: locPin(color) });
    const info = new kakao.maps.InfoWindow({
      content: '<div style="padding:6px;font-size:12px;max-width:230px;word-break:keep-all;">'
        + '<span style="color:' + color + ';font-weight:bold;">[' + type + (time ? ' ' + time : '') + ']</span><br>'
        + (name || '') + '<br>' + (address || '주소 없음')
        + '</div>'
    });
    locMarkers.push(marker);

    kakao.maps.event.addListener(marker, 'click', function() {
      if (locOpenInfo) {
        locOpenInfo.close();
        if (locOpenInfo === info) { locOpenInfo = null; return; }
      }
      info.open(locMap, marker);
      locOpenInfo = info;
    });
  }

  function clearLocMarkers() {
    if (locOpenInfo) { locOpenInfo.close(); locOpenInfo = null; }
    locMarkers.forEach(function(m) { m.setMap(null); });
    locMarkers = [];
  }

  function openLocationMap(idx) {
    const d = dailyData[idx];
    if (!d) return;

    const name = d.first_name || d.Name || '';
    $('#locTitle').text(name ? name + ' 출퇴근 위치' : '출퇴근 위치');
    $('#locSheet').addClass('on');

    // 지도는 처음 열 때 한 번만 만든다.
    // 숨겨진 상태에서 만들면 크기가 0 이 되므로 시트를 띄운 뒤에 초기화하고,
    // 두 번째부터는 relayout() 으로 크기를 다시 잡아 준다.
    kakao.maps.load(function() {
      if (!locMap) {
        locMap = new kakao.maps.Map(document.getElementById('locMap'), {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 5
        });
      } else {
        locMap.relayout();
      }

      clearLocMarkers();
      const bounds = new kakao.maps.LatLngBounds();
      let legend = '', cnt = 0;

      if (d.latitude && d.longitude) {
        addLocMarker(d.latitude, d.longitude, name, d.address, '출근', '#1a6fff', d.starttime, bounds);
        legend += '<span><i style="background:#1a6fff"></i>출근 ' + (d.starttime || '') + '</span>';
        cnt++;
      }
      if (USE_MID_REPORT && d.mid_latitude && d.mid_longitude) {
        addLocMarker(d.mid_latitude, d.mid_longitude, name, d.mid_address, '중간보고', '#34c759', d.mid_time, bounds);
        legend += '<span><i style="background:#34c759"></i>중간보고 ' + (d.mid_time || '') + '</span>';
        cnt++;
      }
      if (d.out_latitude && d.out_longitude) {
        addLocMarker(d.out_latitude, d.out_longitude, name, d.out_address, '퇴근', '#ff3333', d.endtime, bounds);
        legend += '<span><i style="background:#ff3333"></i>퇴근 ' + (d.endtime || '') + '</span>';
        cnt++;
      }

      $('#locLegend').html(cnt > 0 ? legend
        : '<div class="loc-empty">저장된 위치가 없습니다.<br>사내 출퇴근은 좌표를 남기지 않습니다.</div>');

      // 한 곳이면 bounds 를 쓰면 과하게 확대되므로 중심만 옮긴다
      if (cnt === 1) {
        locMap.setCenter(bounds.getSouthWest());
        locMap.setLevel(3);
      } else if (cnt > 1) {
        locMap.setBounds(bounds);
      }
    });
  }

  function closeLocationMap() {
    $('#locSheet').removeClass('on');
    if (locOpenInfo) { locOpenInfo.close(); locOpenInfo = null; }
  }

  // 카드는 조회할 때마다 다시 그려지므로 이벤트는 위임으로 건다
  $(document).on('click', '#dailyList .att-card.has-loc', function() {
    openLocationMap(parseInt($(this).attr('data-idx'), 10));
  });
  $(document).on('click', '#locClose', closeLocationMap);
  $(document).on('click', '#locSheet', function(e) {
    if (e.target === this) closeLocationMap();   // 어두운 바깥을 터치하면 닫는다
  });
</script>
</body>
</html>
