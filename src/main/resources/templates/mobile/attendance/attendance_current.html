<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }
    #searcharea, #detailarea { position: relative; width: 100%; margin-top: 10px; }
    .search-container input { margin-top: 10px; margin-bottom: 10px; box-shadow: 0 4px 5px rgba(0,0,0,0.2); }
    #searcharea input, #detailarea input { width: 100%; border: none; outline: none; font-size: 16px; padding: 10px; }
    #theGrid { overflow-x: auto; white-space: nowrap; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; display: none; }
    .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border-radius: 10px; width: 95%; z-index: 1001; }
    .modal input, .modal select { width: 100%; margin-bottom: 10px; padding: 5px; }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTAS MES</title>
    <!-- ctx: common.js의 $.ajaxPrefilter가 이 값을 읽어 /elv 를 자동으로 붙여줌 -->
    <meta name="ctx" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
    <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script th:src="@{/assets_mobile/js/ui.js}"></script>
    <script th:inline="javascript">
        var sandanData = /*[[${session.sandanList}]]*/ [];
    </script>
    <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script th:src="@{/js/Mobile.js}"></script>
    <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">
    <div class="mobile-layout-header">
        <header>
            <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
            <div class="left" style="margin-left:35px; font-size: 25px;"><h2>개인별휴가현황</h2></div>
            <div class="right">
                <a href="#" title="전체메뉴" class="btn-menu">
                    <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
                </a>
            </div>
        </header>
    </div>

    <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

    <div class="mobile-layout-contents">
        <div class="layout-contents">
            <div class="search-wrap">
                <div class="srch-tit aco-hd">
                    <p>기본검색</p>
                    <a href="#" title="열기/닫기" class="btn-aco">
                        <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
                    </a>
                </div>
                <div class="srch-cont aco-cont">
                    <dl>
                        <dt>조회년도</dt>
                        <dd>
                            <div style="display: flex; gap: 10px">
                                <div style="width: 100%">
                                    <select id="searchYear"><option>2026</option></select>
                                </div>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>근태항목</dt>
                        <dd>
                            <div style="display: flex; gap: 10px">
                                <div style="width: 100%">
                                    <select id="selectWorkcd"><option>전체</option></select>
                                </div>
                            </div>
                        </dd>
                    </dl>
                    <div class="srch-btn">
                        <button class="btn-dark" onclick="handleSearch()">조회</button>
                    </div>
                </div>
            </div>
            <div class="contents-wrap">
                <div id="theGrid"></div>
                <div class="srch-btn"></div>
            </div>
        </div>

        <div id="vacationEditModal" class="modal-overlay">
            <div class="modal">
                <h3>휴가 정보 수정</h3>
                <input type="hidden" id="vacId"><br>
                <div class="form-group">
                    <label for="editAttKind">근태항목:</label>
                    <div style="display: flex; gap: 10%">
                        <select id="editAttKind" style="width: 70%" onchange="bindPeriod();"><option>휴가</option></select>
                        <label style="display: none; align-items: center">
                            <input type="checkbox" style="margin: 0" id="isAnnual" disabled>&nbsp;&nbsp;연차
                        </label>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="editStartDate">시작일:</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="date" id="editStartDate" style="width: 140px;">
                        <input type="time" id="editStartTime" style="width: 140px;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editEndDate">종료일:</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="date" id="editEndDate" style="width: 140px;">
                        <input type="time" id="editEndTime" style="width: 140px;">
                    </div>
                </div>
                <div class="form-group" style="display: none;">
                    <label for="editUseDate">사용일수:</label>
                    <input type="number" id="editUseDate" readonly>
                </div>
                <div class="form-group">
                    <label for="editRemark">사유:</label>
                    <input type="text" id="editRemark">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="submitEditVacation()" style="background-color: #56a0fd; color: #FFFFFF">수정</button>
                    <button onclick="deleteVacation()">삭제</button>
                    <button onclick="closeEditModal()">닫기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">

    $(document).ready(function () {
        AjaxUtil.fillSelectOptions($('#selectWorkcd'), 'workcd', 'all', false, 'work_division', '');
        AjaxUtil.fillSelectOptions($('#editAttKind'), 'workcd', 'choose', false, 'work_division', '');
        document.getElementById('editStartDate').addEventListener('change', calculateUseDays);
        document.getElementById('editEndDate').addEventListener('change', calculateUseDays);
        loadAvailableYears().then(() => { searchMainData(); });
    });

    function formatDateToYYMMDD(dateStr) {
        if (!dateStr || dateStr.length < 10) return '';
        return dateStr.slice(2, 10);
    }

    function searchMainData() {
        // ✅ AjaxUtil이 내부적으로 withCtx() 호출 → $.ajaxPrefilter가 /elv 자동 추가
        //    절대경로 '/api/...' 그대로 사용하면 됨 (ctx 변수 불필요)
        let url = '/api/attendance_current/read';
        let data = {
            'workcd': document.getElementById('selectWorkcd').value,
            'searchYear': document.getElementById('searchYear').value,
        };
        let fnsuccess = function (result) {
            if (result != null && result.data != null) {
                if (result.data.annInfo == null) {
                    result.data.annInfo = { rtdate: "", ewolnum: "", holinum: "", daynum: "", restnum: "" };
                }
                const currentLength = result.data.vacInfo.length;
                if (currentLength < 8) {
                    for (let i = 0; i < 8 - currentLength; i++) result.data.vacInfo.push({});
                }
                const annInfo = result.data.annInfo;
                const vacitems = result.data.vacInfo;

                let tableHtml = `
                <table>
                    <tr style="display: none">
                        <th>입사일</th>
                        <td colspan="7" style="text-align: left">${annInfo.rtdate || ''}</td>
                        <td></td>
                    </tr><br>
                    <tr style="display: none">
                        <th>이월</th><td>${annInfo.ewolnum || ''}</td>
                        <th>생성</th><td>${annInfo.holinum || ''}</td>
                        <th>사용</th><td>${annInfo.daynum || ''}</td>
                        <th>잔여</th><td>${annInfo.restnum || ''}</td>
                        <td></td>
                    </tr><br>
                    <tr>
                        <th>신청일</th><th>구분</th><th>연차</th>
                        <th>시작일</th><th>종료일</th><th>기간</th>
                        <th>사유</th><th>시작시각</th><th>종료시각</th>
                    </tr>`;

                vacitems.forEach(vacInfo => {
                    tableHtml += `
                    <tr>
                        <td>${formatDateToYYMMDD(vacInfo.reqdate) || ''}</td>
                        <td>${vacInfo.worknm || ''}</td>
                        <td>${vacInfo.yearflag || ''}</td>
                        <td>${formatDateToYYMMDD(vacInfo.frdate) || ''}</td>
                        <td>${formatDateToYYMMDD(vacInfo.todate) || ''}</td>
                        <td>${vacInfo.daynum || ''}</td>
                        <td>${vacInfo.remark || ''}</td>
                        <td>${vacInfo.sttime || ''}</td>
                        <td>${vacInfo.edtime || ''}</td>
                        <td style="display:none;">${vacInfo.workcd || ''}</td>
                        <td style="display:none;">${vacInfo.id || ''}</td>
                        <td style="display:none;">${vacInfo.appgubun || ''}</td>
                        <td style="display:none;">${vacInfo.fixflag || ''}</td>
                    </tr>`;
                });
                tableHtml += `</table>`;
                document.querySelector('#theGrid').innerHTML = tableHtml;
            } else {
                document.querySelector('#theGrid').innerHTML =
                    `<tr><td colspan="6" style="text-align:center; padding:8px;">조회된 데이터가 없습니다.</td></tr>`;
            }
        };
        AjaxUtil.getAsyncData(url, data, fnsuccess);
    }

    function handleSearch() {
        searchMainData();
        document.querySelectorAll('.btn-aco').forEach(btn => btn.click());
    }

    function restoreFullYearDate(shortDateStr) {
        if (!shortDateStr || shortDateStr.length !== 8) return '';
        const parts = shortDateStr.split('.');
        return `20${parts[0]}.${parts[1]}.${parts[2]}`;
    }

    document.querySelector('#theGrid').addEventListener('click', function (e) {
        const targetRow = e.target.closest('tr');
        if (!targetRow) return;
        const cells = targetRow.querySelectorAll('td');
        const isEmptyRow = Array.from(cells).every(cell => cell.innerText.trim() === "");
        if (isEmptyRow) return;
        const gubunValue = cells[11].innerText;
        const fixflag = cells[12].innerText;
        if (gubunValue !== '001') { Alert.alert('', '해당 항목은 결재처리되었습니다.'); return; }
        if (fixflag !== '0' && fixflag !== '') { Alert.alert('', '해당 항목은 확인처리되었습니다.'); return; }
        openEditModal(targetRow);
    });

    function openEditModal(targetRow) {
        const cells = targetRow.querySelectorAll('td');
        const textValue = cells[9].innerText;
        const selectElement = document.getElementById('editAttKind');
        for (let i = 0; i < selectElement.options.length; i++) {
            if (selectElement.options[i].value === textValue) { selectElement.value = textValue; break; }
        }
        const startDate = restoreFullYearDate(cells[3].innerText).split('.');
        const endDate = restoreFullYearDate(cells[4].innerText).split('.');
        document.getElementById('editStartDate').value = `${startDate[0]}-${startDate[1]}-${startDate[2]}`;
        document.getElementById('editStartTime').value = cells[7].innerText;
        document.getElementById('editEndDate').value = `${endDate[0]}-${endDate[1]}-${endDate[2]}`;
        document.getElementById('editEndTime').value = cells[8].innerText;
        document.getElementById('editUseDate').value = cells[5].innerText;
        document.getElementById('editRemark').value = cells[6].innerText;
        document.getElementById('vacId').value = cells[10].innerText;
        document.getElementById('isAnnual').checked = cells[2].innerText !== '';
        document.getElementById('vacationEditModal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('vacationEditModal').style.display = 'none';
    }

    function submitEditVacation() {
        // ✅ AjaxUtil → withCtx() → $.ajaxPrefilter 에서 /elv 자동 추가
        let url = '/api/attendance_current/updateAttendance';
        let data = {
            'vacId': document.getElementById('vacId').value,
            'attKind': document.getElementById('editAttKind').value,
            'useDate': document.getElementById('editUseDate').value,
            'remark': document.getElementById('editRemark').value,
            'startDate': document.getElementById('editStartDate').value,
            'startTime': document.getElementById('editStartTime').value,
            'endDate': document.getElementById('editEndDate').value,
            'endTime': document.getElementById('editEndTime').value,
            'isAnnual': document.getElementById('isAnnual').checked ? "1" : "0"
        };
        let fnsuccess = function (result) {
            if (result != null) {
                if (result.success) Alert.alert('', result.message, reloadWindow);
                else Alert.alert('', "휴가 수정에 실패하였습니다.");
            } else Alert.alert('', "오류가 발생하였습니다.");
        };
        AjaxUtil.postAsyncData(url, data, fnsuccess);
    }

    function deleteVacation() {
        // ✅ AjaxUtil → withCtx() → $.ajaxPrefilter 에서 /elv 자동 추가
        let url = '/api/attendance_current/deleteAttendance';
        let data = { 'vacId': document.getElementById('vacId').value };
        let fnsuccess = function (result) {
            if (result != null) {
                if (result.success) Alert.alert('', result.message, reloadWindow);
                else Alert.alert('', "휴가 삭제에 실패하였습니다.");
            } else Alert.alert('', "오류가 발생하였습니다.");
        };
        AjaxUtil.postAsyncData(url, data, fnsuccess);
    }

    function calculateUseDays() {
        const startDate = document.getElementById('editStartDate').value;
        const endDate = document.getElementById('editEndDate').value;
        const useDateInput = document.getElementById('editUseDate');
        if (useDateInput.getAttribute('data-fixed') === 'true') return;
        if (startDate && endDate) {
            const dayDiff = (new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24);
            useDateInput.value = dayDiff === 0 ? "1.00" : (dayDiff > 0 ? (dayDiff + 1).toFixed(2) : '0.00');
        }
    }

    function reloadWindow() { window.location.reload(); }

    function bindPeriod() {
        // ✅ AjaxUtil → withCtx() → $.ajaxPrefilter 에서 /elv 자동 추가
        let url = '/api/attendance_submit/bindPeriod';
        let data = { 'attKind': document.getElementById('editAttKind').value };
        let fnsuccess = function (result) {
            if (result != null) {
                let usenum = parseFloat(result.data.usenum);
                if (usenum > 0 && usenum < 1) {
                    document.getElementById('editUseDate').value = usenum.toFixed(2);
                    document.getElementById('editUseDate').setAttribute('data-fixed', 'true');
                } else {
                    document.getElementById('editUseDate').removeAttribute('data-fixed');
                }
                document.getElementById('isAnnual').checked = result.data.yearflag === '1';
            } else Alert.alert('', "오류가 발생하였습니다.");
        };
        AjaxUtil.getAsyncData(url, data, fnsuccess);
    }

    async function loadAvailableYears() {
        try {
            // ✅ fetch()는 $.ajaxPrefilter 미적용 → window.CTX_PATH로 직접 컨텍스트 패스 추가
            const res = await fetch(window.CTX_PATH + '/api/attendance_current/years');
            const result = await res.json();
            const years = result.data;
            const select = document.getElementById('searchYear');
            select.innerHTML = '';
            if (!years || years.length === 0) {
                const opt = document.createElement('option');
                opt.text = opt.value = new Date().getFullYear();
                select.appendChild(opt);
                return;
            }
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.text = opt.value = y;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error('연도 조회 실패:', e);
        }
    }
</script>
</body>
</html>
