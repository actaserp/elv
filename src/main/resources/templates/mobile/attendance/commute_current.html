<!DOCTYPE html>
<html lang="ko">
<style>
  .btn-clear { display: none !important; }
  .btn-close { display: none !important; }
  #searcharea, #detailarea { position: relative; width: 100%; margin-top: 10px; }
  .search-container input { margin-top: 10px; margin-bottom: 10px; box-shadow: 0 4px 5px rgba(0,0,0,0.2); }
  #searcharea input, #detailarea input { width: 100%; border: none; outline: none; font-size: 16px; padding: 10px; }
  .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; }
  .search-guide { padding: 10px; font-size: 14px; color: #666; }
  .btn-select, .btn-login { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
  .modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; height: 650px; max-width: 90%; background-color: white; border-radius: 10px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); padding: 20px; border: none; z-index: 9999; }
  .modal-close { position: absolute; top: 10px; right: 5px; width: 30px; height: 25px; border: none; border-radius: 3px; background: none; z-index: 1000; cursor: pointer; }
  #loadingSpinner { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
  #loadingImage { width: 95%; max-width: 900px; }
  #theGrid { overflow-x: auto; white-space: nowrap; }
</style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTAS MES</title>
  <!-- ① meta ctx 추가: common.js가 이 값으로 window.CTX_PATH=/elv 세팅 -->
  <meta name="ctx" th:content="@{/}">
  <!-- ② favicon: href → th:href="@{/...}" 로 변경 -->
  <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <!-- ③ CSS 리소스: href → th:href="@{/...}" 로 변경 -->
  <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
  <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <!-- ④ JS 리소스: src → th:src="@{/...}" 로 변경 -->
  <script th:src="@{/assets_mobile/js/ui.js}"></script>
  <script th:inline="javascript">
    var sandanData = /*[[${session.sandanList}]]*/ [];

    /* 사업체별 중간보고 사용여부 (tb_tenant_db.use_mid_report).
       설정이 없으면 사용으로 본다 — 기존 사업체의 동작이 바뀌지 않아야 한다. */
    var USE_MID_REPORT = /*[[${use_mid_report}]]*/ true;
  </script>
  <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script th:src="@{/js/Mobile.js}"></script>
</head>

<body>
<!-- ⑤ CSRF 토큰 추가 -->
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">
  <div class="mobile-layout-header">
    <header>
      <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
      <div class="left" style="margin-left:35px; font-size: 25px;"><h2>출퇴근현황</h2></div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <!-- ⑥ 이미지: src → th:src="@{/...}" 로 변경 -->
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>

  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

  <div class="mobile-layout-contents">
    <div class="layout-contents">
      <div class="search-wrap">
        <div class="srch-tit aco-hd">
          <p>기본검색</p>
          <a href="#" title="열기/닫기" class="btn-aco">
            <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
          </a>
        </div>
        <div class="srch-cont aco-cont">
          <dl>
            <dt>조회일자</dt>
            <dd>
              <div style="display: flex; gap: 10px">
                <div style="width: 45%"><input type="date" id="searchFromDate"></div>
                ~
                <div style="width: 45%"><input type="date" id="searchToDate"></div>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>구분</dt>
            <dd>
              <div style="display: flex; gap: 10px">
                <div style="width: 100%">
                  <select id="selectWorkcd"><option value="">전체</option></select>
                </div>
              </div>
            </dd>
          </dl>
          <div class="srch-btn">
            <button class="btn-dark" onclick="handleSearch()">조회</button>
          </div>
        </div>
      </div>
      <div class="contents-wrap">
        <div id="theGrid"></div>
      </div>
      <div id="addressWrap" class="contents-wrap"></div>
    </div>
  </div>
</div>

<script type="text/javascript">

  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const date = String(today.getDate()).padStart(2, '0');

  $(document).ready(function () {
    AjaxUtil.fillSelectOptions($('#selectWorkcd'), 'workcd', 'all', false, 'work_division', '');
    document.getElementById('searchFromDate').value = `${year}-${month}-01`;
    document.getElementById('searchToDate').value = `${year}-${month}-${date}`;
    searchMainData();
  });

  // workym('YYYYMM') + workday('DD') → 'YY-MM-DD'
  // 예전에는 workym 만 넘기고 10자 미만이면 '' 를 돌려줘서 일자가 비어 보였다
  function formatDateToYYMMDD(workym, workday) {
    if (!workym || workym.length < 6) return '';
    return workym.slice(2, 4) + '-' + workym.slice(4, 6) + '-' + (workday || '');
  }

  function searchMainData() {
    // AjaxUtil → withCtx() → $.ajaxPrefilter 가 /elv 자동 추가
    let url = '/api/commute_current/read';
    let data = {
      'workcd': document.getElementById('selectWorkcd').value,
      'searchFromDate': document.getElementById('searchFromDate').value,
      'searchToDate': document.getElementById('searchToDate').value
    };
    let fnsuccess = function (result) {
      if (result != null && result.data != null) {
        const items = result.data;
        // 중간보고를 쓰지 않는 사업장은 관련 열 3개를 아예 빼낸다.
        // 값이 비어도 헤더는 남아 빈 칸으로 보이기 때문이다.
        const midTh    = USE_MID_REPORT ? '<th>중간보고</th>' : '';
        const midLocTh = USE_MID_REPORT ? '<th>중간위치</th>' : '';
        const midRmkTh = USE_MID_REPORT ? '<th>중간비고</th>' : '';

        let tableHtml = `
          <table>
            <tr>
              <th>일자</th><th>근태</th><th>출근</th>${midTh}
              <th>퇴근</th><th>근무시간</th><th>구분</th>
              <th>출근위치</th>${midLocTh}<th>퇴근위치</th>
              <th>출근비고</th>${midRmkTh}<th>퇴근비고</th>
            </tr>`;
        items.forEach(item => {
          // 다시 누르면 덮어쓰므로 마지막 시각 하나만 보여준다 (누른 횟수는 본사 commute_log 에 남는다)
          const midTime = item.mid_time || '-';
          const midTd    = USE_MID_REPORT ? `<td>${midTime}</td>` : '';
          const midLocTd = USE_MID_REPORT ? `<td>${item.mid_address || ''}</td>` : '';
          const midRmkTd = USE_MID_REPORT ? `<td>${item.mid_remark || ''}</td>` : '';
          tableHtml += `
            <tr>
              <td>${formatDateToYYMMDD(item.workym, item.workday)}</td>
              <td>${item.worknm || ''}</td>
              <td>${item.starttime || '--:--'}</td>
              ${midTd}
              <td>${item.endtime || '--:--'}</td>
              <td>${item.worktime || '-'}</td>
              <td>${item.status_text || ''}</td>
              <td>${item.address || ''}</td>
              ${midLocTd}
              <td>${item.out_address || ''}</td>
              <td>${item.remark || ''}</td>
              ${midRmkTd}
              <td>${item.out_remark || ''}</td>
            </tr>`;
        });
        tableHtml += `</table>`;
        document.querySelector('#theGrid').innerHTML = tableHtml;
      } else {
        document.querySelector('#theGrid').innerHTML =
          `<tr><td colspan="${USE_MID_REPORT ? 13 : 10}" style="text-align:center; padding:8px;">조회된 데이터가 없습니다.</td></tr>`;
      }
    };
    AjaxUtil.getAsyncData(url, data, fnsuccess);
  }

  function handleSearch() {
    searchMainData();
    document.querySelectorAll('.btn-aco').forEach(btn => btn.click());
  }
</script>
</body>
</html>
