<!DOCTYPE html>
<html lang="ko">
<style>
  .contents-wrap{}
  .currentData{}

  .ip-card{
    width: 80%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #4dd0e1, #81c784);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    margin-bottom: 10px;
    position: relative;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    text-align: center;
    margin-left: 10%;
    font-size: large;
  }

  .office-card{
    text-align: center;
    padding: 10px;
    margin-bottom: 5px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ✅ 추가근무 카드 스타일 */
  .overtime-card{
    text-align: center;
    padding: 10px;
    margin-bottom: 5px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 4px solid #ff9500;
  }

  .btnArea{
    width: 93%;
    margin-top: 15px;
  }

  .office_btn {
    background-color: #007aff;
    color: white;
    border: none;
    border-radius: 8px;
    width: 100px;
    height: 100px;
    font-size: 1.2em;
    cursor: pointer;
    transition: background-color 0.3s;
    display: block;
    margin-top: 10px;
    margin-bottom: 50px;
    border: none;
    box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);
  }

  #officeIcon {
    color: #ffffff;
    background-color: #9acaf4;
    border-radius: 10px;
    font-size: 2.5em;
    width: 15%;
    aspect-ratio: 1 / 1;
    padding-top: 2%;
    margin-right: 10%;
  }

  /* ✅ 추가근무 아이콘 스타일 */
  #overtimeIcon {
    color: #ffffff;
    background-color: #ff9500;
    border-radius: 10px;
    font-size: 2.5em;
    width: 15%;
    aspect-ratio: 1 / 1;
    padding-top: 2%;
    margin-right: 10%;
  }

  #selectWorkcd {
    max-height: 150px;
    overflow-y: auto;
  }
</style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="ctx" th:content="@{/}">
  <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
  <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script th:src="@{/assets_mobile/js/ui.js}"></script>
  <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>

</head>

<body>
<script th:inline="javascript">
  if (!sessionStorage.getItem("spjangcd")) {
    sessionStorage.setItem("spjangcd", [[${session.spjangcd}]]);
  }
</script>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">
  <!-- [모바일] 헤더 -->
  <div class="mobile-layout-header">
    <header>
      <div class="left">
        <a href="#" title="전체메뉴" class="logo"></a>
      </div>
      <div class="left" style="margin-left:35px; font-size: 25px;">
        <h2>출퇴근등록</h2>
      </div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>

  <!-- [모바일] 메뉴 -->
  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

  <!-- [모바일] 컨텐츠 -->
  <div class="mobile-layout-contents">
    <div class="layout-contents">
      <div class="search-wrap" style="margin-bottom: 10px"></div>

      <div class="contents-wrap">
        <dl style="margin-bottom: 10px">
          <div class="ip-card">
            <input type="hidden" id="postno">
            <div style="margin-bottom: 10px">
              <div id="searchDate" class="currentData" style="text-align: justify;"></div>
              <div id="userInfo" class="currentData" style="text-align: end">생산부 홍길동 사원</div>
            </div>
            <div>
              <span id="searchTime" class="currentData" style="height: 100px; font-size: 40px;"></span>
            </div>
            <div>
              <span id="ipAddress" class="currentData" style="border-radius: 0 0 10px 10px;"></span>
            </div>
          </div>

          <!-- 출근/추가근무 카드 가로 배치 -->
          <div style="display:flex; gap:8px; margin-bottom:5px;">

            <!-- 출근시간 카드 (일반) -->
            <div class="office-card" style="flex:1; margin-bottom:0;">
              <i class="fa-solid fa-stopwatch fa_xl" id="officeIcon" style="font-size:1.6em; width:12%; margin-right:6%;"></i>
              <div>
                <div class="status" style="font-size:12px;">출근</div>
                <div class="time" id="officeTime" style="font-weight:bold; font-size:14px;">오전 09:00</div>
              </div>
            </div>

            <!-- 추가근무 출근시간 카드 -->
            <div class="overtime-card" id="overtimeCard" style="flex:1; margin-bottom:0; display:none;">
              <i class="fa-solid fa-clock-rotate-left fa_xl" id="overtimeIcon" style="font-size:1.6em; width:12%; margin-right:6%;"></i>
              <div>
                <div class="status" style="font-size:12px;">추가근무</div>
                <div class="time" id="overtimeStartTime" style="font-weight:bold; font-size:14px; color:#ff9500;">--:--</div>
              </div>
            </div>

          </div>

          <!-- 근태구분 확인 -->
          <div id="workcd" style="display: none">
            <label>근태구분</label>
            <div>
              <select id="selectWorkcd">
                <option>휴가</option>
              </select>
            </div>
          </div>

          <div style="font-size: small; color: red;" id="gpsInfo"></div>

          <!-- 비고 입력 -->
          <div style="">
            <input type="text" id="remarkInput"
                   placeholder="비고 입력 (25자 이내)"
                   maxlength="25"
                   style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px;
                          font-size:14px; box-sizing:border-box;">
          </div>
          <div class="btnArea">
            <!-- 사내 버튼 -->
            <div id="inside" style="display: none; gap: 13%; justify-content: center;">
              <button onclick="submitCommute('inOfficeIn')" class="office_btn">
                <i class="fa-solid fa-briefcase fa_xl" style="color: #ffffff;"></i><br>사내출근
              </button>
              <button onclick="submitCommute('inOfficeOut')" class="office_btn" style="background-color: red;">
                <i class="fa-solid fa-person-walking fa-xl" style="color: #ffffff;"></i><br>사내퇴근
              </button>
            </div>
            <!-- 외부 버튼 -->
            <div id="outside" style="display: none; gap: 13%; justify-content: center;">
              <button onclick="submitCommute('outOfficeIn')" class="office_btn">
                <i class="fa-solid fa-briefcase fa_xl" style="color: #ffffff;"></i><br>출근
              </button>
              <button onclick="submitCommute('outOfficeOut')" class="office_btn" style="background-color: red;">
                <i class="fa-solid fa-person-walking fa_xl" style="color: #fafafa;"></i><br>퇴근
              </button>
            </div>
          </div>
        </dl>
      </div>
    </div>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=52c2b8b80bd58f19004f0c727c024f75&libraries=services&autoload=false"></script>
<script src="/elv/js/gps.js"></script>

<script type="text/javascript">
  // ✅ 전역 변수로 유저 ID 저장 (이름보다 empId가 더 안전)
  let currentUserInfo = null;

  const weekDays = ["일", "월", "화", "수", "목", "금", "토"];

  const updateDate = () => {
    const today = new Date();
    const year    = today.getFullYear();
    const month   = String(today.getMonth() + 1).padStart(2, '0');
    const date    = String(today.getDate()).padStart(2, '0');
    const weekDay = weekDays[today.getDay()];
    document.getElementById('searchDate').innerText = `${year}.${month}.${date}(${weekDay})`;
  };

  const updateIPAddress = () => {
    const cacheBuster = `?format=json&cb=${Date.now()}`;
    fetch(`https://api.ipify.org${cacheBuster}`)
            .then(response => response.text())
            .then(data => {
              if (data.includes('{')) {
                const jsonData = JSON.parse(data);
                document.getElementById('ipAddress').innerText = 'IP : ' + jsonData.ip;
                handleIPDisplay(jsonData.ip);
              } else {
                document.getElementById('ipAddress').innerText = 'IP : ' + data.trim();
                handleIPDisplay(data.trim());
              }
            })
            .catch(error => console.error("IP 조회 중 에러 발생: ", error.message));
  };

  const handleIPDisplay = (ip) => {
    if (ip === '') {
      document.getElementById('inside').style.display = 'flex';
      document.getElementById('outside').style.display = 'none';
      document.getElementById('workcd').style.display = 'none';
      getGPSLocation();
    } else {
      document.getElementById('inside').style.display = 'none';
      document.getElementById('outside').style.display = 'flex';
      document.getElementById('workcd').style.display = 'block';
      getGPSLocation();
    }
  };

  window.addEventListener('online', () => { updateIPAddress(); });

  if (navigator.connection) {
    navigator.connection.addEventListener('change', () => {
      setTimeout(() => { updateIPAddress(); }, 2000);
    });
  }

  const updateTime = () => {
    const now     = new Date();
    let hours     = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm    = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    document.getElementById('searchTime').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
  };

  $(document).ready(function () {
    // ✅ 날짜가 바뀌면 로컬스토리지 초기화(다음날 출근 대비)
    const savedDate = localStorage.getItem('commuteDate');
    const today = new Date();
    const todayStr = today.getFullYear()
            + String(today.getMonth() + 1).padStart(2, '0')
            + String(today.getDate()).padStart(2, '0');

    if (savedDate && savedDate !== todayStr) {
      localStorage.removeItem('commuteUser');
      localStorage.removeItem('commuteDate');
    }

    updateIPAddress();
    updateTime();
    setInterval(updateIPAddress, 5000);
    setInterval(updateTime, 5000);
    updateDate();

    function searchMainData() {
      let url = '/api/mobile_main/read_userInfo';
      let fnsuccess = function (result) {
        if (result != null) {

          // ✅ 전역 변수에 저장 (empId 사용 권장)
          currentUserInfo = result.data.perid; // 사번 또는 직원ID

          document.getElementById('userInfo').textContent =
                  result.data.divinm + " " + result.data.last_name + " " + result.data.RSPNM;

          // ✅ 일반 출근시간 (idx=1)
          document.getElementById('officeTime').textContent =
                  result.data.inOfficeTime ? result.data.inOfficeTime : "--:--";

          // ✅ 비고 표시 (출근 후 저장된 remark)
          if (result.data.remark) {
            document.getElementById('remarkInput').value = result.data.remark;
          }

          // ✅ 추가근무 출근시간 바인딩 (idx>=2)
          if (result.data.ovStartTime) {
            document.getElementById('overtimeStartTime').textContent = result.data.ovStartTime;
            document.getElementById('overtimeCard').style.display = 'flex';
            // 카드 2개일 때 아이콘 width 22%로 확대
            document.getElementById('officeIcon').style.width   = '22%';
            document.getElementById('overtimeIcon').style.width = '22%';
          } else {
            document.getElementById('overtimeCard').style.display = 'none';
            // 카드 1개일 때 아이콘 width 12%로 원복
            document.getElementById('officeIcon').style.width = '12%';
          }

          // 근태구분 바인딩
          const selectElement = document.getElementById('selectWorkcd');
          const options = selectElement.options;
          for (let i = 0; i < options.length; i++) {
            if (options[i].value === result.data.workcd) {
              selectElement.value = options[i].value;
              break;
            }
          }
        }
      };
      AjaxUtil.getAsyncData(url, {}, fnsuccess);
    }
    searchMainData();
    AjaxUtil.fillSelectOptions($('#selectWorkcd'), 'workcd', 'choose', false, 'work_division', '');
  });

  // 공휴일 확인 API
  const API_KEY = 'a0b009c35f320b2f60bd2ba0bfdc91cde87089876c80cad72fa563fd5463e3c0';
  const today   = new Date();
  const year    = today.getFullYear();
  const month   = String(today.getMonth() + 1).padStart(2, '0');
  const day     = String(today.getDate()).padStart(2, '0');
  let isHoly    = 0;

  const url = `https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getHoliDeInfo?solYear=${year}&solMonth=${month}&ServiceKey=${API_KEY}`;

  async function checkHoliday() {
    try {
      const response   = await axios.get(url, { params: { _type: 'json' } });
      const items      = response.data.response.body.items.item;
      const todayStr   = `${year}${month}${day}`;
      const isWeekend  = today.getDay() === 0 || today.getDay() === 6;
      const isHoliday  = items && items.some(item => item.locdate === todayStr);
      if (isWeekend || isHoliday) { isHoly = 1; }
    } catch (error) {
      console.error("공휴일 API 호출 실패:", error.message);
    }
  }

  function reloadWindow() {
    window.location.reload();
  }

  // ✅ 출퇴근 등록 메인 함수
  function submitCommute(office) {
    const now     = new Date();
    const year    = now.getFullYear();
    const month   = String(now.getMonth() + 1).padStart(2, '0');
    const date    = String(now.getDate()).padStart(2, '0');
    const weekNum = now.getDay();

    const isIn  = office === 'inOfficeIn'  || office === 'outOfficeIn';
    const isOut = office === 'inOfficeOut' || office === 'outOfficeOut';

    // ✅ 외부 출퇴근 시 근태구분 필수 체크
    if ((office === 'outOfficeIn' || office === 'outOfficeOut') &&
            document.getElementById('selectWorkcd').value === "") {
      Alert.alert('', '근태구분을 선택하여주십시오');
      return;
    }

    // ✅ 출근 버튼 클릭
    if (isIn) {
      const alreadyIn = document.getElementById('officeTime').textContent !== '--:--';

      if (alreadyIn) {
        // ✅ 이미 출근기록 있음 → 추가근무 여부 확인 팝업
        Alert.confirm(
                '',
                '이미 출근기록이 있습니다. \n추가근무 출근이신가요?',
                function () {
                  // 확인 → 추가근무 출근 처리
                  callCommuteApi(office, year, month, date, weekNum, true);
                },
                function () {
                  // 취소 → 아무것도 안 함
                }
        );
      } else {
        // 일반 출근
        checkHoliday();
        callCommuteApi(office, year, month, date, weekNum, false);
      }
      return;
    }

    // ✅ 퇴근 버튼 클릭
    if (isOut) {
      if (document.getElementById('officeTime').textContent === '--:--') {
        Alert.alert('', '출근기록이 없습니다.');
        return;
      }
      callCommuteApi(office, year, month, date, weekNum, false);
    }
  }

  // ✅ 공통 API 호출 함수
  function callCommuteApi(office, year, month, date, weekNum, isOvertime) {
    const isIn = office === 'inOfficeIn' || office === 'outOfficeIn';

    if (isIn) {
      // 출근 API
      // ✅ 유저 정보 로드 전 출근 시도 차단
      if (!currentUserInfo) {
        Alert.alert('', '사용자 정보를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
        return;
      }

      // ✅ 위치정보(GPS) 조회 전 출근 시도 차단
      if (latitude == null || longitude == null) {
        Alert.alert('', '위치정보를 불러오는 중입니다.\n위치 확인 후 다시 시도해주세요.');
        getGPSLocation();   // 즉시 재조회 시도
        return;
      }

      // ✅ 다른 유저 출근 여부 체크 (이름 대신 ID로 비교)
      const savedUser = localStorage.getItem('commuteUser');

      if (savedUser && savedUser !== currentUserInfo) {
        const savedUserName = localStorage.getItem('commuteUserName');
        Alert.alert('',
                `이 기기는 [${savedUserName}] 님이 출근 중입니다.\n퇴근 후 사용 가능합니다.`
        );
        return;
      }

      let data = {
        weekNum:    weekNum,
        office:     office,
        workym:     year + month,
        workday:    date,
        isHoly:     isHoly,
        workcd:     document.getElementById('selectWorkcd').value,
        latitude:   latitude,
        longitude:  longitude,
        gpsInfo:    document.getElementById('gpsInfo').innerText,
        remark:     document.getElementById('remarkInput').value.trim(),
        isOvertime: isOvertime  // ✅ 추가근무 여부 전달
      };

      AjaxUtil.postAsyncData('/api/mobile_main/submitCommute', data, function (result) {
        if (result != null) {
          if (result.success) {
            // ✅ ID와 표시용 이름 분리해서 저장
            localStorage.setItem('commuteUser', currentUserInfo);
            localStorage.setItem('commuteUserName',
                    document.getElementById('userInfo').textContent.trim());
            localStorage.setItem('commuteDate', `${year}${month}${date}`);
            // ✅ 추가근무 출근 성공 시 카드 표시
            if (isOvertime) {
              document.getElementById('overtimeCard').style.display = 'flex';
              document.getElementById('officeIcon').style.width   = '22%';
              document.getElementById('overtimeIcon').style.width = '22%';
            }
            Alert.alert('', result.message, reloadWindow);
          } else {
            Alert.alert('', result.message || '출근 등록에 실패하였습니다.');
          }
        } else {
          Alert.alert('', '오류가 발생하였습니다.');
        }
      });

    } else {
      // 퇴근 API
      let data = {
        office:    office,
        workym:    year + month,
        workday:   date,
        workcd:    document.getElementById('selectWorkcd').value,
        remark:    document.getElementById('remarkInput').value.trim(),
        gpsInfo:   document.getElementById('gpsInfo').innerText,
        latitude:  latitude,
        longitude: longitude
      };

      AjaxUtil.postAsyncData('/api/mobile_main/modifyCommute', data, function (result) {
        if (result.success) {
          // ✅ 퇴근 성공 시 로컬스토리지 초기화
          localStorage.removeItem('commuteUser');
          localStorage.removeItem('commuteUserName');
          localStorage.removeItem('commuteDate');

          Alert.alert('', result.message, function () {
            window.location.href = 'mobile/attendance/commute_current';
          });
        } else {
          Alert.alert('', result.message || '퇴근 등록에 실패하였습니다.');
        }
      });
    }
  }
</script>
</body>
