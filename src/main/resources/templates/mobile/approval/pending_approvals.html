<!DOCTYPE html>
<html lang="ko">
<style>
  .approval-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    border-left: 4px solid #03428E;
  }
  .approval-card .card-title {
    font-size: 15px;
    font-weight: bold;
    color: #222;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .approval-card .card-meta {
    font-size: 12px;
    color: #666;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .approval-card .card-status {
    font-size: 12px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .status-001 { background:#e3f2fd; color:#1565c0; }
  .status-101 { background:#e8f5e9; color:#2e7d32; }
  .status-131 { background:#fce4ec; color:#c62828; }
  .status-201 { background:#fff3e0; color:#e65100; }

  /* 팝업 */
  .mobile-popup-overlay {
    display: none;
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.5); z-index: 999;
  }
  .mobile-popup-wrapper {
    display: none;
    position: fixed; top:50%; left:50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 16px;
    width: 92%; max-width: 500px;
    max-height: 85vh; overflow-y: auto;
    z-index: 1000;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .mobile-popup-wrapper h3 {
    font-size: 16px; margin: 0 0 16px; color: #03428E;
  }
  .detail-table { width:100%; border-collapse: collapse; font-size:13px; margin-bottom:12px; }
  .detail-table th { background:#f0f4f8; padding:7px 8px; text-align:left; color:#555; font-weight:600; width:30%; }
  .detail-table td { padding:7px 8px; color:#222; border-bottom:1px solid #f0f0f0; }

  .work-item {
    background:#f8f9fa; border-radius:8px; padding:10px 12px;
    margin-bottom:8px; font-size:13px;
  }
  .work-item .wi-title { font-weight:bold; color:#333; margin-bottom:4px; }
  .work-item .wi-meta { color:#666; font-size:12px; }

  .remark-input {
    width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;
    font-size:14px; box-sizing:border-box; margin-bottom:12px;
  }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-approval {
    flex:1; padding:11px 8px; border:none; border-radius:8px;
    font-size:13px; font-weight:bold; cursor:pointer; min-width:70px;
  }
  .btn-approve  { background:#03428E; color:#fff; }
  .btn-reject   { background:#c62828; color:#fff; }
  .btn-hold     { background:#e65100; color:#fff; }
  .btn-cancel   { background:#757575; color:#fff; }
  .btn-close    { background:#eee;    color:#333; }
  .btn-approval:disabled { background:#ccc; color:#999; cursor:not-allowed; }

  .empty-msg { text-align:center; color:#999; padding:40px 0; font-size:14px; }

  /* 검색바 */
  .search-bar { display:flex; gap:8px; margin-bottom:14px; align-items:center; }
  .search-bar input, .search-bar select {
    flex:1; padding:9px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px;
  }
  .search-bar button {
    padding:9px 16px; background:#03428E; color:#fff; border:none; border-radius:8px; font-size:13px; cursor:pointer;
  }
  .summary-bar {
    display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;
  }
  .summary-item {
    flex:1; min-width:70px; background:#f0f4f8; border-radius:8px;
    padding:8px; text-align:center; font-size:12px;
  }
  .summary-item .s-count { font-size:18px; font-weight:bold; color:#03428E; }
  .summary-item .s-label { color:#666; margin-top:2px; }
</style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결재 할 내역</title>
  <meta name="ctx" th:content="@{/}">
  <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
  <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script th:src="@{/assets_mobile/js/ui.js}"></script>
  <script th:inline="javascript">
    if (!sessionStorage.getItem("spjangcd")) {
      sessionStorage.setItem("spjangcd", [[${session.spjangcd}]]);
    }
  </script>
  <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script th:src="@{/js/Mobile.js}"></script>
  <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
</head>
<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<div class="mobile-wrapper page-ticket-list">
  <!-- 헤더 -->
  <div class="mobile-layout-header">
    <header>
      <div class="left">
        <a href="#" title="전체메뉴" class="logo"></a>
      </div>
      <div class="left" style="margin-left:35px; font-size:20px;">
        <h2>결재 할 내역</h2>
      </div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>

  <!-- 메뉴 -->
  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

  <!-- 컨텐츠 -->
  <div class="mobile-layout-contents">
    <div class="layout-contents">

      <!-- 날짜 검색 -->
      <div class="search-bar">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
        <button onclick="loadList()">검색</button>
      </div>

      <!-- 요약 현황 -->
      <div class="summary-bar">
        <div class="summary-item">
          <div class="s-count" id="cnt001">-</div>
          <div class="s-label">대기</div>
        </div>
        <div class="summary-item">
          <div class="s-count" id="cnt101">-</div>
          <div class="s-label">결재</div>
        </div>
        <div class="summary-item">
          <div class="s-count" id="cnt201">-</div>
          <div class="s-label">보류</div>
        </div>
        <div class="summary-item">
          <div class="s-count" id="cnt131">-</div>
          <div class="s-label">반려</div>
        </div>
      </div>

      <!-- 카드 목록 -->
      <div id="cardList">
        <div class="empty-msg">데이터를 불러오는 중...</div>
      </div>

    </div>
  </div>
</div>

<!-- 결재 상세 팝업 -->
<div class="mobile-popup-overlay" id="popupOverlay" onclick="closePopup()"></div>
<div class="mobile-popup-wrapper" id="popupWrapper">
  <h3>📋 업무일지 결재</h3>

  <!-- 기본 정보 -->
  <table class="detail-table">
    <tr><th>작성자</th><td id="dRepopernm"></td><th>부서</th><td id="dDivinm"></td></tr>
    <tr><th>직급</th><td id="dRspnm"></td><th>작성일</th><td id="dRptdate"></td></tr>
    <tr><th>문서명</th><td id="dPapercd" colspan="3"></td></tr>
  </table>

  <!-- 업무 상세 -->
  <div style="font-size:13px; font-weight:bold; color:#03428E; margin-bottom:8px;">📝 업무 내용</div>
  <div id="workItems"></div>

  <!-- 사유 입력 -->
  <input type="text" class="remark-input" id="popupRemark" placeholder="사유 입력 (선택)">

  <!-- 버튼 영역 -->
  <div class="btn-row">
    <button class="btn-approval btn-approve"  id="btnApprove" onclick="doAction('approve')">승인</button>
    <button class="btn-approval btn-reject"   id="btnReject"  onclick="doAction('reject')">반려</button>
    <button class="btn-approval btn-hold"     id="btnHold"    onclick="doAction('hold')">보류</button>
    <button class="btn-approval btn-cancel"   id="btnCancelApprove" onclick="doAction('cancel')">승인취소</button>
    <button class="btn-approval btn-close"    onclick="closePopup()">닫기</button>
  </div>
</div>

<script type="text/javascript">
  let currentAppnum   = '';
  let currentAppgubun = '';
  let currentPapercd  = '';

  const statusMap = {
    '001': { label: '대기',   cls: 'status-001' },
    '101': { label: '결재',   cls: 'status-101' },
    '131': { label: '반려',   cls: 'status-131' },
    '201': { label: '보류',   cls: 'status-201' },
    '111': { label: '결재중', cls: 'status-001' }
  };

  $(document).ready(function() {
    const today    = new Date();
    const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    $('#startDate').val(CommonUtil.getYYYYMMDDMonthFirst());
    $('#endDate').val(CommonUtil.formatYYYYMMDD(monthEnd));

    // Master 메뉴 노출
    $.get('/api/mobile_main/read_userInfo', function(res) {
      if (res && res.data && res.data.isMaster) {
        const menuEl = document.getElementById('menuApproval');
        if (menuEl) menuEl.style.display = '';
      }
    });

    loadList();
  });

  function loadList() {
    const sd = $('#startDate').val();
    const ed = $('#endDate').val();
    if (!sd || !ed) { Alert.alert('', '날짜를 입력해주세요.'); return; }

    // 요약 카운트
    $.get('/api/AS/daily_approval/pending/read1', { startDate: sd, endDate: ed }, function(res) {
      if (res && res.data && res.data.paymentList && res.data.paymentList.length > 0) {
        const d = res.data.paymentList[0];
        $('#cnt001').text(d.appgubun1 || 0);
        $('#cnt101').text(d.appgubun2 || 0);
        $('#cnt201').text(d.appgubun4 || 0);
        $('#cnt131').text(d.appgubun3 || 0);
      }
    });

    // 목록
    $.get('/api/AS/daily_approval/pending/read', { startDate: sd, endDate: ed }, function(res) {
      const list = document.getElementById('cardList');
      if (!res || !res.success || !res.data || res.data.length === 0) {
        list.innerHTML = '<div class="empty-msg">결재 할 내역이 없습니다.</div>';
        return;
      }

      const realData = res.data.filter(d => d.appnum);
      if (realData.length === 0) {
        list.innerHTML = '<div class="empty-msg">결재 할 내역이 없습니다.</div>';
        return;
      }

      list.innerHTML = realData.map(item => {
        const st = statusMap[item.appgubun] || { label: item.appgubun_display || '', cls: '' };
        return `
          <div class="approval-card" onclick="openPopup('${item.appnum}','${item.appgubun}','${item.papercd}','${item.papercd_name}','${item.repopernm}','${item.repodate}')">
            <span class="card-status ${st.cls}">${st.label}</span>
            <div class="card-title">${item.title || '업무일지'}</div>
            <div class="card-meta">
              <span>📅 ${item.repodate || ''}</span>
              <span>👤 ${item.repopernm || ''}</span>
              <span>📄 ${item.papercd_name || ''}</span>
            </div>
          </div>`;
      }).join('');
    });
  }

  function openPopup(appnum, appgubun, papercd, papernm, repopernm, repodate) {
    currentAppnum   = appnum;
    currentAppgubun = appgubun;
    currentPapercd  = papercd;

    document.getElementById('dRepopernm').textContent = repopernm || '';
    document.getElementById('dPapercd').textContent   = papernm   || '';
    document.getElementById('dRptdate').textContent   = repodate  || '';
    document.getElementById('dDivinm').textContent    = '';
    document.getElementById('dRspnm').textContent     = '';
    document.getElementById('workItems').innerHTML    = '<div style="color:#999;font-size:13px;">불러오는 중...</div>';
    document.getElementById('popupRemark').value      = '';

    setButtons(appgubun, appnum);

    document.getElementById('popupOverlay').style.display   = 'block';
    document.getElementById('popupWrapper').style.display   = 'block';

    // 업무일지 상세 로드
    $.get('/api/AS/daily_approval/pending/dailyDetail', { appnum: appnum }, function(res) {
      if (!res || !res.success || !res.data) {
        document.getElementById('workItems').innerHTML = '<div style="color:#999;">내용 없음</div>';
        return;
      }
      const head    = res.data.head    || {};
      const details = res.data.details || [];

      document.getElementById('dDivinm').textContent = head.divinm || '';
      document.getElementById('dRspnm').textContent  = head.rspnm  || '';

      if (details.length === 0) {
        document.getElementById('workItems').innerHTML = '<div style="color:#999;font-size:13px;">상세 내용 없음</div>';
        return;
      }

      document.getElementById('workItems').innerHTML = details.map((d, i) => `
        <div class="work-item">
          <div class="wi-title">${i+1}. ${d.actnm || ''} ${d.equpnm ? '· ' + d.equpnm : ''}</div>
          <div class="wi-meta">
            ${d.businm ? '[' + d.businm + '] ' : ''}
            ${d.frtime && d.totime ? d.frtime + ' ~ ' + d.totime : ''}
          </div>
          ${d.remark ? '<div style="margin-top:4px;color:#333;">' + d.remark + '</div>' : ''}
        </div>`).join('');
    });
  }

  function setButtons(appgubun, appnum) {
    const btnApprove = document.getElementById('btnApprove');
    const btnReject  = document.getElementById('btnReject');
    const btnHold    = document.getElementById('btnHold');
    const btnCancel  = document.getElementById('btnCancelApprove');

    [btnApprove, btnReject, btnHold, btnCancel].forEach(b => b.disabled = true);

    if (!appnum) return;

    $.ajax({
      url: '/api/AS/daily_approval/pending/approvalInfo',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ appnum: appnum }),
      headers: { 'X-CSRF-Token': $('[name=_csrf]').val() },
      success: function(res) {
        const canCancel  = res.data?.canCancel  === true;
        const isApproved = res.data?.isApproved === true;

        if (appgubun === '101') {
          if (canCancel && isApproved) {
            btnCancel.disabled = false;
          } else if (!isApproved) {
            btnApprove.disabled = false;
            btnReject.disabled  = false;
            btnHold.disabled    = false;
          }
        } else if (appgubun === '001') {
          btnApprove.disabled = false;
          btnReject.disabled  = false;
          btnHold.disabled    = false;
        } else if (appgubun === '201') {
          btnApprove.disabled = false;
          btnReject.disabled  = false;
        }
      }
    });
  }

  function doAction(action) {
    const remark = document.getElementById('popupRemark').value;
    Alert.confirm('', '결재 처리하시겠습니까?', function() {
      $.ajax({
        url: '/api/AS/daily_approval/pending/changeState',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ appnum: currentAppnum, action: action, remark: remark }),
        headers: { 'X-CSRF-Token': $('[name=_csrf]').val() },
        success: function(res) {
          if (!res.success) { Alert.alert('', res.message || '처리 실패'); return; }
          Alert.alert('', '처리되었습니다.', function() {
            closePopup();
            loadList();
          });
        },
        error: function() { Alert.alert('', '오류가 발생하였습니다.'); }
      });
    }, function() {});
  }

  function closePopup() {
    document.getElementById('popupOverlay').style.display = 'none';
    document.getElementById('popupWrapper').style.display = 'none';
    currentAppnum = '';
    currentAppgubun = '';
  }
</script>
</body>
</html>
