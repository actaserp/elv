<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }
    #searcharea, #detailarea { position: relative; width: 100%; margin-top: 10px; }
    .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; }
    .search-guide { padding: 10px; font-size: 14px; color: #666; }
    .btn-select, .btn-login { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
    .modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; height: 650px; max-width: 90%; background-color: white; border-radius: 10px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); padding: 20px; border: none; z-index: 9999; }
    .modal-close { position: absolute; top: 10px; right: 5px; width: 30px; height: 25px; border: none; border-radius: 3px; background: none; z-index: 1000; cursor: pointer; }
    #loadingSpinner { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    #loadingImage { width: 95%; max-width: 900px; }
    .contents-wrap dd { margin-bottom: 5px; }
    .contents-wrap dt { margin-left: 10px; }

    /* 현장/차량 팝업 검색창 공통 */
    #siteSearchInput, #vehicleSearchInput {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    /* 현장/차량 목록 아이템 공통 */
    .site-item, .vehicle-item {
        padding: 14px 10px;
        border-bottom: 1px solid #EFEFEF;
        cursor: pointer;
    }
    .site-item:hover { background-color: #E5F9F9; }
    .vehicle-item:hover { background-color: #E5F9F9; }
    .site-item .site-name, .vehicle-item .vehicle-num { font-size: 16px; font-weight: 600; color: #111; }
    .site-item .site-address { font-size: 13px; color: #888; margin-top: 3px; }
    .site-item .site-code, .vehicle-item .vehicle-fuel { font-size: 12px; color: #aaa; margin-top: 2px; }

    /* OCR 로딩 오버레이 */
    #ocrLoading {
        display: none;
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-size: 16px;
    }
    #ocrLoading.active { display: flex; }
    .ocr-spinner {
        width: 48px; height: 48px;
        border: 5px solid #fff;
        border-top-color: #5ddfde;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>

                            </dd>

                        <div style="flex: 1">
                            <dd>
                                <select style="width: 100%" id="fuelKind" hidden="hidden">
                                    <option value="">선택</option>
                                </select>
                            </dd>
                        </div>
                    </div>
                    <div>
                        <dd>
                            <div style="display: flex; flex-direction: row; gap: 5px;">
                                <div style="flex: 1">
                                    <div>주행시작(km)</div>
                                    <div style="display: flex; flex-direction: column; gap: 5px;">
                                        <input type="file" id="startImgFile" accept="image/*" capture="environment"
                                               style="display:none;" onchange="analyzeOcr(this, 'start', 'startImgPreview')">
                                        <button type="button" onclick="document.getElementById('startImgFile').click()"
                                                class="btn-dark">📷 사진</button>
                                        <img id="startImgPreview" src="" alt="시작 이미지"

                                    </div>
                                </div>
                                <div style="flex: 1">
                                    <div>주행종료(km)</div>
                                    <div style="display: flex; flex-direction: column; gap: 5px;">
                                        <input type="file" id="endImgFile" accept="image/*" capture="environment"
                                               style="display:none;" onchange="analyzeOcr(this, 'end', 'endImgPreview')">
                                        <button type="button" onclick="document.getElementById('endImgFile').click()"
                                                class="btn-dark">📷 사진</button>
                                        <img id="endImgPreview" src="" alt="종료 이미지"
                                             style="display:none; width:100%; border-radius:5px;">

                    </div>

                    <div style="display: flex; flex-direction: row; gap: 7px;">
                        <div>
                            <dt>출발(km)</dt>
                            <div style="display: flex; gap: 10px;">
                                <!-- onchange 추가: 직접 입력 시에도 운행거리/합계 자동 계산 -->
                                <input type="number" id="startKM" style="width: 100%;" readonly
                                       onchange="calcDistance()">

                        </div>
                        <span style="font-weight: bold; align-content: center;">~</span>
                        <div>
                            <dt>도착(km)</dt>
                            <div style="display: flex; gap: 10px;">
                                <!-- onchange 추가: 직접 입력 시에도 운행거리/합계 자동 계산 -->

            <div class="popup-contents" id="vehicleList">

<script type="text/javascript">

    var hasMyVehicle = false;

    $(document).ready(function (e) {
        bindDate();
        searchMainData();
        AjaxUtil.fillSelectOptions($('#fuelKind'), 'fuel', 'choose', false, '', '');

        document.getElementById('siteSearchInput').addEventListener('input', function () {
            loadSiteList(this.value);
        });
        document.getElementById('vehicleSearchInput').addEventListener('input', function () {
            loadVehicleList(this.value);
        });
    });

    function bindDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm   = String(today.getMonth() + 1).padStart(2, '0');
        const dd   = String(today.getDate()).padStart(2, '0');
        document.getElementById('startDate').value = `${yyyy}-${mm}-${dd}`;
    }

    function searchMainData() {
        AjaxUtil.getAsyncData('/api/vehicle_manage/read_userInfo', {}, function (result) {
            if (result != null) {
                const userIdEl   = document.getElementById('userId');
                const userNameEl = document.getElementById('userName2');
                if (userIdEl)   userIdEl.value   = result.data.username   ?? '';
                if (userNameEl) userNameEl.value = result.data.first_name ?? '';

                if (result.data.carnum) {
                    hasMyVehicle = true;
                    document.getElementById('vehicleCd').value = result.data.carcd ?? '';
                    document.getElementById('vehicleNm').value = result.data.carnum ?? '';
                    document.getElementById('vehicleNm').style.cursor = 'default';
                    document.getElementById('vehicleNm').onclick = null;
                    document.getElementById('liter').value = result.data.samt ?? '';
                    if (result.data.fuelcd) {
                        waitAndSetFuel(result.data.fuelcd, result.data.samt, 0);
                    } else {
                        setFuelFieldsEditable(true);
                    }
                } else {
                    hasMyVehicle = false;
                }
            }
        });
    }

    function waitAndSetFuel(fuelcd, samt, attempt) {
        const select = document.getElementById('fuelKind');
        const found  = Array.from(select.options).some(opt => opt.value === fuelcd);
        if (found) {
            select.value = fuelcd;
            bindFuelInfo(samt);
        } else if (attempt < 20) {
            setTimeout(function () { waitAndSetFuel(fuelcd, samt, attempt + 1); }, 100);
        }
    }

    function bindFuelInfo(samt) {
        const fuelcd = document.getElementById('fuelKind').value;
        if (!fuelcd) {
            document.getElementById('unitAmt').value = '';
            document.getElementById('liter').value   = '';
            setFuelFieldsEditable(true);
            calcTotal();
            return;
        }
        AjaxUtil.getAsyncData('/api/vehicle_manage/getFuelInfo', { fuelcd: fuelcd }, function (result) {
            if (result != null && result.data != null) {
                document.getElementById('unitAmt').value = result.data.uamt ?? '';
                if (samt !== undefined && samt !== null && samt !== '') {
                    document.getElementById('liter').value = samt;
                } else {
                    document.getElementById('liter').value = result.data.kmliter ?? '';
                }
                // 유종에 연비/단가 데이터가 없으면 직접입력 허용
                const noData = !document.getElementById('unitAmt').value && !document.getElementById('liter').value;
                setFuelFieldsEditable(noData);
            } else {
                // 유종 정보 자체가 없음 → 직접입력 허용
                document.getElementById('unitAmt').value = '';
                document.getElementById('liter').value   = '';
                setFuelFieldsEditable(true);
            }
            calcTotal();
        });
    }

    function calcTotal() {
        const totalKM = parseFloat(document.getElementById('totalKM').value) || 0;
        const liter   = parseFloat(document.getElementById('liter').value)   || 0;
        const unitAmt = parseFloat(document.getElementById('unitAmt').value) || 0;
        const total = liter > 0 ? (totalKM / liter * unitAmt) : 0;
        document.getElementById('total').value = total > 0 ? total.toFixed(0) : '';
    }

    // 유종 정보가 없을 때(연비/단가 미존재) 직접 입력할 수 있도록 readonly 토글
    function setFuelFieldsEditable(editable) {
        const liter = document.getElementById('liter');
        const unit  = document.getElementById('unitAmt');
        if (editable) {
            liter.removeAttribute('readonly');
            unit.removeAttribute('readonly');
            liter.style.backgroundColor = '#fffef2';
            unit.style.backgroundColor  = '#fffef2';
            liter.placeholder = '연비 직접 입력';
            unit.placeholder  = '단가 직접 입력';
        } else {
            liter.setAttribute('readonly', 'readonly');
            unit.setAttribute('readonly', 'readonly');
            liter.style.backgroundColor = '';
            unit.style.backgroundColor  = '';
            liter.placeholder = '';
            unit.placeholder  = '';
        }
    }

    function calcDistance() {
        const startKM = parseFloat(document.getElementById('startKM').value) || 0;
        const endKM   = parseFloat(document.getElementById('endKM').value)   || 0;
        const totalKM = endKM - startKM;
        document.getElementById('totalKM').value = totalKM > 0 ? totalKM : '';
        calcTotal();
    }

    // =====================================================
    // OCR: 사진 선택 시 미리보기 + 서버 OCR 분석 → km 바인딩
    // AjaxUtil.postFileAsyncData 사용 → context-path, CSRF 자동 처리
    // =====================================================
    function analyzeOcr(input, type, previewId) {
        const file = input.files[0];
        if (!file) return;

        // 1. 미리보기 표시
        const preview = document.getElementById(previewId);
        const reader  = new FileReader();
        reader.onload = function (e) {
            preview.src           = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        // 2. OCR 로딩 오버레이 표시
        document.getElementById('ocrLoading').classList.add('active');

        // 3. FormData 구성 (_csrf는 postFileAsyncData 내부에서 자동 추가됨)
        const formData = new FormData();
        formData.append('imageFile', file);

        // 4. AjaxUtil.postFileAsyncData 호출
        AjaxUtil.postFileAsyncData(
            '/api/vehicle_manage/ocrAnalyze',
            formData,
            function (result) {
                document.getElementById('ocrLoading').classList.remove('active');

                if (result && result.data && result.data.km != null) {
                    const km = result.data.km;
                    if (type === 'start') {
                        document.getElementById('startKM').value = km;
                    } else {
                        document.getElementById('endKM').value = km;
                    }
                    calcDistance();
                } else {
                    Alert.alert('', 'km 수치를 인식하지 못했습니다. 직접 입력해 주세요.');
                    if (type === 'start') {
                        document.getElementById('startKM').removeAttribute('readonly');
                        document.getElementById('startKM').focus();
                    } else {
                        document.getElementById('endKM').removeAttribute('readonly');
                        document.getElementById('endKM').focus();
                    }
                }
            },
            function (req, status, error) {
                document.getElementById('ocrLoading').classList.remove('active');
                Alert.alert('', 'OCR 분석 중 오류가 발생했습니다. 직접 입력해 주세요.');
                if (type === 'start') {
                    document.getElementById('startKM').removeAttribute('readonly');
                } else {
                    document.getElementById('endKM').removeAttribute('readonly');
                }
            }
        );
    }
    // =====================================================

    // ========== 현장 팝업 ==========
    function openSitePopup() {
        document.getElementById('siteSearchInput').value = '';
        loadSiteList('');
        document.querySelector('#sitePopup .popup-overlay').style.display  = 'block';
        document.querySelector('#sitePopup .popup-wrapper').classList.add('active');
    }
    function closeSitePopup() {
        document.querySelector('#sitePopup .popup-overlay').style.display  = 'none';
        document.querySelector('#sitePopup .popup-wrapper').classList.remove('active');
    }
    function loadSiteList(keyword) {
        AjaxUtil.getAsyncData('/api/vehicle_manage/getSiteList', { keyword: keyword }, function (result) {
            const container = document.getElementById('siteList');
            if (!result || !result.data || result.data.length === 0) {
                container.innerHTML = '<div class="nodata">검색 결과가 없습니다.</div>';
                return;
            }
            let html = '';
            result.data.forEach(function (item) {
                html += `
                    <div class="site-item" onclick="selectSite('${item.actcd}', '${(item.actnm || '').replace(/'/g, "\\'")}', '${(item.address || '').replace(/'/g, "\\'")}')">
                        <div class="site-name">${item.actnm || '-'}</div>
                        <div class="site-address">${item.address || ''}</div>
                        <div class="site-code">코드: ${item.actcd}</div>
                    </div>`;
            });
            container.innerHTML = html;
        });
    }
    function selectSite(actcd, actnm, address) {
        document.getElementById('siteCd').value = actcd;
        document.getElementById('siteNm').value = actnm;
        closeSitePopup();
    }
    document.getElementById('sitePopupClose').addEventListener('click', closeSitePopup);
    document.querySelector('#sitePopup .popup-overlay').addEventListener('click', closeSitePopup);

    // ========== 차량 팝업 ==========
    function openVehiclePopup() {
        if (hasMyVehicle) return;
        document.getElementById('vehicleSearchInput').value = '';
        loadVehicleList('');
        document.querySelector('#vehiclePopup .popup-overlay').style.display  = 'block';
        document.querySelector('#vehiclePopup .popup-wrapper').classList.add('active');
    }
    function closeVehiclePopup() {
        document.querySelector('#vehiclePopup .popup-overlay').style.display  = 'none';
        document.querySelector('#vehiclePopup .popup-wrapper').classList.remove('active');
    }
    function loadVehicleList(keyword) {
        AjaxUtil.getAsyncData('/api/vehicle_manage/getVehicleList', { keyword: keyword }, function (result) {
            const container = document.getElementById('vehicleList');
            if (!result || !result.data || result.data.length === 0) {
                container.innerHTML = '<div class="nodata">검색 결과가 없습니다.</div>';
                return;
            }
            let html = '';
            result.data.forEach(function (item) {
                const samt   = item.samt   ?? '';
                const fuelcd = item.fuelcd ?? '';
                html += `
                    <div class="vehicle-item" onclick="selectVehicle('${item.carcd}', '${(item.carnum || '').replace(/'/g, "\\'")}', '${fuelcd}', '${samt}')">
                        <div class="vehicle-num">${item.carnum || '-'}</div>
                        <div class="vehicle-fuel">유종: ${item.fuelnm}</div>
                    </div>`;
            });
            container.innerHTML = html;
        });
    }
    function selectVehicle(carcd, carnum, fuelcd, samt) {
        document.getElementById('vehicleCd').value = carcd;
        document.getElementById('vehicleNm').value = carnum;
        document.getElementById('liter').value = samt;
        if (fuelcd) {
            waitAndSetFuel(fuelcd, samt, 0);
        } else {
            setFuelFieldsEditable(true);
        }
        closeVehiclePopup();
    }
    document.getElementById('vehiclePopupClose').addEventListener('click', closeVehiclePopup);
    document.querySelector('#vehiclePopup .popup-overlay').addEventListener('click', closeVehiclePopup);

    // ========== 등록 ==========
    function saveAttendance() {
        var vehicleNm = document.getElementById('vehicleNm').value.trim();
        var siteNm    = document.getElementById('siteNm').value.trim();
        var startKM   = document.getElementById('startKM').value.trim();
        var endKM     = document.getElementById('endKM').value.trim();

        if (!vehicleNm) {
            Alert.alert('', '차량번호를 선택하세요.');
            return;
        }
        if (!siteNm) {
            Alert.alert('', '현장명을 선택하세요.');
            return;
        }
        if (!startKM) {
            Alert.alert('', '출발(km) 값을 입력하세요.');
            return;
        }
        if (!endKM) {
            Alert.alert('', '도착(km) 값을 입력하세요.');
            return;
        }
        if (parseFloat(endKM) <= parseFloat(startKM)) {
            Alert.alert('', '도착(km)은 출발(km)보다 커야 합니다.');
            return;
        }
        let url  = '/api/vehicle_manage/submitAttendance';
        let data = {
            'userId'    : document.getElementById('userId').value,
            'userName'  : document.getElementById('userName2').value,
            'siteCd'    : document.getElementById('siteCd').value,
            'siteNm'    : document.getElementById('siteNm').value,
            'vehicleCd' : document.getElementById('vehicleCd').value,
            'vehicleNm' : document.getElementById('vehicleNm').value,
            'fuelKind'  : document.getElementById('fuelKind').value,
            'liter'     : document.getElementById('liter').value,
            'unitAmt'   : document.getElementById('unitAmt').value,
            'startDate' : document.getElementById('startDate').value,
            'startKM'   : document.getElementById('startKM').value,
            'endKM'     : document.getElementById('endKM').value,
            'totalKM'   : document.getElementById('totalKM').value,
            'total'     : document.getElementById('total').value,
        };
        let fnsuccess = function (result) {
            if (result != null) {
                if (result.success) {
                    Alert.alert('', result.message, function () {
                        window.location.href = window.CTX_PATH + '/mobile/request/vehicle_status';
                    });
                } else {
                    Alert.alert('', "운행기록 등록에 실패하였습니다.");
                }
            } else {
                Alert.alert('', "오류가 발생하였습니다.");
            }
        };
        AjaxUtil.postJsonData(url, data, fnsuccess);
    }

</script>
