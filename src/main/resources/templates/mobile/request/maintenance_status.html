<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }

    .card-list { padding: 8px 12px 100px; }
    .comp-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.10); margin-bottom: 10px; padding: 14px 16px; cursor: pointer; }
    .comp-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .card-actnm { font-size: 15px; font-weight: 700; color: #222; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-badge-rece { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fff3e0; color: #e65100; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-badge-comp { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #e6f4ea; color: #1a7a3a; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-row { display: flex; font-size: 13px; color: #555; margin-top: 3px; gap: 4px; }
    .card-label { color: #999; min-width: 55px; flex-shrink: 0; }
    .card-value { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .result-count { padding: 4px 14px; font-size: 12px; color: #888; }
    .empty-msg { text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }

    /* 바텀시트 팝업 공통 */
    .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9000; justify-content: center; align-items: flex-end; }
    .popup-overlay.active { display: flex; }
    .popup-sheet { background: #fff; width: 100%; max-height: 80vh; border-radius: 16px 16px 0 0; overflow: hidden; display: flex; flex-direction: column; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 700; font-size: 16px; flex-shrink: 0; white-space: nowrap; }
    .popup-header span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .popup-close { width: 0; border: none; font-size: 24px; cursor: pointer; color: #666; line-height: 1; flex-shrink: 0; margin-left: 12px; }
    .popup-body { overflow-y: auto; flex: 1; padding: 16px 20px 30px; }

    /* 상세 팝업 */
    .detail-section-title { font-size: 13px; font-weight: 700; color: #444; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #dce6f1; }
    .detail-row { display: flex; padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; gap: 12px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #999; min-width: 80px; flex-shrink: 0; font-size: 13px; }
    .detail-value { color: #222; flex: 1; word-break: break-all; }

    /* 상세 팝업 하단 버튼 */
    .detail-footer { padding: 12px 20px 24px; border-top: 1px solid #eee; flex-shrink: 0; display:flex; gap:8px; }
    .btn-edit   { flex:1; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-edit:active   { background: #111; }
    .btn-delete { flex:1; padding: 12px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-delete:active { background: #cc0000; }

    /* 수정 팝업 폼 */
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 600; }
    .form-row input[type="text"], .form-row input[type="date"], .form-row input[type="time"], .form-row textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .form-row input[readonly] { background: #f5f5f5; color: #333; cursor: pointer; caret-color: transparent; }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .form-row .row-2col { display: flex; gap: 8px; }
    .form-row .row-2col > * { flex: 1; }
    .form-save-btn { width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .form-save-btn:active { background: #111; }

    /* 현장/호기 팝업 */
    .popup-list { overflow-y: auto; flex: 1; }
    .popup-list ul { list-style: none; margin: 0; padding: 0; }
    .popup-list ul li { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; }
    .popup-list ul li:active { background: #f5f5f5; }
    .popup-list .item-code { font-size: 12px; color: #999; margin-right: 6px; }
    .popup-search-input { width: 100%; padding: 10px 14px; border: none; border-bottom: 1px solid #eee; font-size: 14px; box-sizing: border-box; outline: none; flex-shrink: 0; }
</style>

<script type="text/javascript">

    var _actListCache = [];
    var _spjangcd     = sessionStorage.getItem('spjangcd') || '';
    var _currentItem  = null;

    $(document).ready(function () {
        const today = new Date();
        const yyyy  = today.getFullYear();
        const mm    = String(today.getMonth() + 1).padStart(2, '0');
        const dd    = String(today.getDate()).padStart(2, '0');
        document.getElementById('compFromDate').value = `${yyyy}-${mm}-01`;
        document.getElementById('compToDate').value   = `${yyyy}-${mm}-${dd}`;

        $('#searchActnm').on('keypress', function (e) {
            if (e.keyCode === 13) handleSearch();
        });

        searchCompList();
    });

    /* ── 목록 조회 ── */
    function handleSearch() {
        searchCompList();
        document.querySelectorAll('.btn-aco').forEach(function (btn) { btn.click(); });
    }

    function searchCompList() {
        const fromDate  = document.getElementById('compFromDate').value.replaceAll('-', '');
        const toDate    = document.getElementById('compToDate').value.replaceAll('-', '');
        const actnm     = document.getElementById('searchActnm').value.trim();
        const resultck  = document.getElementById('searchResultck').value;

        AjaxUtil.getAsyncData('/api/maintenance_repair/read_comp', {
            fromDate : fromDate,
            toDate   : toDate,
            actnm    : actnm,
            resultck : resultck,
            spjangcd : _spjangcd
        }, function (result) {
            if (result != null && result.data != null) {
                renderCardList(result.data);
            } else {
                document.getElementById('cardList').innerHTML =
                    '<div class="empty-msg">조회 중 오류가 발생하였습니다.</div>';
            }
        });
    }

    function renderCardList(list) {
        const container = document.getElementById('cardList');
        const countEl   = document.getElementById('resultCount');
        if (!list || list.length === 0) {
            countEl.textContent = '';
            container.innerHTML = '<div class="empty-msg">조회된 데이터가 없습니다.</div>';
            return;
        }
        countEl.textContent = `총 ${list.length}건`;
        let html = '';
        list.forEach(function (item) {
            const isComp     = item.resultck == '1';
            const badgeClass = isComp ? 'card-badge-comp' : 'card-badge-rece';
            const badgeText  = isComp ? '처리' : '접수';
            html += `
            <div class="comp-card" onclick='openDetailPopup(${JSON.stringify(item)})'>
                <div class="card-header">
                    <span class="card-actnm">${esc(item.actnm || '')}</span>
                    <span class="${badgeClass}">${esc(item.compdate || '')} / ${badgeText}</span>
                </div>
                ${item.equpnm     ? `<div class="card-row"><span class="card-label">호기명</span><span class="card-value">${esc(item.equpnm)}</span></div>` : ''}
                ${item.contremark ? `<div class="card-row"><span class="card-label">고장내용</span><span class="card-value">${esc(item.contremark)}</span></div>` : ''}
                ${item.pernm ? `<div class="card-row"><span class="card-label">처리자</span><span class="card-value">${esc(item.pernm)}</span></div>` : ''}
            </div>`;
        });

    }

    /* ── 상세 팝업 ── */

    /* ── 수정 팝업 — 상세 데이터로 폼 채우기 ── */
    function openEditPopup() {
        if (!_currentItem) return;
        const item = _currentItem;

        const toDateInput = function(v) {
            v = v || '';
            return v.length === 8 ? `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}` : v;
        };
        const toTimeInput = function(v) {
            v = v || '';
            return v.length >= 4 ? `${v.slice(0,2)}:${v.slice(2,4)}` : v;
        };

        document.getElementById('editCompdate').value      = item.compdate    || '';
        document.getElementById('editCompnum').value       = item.compnum     || '';
        document.getElementById('editActcd').value         = item.actcd       || '';
        document.getElementById('editEqupcd').value        = item.equpcd      || '';
        document.getElementById('editCompdateDisp').value  = toDateInput(item.compdate);
        document.getElementById('editRecedate').value      = toDateInput(item.recedate);
        document.getElementById('editRecetime').value      = toTimeInput(item.recetime);
        document.getElementById('editArrivdate').value     = toDateInput(item.arrivdate);
        document.getElementById('editArrivtime').value     = toTimeInput(item.arrivtime);
        document.getElementById('editComptime').value      = toTimeInput(item.comptime);
        document.getElementById('editActnm').value         = item.actnm       || '';
        document.getElementById('editEqupnm').value        = item.equpnm      || '';
        document.getElementById('editContremark').value    = item.contremark  || '';
        document.getElementById('editGregicd').value        = item.gregicd     || '';
        document.getElementById('editReginm').value         = item.reginm      || '';
        document.getElementById('editRegicd').value         = item.regicd      || '';
        document.getElementById('editRemonm').value         = item.remonm      || '';
        document.getElementById('editRemocd').value         = item.remocd      || '';
        document.getElementById('editFacnm').value          = item.facnm       || '';
        document.getElementById('editFaccd').value          = item.faccd       || '';
        document.getElementById('editRemoremark').value     = item.remoremark  || '';
        document.getElementById('editResunm').value         = item.resunm      || '';
        document.getElementById('editResucd').value         = item.resucd      || '';
        document.getElementById('editResuremark').value     = item.resuremark  || '';
        document.getElementById('editResultnm').value       = item.remark      || '';
        document.getElementById('editResultcd').value       = item.resultcd    || '';
        document.getElementById('editCustomer').value       = item.customer    || '';
        document.getElementById('editActperid').value       = item.perid      || '';

    /* ── 코드 팝업 공통 ── */
    var _editCodeCache = {};

    function openEditCodePopup(popupId, apiUrl, listId, nameKey, keywordId, onSelect) {
        document.getElementById(keywordId).value = '';
        if (_editCodeCache[popupId]) {
            renderEditCodeList(listId, _editCodeCache[popupId], nameKey, onSelect);
            openPopup(popupId);
            return;
        }
        AjaxUtil.getAsyncData(apiUrl, {}, function (result) {
            if (result && result.data) {
                _editCodeCache[popupId] = result.data;
                renderEditCodeList(listId, result.data, nameKey, onSelect);
                openPopup(popupId);
            }
        });
    }

    function renderEditCodeList(listId, data, nameKey, onSelect) {
        const ul = document.getElementById(listId);
        ul.innerHTML = '';
        if (!data || data.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 데이터가 없습니다.</li>';
            return;
        }
        data.forEach(function (item) {
            const li = document.createElement('li');
            li.textContent = item[nameKey] || '';
            li.onclick = function () { onSelect(item); };
            ul.appendChild(li);
        });
    }

    function filterEditCodePopup(listId, keyword) {
        const ul = document.getElementById(listId);
        Array.from(ul.querySelectorAll('li')).forEach(function (li) {
            li.style.display = (li.textContent || '').includes(keyword) ? '' : 'none';
        });
    }

    function openEditGreginmPopup() {
        openEditCodePopup('editGreginmPopup', '/api/maintenance_repair/read_greginm', 'editGreginmList', 'greginm', 'editGreginmKeyword', function (item) {
            document.getElementById('editGregicd').value    = item.gregicd || '';
            document.getElementById('editContremark').value = item.greginm || '';
            document.getElementById('editRegicd').value     = '';
            document.getElementById('editReginm').value     = '';
            delete _editCodeCache['editReginmPopup'];
            closePopup('editGreginmPopup');
        });
    }

    function openEditReginmPopup() {
        const gregicd = document.getElementById('editGregicd').value;
        if (!gregicd) { Alert.alert('', '고장부위를 먼저 선택해주세요.'); return; }
        document.getElementById('editReginmKeyword').value = '';
        AjaxUtil.getAsyncData('/api/maintenance_repair/read_reginm', { gregicd: gregicd }, function (result) {
            if (result && result.data) {
                _editCodeCache['editReginmPopup'] = result.data;
                renderEditCodeList('editReginmList', result.data, 'reginm', function (item) {
                    document.getElementById('editRegicd').value = item.regicd || '';
                    document.getElementById('editReginm').value = item.reginm || '';
                    closePopup('editReginmPopup');
                });
                openPopup('editReginmPopup');
            }
        });
    }

    function openEditRemonmPopup() {
        openEditCodePopup('editRemonmPopup', '/api/maintenance_repair/read_remonm', 'editRemonmList', 'remonm', 'editRemonmKeyword', function (item) {
            document.getElementById('editRemocd').value = item.remocd || '';
            document.getElementById('editRemonm').value = item.remonm || '';
            closePopup('editRemonmPopup');
        });
    }

    function openEditFacnmPopup() {
        openEditCodePopup('editFacnmPopup', '/api/maintenance_repair/read_facnm', 'editFacnmList', 'facnm', 'editFacnmKeyword', function (item) {
            document.getElementById('editFaccd').value  = item.faccd || '';
            document.getElementById('editFacnm').value  = item.facnm || '';
            closePopup('editFacnmPopup');
        });
    }

    function openEditResunmPopup() {
        openEditCodePopup('editResunmPopup', '/api/maintenance_repair/read_resunm', 'editResunmList', 'resunm', 'editResunmKeyword', function (item) {
            document.getElementById('editResucd').value  = item.resucd || '';
            document.getElementById('editResunm').value  = item.resunm || '';
            closePopup('editResunmPopup');
        });
    }

    function openEditResultnmPopup() {
        openEditCodePopup('editResultnmPopup', '/api/maintenance_repair/read_resultnm', 'editResultnmList', 'resultnm', 'editResultnmKeyword', function (item) {
            document.getElementById('editResultcd').value  = item.resultcd || '';
            document.getElementById('editResultnm').value  = item.resultnm || '';
            closePopup('editResultnmPopup');
        });
    }

    var _editProcessorCache = [];

    function openEditProcessorPopup() {
        document.getElementById('editProcessorKeyword').value = '';
        if (_editProcessorCache.length > 0) {
            renderEditProcessorList(_editProcessorCache);
            openPopup('editProcessorPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/system/user/getPerson', { searchCode: '', searchName: '' }, function (result) {
            if (result && result.data) {
                _editProcessorCache = result.data;
                renderEditProcessorList(_editProcessorCache);
                openPopup('editProcessorPopup');
            }
        });
    }

    function renderEditProcessorList(list) {
        const ul = document.getElementById('editProcessorList');
        ul.innerHTML = '';
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.code || '')}</span>${esc(item.name || '')}`;
            li.onclick = function () {
                document.getElementById('editActperid').value    = item.code || '';
                document.getElementById('editProcessorNm').value = item.name || '';
                closePopup('editProcessorPopup');
            };
            ul.appendChild(li);
        });
    }

    function filterEditProcessorList(keyword) {
        renderEditProcessorList(_editProcessorCache.filter(function (item) {
            return (item.name || '').includes(keyword);
        }));
    }

    /* ── 담당자 선택 팝업 ── */
    function openEditMgrPopup() {
        document.getElementById('editMgrKeyword').value = '';
        if (_editProcessorCache.length > 0) {
            renderEditMgrList(_editProcessorCache);
            openPopup('editMgrPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/system/user/getPerson', { searchCode: '', searchName: '' }, function (result) {
            if (result && result.data) {
                _editProcessorCache = result.data;
                renderEditMgrList(_editProcessorCache);
                openPopup('editMgrPopup');
            }
        });
    }

    function renderEditMgrList(list) {
        const ul = document.getElementById('editMgrList');
        ul.innerHTML = '';
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.code || '')}</span>${esc(item.name || '')}`;
            li.onclick = function () {
                document.getElementById('editMgrPerid').value = (item.code || '').replace(/^p/, '');
                document.getElementById('editMgrPernm').value = item.name || '';
                closePopup('editMgrPopup');
            };
            ul.appendChild(li);
        });
    }

    function filterEditMgrList(keyword) {
        renderEditMgrList(_editProcessorCache.filter(function (item) {
            return (item.name || '').includes(keyword);
        }));
    }

    /* ── 현장 선택 팝업 ── */
    function openActPopup() {
        document.getElementById('actSearchInput').value = '';
        if (_actListCache.length > 0) {
            renderActList(_actListCache);
            openPopup('actPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/maintenance_repair/read_site', {
            keyword: '', spjangcd: _spjangcd
        }, function (result) {
            if (result && result.data) {
                _actListCache = result.data;
                renderActList(_actListCache);
                openPopup('actPopup');
            }
        });
    }

    function renderActList(list) {
        const ul = document.getElementById('actList');
        ul.innerHTML = '';
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.actcd || '')}</span>${esc(item.actnm || '')}`;
            li.onclick = function () { setActData(item); };
            ul.appendChild(li);
        });
    }

    function filterActList(keyword) {
        renderActList(_actListCache.filter(function (item) {
            return (item.actnm || '').includes(keyword);
        }));
    }

    function setActData(item) {
        document.getElementById('editActcd').value  = item.actcd || '';
        document.getElementById('editActnm').value  = item.actnm || '';
        document.getElementById('editEqupcd').value = '';
        document.getElementById('editEqupnm').value = '';
        closePopup('actPopup');
    }

    /* ── 호기 선택 팝업 ── */
    function openEditEqupPopup() {
        const actcd = document.getElementById('editActcd').value;
        if (!actcd) { Alert.alert('', '현장을 먼저 선택해주세요.'); return; }

        AjaxUtil.getAsyncData('/api/maintenance_repair/read_equp', {
            actcd: actcd, spjangcd: _spjangcd
        }, function (result) {
            const ul = document.getElementById('equpList');
            ul.innerHTML = '';
            if (result && result.data && result.data.length > 0) {
                result.data.forEach(function (item) {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="item-code">${esc(item.equpcd || '')}</span>${esc(item.equpnm || '')}`;
                    li.onclick = function () { setEqupData(item); };
                    ul.appendChild(li);
                });
            } else {
                ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 호기가 없습니다.</li>';
            }
            openPopup('equpPopup');
        });
    }

    function setEqupData(item) {
        document.getElementById('editEqupcd').value = item.equpcd || '';
        document.getElementById('editEqupnm').value = item.equpnm || '';
        closePopup('equpPopup');
    }

    /* ── 수정 저장 ── */
    function updateComp() {
        const compdate = document.getElementById('editCompdate').value;
        const actcd    = document.getElementById('editActcd').value;
        if (!compdate) { Alert.alert('', '완료일자가 없습니다.'); return; }
        if (!actcd)    { Alert.alert('', '현장을 선택해주세요.'); return; }

        const data = {
            spjangcd   : _spjangcd,
            compdate   : compdate,
            compnum    : document.getElementById('editCompnum').value,
            comptime   : document.getElementById('editComptime').value.replaceAll(':', ''),
            recedate   : document.getElementById('editRecedate').value.replaceAll('-', ''),
            recetime   : document.getElementById('editRecetime').value.replaceAll(':', ''),
            arrivdate  : document.getElementById('editArrivdate').value.replaceAll('-', ''),
            arrivtime  : document.getElementById('editArrivtime').value.replaceAll(':', ''),
            actcd      : actcd,
            actnm      : document.getElementById('editActnm').value,
            equpcd     : document.getElementById('editEqupcd').value,
            equpnm     : document.getElementById('editEqupnm').value,
            contremark : document.getElementById('editContremark').value,  // 고장부위명
            gregicd    : document.getElementById('editGregicd').value,      // 고장부위코드
            regicd     : document.getElementById('editRegicd').value,       // 고장부위상세코드
            remocd     : document.getElementById('editRemocd').value,       // 고장요인코드
            faccd      : document.getElementById('editFaccd').value,        // 고장원인코드
            remoremark : document.getElementById('editRemoremark').value,   // 고장원인상세 직접입력
            resucd     : document.getElementById('editResucd').value,       // 처리내용코드
            resuremark : document.getElementById('editResuremark').value,   // 처리상세 직접입력
            resultcd   : document.getElementById('editResultcd').value,     // 처리결과코드
            remark     : document.getElementById('editResultnm').value,     // 처리결과명
            customer   : document.getElementById('editCustomer').value,     // 사후관리사항 직접입력
            actperid   : document.getElementById('editActperid').value,
            mgrperid   : document.getElementById('editMgrPerid').value,
        };

        AjaxUtil.postAsyncData('/api/maintenance_repair/update_comp', data, function (result) {
            if (result && result.success) {
                Alert.alert('', result.message, function () {
                    closePopup('editPopup');
                    searchCompList();
                });
            } else {
                Alert.alert('', (result && result.message) || '수정 중 오류가 발생하였습니다.');
            }
        });
    }

    /* ── 삭제 ── */
    function deleteComp() {
        if (!_currentItem) return;
        Alert.confirm('', '해당 고장처리 결과를 삭제하시겠습니까?', function () {
            AjaxUtil.postAsyncData('/api/maintenance_repair/delete_comp', {
                spjangcd : _spjangcd,
                compdate : _currentItem.compdate,
                compnum  : _currentItem.compnum,
            }, function (result) {
                if (result && result.success) {
                    Alert.alert('', '삭제되었습니다.', function () {
                        closePopup('detailPopup');
                        searchCompList();
                    });
                } else {
                    Alert.alert('', (result && result.message) || '삭제 중 오류가 발생하였습니다.');
                }
            });
        });
    }

    /* ── 팝업 공통 ── */
    function openPopup(id)  { document.getElementById(id).classList.add('active');    }
    function closePopup(id) { document.getElementById(id).classList.remove('active'); }

    ['detailPopup', 'editPopup', 'actPopup', 'equpPopup',
     'editGreginmPopup', 'editReginmPopup', 'editRemonmPopup',
     'editFacnmPopup', 'editResunmPopup', 'editResultnmPopup', 'editProcessorPopup', 'editMgrPopup'
    ].forEach(function (id) {
        document.getElementById(id).addEventListener('click', function (e) {
            if (e.target === this) closePopup(id);
        });
    });

    function buildDetailRows(rows) {
        return rows.map(function (r) {
            if (!r.value) return '';
            return `<div class="detail-row">
                <span class="detail-label">${r.label}</span>
                <span class="detail-value">${esc(String(r.value))}</span>
            </div>`;
        }).join('');
    }

    // 시간 입력 간소화: 숫자만 입력 → 자동 HH:mm (시계 다이얼 대신 키패드)
    function formatTimeInput(el) {
        const e = window.event;
        const deleting = e && e.inputType && e.inputType.indexOf('delete') === 0;
        let d = el.value.replace(/[^0-9]/g, '').slice(0, 4);
        if (d.length === 0)      el.value = '';
        else if (d.length <= 2)  el.value = deleting ? d : d + ':';
        else                     el.value = d.slice(0, 2) + ':' + d.slice(2);
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

</script>
