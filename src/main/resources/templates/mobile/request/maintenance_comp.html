<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }

    .card-list { padding: 8px 12px 80px; }

    .site-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.10);
        margin-bottom: 10px;
        padding: 14px 16px;
        cursor: pointer;
    }
    .site-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.18); }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
    }
    .card-actnm {
        font-size: 15px;
        font-weight: 700;
        color: #222;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .card-badge-cont  { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #e6f4ea; color: #1a7a3a; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-badge-cancel{ font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fde8e8; color: #cc2222; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-badge-etc   { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #f0f0f0; color: #888;    margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-row {
        display: flex;
        font-size: 13px;
        color: #555;
        margin-top: 3px;
        gap: 4px;
    }
    .card-label { color: #999; min-width: 55px; flex-shrink: 0; }
    .card-value { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .result-count { padding: 4px 14px; font-size: 12px; color: #888; }

    .empty-msg { text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }

    /* ── 검색필터 2단 배치 (모바일 세로공간 절약) ── */
    .srch-row2 { display: flex; gap: 8px; }
    .srch-row2 > dl { flex: 1; min-width: 0; }
    .srch-row2 > dl dd input { width: 100%; box-sizing: border-box; }

    /* ── 바텀시트 팝업 ── */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 9000;
        justify-content: center;
        align-items: flex-end;
    }
    .popup-overlay.active { display: flex; }

    .popup-sheet {
        background: #fff;
        width: 100%;
        max-height: 75vh;
        border-radius: 16px 16px 0 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .popup-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #eee;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .popup-close {
        width: 0%;
        background: none; border: none;
        font-size: 24px; cursor: pointer;
        color: #666; line-height: 1;
        flex-shrink: 0;
        margin-left: 12px;
    }
    .popup-body { overflow-y: auto; flex: 1; padding: 16px 20px 30px; }

    .detail-section-title {
        font-size: 13px; font-weight: 700; color: #444;
        margin: 14px 0 6px; padding-bottom: 4px;
        border-bottom: 2px solid #dce6f1;
    }
    .detail-row {
        display: flex; padding: 9px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 14px; gap: 12px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #999; min-width: 80px; flex-shrink: 0; font-size: 13px; }
    .detail-value { color: #222; flex: 1; word-break: break-all; }

    .equp-section { margin-top: 16px; }
    .equp-item {
        display: flex; justify-content: space-between;
        padding: 8px 0; border-bottom: 1px solid #f5f5f5;
        font-size: 13px; color: #333;
    }
    .equp-item:last-child { border-bottom: none; }
    .equp-code { color: #999; margin-right: 8px; font-size: 12px; }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTAS MES</title>
    <meta name="ctx" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
    <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script th:src="@{/assets_mobile/js/ui.js}"></script>
    <script th:inline="javascript">var sandanData = /*[[${session.sandanList}]]*/ [];</script>
    <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script th:src="@{/js/Mobile.js}"></script>
    <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">

    <!-- 헤더 -->
    <div class="mobile-layout-header">
        <header>
            <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
            <div class="left" style="margin-left:35px; font-size:25px;"><h2>보수현장 현황</h2></div>
            <div class="right">
                <a href="#" title="전체메뉴" class="btn-menu">
                    <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
                </a>
            </div>
        </header>
    </div>

    <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

    <!-- 컨텐츠 -->
    <div class="mobile-layout-contents" style="display:block;">
        <div class="layout-contents">

            <!-- 검색 영역 -->
            <div class="search-wrap">
                <div class="srch-tit aco-hd">
                    <p>기본검색</p>
                    <a href="#" title="열기/닫기" class="btn-aco">
                        <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
                    </a>
                </div>
                <div class="srch-cont aco-cont">
                    <dl>
                        <dt>현장명</dt>
                        <dd><input type="text" id="searchKeyword" placeholder="현장명을 입력하세요"></dd>
                    </dl>
                    <div class="srch-row2">
                        <dl>
                            <dt>승강기번호</dt>
                            <dd><input type="text" id="searchEqupcd" placeholder="승강기번호"></dd>
                        </dl>
                        <dl>
                            <dt>전화번호</dt>
                            <dd><input type="text" id="searchTel" placeholder="전화번호"></dd>
                        </dl>
                    </div>
                    <div class="srch-row2">
                        <dl>
                            <dt>프로젝트번호</dt>
                            <dd><input type="text" id="searchCltnum" placeholder="프로젝트번호"></dd>
                        </dl>
                        <dl>
                            <dt>비상통화장치번호</dt>
                            <dd><input type="text" id="searchEmtelnum" placeholder="비상통화장치번호"></dd>
                        </dl>
                    </div>
                    <dl>
                        <dt>계약구분</dt>
                        <dd>
                            <select id="searchActgubun" style="width:100%;">
                                <option value="01">계약중</option>
                                <option value="02">해지</option>
                                <option value="">전체</option>
                            </select>
                        </dd>
                    </dl>
                    <div class="srch-btn">
                        <button class="btn-dark" onclick="handleSearch()">조회</button>
                    </div>
                </div>
            </div>

            <!-- 결과 건수 -->
            <div class="result-count" id="resultCount"></div>

            <!-- 카드 리스트 -->
            <div class="card-list" id="cardList">
                <div class="empty-msg">조회 버튼을 눌러 현장 목록을 조회하세요.</div>
            </div>

        </div>
    </div>
</div>

<!-- ======================== 현장 상세 팝업 ======================== -->
<div class="popup-overlay" id="detailPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span id="popupTitle">현장 상세</span>
            <button class="popup-close" onclick="closePopup('detailPopup')">×</button>
        </div>
        <div class="popup-body" id="popupBody"></div>
    </div>
</div>

<script type="text/javascript">

    var _spjangcd = sessionStorage.getItem('spjangcd') || '';

    $(document).ready(function () {
        $('#searchKeyword').on('keypress', function (e) {
            if (e.keyCode === 13) handleSearch();
        });
    });

    function handleSearch() {
        searchSiteList();
        document.querySelectorAll('.btn-aco').forEach(function (btn) { btn.click(); });
    }

    function searchSiteList() {
        const keyword   = document.getElementById('searchKeyword').value.trim();
        const equpcd    = document.getElementById('searchEqupcd').value.trim();
        const tel       = document.getElementById('searchTel').value.trim();
        const actgubun  = document.getElementById('searchActgubun').value;
        const cltnum    = document.getElementById('searchCltnum').value.trim();
        const emtelnum  = document.getElementById('searchEmtelnum').value.trim();
        AjaxUtil.getAsyncData('/api/maintenance_comp/read_site', {
            keyword  : keyword,
            equpcd   : equpcd,
            tel      : tel,
            actgubun : actgubun,
            cltnum   : cltnum,
            emtelnum : emtelnum,
            spjangcd : _spjangcd
        }, function (result) {
            if (result != null && result.data != null) {
                renderCardList(result.data);
            } else {
                document.getElementById('cardList').innerHTML =
                    '<div class="empty-msg">조회 중 오류가 발생하였습니다.</div>';
            }
        });
    }

    function renderCardList(list) {
        const container = document.getElementById('cardList');
        const countEl   = document.getElementById('resultCount');
        if (!list || list.length === 0) {
            countEl.textContent = '';
            container.innerHTML = '<div class="empty-msg">조회된 현장이 없습니다.</div>';
            return;
        }
        countEl.textContent = `총 ${list.length}건`;
        let html = '';
        list.forEach(function (item) {
            html += `
            <div class="site-card" onclick='openDetailPopup(${JSON.stringify(item)})'>
                <div class="card-header">
                    <span class="card-actnm">${esc(item.actnm || '')}</span>
                    ${item.actgubun ? `<span class="${getGubunClass(item.actgubun)}">${getGubunNm(item.actgubun)}</span>` : ''}
                </div>
                ${item.bildyd ? `<div class="card-row"><span class="card-label">건물용도</span><span class="card-value">${esc(item.bildyd)}</span></div>` : ''}
                ${item.actpernm ? `<div class="card-row"><span class="card-label">담당자</span><span class="card-value">${esc(item.actpernm)}${item.divinm ? ' / ' + esc(item.divinm) : ''}</span></div>` : ''}
                ${item.tel ? `<div class="card-row"><span class="card-label">전화번호</span><span class="card-value">${esc(item.tel)}</span></div>` : ''}
                ${item.address ? `<div class="card-row"><span class="card-label">소재지</span><span class="card-value">${esc(item.address)}</span></div>` : ''}
            </div>`;
        });
        container.innerHTML = html;
    }

    function openDetailPopup(item) {
        document.getElementById('popupTitle').textContent = item.actnm || '현장 상세';

        let html = `<div class="detail-section-title">기본 정보</div>`;
        html += buildDetailRows([
            { label: '현장코드',   value: item.actcd    },
            { label: '현장명',     value: item.actnm    },
            { label: '현장구분',   value: getGubunNm(item.actgubun) },
            { label: '거래처코드', value: item.cltcd    },
            { label: '건물용도',   value: item.bildyd   },
            { label: '건물층수',   value: item.bildlv   },
            { label: '건물주',     value: item.bildju   },
            { label: '건축허가일', value: item.bilddate },
        ]);
        html += `<div class="detail-section-title">담당자 정보</div>`;
        html += buildDetailRows([
            { label: '담당자',   value: item.actpernm },
            { label: '부서명',   value: item.divinm   },
            { label: '메일',     value: item.actmail  },
            { label: '전화번호', value: item.tel      },
            { label: '핸드폰',   value: item.hp       },
            { label: '팩스',     value: item.fax      },
        ]);
        html += `<div class="detail-section-title">소재지 정보</div>`;
        html += buildDetailRows([
            { label: '우편번호', value: item.zipcode  },
            { label: '소재지',   value: item.address  },
            { label: '상세주소', value: item.address2 },
        ]);
        html += `<div class="detail-section-title">계약 정보</div>`;
        html += buildDetailRows([
            { label: '계약시작일', value: item.stdate  },
            { label: '계약만료일', value: item.enddate },
            { label: '구분',       value: item.gubun   },
        ]);

        document.getElementById('popupBody').innerHTML = html;

        AjaxUtil.getAsyncData('/api/maintenance_comp/read_equp', {
            actcd: item.actcd, spjangcd: _spjangcd
        }, function (result) {
            if (result && result.data && result.data.length > 0) {
                let equpHtml = `<div class="equp-section"><div class="detail-section-title">호기 목록 (${result.data.length}건)</div>`;
                result.data.forEach(function (e) {
                    equpHtml += `<div class="equp-item"><span><span class="equp-code">${esc(e.equpcd || '')}</span>${esc(e.equpnm || '')}</span></div>`;
                });
                equpHtml += '</div>';
                document.getElementById('popupBody').innerHTML += equpHtml;
            }
        });

        openPopup('detailPopup');
    }

    function openPopup(id)  { document.getElementById(id).classList.add('active');    }
    function closePopup(id) { document.getElementById(id).classList.remove('active'); }

    document.getElementById('detailPopup').addEventListener('click', function (e) {
        if (e.target === this) closePopup('detailPopup');
    });

    function buildDetailRows(rows) {
        return rows.map(function (r) {
            if (!r.value) return '';
            return `<div class="detail-row">
                <span class="detail-label">${r.label}</span>
                <span class="detail-value">${esc(String(r.value))}</span>
            </div>`;
        }).join('');
    }

    function getGubunNm(val) {
        if (val == '01') return '계약중';
        if (val == '02') return '해지';
        return val || '';
    }
    function getGubunClass(val) {
        if (val == '01') return 'card-badge-cont';
        if (val == '02') return 'card-badge-cancel';
        return 'card-badge-etc';
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

</script>
</body>
</html>
