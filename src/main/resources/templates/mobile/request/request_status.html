<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }

    .card-list { padding: 8px 12px 100px; }
    .repair-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.10); margin-bottom: 10px; padding: 14px 16px; cursor: pointer; }
    .repair-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .card-actnm { font-size: 15px; font-weight: 700; color: #222; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-badge-rece { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fff3e0; color: #e65100; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-badge-comp { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #e6f4ea; color: #1a7a3a; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
    .card-row { display: flex; font-size: 13px; color: #555; margin-top: 3px; gap: 4px; }
    .card-label { color: #999; min-width: 55px; flex-shrink: 0; }
    .card-value { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .result-count { padding: 4px 14px; font-size: 12px; color: #888; }
    .empty-msg { text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }

    .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9000; justify-content: center; align-items: flex-end; }
    .popup-overlay.active { display: flex; }
    .popup-sheet { background: #fff; width: 100%; max-height: 80vh; border-radius: 16px 16px 0 0; overflow: hidden; display: flex; flex-direction: column; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 700; font-size: 16px; flex-shrink: 0; white-space: nowrap; }
    .popup-header span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .popup-close { width:0; border: none; font-size: 24px; cursor: pointer; color: #666; line-height: 1; flex-shrink: 0; margin-left: 12px; }
    .popup-body { overflow-y: auto; flex: 1; padding: 16px 20px 30px; }

    .detail-section-title { font-size: 13px; font-weight: 700; color: #444; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #dce6f1; }
    .detail-row { display: flex; padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; gap: 12px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #999; min-width: 80px; flex-shrink: 0; font-size: 13px; }
    .detail-value { color: #222; flex: 1; word-break: break-all; }

    .detail-footer { padding: 12px 20px 24px; border-top: 1px solid #eee; flex-shrink: 0; display:flex; gap:8px; }
    .btn-edit   { flex:1; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-edit:active { background: #111; }
    .btn-delete { flex:1; padding: 12px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-delete:active { background: #cc0000; }

    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 600; }
    .form-row input[type="text"], .form-row input[type="date"], .form-row input[type="time"], .form-row textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .form-row input[readonly] { background: #f5f5f5; color: #666; cursor: pointer; }
    .form-row textarea { resize: vertical; min-height: 80px; }
    .form-row .row-2col { display: flex; gap: 8px; }
    .form-row .row-2col > * { flex: 1; }
    .form-save-btn { width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .form-save-btn:active { background: #111; }

    .popup-list { overflow-y: auto; flex: 1; }
    .popup-list ul { list-style: none; margin: 0; padding: 0; }
    .popup-list ul li { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; }
    .popup-list ul li:active { background: #f5f5f5; }
    .popup-list .item-code { font-size: 12px; color: #999; margin-right: 6px; }
    .popup-search-input { width: 100%; padding: 10px 14px; border: none; border-bottom: 1px solid #eee; font-size: 14px; box-sizing: border-box; outline: none; flex-shrink: 0; }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTAS MES</title>
    <meta name="ctx" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
    <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script th:src="@{/assets_mobile/js/ui.js}"></script>
    <script th:inline="javascript">var sandanData = /*[[${session.sandanList}]]*/ [];</script>
    <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script th:src="@{/js/Mobile.js}"></script>
    <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">

    <div class="mobile-layout-header">
        <header>
            <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
            <div class="left" style="margin-left:35px; font-size:25px;"><h2>고장접수현황</h2></div>
            <div class="right">
                <a href="#" title="전체메뉴" class="btn-menu">
                    <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
                </a>
            </div>
        </header>
    </div>

    <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

    <div class="mobile-layout-contents" style="display:block;">
        <div class="layout-contents">
            <div class="search-wrap">
                <div class="srch-tit aco-hd">
                    <p>기본검색</p>
                    <a href="#" title="열기/닫기" class="btn-aco">
                        <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
                    </a>
                </div>
                <div class="srch-cont aco-cont">
                    <dl>
                        <dt>접수기간</dt>
                        <dd>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <input type="date" id="searchFromDate" style="flex:1;">
                                <span>~</span>
                                <input type="date" id="searchToDate" style="flex:1;">
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>현장명</dt>
                        <dd><input type="text" id="searchActnm" placeholder="현장명 검색"></dd>
                    </dl>
                    <dl>
                        <dt>처리여부</dt>
                        <dd>
                            <select id="searchResultck" style="width:100%;">
                                <option value="">전체</option>
                                <option value="null">접수</option>
                                <option value="1">처리</option>
                            </select>
                        </dd>
                    </dl>
                    <div class="srch-btn">
                        <button class="btn-dark" onclick="handleSearch()">조회</button>
                    </div>
                </div>
            </div>
            <div class="result-count" id="resultCount"></div>
            <div class="card-list" id="cardList">
                <div class="empty-msg">조회 버튼을 눌러 고장접수 목록을 조회하세요.</div>
            </div>
        </div>
    </div>
</div>

<!-- 상세 팝업 -->
<div class="popup-overlay" id="detailPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span id="detailTitle">고장접수 상세</span>
            <button class="popup-close" onclick="closePopup('detailPopup')">×</button>
        </div>
        <div class="popup-body" id="detailBody"></div>
        <div class="detail-footer">
            <button class="btn-edit"   onclick="openEditPopup()">수정</button>
            <button class="btn-delete" onclick="deleteRepair()">삭제</button>
        </div>
    </div>
</div>

<!-- 수정 팝업 -->
<div class="popup-overlay" id="editPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>고장접수 수정</span>
            <button class="popup-close" onclick="closePopup('editPopup')">×</button>
        </div>
        <div class="popup-body">
            <input type="hidden" id="editRecedate">
            <input type="hidden" id="editRecenum">
            <input type="hidden" id="editActcd">
            <input type="hidden" id="editEqupcd">
            <input type="hidden" id="editContcd">

            <div class="form-row">
                <label>접수일자 / 접수시간</label>
                <div class="row-2col">
                    <input type="date" id="editRecedateDisp">
                    <input type="time" id="editRecetime">
                </div>
            </div>
            <div class="form-row">
                <label>고장일자 / 고장시간</label>
                <div class="row-2col">
                    <input type="date" id="editHitchdate">
                    <input type="time" id="editHitchhour">
                </div>
            </div>
            <div class="form-row">
                <label>현장명</label>
                <input type="text" id="editActnm" placeholder="현장 선택" readonly onclick="openActPopup()">
            </div>
            <div class="form-row">
                <label>호기명</label>
                <input type="text" id="editEqupnm" placeholder="호기 선택 (현장 먼저 선택)" readonly onclick="openEditEqupPopup()">
            </div>
            <div class="form-row">
                <label>고장내용</label>
                <input type="text" id="editContnm" placeholder="고장내용 선택" readonly onclick="openContnmPopup()">
            </div>
            <div class="form-row">
                <label>상세내용</label>
                <input type="text" id="editContents" placeholder="상세내용 입력">
            </div>
            <div class="form-row">
                <label>비고</label>
                <textarea id="editRemark" placeholder="비고 입력"></textarea>
            </div>
            <div class="form-row">
                <label>통보(전달)자</label>
                <input type="text" id="editRepernm" placeholder="통보자 선택" readonly onclick="openPerPopup()">
                <input type="hidden" id="editReperid">
            </div>
            <button class="form-save-btn" onclick="updateRepair()">수정 저장</button>
        </div>
    </div>
</div>

<!-- 현장 선택 팝업 -->
<div class="popup-overlay" id="actPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>현장 선택</span>
            <button class="popup-close" onclick="closePopup('actPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="actSearchInput" placeholder="현장명 검색"
               oninput="filterActList(this.value)">
        <div class="popup-list"><ul id="actList"></ul></div>
    </div>
</div>

<!-- 호기 선택 팝업 -->
<div class="popup-overlay" id="equpPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>호기 선택</span>
            <button class="popup-close" onclick="closePopup('equpPopup')">×</button>
        </div>
        <div class="popup-list"><ul id="equpList"></ul></div>
    </div>
</div>

<!-- 고장내용 선택 팝업 -->
<div class="popup-overlay" id="contnmPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>고장내용 선택</span>
            <button class="popup-close" onclick="closePopup('contnmPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="contnmSearchInput" placeholder="고장내용 검색"
               oninput="filterContnmList(this.value)">
        <div class="popup-list"><ul id="contnmList"></ul></div>
    </div>
</div>

<!-- 통보자 선택 팝업 -->
<div class="popup-overlay" id="perPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>통보자 선택</span>
            <button class="popup-close" onclick="closePopup('perPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="perSearchInput" placeholder="이름 검색"
               oninput="filterPerList(this.value)">
        <div class="popup-list"><ul id="perList"></ul></div>
    </div>
</div>

<script type="text/javascript">

    var _actListCache    = [];
    var _contnmListCache = [];
    var _perListCache    = [];
    var _spjangcd        = sessionStorage.getItem('spjangcd') || '';
    var _currentItem     = null;

    $(document).ready(function () {
        const today = new Date();
        const yyyy  = today.getFullYear();
        const mm    = String(today.getMonth() + 1).padStart(2, '0');
        const dd    = String(today.getDate()).padStart(2, '0');
        document.getElementById('searchFromDate').value = `${yyyy}-${mm}-01`;
        document.getElementById('searchToDate').value   = `${yyyy}-${mm}-${dd}`;
        searchRepairList();
    });

    /* ── 목록 조회 ── */
    function handleSearch() {
        searchRepairList();
        document.querySelectorAll('.btn-aco').forEach(function (btn) { btn.click(); });
    }

    function searchRepairList() {
        const fromDate = document.getElementById('searchFromDate').value.replaceAll('-', '');
        const toDate   = document.getElementById('searchToDate').value.replaceAll('-', '');
        const actnm    = document.getElementById('searchActnm').value.trim();
        const resultck = document.getElementById('searchResultck').value;

        AjaxUtil.getAsyncData('/api/request_repair/read', {
            fromDate : fromDate,
            toDate   : toDate,
            actnm    : actnm,
            resultck : resultck,
            spjangcd : _spjangcd
        }, function (result) {
            if (result != null && result.data != null) {
                renderCardList(result.data);
            } else {
                document.getElementById('cardList').innerHTML =
                    '<div class="empty-msg">조회 중 오류가 발생하였습니다.</div>';
            }
        });
    }

    function renderCardList(list) {
        const container = document.getElementById('cardList');
        const countEl   = document.getElementById('resultCount');
        if (!list || list.length === 0) {
            countEl.textContent = '';
            container.innerHTML = '<div class="empty-msg">조회된 데이터가 없습니다.</div>';
            return;
        }
        countEl.textContent = `총 ${list.length}건`;
        let html = '';
        list.forEach(function (item) {
            const isComp     = item.resultck == '1';
            const badgeClass = isComp ? 'card-badge-comp' : 'card-badge-rece';
            const badgeText  = isComp ? '처리' : '접수';
            html += `
            <div class="repair-card" onclick='openDetailPopup(${JSON.stringify(item)})'>
                <div class="card-header">
                    <span class="card-actnm">${esc(item.actnm || '')}</span>
                    <span class="${badgeClass}">${esc(item.recedate || '')} / ${badgeText}</span>
                </div>
                ${item.equpnm  ? `<div class="card-row"><span class="card-label">호기명</span><span class="card-value">${esc(item.equpnm)}</span></div>` : ''}
                ${item.contnm  ? `<div class="card-row"><span class="card-label">고장내용</span><span class="card-value">${esc(item.contnm)}</span></div>` : ''}
            </div>`;
        });
        container.innerHTML = html;
    }

    /* ── 상세 팝업 ── */
    function openDetailPopup(item) {
        _currentItem = item;
        document.getElementById('detailTitle').textContent = (item.actnm || '고장접수') + ' 상세';

        let html = `<div class="detail-section-title">접수 정보</div>`;
        html += buildDetailRows([
            { label: '접수일자', value: item.recedate  },
            { label: '접수번호', value: item.recenum   },
            { label: '접수시간', value: item.recetime  },
            { label: '고장일자', value: item.hitchdate },
            { label: '고장시간', value: item.hitchhour },
        ]);
        html += `<div class="detail-section-title">현장 정보</div>`;
        html += buildDetailRows([
            { label: '현장명', value: item.actnm  },
            { label: '호기명', value: item.equpnm },
        ]);
        html += `<div class="detail-section-title">고장 내용</div>`;
        html += buildDetailRows([
            { label: '고장내용', value: item.contnm   },
            { label: '상세내용', value: item.contents },
            { label: '비고',     value: item.remark   },
        ]);
        html += `<div class="detail-section-title">담당자 정보</div>`;
        html += buildDetailRows([
            { label: '통보자', value: item.repernm || item.reperid },
            { label: '부서명', value: item.divinm  },
            { label: '접수자', value: item.pernm   },
        ]);

        document.getElementById('detailBody').innerHTML = html;
        openPopup('detailPopup');
    }

    /* ── 삭제 ── */
    function deleteRepair() {
        if (!_currentItem) return;
        Alert.confirm('', '해당 고장접수를 삭제하시겠습니까?', function () {
            AjaxUtil.postAsyncData('/api/request_repair/delete', {
                spjangcd : _spjangcd,
                recedate : _currentItem.recedate,
                recenum  : _currentItem.recenum,
            }, function (result) {
                if (result && result.success) {
                    Alert.alert('', '삭제되었습니다.', function () {
                        closePopup('detailPopup');
                        searchRepairList();
                    });
                } else {
                    Alert.alert('', (result && result.message) || '삭제 중 오류가 발생하였습니다.');
                }
            });
        });
    }

    /* ── 수정 팝업 ── */
    function openEditPopup() {
        if (!_currentItem) return;
        const item = _currentItem;

        const toDateInput = function(v) {
            v = v || '';
            return v.length === 8 ? `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}` : v;
        };
        const toTimeInput = function(v) {
            v = v || '';
            return v.length >= 4 ? `${v.slice(0,2)}:${v.slice(2,4)}` : v;
        };

        document.getElementById('editRecedate').value     = item.recedate  || '';
        document.getElementById('editRecenum').value      = item.recenum   || '';
        document.getElementById('editActcd').value        = item.actcd     || '';
        document.getElementById('editEqupcd').value       = item.equpcd    || '';
        document.getElementById('editContcd').value       = item.contcd    || '';
        document.getElementById('editRecedateDisp').value = toDateInput(item.recedate);
        document.getElementById('editRecetime').value     = toTimeInput(item.recetime);
        document.getElementById('editHitchdate').value    = toDateInput(item.hitchdate);
        document.getElementById('editHitchhour').value    = toTimeInput(item.hitchhour);
        document.getElementById('editActnm').value        = item.actnm    || '';
        document.getElementById('editEqupnm').value       = item.equpnm   || '';
        document.getElementById('editContnm').value       = item.contnm   || '';
        document.getElementById('editContents').value     = item.contents  || '';
        document.getElementById('editRemark').value       = item.remark    || '';
        document.getElementById('editReperid').value      = item.reperid   || '';
        document.getElementById('editRepernm').value      = item.repernm   || item.reperid || '';

        closePopup('detailPopup');
        openPopup('editPopup');
    }

    /* ── 수정 저장 ── */
    function updateRepair() {
        const recedate = document.getElementById('editRecedate').value;
        const actcd    = document.getElementById('editActcd').value;
        if (!recedate) { Alert.alert('', '접수일자가 없습니다.'); return; }
        if (!actcd)    { Alert.alert('', '현장을 선택해주세요.'); return; }

        const data = {
            spjangcd  : _spjangcd,
            recedate  : recedate,
            recenum   : document.getElementById('editRecenum').value,
            recetime  : document.getElementById('editRecetime').value.replaceAll(':', ''),
            hitchdate : document.getElementById('editHitchdate').value.replaceAll('-', ''),
            hitchhour : document.getElementById('editHitchhour').value.replaceAll(':', ''),
            actcd     : actcd,
            actnm     : document.getElementById('editActnm').value,
            equpcd    : document.getElementById('editEqupcd').value,
            equpnm    : document.getElementById('editEqupnm').value,
            contcd    : document.getElementById('editContcd').value,
            contents  : document.getElementById('editContents').value,
            remark    : document.getElementById('editRemark').value,
            reperid   : document.getElementById('editReperid').value,
        };

        AjaxUtil.postAsyncData('/api/request_repair/update', data, function (result) {
            if (result && result.success) {
                Alert.alert('', result.message, function () {
                    closePopup('editPopup');
                    searchRepairList();
                });
            } else {
                Alert.alert('', (result && result.message) || '수정 중 오류가 발생하였습니다.');
            }
        });
    }

    /* ── 현장 선택 팝업 ── */
    function openActPopup() {
        document.getElementById('actSearchInput').value = '';
        if (_actListCache.length > 0) {
            renderActList(_actListCache);
            openPopup('actPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/request_repair/read_act', { spjangcd: _spjangcd }, function (result) {
            if (result && result.data) {
                _actListCache = result.data;
                renderActList(_actListCache);
                openPopup('actPopup');
            }
        });
    }

    function renderActList(list) {
        const ul = document.getElementById('actList');
        ul.innerHTML = '';
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.actcd || '')}</span>${esc(item.actnm || '')}`;
            li.onclick = function () { setActData(item); };
            ul.appendChild(li);
        });
    }

    function filterActList(keyword) {
        renderActList(_actListCache.filter(function (item) {
            return (item.actnm || '').includes(keyword);
        }));
    }

    function setActData(item) {
        document.getElementById('editActcd').value  = item.actcd || '';
        document.getElementById('editActnm').value  = item.actnm || '';
        document.getElementById('editEqupcd').value = '';
        document.getElementById('editEqupnm').value = '';
        closePopup('actPopup');
    }

    /* ── 호기 선택 팝업 ── */
    function openEditEqupPopup() {
        const actcd = document.getElementById('editActcd').value;
        if (!actcd) { Alert.alert('', '현장을 먼저 선택해주세요.'); return; }

        AjaxUtil.getAsyncData('/api/request_repair/read_equp', {
            actcd: actcd, spjangcd: _spjangcd
        }, function (result) {
            const ul = document.getElementById('equpList');
            ul.innerHTML = '';
            if (result && result.data && result.data.length > 0) {
                result.data.forEach(function (item) {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="item-code">${esc(item.equpcd || '')}</span>${esc(item.equpnm || '')}`;
                    li.onclick = function () { setEqupData(item); };
                    ul.appendChild(li);
                });
            } else {
                ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 호기가 없습니다.</li>';
            }
            openPopup('equpPopup');
        });
    }

    function setEqupData(item) {
        document.getElementById('editEqupcd').value = item.equpcd || '';
        document.getElementById('editEqupnm').value = item.equpnm || '';
        closePopup('equpPopup');
    }

    /* ── 고장내용 선택 팝업 ── */
    function openContnmPopup() {
        document.getElementById('contnmSearchInput').value = '';
        if (_contnmListCache.length > 0) {
            renderContnmList(_contnmListCache);
            openPopup('contnmPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/request_repair/read_contnm', {}, function (result) {
            if (result && result.data) {
                _contnmListCache = result.data;
                renderContnmList(_contnmListCache);
                openPopup('contnmPopup');
            }
        });
    }

    function renderContnmList(list) {
        const ul = document.getElementById('contnmList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 고장내용이 없습니다.</li>';
            return;
        }
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.contcd || '')}</span>${esc(item.contnm || '')}`;
            li.onclick = function () { setContnmData(item); };
            ul.appendChild(li);
        });
    }

    function filterContnmList(keyword) {
        renderContnmList(_contnmListCache.filter(function (item) {
            return (item.contnm || '').includes(keyword);
        }));
    }

    function setContnmData(item) {
        document.getElementById('editContcd').value = item.contcd || '';
        document.getElementById('editContnm').value = item.contnm || '';
        closePopup('contnmPopup');
    }

    /* ── 통보자 선택 팝업 ── */
    function openPerPopup() {
        document.getElementById('perSearchInput').value = '';
        if (_perListCache.length > 0) {
            renderPerList(_perListCache);
            openPopup('perPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/system/user/getPerson', { searchCode: '', searchName: '' }, function (result) {
            if (result && result.data) {
                _perListCache = result.data;
                renderPerList(_perListCache);
                openPopup('perPopup');
            }
        });
    }

    function renderPerList(list) {
        const ul = document.getElementById('perList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 사원이 없습니다.</li>';
            return;
        }
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.code || '')}</span>${esc(item.name || '')}`;
            li.onclick = function () { setPerData(item); };
            ul.appendChild(li);
        });
    }

    function filterPerList(keyword) {
        renderPerList(_perListCache.filter(function (item) {
            return (item.name || '').includes(keyword);
        }));
    }

    function setPerData(item) {
        document.getElementById('editReperid').value = (item.code || '').replace(/^p/, '');
        document.getElementById('editRepernm').value = item.name || '';
        closePopup('perPopup');
    }

    /* ── 팝업 공통 ── */
    function openPopup(id)  { document.getElementById(id).classList.add('active');    }
    function closePopup(id) { document.getElementById(id).classList.remove('active'); }

    ['detailPopup', 'editPopup', 'actPopup', 'equpPopup', 'contnmPopup', 'perPopup'].forEach(function (id) {
        document.getElementById(id).addEventListener('click', function (e) {
            if (e.target === this) closePopup(id);
        });
    });

    function buildDetailRows(rows) {
        return rows.map(function (r) {
            if (!r.value) return '';
            return `<div class="detail-row">
                <span class="detail-label">${r.label}</span>
                <span class="detail-value">${esc(String(r.value))}</span>
            </div>`;
        }).join('');
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

</script>
</body>
</html>
