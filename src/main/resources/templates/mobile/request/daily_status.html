<!DOCTYPE html>
<html lang="ko">
<style>
  .btn-clear { display: none !important; }
  .btn-close { display: none !important; }
  .card-list { padding: 8px 12px 80px; }
  .site-card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.10); margin-bottom:10px; padding:14px 16px; cursor:pointer; }
  .site-card:active { box-shadow:0 2px 8px rgba(0,0,0,0.18); }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .card-actnm { font-size:15px; font-weight:700; color:#222; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-row { display:flex; font-size:13px; color:#555; margin-top:3px; gap:4px; }
  .card-label { color:#999; min-width:65px; flex-shrink:0; }
  .card-value { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-count { padding:4px 14px; font-size:12px; color:#888; }
  .empty-msg { text-align:center; padding:60px 20px; color:#bbb; font-size:14px; }
  .popup-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:9000; justify-content:center; align-items:flex-end; }
  .popup-overlay.active { display:flex; }
  .popup-sheet { background:#fff; width:100%; max-height:80vh; border-radius:16px 16px 0 0; overflow:hidden; display:flex; flex-direction:column; }
  .popup-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #eee; font-weight:700; font-size:16px; flex-shrink:0; }
  .popup-close { width: 0%; background:none; border:none; font-size:24px; cursor:pointer; color:#666; line-height:1; }
  .popup-body { overflow-y:auto; flex:1; padding:16px 20px 30px; }
  .popup-footer { padding:12px 20px; border-top:1px solid #eee; display:flex; gap:8px; flex-shrink:0; }
  .btn-delete { flex:1; padding:12px; background:#ff4444; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-edit   { flex:1; padding:12px; background:#4472c4; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .edit-row { display:flex; flex-direction:column; margin-bottom:14px; }
  .edit-label { font-size:13px; color:#999; margin-bottom:4px; }
  .edit-input { padding:9px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; width:100%; box-sizing:border-box; }
  .detail-section-title { font-size:13px; font-weight:700; color:#444; margin:14px 0 6px; padding-bottom:4px; border-bottom:2px solid #dce6f1; }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px solid #f0f0f0; font-size:14px; gap:12px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { color:#999; min-width:80px; flex-shrink:0; font-size:13px; }
  .detail-value { color:#222; flex:1; word-break:break-all; }
</style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTAS MES</title>
  <meta name="ctx" th:content="@{/}">
  <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
  <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
  <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script th:src="@{/assets_mobile/js/ui.js}"></script>
  <script th:inline="javascript">var sandanData = /*[[${session.sandanList}]]*/ [];</script>
  <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/Mobile.js}"></script>
</head>
<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">
  <div class="mobile-layout-header">
    <header>
      <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
      <div class="left" style="margin-left:35px; font-size:25px;"><h2>업무일지 현황</h2></div>
      <div class="right">
        <a href="#" title="전체메뉴" class="btn-menu">
          <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
        </a>
      </div>
    </header>
  </div>
  <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>
  <div class="mobile-layout-contents" style="display:block;">
    <div class="layout-contents">
      <div class="search-wrap">
        <div class="srch-tit aco-hd">
          <p>기본검색</p>
          <a href="#" title="열기/닫기" class="btn-aco">
            <img th:src="@{/assets_mobile/images/icon/ico-down.svg}" alt="열기/닫기">
          </a>
        </div>
        <div class="srch-cont aco-cont">
          <dl>
            <dt>조회기간</dt>
            <dd style="display:flex; gap:6px; align-items:center;">
              <input type="date" id="searchFromDate" style="flex:1;">
              <span>~</span>
              <input type="date" id="searchToDate" style="flex:1;">
            </dd>
          </dl>
          <dl>
            <dt>현장명</dt>
            <dd><input type="text" id="searchActnm" placeholder="현장명을 입력하세요"></dd>
          </dl>
          <div class="srch-btn">
            <button class="btn-dark" onclick="handleSearch()">조회</button>
          </div>
        </div>
      </div>
      <div class="result-count" id="resultCount"></div>
      <div class="card-list" id="cardList">
        <div class="empty-msg">조회 버튼을 눌러 목록을 조회하세요.</div>
      </div>
    </div>
  </div>
</div>

<!-- 상세 팝업 -->
<div class="popup-overlay" id="detailPopup">
  <div class="popup-sheet">
    <div class="popup-header">
      <span id="popupTitle">업무일지 상세</span>
      <button class="popup-close" onclick="closePopup('detailPopup')">×</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
    <div class="popup-footer">
      <button class="btn-edit"   onclick="openEditPopup()">수정</button>
      <button class="btn-delete" onclick="deleteRecord()">삭제</button>
    </div>
  </div>
</div>

<!-- 수정 팝업 -->
<div class="popup-overlay" id="editPopup">
  <div class="popup-sheet">
    <div class="popup-header">
      <span>업무일지 수정</span>
      <button class="popup-close" onclick="closePopup('editPopup')">×</button>
    </div>
    <div class="popup-body">
      <div class="edit-row">
        <label class="edit-label">일자</label>
        <input type="date" id="editRptdate" class="edit-input">
      </div>
      <div class="edit-row">
        <label class="edit-label">현장명</label>
        <input type="text" id="editActnm" class="edit-input" placeholder="현장명">
        <input type="hidden" id="editActcd">
      </div>
      <div class="edit-row">
        <label class="edit-label">호기</label>
        <input type="text" id="editEqupnm" class="edit-input" placeholder="호기명">
        <input type="hidden" id="editEqupcd">
      </div>
      <div class="edit-row">
        <label class="edit-label">업무구분</label>
        <input type="text" id="editWkcd" class="edit-input" placeholder="업무구분">
      </div>
      <div class="edit-row">
        <label class="edit-label">시작시간</label>
        <input type="time" id="editFrtime" class="edit-input">
      </div>
      <div class="edit-row">
        <label class="edit-label">종료시간</label>
        <input type="time" id="editTotime" class="edit-input">
      </div>
      <div class="edit-row">
        <label class="edit-label">내용</label>
        <textarea id="editRemark" class="edit-input" rows="4" style="resize:none;"></textarea>
      </div>
      <div class="edit-row">
        <label class="edit-label">첨부파일</label>
        <div id="editFileArea">
          <!-- 기존 파일 표시 -->
          <div id="editFileExisting" style="display:none; padding:8px 10px; background:#f5f5f5; border-radius:6px; font-size:13px; color:#444; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">
            <span id="editFileExistingName" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
            <button type="button" onclick="removeExistingFile()" style="background:none; border:none; font-size:18px; color:#aaa; cursor:pointer; padding:0 4px;">×</button>
          </div>
          <!-- 새 파일 선택 -->
          <div id="editFileNew">
            <div class="file-upload-area" onclick="document.getElementById('editFileInput').click()" style="border:2px dashed #ddd; border-radius:8px; padding:12px; text-align:center; cursor:pointer; background:#fafafa;">
              <p style="margin:0; font-size:13px; color:#888;">클릭하여 파일 선택 (교체)</p>
            </div>
            <div id="editFilePreview" style="display:none; margin-top:8px; padding:8px 10px; background:#f5f5f5; border-radius:6px; font-size:13px; color:#444; align-items:center; gap:8px;">
              <span id="editFileNameDisplay" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
              <span id="editFileStatus" style="font-size:12px; white-space:nowrap;"></span>
              <button type="button" onclick="removeNewFile()" style="background:none; border:none; font-size:18px; color:#aaa; cursor:pointer; padding:0 2px;">×</button>
            </div>
          </div>
          <input type="file" id="editFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
          <input type="hidden" id="editFilesvnm">
          <input type="hidden" id="editFilepath">
          <input type="hidden" id="editFileDeleted" value="0"> <!-- 1: 기존 파일 삭제 -->
        </div>
      </div>
    </div>
    <div class="popup-footer">
      <button class="btn-edit" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script type="text/javascript">
  var ctx = document.querySelector('meta[name="ctx"]').getAttribute('content') || '/';
  var _spjangcd = sessionStorage.getItem('spjangcd') || '';
  var _selectedItem = null;

  $(document).ready(function () {
    const today = new Date();
    const yyyy  = today.getFullYear();
    const mm    = String(today.getMonth() + 1).padStart(2, '0');
    const dd    = String(today.getDate()).padStart(2, '0');
    document.getElementById('searchFromDate').value = `${yyyy}-${mm}-01`;
    document.getElementById('searchToDate').value   = `${yyyy}-${mm}-${dd}`;
  });

  function handleSearch() {
    searchList();
    document.querySelectorAll('.btn-aco').forEach(function (btn) { btn.click(); });
  }

  function searchList() {
    const fromDate = document.getElementById('searchFromDate').value.replace(/-/g, '');
    const toDate   = document.getElementById('searchToDate').value.replace(/-/g, '');
    const actnm    = document.getElementById('searchActnm').value.trim();
    AjaxUtil.getAsyncData('/api/daily_report/read_status', {
      fromDate : fromDate,
      toDate   : toDate,
      actnm    : actnm,
      spjangcd : _spjangcd
    }, function (result) {
      if (result != null && result.data != null) {
        renderCardList(result.data);
      } else {
        document.getElementById('cardList').innerHTML = '<div class="empty-msg">조회 중 오류가 발생하였습니다.</div>';
      }
    });
  }

  function renderCardList(list) {
    const container = document.getElementById('cardList');
    const countEl   = document.getElementById('resultCount');
    if (!list || list.length === 0) {
      countEl.textContent = '';
      container.innerHTML = '<div class="empty-msg">조회된 데이터가 없습니다.</div>';
      return;
    }
    countEl.textContent = `총 ${list.length}건`;
    let html = '';
    list.forEach(function (item) {
      html += `
        <div class="site-card" onclick='openDetailPopup(${JSON.stringify(item)})'>
          <div class="card-header">
            <span class="card-actnm">${esc(item.actnm || '-')}</span>
            <span style="font-size:12px; color:#888;">${esc(item.rptdate || '')}</span>
          </div>
          ${item.pernm ? `<div class="card-row"><span class="card-label">작성자</span><span class="card-value">${esc(item.pernm)}</span></div>` : ''}
          ${item.wkcd ? `<div class="card-row"><span class="card-label">업무구분</span><span class="card-value">${esc(item.wkcd)}</span></div>` : ''}
          ${item.frtime ? `<div class="card-row"><span class="card-label">시간</span><span class="card-value">${esc(item.frtime)} ~ ${esc(item.totime || '')}</span></div>` : ''}
          ${item.remark ? `<div class="card-row"><span class="card-label">내용</span><span class="card-value">${esc(item.remark)}</span></div>` : ''}
        </div>`;
    });
    container.innerHTML = html;
  }

  function openDetailPopup(item) {
    _selectedItem = item;
    document.getElementById('popupTitle').textContent = item.actnm || '업무일지 상세';
    let html = `<div class="detail-section-title">업무일지 정보</div>`;
    html += buildDetailRows([
      { label: '일자',     value: item.rptdate },
      { label: '작성자',   value: item.pernm   },
      { label: '현장명',   value: item.actnm   },
      { label: '호기',     value: item.equpnm  },
      { label: '업무구분', value: item.wkcd    },
      { label: '시작시간', value: item.frtime  },
      { label: '종료시간', value: item.totime  },
      { label: '내용',     value: item.remark  },
    ]);

    // 첨부파일 다운로드 링크
    if (item.filesvnm && item.filesvnm.trim()) {
      const fileUrl = ctx + 'api/daily_report/download?filepath=' + encodeURIComponent(item.filepath) + '&filesvnm=' + encodeURIComponent(item.filesvnm);
      html += `<div class="detail-row">
                 <span class="detail-label">첨부파일</span>
                 <span class="detail-value">
                   <a href="${fileUrl}" target="_blank" style="color:#4472c4; text-decoration:underline;">
                     📎 첨부파일 다운로드
                   </a>
                 </span>
               </div>`;
    }

    document.getElementById('popupBody').innerHTML = html;
    openPopup('detailPopup');
  }

  function deleteRecord() {
    if (!_selectedItem) return;
    Alert.confirm('', '해당 업무일지를 삭제하시겠습니까?', function () {
      AjaxUtil.postAsyncData('/api/daily_report/delete_status', {
        rptdate  : _selectedItem.rptdate,
        perid    : _selectedItem.perid,
        rptnum   : _selectedItem.rptnum,
        spjangcd : _spjangcd
      }, function (result) {
        if (result && result.success) {
          Alert.alert('', '삭제되었습니다.', function () {
            closePopup('detailPopup');
            searchList();
          });
        } else {
          Alert.alert('', result.message || '삭제 중 오류가 발생하였습니다.');
        }
      });
    });
  }

  function openEditPopup() {
    if (!_selectedItem) return;
    const item = _selectedItem;
    const rd = item.rptdate || '';
    document.getElementById('editRptdate').value = rd.length === 8
      ? rd.substring(0,4)+'-'+rd.substring(4,6)+'-'+rd.substring(6,8) : '';
    document.getElementById('editActnm').value  = item.actnm  || '';
    document.getElementById('editActcd').value  = item.actcd  || '';
    document.getElementById('editEqupnm').value = item.equpnm || '';
    document.getElementById('editEqupcd').value = item.equpcd || '';
    document.getElementById('editWkcd').value   = item.wkcd   || '';
    document.getElementById('editFrtime').value = item.frtime ? item.frtime.substring(0,2)+':'+item.frtime.substring(2,4) : '';
    document.getElementById('editTotime').value = item.totime ? item.totime.substring(0,2)+':'+item.totime.substring(2,4) : '';
    document.getElementById('editRemark').value = item.remark || '';

    // 파일 초기화
    document.getElementById('editFilesvnm').value   = '';
    document.getElementById('editFilepath').value   = '';
    document.getElementById('editFileDeleted').value = '0';
    document.getElementById('editFilePreview').style.display = 'none';
    document.getElementById('editFileInput').value  = '';

    // 기존 파일 표시
    const existingDiv = document.getElementById('editFileExisting');
    if (item.filesvnm && item.filesvnm.trim()) {
      document.getElementById('editFileExistingName').textContent = item.filesvnm;
      existingDiv.style.display = 'flex';
    } else {
      existingDiv.style.display = 'none';
    }

    // 파일 input 이벤트 등록 (중복 방지)
    const fileInput = document.getElementById('editFileInput');
    fileInput.onchange = function () {
      if (this.files[0]) handleEditFileSelect(this.files[0]);
    };

    openPopup('editPopup');
  }

  function removeExistingFile() {
    document.getElementById('editFileExisting').style.display = 'none';
    document.getElementById('editFileDeleted').value = '1';
    document.getElementById('editFilesvnm').value = '';
    document.getElementById('editFilepath').value  = '';
  }

  function removeNewFile() {
    document.getElementById('editFileInput').value = '';
    document.getElementById('editFilesvnm').value  = '';
    document.getElementById('editFilepath').value   = '';
    document.getElementById('editFilePreview').style.display = 'none';
  }

  function handleEditFileSelect(file) {
    const preview  = document.getElementById('editFilePreview');
    const nameEl   = document.getElementById('editFileNameDisplay');
    const statusEl = document.getElementById('editFileStatus');

    nameEl.textContent   = file.name;
    statusEl.textContent = '업로드 중...';
    statusEl.style.color = '#f0a500';
    preview.style.display = 'flex';

    document.getElementById('editFilesvnm').value = '';
    document.getElementById('editFilepath').value  = '';

    const csrfToken = document.querySelector('input[name="_csrf"]').value;
    const formData  = new FormData();
    formData.append('file', file);

    fetch(ctx + 'api/daily_report/upload_file', {
      method: 'POST',
      headers: { 'X-CSRF-TOKEN': csrfToken },
      body: formData
    })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.success && result.data) {
        document.getElementById('editFilesvnm').value = result.data.filesvnm;
        document.getElementById('editFilepath').value  = result.data.filepath;
        // 새 파일 업로드 시 기존 파일 삭제 표시
        document.getElementById('editFileDeleted').value = '1';
        document.getElementById('editFileExisting').style.display = 'none';
        statusEl.textContent = '✓ 업로드 완료';
        statusEl.style.color = '#2a9d2a';
      } else {
        statusEl.textContent = '✗ 업로드 실패';
        statusEl.style.color = '#cc3333';
        Alert.alert('', result.message || '파일 업로드에 실패하였습니다.');
      }
    })
    .catch(function() {
      statusEl.textContent = '✗ 업로드 실패';
      statusEl.style.color = '#cc3333';
      Alert.alert('', '파일 업로드 중 오류가 발생하였습니다.');
    });
  }

  function saveEdit() {
    if (!_selectedItem) return;

    const statusEl = document.getElementById('editFileStatus');
    if (statusEl && statusEl.textContent === '업로드 중...') {
      Alert.alert('', '파일 업로드가 완료될 때까지 기다려주세요.');
      return;
    }

    const frtime = document.getElementById('editFrtime').value.replace(':', '');
    const totime = document.getElementById('editTotime').value.replace(':', '');
    AjaxUtil.postAsyncData('/api/daily_report/update_status', {
      rptdate     : _selectedItem.rptdate,
      perid       : _selectedItem.perid,
      rptnum      : _selectedItem.rptnum,
      spjangcd    : _spjangcd,
      actcd       : document.getElementById('editActcd').value,
      actnm       : document.getElementById('editActnm').value,
      equpcd      : document.getElementById('editEqupcd').value,
      wkcd        : document.getElementById('editWkcd').value,
      frtime      : frtime,
      totime      : totime,
      remark      : document.getElementById('editRemark').value,
      filesvnm    : document.getElementById('editFilesvnm').value,
      filepath    : document.getElementById('editFilepath').value,
      fileDeleted : document.getElementById('editFileDeleted').value,
    }, function (result) {
      if (result && result.success) {
        Alert.alert('', '수정되었습니다.', function () {
          closePopup('editPopup');
          closePopup('detailPopup');
          searchList();
        });
      } else {
        Alert.alert('', result.message || '수정 중 오류가 발생하였습니다.');
      }
    });
  }

  function openPopup(id)  { document.getElementById(id).classList.add('active');    }
  function closePopup(id) { document.getElementById(id).classList.remove('active'); }
  document.getElementById('detailPopup').addEventListener('click', function (e) {
    if (e.target === this) closePopup('detailPopup');
  });
  document.getElementById('editPopup').addEventListener('click', function (e) {
    if (e.target === this) closePopup('editPopup');
  });
  function buildDetailRows(rows) {
    return rows.map(function (r) {
      if (r.value == null || r.value === '') return '';
      return `<div class="detail-row"><span class="detail-label">${r.label}</span><span class="detail-value">${esc(String(r.value))}</span></div>`;
    }).join('');
  }
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
