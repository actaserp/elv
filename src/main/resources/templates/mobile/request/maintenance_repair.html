<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }

    .card-list { padding: 8px 12px 100px; }

    .comp-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.10);
        margin-bottom: 10px;
        padding: 14px 16px;
        cursor: pointer;
    }
    .comp-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.18); }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
    }
    .card-actnm {
        font-size: 15px;
        font-weight: 700;
        color: #222;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .card-badge-green {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 20px;
        background: #e6f4ea;
        color: #1a7a3a;
        margin-left: 8px;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .card-row {
        display: flex;
        font-size: 13px;
        color: #555;
        margin-top: 3px;
        gap: 4px;
    }
    .card-label { color: #999; min-width: 55px; flex-shrink: 0; }
    .card-value { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .result-count { padding: 4px 14px; font-size: 12px; color: #888; }
    .empty-msg { text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }

    /* ── 플로팅 버튼 ── */
    .fab-btn { display: none; }

    /* ── 등록 폼 직접 노출 ── */
    .reg-wrap { padding: 16px 16px 100px; }

    /* ── 바텀시트 팝업 공통 ── */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 9000;
        justify-content: center;
        align-items: flex-end;
    }
    .popup-overlay.active { display: flex; }

    .popup-sheet {
        background: #fff;
        width: 100%;
        max-height: 80vh;
        border-radius: 16px 16px 0 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .popup-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #eee;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .popup-close {
        width: 0;
        background: none; border: none;
        font-size: 24px; cursor: pointer;
        color: #666; line-height: 1;
        flex-shrink: 0;
        margin-left: 12px;
    }
    .popup-body { overflow-y: auto; flex: 1; padding: 16px 20px 30px; }

    /* ── 상세 팝업 ── */
    .detail-section-title {
        font-size: 13px; font-weight: 700; color: #444;
        margin: 14px 0 6px; padding-bottom: 4px;
        border-bottom: 2px solid #dce6f1;
    }
    .detail-row {
        display: flex; padding: 9px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 14px; gap: 12px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #999; min-width: 80px; flex-shrink: 0; font-size: 13px; }
    .detail-value { color: #222; flex: 1; word-break: break-all; }

    /* ── 등록 폼 ── */
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 600; }
    .form-row input[type="text"],
    .form-row input[type="date"],
    .form-row input[type="time"],
    .form-row textarea {
        width: 100%; padding: 8px 10px;
        border: 1px solid #ddd; border-radius: 6px;
        font-size: 14px; box-sizing: border-box;
    }
    .form-row input[readonly] { background: #f5f5f5; color: #333; cursor: pointer; caret-color: transparent; }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .form-row .row-2col { display: flex; gap: 8px; }
    .form-row .row-2col > * { flex: 1; }
    .form-save-btn {
        width: 100%; padding: 12px; background: #333;
        color: #fff; border: none; border-radius: 8px;
        font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    .form-save-btn:active { background: #111; }

    /* ── 현장/호기 선택 팝업 ── */
    .popup-list { overflow-y: auto; flex: 1; }
    .popup-list ul { list-style: none; margin: 0; padding: 0; }
    .popup-list ul li {
        padding: 14px 20px; border-bottom: 1px solid #f0f0f0;
        cursor: pointer; font-size: 14px;
    }
    .popup-list ul li:active { background: #f5f5f5; }
    .popup-list .item-code { font-size: 12px; color: #999; margin-right: 6px; }
    .popup-search-input {
        width: 100%; padding: 10px 14px;
        border: none; border-bottom: 1px solid #eee;
        font-size: 14px; box-sizing: border-box;
        outline: none; flex-shrink: 0;
    }

    /* ── 고장접수 선택 버튼 ── */
    .repair-select-btn {
        width: 100%; padding: 12px; margin-bottom: 16px;
        background: #4472c4; color: #fff;
        border: none; border-radius: 8px;
        font-size: 15px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .repair-select-btn:active { background: #3461b3; }

    /* ── 선택된 고장접수 표시 ── */
    .selected-repair-card {
        background: #f0f4ff;
        border: 1.5px solid #4472c4;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 16px;
        font-size: 13px;
    }
    .selected-repair-card .repair-card-title {
        font-size: 14px; font-weight: 700; color: #333; margin-bottom: 6px;
    }
    .selected-repair-card .repair-card-row {
        display: flex; gap: 8px; color: #555; margin-top: 3px;
    }
    .selected-repair-card .repair-card-label { color: #999; min-width: 60px; }

    /* ── 고장접수 팝업 리스트 아이템 ── */
    .repair-list-item {
        padding: 14px 20px; border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
    }
    .repair-list-item:active { background: #f5f5f5; }
    .repair-list-item .item-top {
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 4px;
    }
    .repair-list-item .item-date { font-size: 12px; color: #999; }
    .repair-list-item .item-status {
        font-size: 11px; padding: 1px 7px; border-radius: 10px;
        background: #fff3e0; color: #e65100;
    }
    .repair-list-item .item-status.done {
        background: #e8f5e9; color: #2e7d32;
    }
    .repair-list-item .item-actnm { font-size: 14px; font-weight: 600; color: #222; margin-bottom: 2px; }
    .repair-list-item .item-contents { font-size: 13px; color: #666; }
</style>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">

    <!-- 헤더 -->
    <div class="mobile-layout-header">
        <header>
            <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
            <div class="left" style="margin-left:35px; font-size:25px;"><h2>고장처리등록</h2></div>
            <div class="right">
                <a href="#" title="전체메뉴" class="btn-menu">
                    <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
                </a>
            </div>
        </header>
    </div>

    <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

    <!-- 등록 폼 (바로 노출) -->
    <div class="mobile-layout-contents" style="display:block;">
        <div class="layout-contents">
            <div class="reg-wrap">

                <!-- hidden: 고장접수 연결 정보 -->
                <input type="hidden" id="regRecedate">
                <input type="hidden" id="regRecenum">

                <!-- ── 고장접수 선택 버튼 ── -->
                <button class="repair-select-btn" type="button" onclick="openRepairPopup()">
                    📋 고장접수 선택
                </button>

                <!-- ── 선택된 고장접수 표시 영역 (선택 전 숨김) ── -->
                <div class="selected-repair-card" id="selectedRepairCard" style="display:none;">
                    <div class="repair-card-title" id="selectedActnm"></div>
                    <div class="repair-card-row">
                        <span class="repair-card-label">접수일자</span>
                        <span id="selectedRecedate"></span>
                    </div>
                    <div class="repair-card-row">
                        <span class="repair-card-label">고장내용</span>
                        <span id="selectedContents"></span>
                    </div>
                    <div class="repair-card-row">
                        <span class="repair-card-label">호기명</span>
                        <span id="selectedEqupnm"></span>
                    </div>
                </div>

                <!-- 기존 폼 필드들 -->
                <input type="hidden" id="regActcd">
                <input type="hidden" id="regEqupcd">

                <div class="form-row">
                    <label>현장명</label>
                    <input type="text" id="regActnm" placeholder="현장 선택" readonly onclick="openActPopupIfFree()">
                </div>
                <div class="form-row">
                    <label>호기명</label>
                    <input type="text" id="regEqupnm" placeholder="호기 선택 (현장 먼저)" readonly onclick="openEqupPopupIfFree()">
                </div>
                <div class="form-row">
                    <label>접수일자 / 접수시간</label>
                    <div class="row-2col">
                        <input type="date" id="regRecedate2" readonly style="background:#f5f5f5; color:#666;">
                        <input type="time" id="regRecetime" readonly style="background:#f5f5f5; color:#666;">
                    </div>
                </div>
                <div class="form-row">
                    <label>도착일자 / 도착시간</label>
                    <div class="row-2col">
                        <input type="date" id="regArrivdate">
                        <input type="text" id="regArrivtime" inputmode="numeric" maxlength="5"
                               placeholder="HH:mm" oninput="formatTimeInput(this)">
                    </div>
                </div>
                <div class="form-row">
                    <label>완료일자 / 완료시간</label>
                    <div class="row-2col">
                        <input type="date" id="regCompdate">
                        <input type="text" id="regComptime" inputmode="numeric" maxlength="5"
                               placeholder="HH:mm" oninput="formatTimeInput(this)">
                    </div>
                </div>
                <div class="form-row">
                    <label>고장내용</label>
                    <input type="text" id="regContnm" placeholder="고장접수 선택 시 자동입력" readonly style="background:#f5f5f5; color:#666;">
                </div>
                <div class="form-row">
                    <label>고장상세내용</label>
                    <input type="text" id="regContents" placeholder="고장접수 선택 시 자동입력" readonly style="background:#f5f5f5; color:#666;">
                </div>
                <div class="form-row">
                    <label>고장부위</label>
                    <input type="text" id="regContremark" placeholder="고장부위 선택" readonly onclick="openGreginmPopup()">
                    <input type="hidden" id="regGregicd">
                </div>
                <div class="form-row">
                    <label>고장부위상세</label>
                    <input type="text" id="regReginm" placeholder="고장부위 먼저 선택" readonly onclick="openReginmPopup()">
                    <input type="hidden" id="regRegicd">
                </div>
                <div class="form-row" style="display:none;">
                    <label>고장요인</label>
                    <input type="text" id="regRemonm" placeholder="고장요인 선택" readonly onclick="openRemonmPopup()">
                    <input type="hidden" id="regRemocd">
                </div>
                <div class="form-row">
                    <label>고장원인</label>
                    <input type="text" id="regFacnm" placeholder="고장원인 선택" readonly onclick="openFacnmPopup()">
                    <input type="hidden" id="regFaccd">
                </div>
                <div class="form-row">
                    <label>고장원인상세</label>
                    <textarea id="regRemoremark" placeholder="고장원인상세 입력"></textarea>
                </div>
                <div class="form-row">
                    <label>처리내용</label>
                    <input type="text" id="regResunm" placeholder="처리내용 선택" readonly onclick="openResunmPopup()">
                    <input type="hidden" id="regResucd">
                </div>
                <div class="form-row">
                    <label>처리상세</label>
                    <textarea id="regResuremark" placeholder="처리상세 입력"></textarea>
                </div>
                <div class="form-row">
                    <label>처리결과</label>
                    <input type="text" id="regResultnm" placeholder="처리결과 선택" readonly onclick="openResultnmPopup()">
                    <input type="hidden" id="regResultcd">
                </div>
                <div class="form-row">
                    <label>사후관리사항</label>
                    <textarea id="regCustomer" placeholder="사후관리사항 입력"></textarea>
                </div>

                <div class="form-row">
                    <label>파일 첨부</label>
                    <div class="file-upload-wrap">
                        <input type="file" id="regFileInput" style="display:none"
                               accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
                        <input type="hidden" id="regFilesvnm">
                        <input type="hidden" id="regFilepath">
                        <div class="file-upload-btn" onclick="document.getElementById('regFileInput').click()"
                             style="border:2px dashed #ddd; border-radius:8px; padding:12px; text-align:center; cursor:pointer; background:#fafafa; font-size:13px; color:#888;">
                            📎 클릭하여 파일 선택
                        </div>
                        <div id="regFilePreview" style="display:none; margin-top:8px; padding:8px 12px; background:#f5f5f5; border-radius:6px; font-size:13px; color:#444; display:flex; align-items:center; justify-content:space-between;">
                            <span id="regFileNameDisplay" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
                            <span id="regFileStatus" style="font-size:12px; white-space:nowrap; margin-left:8px;"></span>
                            <button onclick="removeRepairFile()" style="background:none; border:none; font-size:18px; color:#aaa; cursor:pointer;">×</button>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <label>처리자</label>
                    <input type="text" id="regProcessorNm" placeholder="처리자 선택" readonly onclick="openProcessorPopup()">
                    <input type="hidden" id="regProcessorId">
                </div>

                <button class="form-save-btn" onclick="saveComp()">등록</button>
            </div>
        </div>
    </div>
</div>

<!-- ── 고장접수 선택 팝업 ── -->
<div class="popup-overlay" id="repairPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>고장접수 선택</span>
            <button class="popup-close" onclick="closePopup('repairPopup')">×</button>
        </div>
        <!-- 검색 조건 -->
        <div style="padding:12px 16px; border-bottom:1px solid #eee; display:flex; gap:8px; align-items:center; flex-shrink:0;">
            <input type="date" id="repairFromDate" style="flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-size:13px;">
            <span style="color:#999; font-size:12px;">~</span>
            <input type="date" id="repairToDate" style="flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-size:13px;">
            <button type="button" onclick="searchRepairList()" style="padding:6px 12px; background:#4472c4; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer;">조회</button>
        </div>
        <input type="text" class="popup-search-input" id="repairActnmSearch"
               placeholder="현장명 검색" oninput="filterRepairList(this.value)">
        <div class="popup-list" id="repairList">
            <div style="padding:40px 20px; text-align:center; color:#bbb; font-size:13px;">조회 버튼을 눌러주세요.</div>
        </div>
    </div>
</div>

<!-- 현장 선택 팝업 -->
<div class="popup-overlay" id="actPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>현장 선택</span>
            <button class="popup-close" onclick="closePopup('actPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="actSearchInput"
               placeholder="현장명 검색" oninput="filterActList(this.value)">
        <div class="popup-list"><ul id="actList"></ul></div>
    </div>
</div>

<!-- 호기 선택 팝업 -->
<div class="popup-overlay" id="equpPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>호기 선택</span>
            <button class="popup-close" onclick="closePopup('equpPopup')">×</button>
        </div>
        <div class="popup-list"><ul id="equpList"></ul></div>
    </div>
</div>

<!-- 고장부위 팝업 -->
<div class="popup-overlay" id="greginmPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>고장부위 선택</span><button class="popup-close" onclick="closePopup('greginmPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="greginmKeyword" placeholder="고장부위 검색" oninput="filterCodePopup('greginmList', this.value, 'greginm')">
        <div class="popup-list"><ul id="greginmList"></ul></div>
    </div>
</div>

<!-- 고장부위상세 팝업 -->
<div class="popup-overlay" id="reginmPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>고장부위상세 선택</span><button class="popup-close" onclick="closePopup('reginmPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="reginmKeyword" placeholder="고장부위상세 검색" oninput="filterCodePopup('reginmList', this.value, 'reginm')">
        <div class="popup-list"><ul id="reginmList"></ul></div>
    </div>
</div>

<!-- 고장요인 팝업 -->
<div class="popup-overlay" id="remonmPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>고장요인 선택</span><button class="popup-close" onclick="closePopup('remonmPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="remonmKeyword" placeholder="고장요인 검색" oninput="filterCodePopup('remonmList', this.value, 'remonm')">
        <div class="popup-list"><ul id="remonmList"></ul></div>
    </div>
</div>

<!-- 고장원인 팝업 -->
<div class="popup-overlay" id="facnmPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>고장원인 선택</span><button class="popup-close" onclick="closePopup('facnmPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="facnmKeyword" placeholder="고장원인 검색" oninput="filterCodePopup('facnmList', this.value, 'facnm')">
        <div class="popup-list"><ul id="facnmList"></ul></div>
    </div>
</div>

<!-- 처리내용 팝업 -->
<div class="popup-overlay" id="resunmPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>처리내용 선택</span><button class="popup-close" onclick="closePopup('resunmPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="resunmKeyword" placeholder="처리내용 검색" oninput="filterCodePopup('resunmList', this.value, 'resunm')">
        <div class="popup-list"><ul id="resunmList"></ul></div>
    </div>
</div>

<!-- 처리결과 팝업 -->
<div class="popup-overlay" id="resultnmPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>처리결과 선택</span><button class="popup-close" onclick="closePopup('resultnmPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="resultnmKeyword" placeholder="처리결과 검색" oninput="filterCodePopup('resultnmList', this.value, 'resultnm')">
        <div class="popup-list"><ul id="resultnmList"></ul></div>
    </div>
</div>

<!-- 처리자 팝업 -->
<div class="popup-overlay" id="processorPopup">
    <div class="popup-sheet">
        <div class="popup-header"><span>처리자 선택</span><button class="popup-close" onclick="closePopup('processorPopup')">×</button></div>
        <input type="text" class="popup-search-input" id="processorKeyword" placeholder="이름 검색" oninput="filterProcessorList(this.value)">
        <div class="popup-list"><ul id="processorList"></ul></div>
    </div>
</div>

<script type="text/javascript">

    var _actListCache  = [];
    var _repairListCache = [];
    var _spjangcd      = sessionStorage.getItem('spjangcd') || '';

    /* ── 초기화 ── */
    $(document).ready(function () {
        const now   = new Date();
        const yyyy  = now.getFullYear();
        const mm    = String(now.getMonth() + 1).padStart(2, '0');
        const dd    = String(now.getDate()).padStart(2, '0');
        const hh    = String(now.getHours()).padStart(2, '0');
        const mi    = String(now.getMinutes()).padStart(2, '0');
        const today = `${yyyy}-${mm}-${dd}`;
        const time  = `${hh}:${mi}`;

        document.getElementById('regCompdate').value   = today;
        document.getElementById('regRecedate2').value  = today;
        document.getElementById('regRecetime').value   = time;
        document.getElementById('regArrivdate').value  = today;
        document.getElementById('regArrivtime').value  = time;
        document.getElementById('regComptime').value   = time;

        // 고장접수 팝업 날짜 기본값 (당월 1일 ~ 오늘)
        const firstDay = `${yyyy}-${mm}-01`;
        document.getElementById('repairFromDate').value = firstDay;
        document.getElementById('repairToDate').value   = today;
    });

    /* ── 고장접수 선택 팝업 ── */
    function openRepairPopup() {
        document.getElementById('repairActnmSearch').value = '';
        _repairListCache = [];
        renderRepairList([]);
        openPopup('repairPopup');
    }

    function searchRepairList() {
        const fromDate = document.getElementById('repairFromDate').value.replaceAll('-', '');
        const toDate   = document.getElementById('repairToDate').value.replaceAll('-', '');
        const actnm    = document.getElementById('repairActnmSearch').value.trim();

        AjaxUtil.getAsyncData('/api/maintenance_repair/read_repair_list', {
            fromDate : fromDate,
            toDate   : toDate,
            actnm    : actnm,
            spjangcd : _spjangcd
        }, function (result) {
            if (result && result.data) {
                _repairListCache = result.data;
                renderRepairList(_repairListCache);
            } else {
                renderRepairList([]);
            }
        });
    }

    function renderRepairList(list) {
        const container = document.getElementById('repairList');
        container.innerHTML = '';

        if (!list || list.length === 0) {
            container.innerHTML = '<div style="padding:40px 20px; text-align:center; color:#bbb; font-size:13px;">조회된 고장접수가 없습니다.</div>';
            return;
        }

        list.forEach(function (item) {
            const div = document.createElement('div');
            div.className = 'repair-list-item';

            const statusText  = item.resultck ? '처리완료' : '미처리';
            const statusClass = item.resultck ? 'done' : '';
            const dateStr     = formatDate(item.recedate) + (item.recetime ? ' ' + formatTime(item.recetime) : '');

            div.innerHTML = `
                <div class="item-top">
                    <span class="item-date">${esc(dateStr)}</span>
                    <span class="item-status ${statusClass}">${statusText}</span>
                </div>
                <div class="item-actnm">${esc(item.actnm || '-')}</div>
                <div class="item-contents">${esc(item.equpnm || '')} ${item.contents ? '· ' + esc(item.contents) : ''}</div>
            `;

            div.addEventListener('click', function () {
                setRepairData(item);
                closePopup('repairPopup');
            });

            container.appendChild(div);
        });
    }

    function filterRepairList(keyword) {
        const filtered = _repairListCache.filter(function (item) {
            return (item.actnm || '').includes(keyword);
        });
        renderRepairList(filtered);
    }

    /* ── 고장접수 선택 후 폼 바인딩 ── */
    function setRepairData(item) {
        // hidden 값 저장
        document.getElementById('regRecedate').value  = item.recedate || '';
        document.getElementById('regRecenum').value   = item.recenum  || '';

        // 고장내용/고장상세내용 바인딩
        document.getElementById('regContnm').value   = item.contnm   || '';
        document.getElementById('regContents').value = item.contents || '';

        // 현장/호기 바인딩 (readonly 스타일 적용)
        document.getElementById('regActcd').value  = item.actcd  || '';
        document.getElementById('regEqupcd').value = item.equpcd || '';
        setFieldReadonly('regActnm',  item.actnm  || '');
        setFieldReadonly('regEqupnm', item.equpnm || '');

        // 접수일자/시간 바인딩
        document.getElementById('regRecedate2').value = item.recedate ? formatDateInput(item.recedate) : '';
        document.getElementById('regRecetime').value  = item.recetime ? formatTime(item.recetime) : '';

        // 선택된 고장접수 카드 표시
        document.getElementById('selectedActnm').textContent    = item.actnm    || '-';
        document.getElementById('selectedRecedate').textContent = formatDate(item.recedate) + (item.recetime ? ' ' + formatTime(item.recetime) : '');
        document.getElementById('selectedContents').textContent = item.contents || '';
        document.getElementById('selectedEqupnm').textContent   = item.equpnm  || '';
        document.getElementById('selectedRepairCard').style.display = 'block';
    }

    // 고장접수에서 불러온 필드 readonly 스타일 적용
    function setFieldReadonly(id, value) {
        const el = document.getElementById(id);
        el.value = value;
        el.style.background = '#f0f0f0';
        el.style.color = '#888';
        el.setAttribute('data-from-repair', '1');
    }

    // 고장접수에서 불러온 경우 팝업 차단
    function openActPopupIfFree() {
        if (document.getElementById('regActnm').getAttribute('data-from-repair') === '1') return;
        openActPopup();
    }

    function openEqupPopupIfFree() {
        if (document.getElementById('regEqupnm').getAttribute('data-from-repair') === '1') return;
        openEqupPopup();
    }

    /* ── 현장 선택 팝업 ── */
    function openActPopup() {
        document.getElementById('actSearchInput').value = '';
        if (_actListCache.length > 0) {
            renderActList(_actListCache);
            openPopup('actPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/maintenance_repair/read_site', {
            keyword: '', spjangcd: _spjangcd
        }, function (result) {
            if (result && result.data) {
                _actListCache = result.data;
                renderActList(_actListCache);
                openPopup('actPopup');
            }
        });
    }

    function renderActList(list) {
        const ul = document.getElementById('actList');
        ul.innerHTML = '';
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.actcd || '')}</span>${esc(item.actnm || '')}`;
            li.onclick = function () { setActData(item); };
            ul.appendChild(li);
        });
    }

    function filterActList(keyword) {
        renderActList(_actListCache.filter(function (item) {
            return (item.actnm || '').includes(keyword);
        }));
    }

    function setActData(item) {
        document.getElementById('regActcd').value  = item.actcd || '';
        document.getElementById('regActnm').value  = item.actnm || '';
        document.getElementById('regEqupcd').value = '';
        document.getElementById('regEqupnm').value = '';
        closePopup('actPopup');
    }

    /* ── 호기 선택 팝업 ── */
    function openEqupPopup() {
        const actcd = document.getElementById('regActcd').value;
        if (!actcd) { Alert.alert('', '현장을 먼저 선택해주세요.'); return; }
        AjaxUtil.getAsyncData('/api/maintenance_repair/read_equp', {
            actcd: actcd, spjangcd: _spjangcd
        }, function (result) {
            const ul = document.getElementById('equpList');
            ul.innerHTML = '';
            if (result && result.data && result.data.length > 0) {
                result.data.forEach(function (item) {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="item-code">${esc(item.equpcd || '')}</span>${esc(item.equpnm || '')}`;
                    li.onclick = function () { setEqupData(item); };
                    ul.appendChild(li);
                });
            } else {
                ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 호기가 없습니다.</li>';
            }
            openPopup('equpPopup');
        });
    }

    function setEqupData(item) {
        document.getElementById('regEqupcd').value = item.equpcd || '';
        document.getElementById('regEqupnm').value = item.equpnm || '';
        closePopup('equpPopup');
    }

    /* ── 처리자 선택 팝업 ── */
    var _processorCache = [];

    function openProcessorPopup() {
        document.getElementById('processorKeyword').value = '';
        if (_processorCache.length > 0) {
            renderProcessorList(_processorCache);
            openPopup('processorPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/system/user/getPerson', { searchCode: '', searchName: '' }, function (result) {
            if (result && result.data) {
                _processorCache = result.data;
                renderProcessorList(_processorCache);
                openPopup('processorPopup');
            }
        });
    }

    function renderProcessorList(list) {
        const ul = document.getElementById('processorList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 사원이 없습니다.</li>';
            return;
        }
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.code || '')}</span>${esc(item.name || '')}`;
            li.onclick = function () {
                document.getElementById('regProcessorId').value = item.code || '';
                document.getElementById('regProcessorNm').value = item.name || '';
                closePopup('processorPopup');
            };
            ul.appendChild(li);
        });
    }

    function filterProcessorList(keyword) {
        renderProcessorList(_processorCache.filter(function (item) {
            return (item.name || '').includes(keyword);
        }));
    }

    /* ── 코드 팝업 공통 ── */
    var _codeCache = {};

    function openCodePopup(popupId, apiUrl, listId, codeKey, nameKey, keywordId, onSelect) {
        document.getElementById(keywordId).value = '';
        if (_codeCache[popupId]) {
            renderCodeList(listId, _codeCache[popupId], nameKey, onSelect);
            openPopup(popupId);
            return;
        }
        AjaxUtil.getAsyncData(apiUrl, {}, function (result) {
            if (result && result.data) {
                _codeCache[popupId] = result.data;
                renderCodeList(listId, result.data, nameKey, onSelect);
                openPopup(popupId);
            }
        });
    }

    function renderCodeList(listId, data, nameKey, onSelect) {
        const ul = document.getElementById(listId);
        ul.innerHTML = '';
        if (!data || data.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 데이터가 없습니다.</li>';
            return;
        }
        data.forEach(function (item) {
            const li = document.createElement('li');
            li.textContent = item[nameKey] || '';
            li.onclick = function () { onSelect(item); };
            ul.appendChild(li);
        });
    }

    function filterCodePopup(listId, keyword, nameKey) {
        const ul = document.getElementById(listId);
        Array.from(ul.querySelectorAll('li')).forEach(function (li) {
            li.style.display = (li.textContent || '').includes(keyword) ? '' : 'none';
        });
    }

    // ── 파일 처리 ─────────────────────────────────────────────
    document.getElementById('regFileInput').addEventListener('change', function () {
        const file = this.files[0];
        if (file) handleRepairFileSelect(file);
    });

    function handleRepairFileSelect(file) {
        const preview  = document.getElementById('regFilePreview');
        const nameEl   = document.getElementById('regFileNameDisplay');
        const statusEl = document.getElementById('regFileStatus');

        nameEl.textContent   = file.name;
        statusEl.textContent = '업로드 중...';
        statusEl.style.color = '#f0a500';
        preview.style.display = 'flex';

        document.getElementById('regFilesvnm').value = '';
        document.getElementById('regFilepath').value  = '';

        const csrfToken = document.querySelector('input[name="_csrf"]').value;
        const formData  = new FormData();
        formData.append('file', file);

        fetch(withCtx('api/daily_report/upload_file'), {
            method: 'POST',
            headers: { 'X-CSRF-TOKEN': csrfToken },
            body: formData
        })
        .then(res => res.json())
        .then(result => {
            if (result.success && result.data) {
                document.getElementById('regFilesvnm').value = result.data.filesvnm;
                document.getElementById('regFilepath').value  = result.data.filepath;
                statusEl.textContent = '✓ 업로드 완료';
                statusEl.style.color = '#2a9d2a';
            } else {
                statusEl.textContent = '✗ 업로드 실패';
                statusEl.style.color = '#cc3333';
                Alert.alert('', result.message || '파일 업로드에 실패하였습니다.');
            }
        })
        .catch(() => {
            statusEl.textContent = '✗ 업로드 실패';
            statusEl.style.color = '#cc3333';
            Alert.alert('', '파일 업로드 중 오류가 발생하였습니다.');
        });
    }

    function removeRepairFile() {
        document.getElementById('regFileInput').value    = '';
        document.getElementById('regFilesvnm').value     = '';
        document.getElementById('regFilepath').value      = '';
        document.getElementById('regFilePreview').style.display = 'none';
    }
    function openGreginmPopup() {
        openCodePopup('greginmPopup', '/api/maintenance_repair/read_greginm', 'greginmList', 'gregicd', 'greginm', 'greginmKeyword', function (item) {
            document.getElementById('regGregicd').value    = item.gregicd || '';
            document.getElementById('regContremark').value = item.greginm || '';
            document.getElementById('regRegicd').value    = '';
            document.getElementById('regReginm').value    = '';
            delete _codeCache['reginmPopup'];
            closePopup('greginmPopup');
        });
    }

    /* ── 고장부위상세 팝업 ── */
    function openReginmPopup() {
        const gregicd = document.getElementById('regGregicd').value;
        if (!gregicd) { Alert.alert('', '고장부위를 먼저 선택해주세요.'); return; }
        document.getElementById('reginmKeyword').value = '';
        AjaxUtil.getAsyncData('/api/maintenance_repair/read_reginm', { gregicd: gregicd }, function (result) {
            if (result && result.data) {
                _codeCache['reginmPopup'] = result.data;
                renderCodeList('reginmList', result.data, 'reginm', function (item) {
                    document.getElementById('regRegicd').value = item.regicd || '';
                    document.getElementById('regReginm').value = item.reginm || '';
                    closePopup('reginmPopup');
                });
                openPopup('reginmPopup');
            }
        });
    }

    /* ── 고장요인 팝업 ── */
    function openRemonmPopup() {
        openCodePopup('remonmPopup', '/api/maintenance_repair/read_remonm', 'remonmList', 'remocd', 'remonm', 'remonmKeyword', function (item) {
            document.getElementById('regRemocd').value  = item.remocd || '';
            document.getElementById('regRemonm').value  = item.remonm || '';
            closePopup('remonmPopup');
        });
    }

    /* ── 고장원인 팝업 ── */
    function openFacnmPopup() {
        openCodePopup('facnmPopup', '/api/maintenance_repair/read_facnm', 'facnmList', 'faccd', 'facnm', 'facnmKeyword', function (item) {
            document.getElementById('regFaccd').value  = item.faccd || '';
            document.getElementById('regFacnm').value  = item.facnm || '';
            closePopup('facnmPopup');
        });
    }

    /* ── 처리내용 팝업 ── */
    function openResunmPopup() {
        openCodePopup('resunmPopup', '/api/maintenance_repair/read_resunm', 'resunmList', 'resucd', 'resunm', 'resunmKeyword', function (item) {
            document.getElementById('regResucd').value  = item.resucd || '';
            document.getElementById('regResunm').value  = item.resunm || '';
            closePopup('resunmPopup');
        });
    }

    /* ── 처리결과 팝업 ── */
    function openResultnmPopup() {
        openCodePopup('resultnmPopup', '/api/maintenance_repair/read_resultnm', 'resultnmList', 'resultcd', 'resultnm', 'resultnmKeyword', function (item) {
            document.getElementById('regResultcd').value  = item.resultcd || '';
            document.getElementById('regResultnm').value  = item.resultnm || '';
            closePopup('resultnmPopup');
        });
    }

    /* ── 등록 ── */
    function saveComp() {
        const compdate   = document.getElementById('regCompdate').value;
        const actcd      = document.getElementById('regActcd').value;
        const recedate   = document.getElementById('regRecedate').value;
        const processorId = document.getElementById('regProcessorId').value;

        if (!recedate)    { Alert.alert('', '고장접수를 선택해주세요.');   return; }
        if (!compdate)    { Alert.alert('', '완료일자를 입력해주세요.');   return; }
        if (!actcd)       { Alert.alert('', '현장을 선택해주세요.');       return; }
        if (!processorId) { Alert.alert('', '처리자를 선택해주세요.');     return; }

        const data = {
            spjangcd   : _spjangcd,
            compdate   : compdate.replaceAll('-', ''),
            comptime   : document.getElementById('regComptime').value.replaceAll(':', ''),
            recedate   : document.getElementById('regRecedate2').value.replaceAll('-', ''),
            recenum    : document.getElementById('regRecenum').value,
            recetime   : document.getElementById('regRecetime').value.replaceAll(':', ''),
            arrivdate  : document.getElementById('regArrivdate').value.replaceAll('-', ''),
            arrivtime  : document.getElementById('regArrivtime').value.replaceAll(':', ''),
            actcd      : actcd,
            actnm      : document.getElementById('regActnm').value,
            equpcd     : document.getElementById('regEqupcd').value,
            equpnm     : document.getElementById('regEqupnm').value,
            contremark : document.getElementById('regContremark').value,  // 고장부위명
            gregicd    : document.getElementById('regGregicd').value,      // 고장부위코드
            regicd     : document.getElementById('regRegicd').value,       // 고장부위상세코드
            remocd     : document.getElementById('regRemocd').value,       // 고장요인코드
            faccd      : document.getElementById('regFaccd').value,        // 고장원인코드
            remoremark : document.getElementById('regRemoremark').value,   // 고장원인상세 직접입력
            resucd     : document.getElementById('regResucd').value,       // 처리내용코드
            resuremark : document.getElementById('regResuremark').value,   // 처리상세 직접입력
            resultcd   : document.getElementById('regResultcd').value,     // 처리결과코드
            remark     : document.getElementById('regResultnm').value,     // 처리결과명
            customer   : document.getElementById('regCustomer').value,     // 사후관리사항 직접입력
            actperid   : document.getElementById('regProcessorId').value,
            filesvnm   : document.getElementById('regFilesvnm').value,
            filepath   : document.getElementById('regFilepath').value,
        };

        AjaxUtil.postAsyncData('/api/maintenance_repair/save_comp', data, function (result) {
            if (result && result.success) {
                Alert.alert('', result.message, function () {
                    location.href = window.CTX_PATH + '/mobile/request/maintenance_status';
                });
            } else {
                Alert.alert('', (result && result.message) || '등록 중 오류가 발생하였습니다.');
            }
        });
    }

    /* ── 폼 초기화 ── */
    function resetForm() {
        const now   = new Date();
        const yyyy  = now.getFullYear();
        const mm    = String(now.getMonth() + 1).padStart(2, '0');
        const dd    = String(now.getDate()).padStart(2, '0');
        const hh    = String(now.getHours()).padStart(2, '0');
        const mi    = String(now.getMinutes()).padStart(2, '0');
        const today = `${yyyy}-${mm}-${dd}`;
        const time  = `${hh}:${mi}`;

        document.getElementById('regRecedate').value   = '';
        document.getElementById('regRecenum').value    = '';
        document.getElementById('regCompdate').value   = today;
        document.getElementById('regActcd').value      = '';
        document.getElementById('regActnm').value      = '';
        document.getElementById('regEqupcd').value     = '';
        document.getElementById('regEqupnm').value     = '';
        document.getElementById('regRecedate2').value  = today;
        document.getElementById('regRecetime').value   = time;
        document.getElementById('regArrivdate').value  = today;
        document.getElementById('regArrivtime').value  = time;
        document.getElementById('regComptime').value   = time;
        document.getElementById('regContremark').value = '';
        document.getElementById('regGregicd').value    = '';
        document.getElementById('regReginm').value     = '';
        document.getElementById('regRegicd').value     = '';
        document.getElementById('regRemonm').value     = '';
        document.getElementById('regRemocd').value     = '';
        document.getElementById('regFacnm').value      = '';
        document.getElementById('regFaccd').value      = '';
        document.getElementById('regRemoremark').value = '';
        document.getElementById('regResunm').value     = '';
        document.getElementById('regResucd').value     = '';
        document.getElementById('regResuremark').value = '';
        document.getElementById('regResultnm').value   = '';
        document.getElementById('regResultcd').value   = '';
        document.getElementById('regCustomer').value   = '';
        document.getElementById('selectedRepairCard').style.display = 'none';
        removeRepairFile();

        // 현장/호기 readonly 해제
        ['regActnm', 'regEqupnm'].forEach(function (id) {
            const el = document.getElementById(id);
            el.style.background = '';
            el.style.color = '';
            el.removeAttribute('data-from-repair');
        });
    }

    /* ── 팝업 공통 ── */
    function openPopup(id)  { document.getElementById(id).classList.add('active');    }
    function closePopup(id) { document.getElementById(id).classList.remove('active'); }

    ['actPopup', 'equpPopup', 'repairPopup', 'greginmPopup', 'reginmPopup', 'remonmPopup', 'facnmPopup', 'resunmPopup', 'resultnmPopup', 'processorPopup'].forEach(function (id) {
        document.getElementById(id).addEventListener('click', function (e) {
            if (e.target === this) closePopup(id);
        });
    });

    /* ── 날짜/시간 유틸 ── */
    // yyyyMMdd → yyyy-MM-dd
    function formatDateInput(d) {
        if (!d) return '';
        const s = String(d);
        return `${s.substring(0,4)}-${s.substring(4,6)}-${s.substring(6,8)}`;
    }

    // yyyyMMdd → MM/dd
    function formatDate(d) {
        if (!d) return '';
        const s = String(d);
        return `${s.substring(4,6)}/${s.substring(6,8)}`;
    }

    // HHmm → HH:mm
    function formatTime(t) {
        if (!t) return '';
        const s = String(t).replace(':','').padStart(4,'0');
        return `${s.substring(0,2)}:${s.substring(2,4)}`;
    }

    // 시간 입력 간소화: 숫자만 입력 → 자동 HH:mm (시계 다이얼 대신 키패드)
    function formatTimeInput(el) {
        const e = window.event;
        const deleting = e && e.inputType && e.inputType.indexOf('delete') === 0;
        let d = el.value.replace(/[^0-9]/g, '').slice(0, 4);
        if (d.length === 0)      el.value = '';
        else if (d.length <= 2)  el.value = deleting ? d : d + ':';
        else                     el.value = d.slice(0, 2) + ':' + d.slice(2);
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

</script>
