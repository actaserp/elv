<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear { display: none !important; }
    .btn-close { display: none !important; }

    /* ── 등록 폼 ── */
    .reg-wrap { padding: 16px 16px 100px; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 600; }
    .form-row input[type="text"],
    .form-row input[type="date"],
    .form-row input[type="time"],
    .form-row textarea {
        width: 100%; padding: 8px 10px;
        border: 1px solid #ddd; border-radius: 6px;
        font-size: 14px; box-sizing: border-box;
    }
    .form-row input[readonly] { background: #f5f5f5; color: #666; cursor: pointer; }
    .form-row textarea { resize: vertical; min-height: 80px; }
    .form-row .row-2col { display: flex; gap: 8px; }
    .form-row .row-2col > * { flex: 1; }
    .form-save-btn {
        width: 100%; padding: 14px;
        background: #333; color: #fff;
        border: none; border-radius: 8px;
        font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    .form-save-btn:active { background: #111; }

    /* ── 현장/호기 팝업 ── */
    .popup-overlay {
        display: none; position: fixed; top: 0; left: 0;
        width: 100%; height: 100%; background: rgba(0,0,0,0.4);
        z-index: 9000; justify-content: center; align-items: flex-end;
    }
    .popup-overlay.active { display: flex; }
    .popup-sheet {
        background: #fff; width: 100%; max-height: 70vh;
        border-radius: 16px 16px 0 0; overflow: hidden;
        display: flex; flex-direction: column;
    }
    .popup-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 20px; border-bottom: 1px solid #eee;
        font-weight: 700; font-size: 16px; flex-shrink: 0; white-space: nowrap;
    }
    .popup-header span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .popup-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; line-height: 1; flex-shrink: 0; margin-left: 12px; }
    .popup-list { overflow-y: auto; flex: 1; }
    .popup-list ul { list-style: none; margin: 0; padding: 0; }
    .popup-list ul li { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; }
    .popup-list ul li:active { background: #f5f5f5; }
    .popup-list .item-code { font-size: 12px; color: #999; margin-right: 6px; }
    .popup-search-input {
        width: 100%; padding: 10px 14px; border: none; border-bottom: 1px solid #eee;
        font-size: 14px; box-sizing: border-box; outline: none; flex-shrink: 0;
    }
    .popup-close {
        width: 0;
        background: none; border: none;
        font-size: 24px; cursor: pointer;
        color: #666; line-height: 1;
        flex-shrink: 0;
        margin-left: 12px;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTAS MES</title>
    <meta name="ctx" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
    <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script th:src="@{/assets_mobile/js/ui.js}"></script>
    <script th:inline="javascript">var sandanData = /*[[${session.sandanList}]]*/ [];</script>
    <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script th:src="@{/js/Mobile.js}"></script>
    <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">

    <!-- 헤더 -->
    <div class="mobile-layout-header">
        <header>
            <div class="left"><a href="#" title="전체메뉴" class="logo"></a></div>
            <div class="left" style="margin-left:35px; font-size:25px;"><h2>고장접수등록</h2></div>
            <div class="right">
                <a href="#" title="전체메뉴" class="btn-menu">
                    <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
                </a>
            </div>
        </header>
    </div>

    <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

    <!-- 등록 폼 (바로 노출) -->
    <div class="mobile-layout-contents" style="display:block;">
        <div class="layout-contents">
            <div class="reg-wrap">
                <input type="hidden" id="regActcd">
                <input type="hidden" id="regEqupcd">

                <div class="form-row">
                    <label>접수일자 / 접수시간</label>
                    <div class="row-2col">
                        <input type="date" id="regRecedate" onchange="syncHitchFromRece()">
                        <input type="text" id="regRecetime" inputmode="numeric" maxlength="5"
                               placeholder="HH:mm" oninput="formatTimeInput(this)" onchange="syncHitchFromRece()">
                    </div>
                </div>
                <div class="form-row">
                    <label>고장일자 / 고장시간</label>
                    <div class="row-2col">
                        <input type="date" id="regHitchdate">
                        <input type="text" id="regHitchhour" inputmode="numeric" maxlength="5"
                               placeholder="HH:mm" oninput="formatTimeInput(this)">
                    </div>
                </div>
                <div class="form-row">
                    <label>현장명</label>
                    <input type="text" id="regActnm" placeholder="현장 선택" readonly onclick="openActPopup()">
                </div>
                <div class="form-row">
                    <label>호기명</label>
                    <input type="text" id="regEqupnm" placeholder="호기 선택 (현장 먼저 선택)" readonly onclick="openEqupPopup()">
                </div>
                <div class="form-row">
                    <label>고장내용</label>
                    <input type="hidden" id="regContcd">
                    <input type="text" id="regContents" placeholder="고장내용 선택" readonly onclick="openContnmPopup()">
                </div>
                <div class="form-row">
                    <label>고장상세내용</label>
                    <input type="text" id="regContentsDetail" placeholder="고장상세내용 입력">
                </div>
                <div class="form-row">
                    <label>비고</label>
                    <textarea id="regRemark" placeholder="비고 입력"></textarea>
                </div>
                <div class="form-row">
                    <label>통보(전달)자</label>
                    <input type="text" id="regRepernm" placeholder="통보자 선택" readonly onclick="openPerPopup()">
                    <input type="hidden" id="regPerid">
                </div>
                <div class="form-row">
                    <input type="hidden" id="regBigo">
                </div>
                <button class="form-save-btn" onclick="saveRepair()">등록</button>
            </div>
        </div>
    </div>
</div>

<!-- 현장 선택 팝업 -->
<div class="popup-overlay" id="actPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>현장 선택</span>
            <button class="popup-close" onclick="closePopup('actPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="actSearchInput" placeholder="현장명 검색"
               oninput="filterActList(this.value)">
        <div class="popup-list"><ul id="actList"></ul></div>
    </div>
</div>

<!-- 호기 선택 팝업 -->
<div class="popup-overlay" id="equpPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>호기 선택</span>
            <button class="popup-close" onclick="closePopup('equpPopup')">×</button>
        </div>
        <div class="popup-list"><ul id="equpList"></ul></div>
    </div>
</div>

<!-- 고장내용 선택 팝업 -->
<div class="popup-overlay" id="contnmPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>고장내용 선택</span>
            <button class="popup-close" onclick="closePopup('contnmPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="contnmSearchInput" placeholder="고장내용 검색"
               oninput="filterContnmList(this.value)">
        <div class="popup-list"><ul id="contnmList"></ul></div>
    </div>
</div>

<!-- 통보자 선택 팝업 -->
<div class="popup-overlay" id="perPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>통보자 선택</span>
            <button class="popup-close" onclick="closePopup('perPopup')">×</button>
        </div>
        <input type="text" class="popup-search-input" id="perSearchInput" placeholder="이름 검색"
               oninput="filterPerList(this.value)">
        <div class="popup-list"><ul id="perList"></ul></div>
    </div>
</div>

<script type="text/javascript">

    var _actListCache = [];
    // spjangcd는 백엔드에서 username 기반으로 조회하므로 프론트에서 불필요

    /* ── 초기화 ── */
    $(document).ready(function () {
        const now  = new Date();
        const yyyy = now.getFullYear();
        const mm   = String(now.getMonth() + 1).padStart(2, '0');
        const dd   = String(now.getDate()).padStart(2, '0');
        const hh   = String(now.getHours()).padStart(2, '0');
        const mi   = String(now.getMinutes()).padStart(2, '0');
        const today = `${yyyy}-${mm}-${dd}`;
        const time  = `${hh}:${mi}`;
        document.getElementById('regRecedate').value  = today;
        document.getElementById('regRecetime').value  = time;
        document.getElementById('regHitchdate').value = today;
        document.getElementById('regHitchhour').value = time;
    });

    /* ── 현장 선택 팝업 ── */
    function openActPopup() {
        document.getElementById('actSearchInput').value = '';
        if (_actListCache.length > 0) {
            renderActList(_actListCache);
            openPopup('actPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/request_repair/read_act', {}, function (result) {
            if (result && result.data) {
                _actListCache = result.data;
                renderActList(_actListCache);
                openPopup('actPopup');
            }
        });
    }

    function renderActList(list) {
        const ul = document.getElementById('actList');
        ul.innerHTML = '';
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.actcd || '')}</span>${esc(item.actnm || '')}`;
            li.onclick = function () { setActData(item); };
            ul.appendChild(li);
        });
    }

    function filterActList(keyword) {
        renderActList(_actListCache.filter(function (item) {
            return (item.actnm || '').includes(keyword);
        }));
    }

    function setActData(item) {
        document.getElementById('regActcd').value  = item.actcd || '';
        document.getElementById('regActnm').value  = item.actnm || '';
        document.getElementById('regEqupcd').value = '';
        document.getElementById('regEqupnm').value = '';
        closePopup('actPopup');
    }

    /* ── 호기 선택 팝업 ── */
    function openEqupPopup() {
        const actcd = document.getElementById('regActcd').value;
        if (!actcd) { Alert.alert('', '현장을 먼저 선택해주세요.'); return; }

        AjaxUtil.getAsyncData('/api/request_repair/read_equp', {
            actcd: actcd
        }, function (result) {
            const ul = document.getElementById('equpList');
            ul.innerHTML = '';
            if (result && result.data && result.data.length > 0) {
                result.data.forEach(function (item) {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="item-code">${esc(item.equpcd || '')}</span>${esc(item.equpnm || '')}`;
                    li.onclick = function () { setEqupData(item); };
                    ul.appendChild(li);
                });
            } else {
                ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 호기가 없습니다.</li>';
            }
            openPopup('equpPopup');
        });
    }

    function setEqupData(item) {
        document.getElementById('regEqupcd').value = item.equpcd || '';
        document.getElementById('regEqupnm').value = item.equpnm || '';
        closePopup('equpPopup');
    }

    /* ── 등록 ── */
    function saveRepair() {
        const recedate = document.getElementById('regRecedate').value;
        const actcd    = document.getElementById('regActcd').value;
        if (!recedate) { Alert.alert('', '접수일자를 입력해주세요.'); return; }
        if (!actcd)    { Alert.alert('', '현장을 선택해주세요.');     return; }

        const data = {
            recedate  : recedate.replaceAll('-', ''),
            recetime  : document.getElementById('regRecetime').value.replaceAll(':', ''),
            hitchdate : document.getElementById('regHitchdate').value.replaceAll('-', ''),
            hitchhour : document.getElementById('regHitchhour').value.replaceAll(':', ''),
            actcd     : actcd,
            actnm     : document.getElementById('regActnm').value,
            equpcd    : document.getElementById('regEqupcd').value,
            equpnm    : document.getElementById('regEqupnm').value,
            contents  : document.getElementById('regContentsDetail').value,
            contcd    : document.getElementById('regContcd').value,
            remark    : document.getElementById('regRemark').value,
            perid     : document.getElementById('regPerid').value,   // 통보자(화면 선택)
            bigo      : document.getElementById('regBigo').value,
        };

        AjaxUtil.postAsyncData('/api/request_repair/save', data, function (result) {
            if (result && result.success) {
                Alert.alert('', result.message, function () {
                    location.href = window.CTX_PATH + '/mobile/request/request_status';
                });
            } else {
                Alert.alert('', (result && result.message) || '등록 중 오류가 발생하였습니다.');
            }
        });
    }

    /* ── 팝업 공통 ── */
    function openPopup(id)  { document.getElementById(id).classList.add('active');    }
    function closePopup(id) { document.getElementById(id).classList.remove('active'); }

    ['actPopup', 'equpPopup', 'contnmPopup', 'perPopup'].forEach(function (id) {
        document.getElementById(id).addEventListener('click', function (e) {
            if (e.target === this) closePopup(id);
        });
    });

    /* ── 통보자 선택 팝업 ── */
    var _perListCache = [];

    function openPerPopup() {
        document.getElementById('perSearchInput').value = '';
        if (_perListCache.length > 0) {
            renderPerList(_perListCache);
            openPopup('perPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/system/user/getPerson', { searchCode: '', searchName: '' }, function (result) {
            if (result && result.data) {
                _perListCache = result.data;
                renderPerList(_perListCache);
                openPopup('perPopup');
            }
        });
    }

    function renderPerList(list) {
        const ul = document.getElementById('perList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 사원이 없습니다.</li>';
            return;
        }
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.code || '')}</span>${esc(item.name || '')}`;
            li.onclick = function () { setPerData(item); };
            ul.appendChild(li);
        });
    }

    function filterPerList(keyword) {
        renderPerList(_perListCache.filter(function (item) {
            return (item.name || '').includes(keyword);
        }));
    }

    function setPerData(item) {
        document.getElementById('regPerid').value    = (item.code || '').replace(/^p/, '');
        document.getElementById('regRepernm').value  = item.name || '';
        closePopup('perPopup');
    }

    /* ── 고장내용 선택 팝업 ── */
    var _contnmListCache = [];

    function openContnmPopup() {
        document.getElementById('contnmSearchInput').value = '';
        if (_contnmListCache.length > 0) {
            renderContnmList(_contnmListCache);
            openPopup('contnmPopup');
            return;
        }
        AjaxUtil.getAsyncData('/api/request_repair/read_contnm', {}, function (result) {
            if (result && result.data) {
                _contnmListCache = result.data;
                renderContnmList(_contnmListCache);
                openPopup('contnmPopup');
            }
        });
    }

    function renderContnmList(list) {
        const ul = document.getElementById('contnmList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 고장내용이 없습니다.</li>';
            return;
        }
        list.forEach(function (item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="item-code">${esc(item.contcd || '')}</span>${esc(item.contnm || '')}`;
            li.onclick = function () { setContnmData(item); };
            ul.appendChild(li);
        });
    }

    function filterContnmList(keyword) {
        renderContnmList(_contnmListCache.filter(function (item) {
            return (item.contnm || '').includes(keyword);
        }));
    }

    function setContnmData(item) {
        document.getElementById('regContcd').value   = item.contcd || '';
        document.getElementById('regContents').value = item.contnm || '';
        closePopup('contnmPopup');
    }

    /* ── 시간 입력 간소화: 숫자만 입력 → 자동 HH:mm ── */
    function formatTimeInput(el) {
        const e = window.event;
        const deleting = e && e.inputType && e.inputType.indexOf('delete') === 0;
        let d = el.value.replace(/[^0-9]/g, '').slice(0, 4);
        if (d.length === 0)      el.value = '';
        else if (d.length <= 2)  el.value = deleting ? d : d + ':';
        else                     el.value = d.slice(0, 2) + ':' + d.slice(2);
    }

    /* ── 접수일시 → 고장일시 자동 바인드 (이후 수정 가능) ── */
    function syncHitchFromRece() {
        document.getElementById('regHitchdate').value = document.getElementById('regRecedate').value;
        document.getElementById('regHitchhour').value = document.getElementById('regRecetime').value;
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

</script>
</body>
</html>
