<!DOCTYPE html>
<html lang="ko">
<style>
    .btn-clear {
        display: none !important;
    }
    .btn-close {
        display: none !important;
    }

    .contents-wrap dd {
        margin-bottom: 20px;
    }

    .contents-wrap dt {
        margin-left: 10px;
        margin-bottom: 5px;
        font-weight: 600;
        color: #444;
    }

    .contents-wrap input[type="text"],
    .contents-wrap input[type="date"],
    .contents-wrap input[type="time"],
    .contents-wrap select,
    .contents-wrap textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
    }

    /* select는 padding 렌더링이 브라우저마다 달라 height로 통일 */
    .contents-wrap select {
        padding: 0 10px;
        height: 38px;
        line-height: 38px;
    }

    .contents-wrap input[readonly],
    .contents-wrap textarea[readonly] {
        background-color: #f5f5f5;
        color: #666;
    }

    /* 클릭 가능한 readonly 필드 */
    .contents-wrap input.clickable {
        background-color: #f5f5f5;
        color: #333;
        cursor: pointer;
        caret-color: transparent;
    }

    .contents-wrap input.clickable:active {
        background-color: #ececec;
    }

    .contents-wrap textarea {
        resize: vertical;
        min-height: 100px;
    }

    /* 3열 레이아웃 */
    .row-3col {
        display: flex;
        gap: 8px;
    }

    .row-3col > div {
        flex: 1;
    }

    /* 2열 레이아웃 */
    .row-2col {
        display: flex;
        gap: 10px;
    }

    .row-2col > div {
        flex: 1;
    }

    .divider {
        border: none;
        border-top: 1px solid #eee;
        margin: 5px 0 20px 0;
    }

    /* 파일 업로드 영역 */
    .file-upload-area {
        border: 2px dashed #ddd;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        cursor: pointer;
        background: #fafafa;
        transition: border-color 0.2s;
    }

    .file-upload-area:active {
        border-color: #888;
        background: #f0f0f0;
    }

    .file-upload-area .upload-icon {
        font-size: 28px;
        color: #aaa;
        margin-bottom: 6px;
    }

    .file-upload-area p {
        margin: 0;
        font-size: 13px;
        color: #888;
    }

    /* 파일 선택 후 표시 */
    .file-preview {
        display: none;
        margin-top: 10px;
        padding: 10px 12px;
        background: #f5f5f5;
        border-radius: 6px;
        font-size: 13px;
        color: #444;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .file-preview.show {
        display: flex;
    }

    .file-preview .file-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .file-preview .file-status {
        font-size: 12px;
        white-space: nowrap;
    }

    .file-preview .file-status.uploading { color: #f0a500; }
    .file-preview .file-status.done      { color: #2a9d2a; }
    .file-preview .file-status.error     { color: #cc3333; }

    .btn-file-remove {
        background: none;
        border: none;
        font-size: 18px;
        color: #aaa;
        cursor: pointer;
        line-height: 1;
        padding: 0 2px;
    }

    /* 팝업 오버레이 */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 9000;
        justify-content: center;
        align-items: flex-end;
    }

    .popup-overlay.active {
        display: flex;
    }

    .popup-sheet {
        background: #fff;
        width: 100%;
        max-height: 60vh;
        border-radius: 16px 16px 0 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .popup-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #eee;
        font-weight: 700;
        font-size: 16px;
    }

    .popup-close {
        width: 0%;
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: #666;
        line-height: 1;
    }

    .popup-list {
        overflow-y: auto;
        flex: 1;
    }

    .popup-list ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .popup-list ul li {
        padding: 14px 20px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        font-size: 14px;
    }

    .popup-list ul li:active,
    .popup-list ul li:hover {
        background-color: #f5f5f5;
    }

    .popup-list ul li .item-code {
        font-size: 12px;
        color: #999;
        margin-right: 8px;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTAS MES</title>
    <meta name="ctx" th:content="@{/}">
    <link rel="icon" type="image/png" th:href="@{/images/logo/actas_log_a.png}">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" th:href="@{/resource/ax5ui/ax5ui.all.css}">
    <link rel="stylesheet" th:href="@{/assets_mobile/css/import.css}">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script th:src="@{/assets_mobile/js/ui.js}"></script>

    <script th:inline="javascript">
        var sandanData = /*[[${session.sandanList}]]*/ [];
    </script>

    <script type="text/javascript" th:src="@{/resource/ax5ui/ax5ui.all.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/ax5commUtil.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script th:src="@{/js/Mobile.js}"></script>
    <script src="https://kit.fontawesome.com/84dc79ac13.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<div class="mobile-wrapper page-ticket-list">

    <!-- [모바일] 헤더 -->
    <div class="mobile-layout-header">
        <header>
            <div class="left">
                <a href="#" title="전체메뉴" class="logo"></a>
            </div>
            <div class="left" style="margin-left:35px; font-size: 25px;">
                <h2>업무일지 등록</h2>
            </div>
            <div class="right">
                <a href="#" title="전체메뉴" class="btn-menu">
                    <img th:src="@{/assets_mobile/images/icon/btn-menu.svg}" alt="전체메뉴 아이콘">
                </a>
            </div>
        </header>
    </div>

    <!-- [모바일] 메뉴 -->
    <div th:insert="~{mobile/mobile_menu :: mobile_menu}"></div>

    <!-- [모바일] 컨텐츠 -->
    <div class="mobile-layout-contents">
        <div class="layout-contents">
            <div class="search-wrap"></div>

            <!-- 컨텐츠 영역 -->
            <div class="contents-wrap">

                <!-- hidden 필드 -->
                <input type="hidden" id="userId">
                <input type="hidden" id="position">
                <input type="hidden" id="department">
                <input type="hidden" id="actcd">
                <input type="hidden" id="equpcd">
                <!-- 파일 업로드 결과 hidden -->
                <input type="hidden" id="filesvnm">
                <input type="hidden" id="filepath">

                <!-- 실제 파일 input (숨김) -->
                <input type="file" id="fileInput" style="display:none"
                       accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">

                <dl>

                    <!-- 사용자ID / 사용자명 / 작성일자 (한 행) -->
                    <dt>사용자ID / 사용자명 / 작성일자</dt>
                    <dd>
                        <div class="row-3col">
                            <div>
                                <input type="text" id="userIdView" placeholder="사용자ID" readonly>
                            </div>
                            <div>
                                <!-- mobile_menu.html에 id="userName" 중복 존재 → userNameView로 변경 -->
                                <input type="text" id="userNameView" placeholder="사용자명" readonly>
                            </div>
                            <div>
                                <input type="date" id="writeDate">
                            </div>
                        </div>
                    </dd>

                    <hr class="divider">

                    <!-- 구분 -->
                    <dt>구분</dt>
                    <dd>
                        <select id="wkcd">
                            <option value="">선택</option>
                        </select>
                    </dd>

                    <!-- 행선지 / 호기명 (한 행) -->
                    <dt>행선지 / 호기명</dt>
                    <dd>
                        <div class="row-2col">
                            <div>
                                <input type="text" id="actnm" class="clickable" placeholder="행선지 선택" readonly
                                       onclick="openDestPopup()">
                            </div>
                            <div>
                                <input type="text" id="equpnm" class="clickable" placeholder="호기 선택" readonly
                                       onclick="openEqupPopup()">
                            </div>
                        </div>
                    </dd>

                    <!-- 도착시간 / 완료시간 -->
                    <dt>도착시간 / 완료시간</dt>
                    <dd>
                        <div class="row-2col">
                            <div>
                                <input type="text" id="frtime" inputmode="numeric" maxlength="5"
                                       placeholder="HH:mm" oninput="formatTimeInput(this)">
                            </div>
                            <div>
                                <input type="text" id="totime" inputmode="numeric" maxlength="5"
                                       placeholder="HH:mm" oninput="formatTimeInput(this)">
                            </div>
                        </div>
                    </dd>

                    <!-- 세부내용 -->
                    <dt>세부내용</dt>
                    <dd>
                        <textarea id="remark" placeholder="세부내용을 입력하세요."></textarea>
                    </dd>

                    <!-- 파일 첨부 -->
                    <dt>파일 첨부</dt>
                    <dd>
                        <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                            <div class="upload-icon">📎</div>
                            <p>클릭하여 파일 선택</p>
                            <p style="font-size:11px; margin-top:4px; color:#bbb;">이미지, PDF, Office 파일 등 (최대 20MB)</p>
                        </div>
                        <div class="file-preview" id="filePreview">
                            <span class="file-name" id="fileNameDisplay"></span>
                            <span class="file-status" id="fileStatus"></span>
                            <button class="btn-file-remove" onclick="removeFile()" title="파일 제거">×</button>
                        </div>
                    </dd>

                </dl>

                <div class="srch-btn">
                    <button class="btn-dark" onclick="saveDailyReport()">등록</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ======================== 행선지 팝업 ======================== -->
<div class="popup-overlay" id="destPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>행선지 선택</span>
            <button class="popup-close" onclick="closeDestPopup()">×</button>
        </div>
        <div style="padding:10px 16px; border-bottom:1px solid #eee;">
            <input type="text" id="destSearchKeyword" placeholder="현장명 검색"
                   style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box;"
                   oninput="filterDestList(this.value)">
        </div>
        <div class="popup-list">
            <ul id="destList"></ul>
        </div>
    </div>
</div>

<!-- ======================== 호기 팝업 ======================== -->
<div class="popup-overlay" id="equpPopup">
    <div class="popup-sheet">
        <div class="popup-header">
            <span>호기 선택</span>
            <button class="popup-close" onclick="closeEqupPopup()">×</button>
        </div>
        <div style="padding:10px 16px; border-bottom:1px solid #eee;">
            <input type="text" id="equpSearchKeyword" placeholder="호기명 검색"
                   style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box;"
                   oninput="filterEqupList(this.value)">
        </div>
        <div class="popup-list">
            <ul id="equpList"></ul>
        </div>
    </div>
</div>

<script type="text/javascript">

    var ctx = document.querySelector('meta[name="ctx"]').getAttribute('content') || '/';

    // 시간 입력 간소화: 숫자만 입력 → 자동 HH:mm (시계 다이얼 대신 키패드)
    function formatTimeInput(el) {
        const e = window.event;
        const deleting = e && e.inputType && e.inputType.indexOf('delete') === 0;
        let d = el.value.replace(/[^0-9]/g, '').slice(0, 4);
        if (d.length === 0)      el.value = '';
        else if (d.length <= 2)  el.value = deleting ? d : d + ':';
        else                     el.value = d.slice(0, 2) + ':' + d.slice(2);
    }

    $(document).ready(function () {
        initPage();
    });

    // ── 페이지 초기화 ──────────────────────────────────────────
    function initPage() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('writeDate').value = today;

        // 현재 시간 HH:mm 형식으로 바인딩
        const now  = new Date();
        const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        document.getElementById('frtime').value = hhmm;
        document.getElementById('totime').value = hhmm;

        searchMainData();
        loadGubunList();

        // 파일 선택 이벤트
        document.getElementById('fileInput').addEventListener('change', function () {
            const file = this.files[0];
            if (file) handleFileSelect(file);
        });
    }

    // ── 사용자 정보 조회 ───────────────────────────────────────
    function searchMainData() {
        let url = '/api/daily_report/read_userInfo';
        let fnsuccess = function (result) {
            if (result != null && result.data) {
                const d = result.data;
                document.getElementById('userId').value       = d.username   ?? '';
                document.getElementById('userIdView').value   = d.username   ?? '';
                document.getElementById('userNameView').value = d.first_name ?? '';
                document.getElementById('position').value     = d.position   ?? '';
                document.getElementById('department').value   = d.department ?? '';
            }
        };
        AjaxUtil.getAsyncData(url, {}, fnsuccess);
    }

    // ── 구분 selectbox 로드 (TB_E021) ─────────────────────────
    function loadGubunList() {
        let url = '/api/daily_report/read_gubun';
        let fnsuccess = function (result) {
            if (result != null && result.data) {
                const select = document.getElementById('wkcd');
                result.data.forEach(function(item) {
                    const option = document.createElement('option');
                    option.value = item.busicd;
                    option.text  = item.businm;
                    select.appendChild(option);
                });
            }
        };
        AjaxUtil.getAsyncData(url, {}, fnsuccess);
    }

    // ── 행선지 팝업 ───────────────────────────────────────────
    var _destData = []; // 전체 목록 캐시

    function openDestPopup() {
        document.getElementById('destSearchKeyword').value = '';
        AjaxUtil.getAsyncData('/api/daily_report/read_dest', {}, function (result) {
            if (result != null && result.data) {
                _destData = result.data;
                renderDestList(_destData);
                document.getElementById('destPopup').classList.add('active');
            }
        });
    }

    function filterDestList(keyword) {
        const filtered = keyword.trim()
            ? _destData.filter(function(item) {
                return item.actnm && item.actnm.includes(keyword.trim());
              })
            : _destData;
        renderDestList(filtered);
    }

    function renderDestList(list) {
        const ul = document.getElementById('destList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">검색 결과가 없습니다.</li>';
            return;
        }
        list.forEach(function(item) {
            const li = document.createElement('li');
            li.innerHTML = '<span class="item-code">' + (item.actcd || '') + '</span>' + (item.actnm || '');
            li.onclick = function() { setDestData(item); };
            ul.appendChild(li);
        });
    }

    function closeDestPopup() {
        document.getElementById('destPopup').classList.remove('active');
    }

    function setDestData(item) {
        document.getElementById('actcd').value = item.actcd ?? '';
        document.getElementById('actnm').value = item.actnm ?? '';
        document.getElementById('equpcd').value = '';
        document.getElementById('equpnm').value = '';
        closeDestPopup();
    }

    document.getElementById('destPopup').addEventListener('click', function(e) {
        if (e.target === this) closeDestPopup();
    });

    // ── 호기 팝업 ─────────────────────────────────────────────
    var _equpData = []; // 전체 목록 캐시

    function openEqupPopup() {
        const actcd = document.getElementById('actcd').value;
        if (!actcd) {
            Alert.alert('', '행선지를 먼저 선택해주세요.');
            return;
        }
        document.getElementById('equpSearchKeyword').value = '';
        AjaxUtil.getAsyncData('/api/daily_report/read_equp', { actcd: actcd }, function (result) {
            if (result != null && result.data) {
                _equpData = result.data;
                renderEqupList(_equpData);
                document.getElementById('equpPopup').classList.add('active');
            }
        });
    }

    function filterEqupList(keyword) {
        const filtered = keyword.trim()
            ? _equpData.filter(function(item) {
                return item.equpnm && item.equpnm.includes(keyword.trim());
              })
            : _equpData;
        renderEqupList(filtered);
    }

    function renderEqupList(list) {
        const ul = document.getElementById('equpList');
        ul.innerHTML = '';
        if (!list || list.length === 0) {
            ul.innerHTML = '<li style="color:#999; cursor:default;">조회된 호기가 없습니다.</li>';
            return;
        }
        list.forEach(function(item) {
            const li = document.createElement('li');
            li.innerHTML = '<span class="item-code">' + (item.equpcd || '') + '</span>' + (item.equpnm || '');
            li.onclick = function() { setEqupData(item); };
            ul.appendChild(li);
        });
    }

    function closeEqupPopup() {
        document.getElementById('equpPopup').classList.remove('active');
    }

    function setEqupData(item) {
        document.getElementById('equpcd').value = item.equpcd ?? '';
        document.getElementById('equpnm').value = item.equpnm ?? '';
        closeEqupPopup();
    }

    document.getElementById('equpPopup').addEventListener('click', function(e) {
        if (e.target === this) closeEqupPopup();
    });

    // ── 파일 처리 ─────────────────────────────────────────────
    function handleFileSelect(file) {
        const preview  = document.getElementById('filePreview');
        const nameEl   = document.getElementById('fileNameDisplay');
        const statusEl = document.getElementById('fileStatus');

        nameEl.textContent   = file.name;
        statusEl.textContent = '업로드 중...';
        statusEl.className   = 'file-status uploading';
        preview.classList.add('show');

        document.getElementById('filesvnm').value = '';
        document.getElementById('filepath').value  = '';

        const csrfToken = document.querySelector('input[name="_csrf"]').value;
        const formData  = new FormData();
        formData.append('file', file);

        fetch(ctx + 'api/daily_report/upload_file', {
            method: 'POST',
            headers: { 'X-CSRF-TOKEN': csrfToken },
            body: formData
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
            if (result.success && result.data) {
                document.getElementById('filesvnm').value = result.data.filesvnm;
                document.getElementById('filepath').value  = result.data.filepath;
                statusEl.textContent = '✓ 업로드 완료';
                statusEl.className   = 'file-status done';
            } else {
                statusEl.textContent = '✗ 업로드 실패';
                statusEl.className   = 'file-status error';
                Alert.alert('', result.message || '파일 업로드에 실패하였습니다.');
            }
        })
        .catch(function() {
            statusEl.textContent = '✗ 업로드 실패';
            statusEl.className   = 'file-status error';
            Alert.alert('', '파일 업로드 중 오류가 발생하였습니다.');
        });
    }

    function removeFile() {
        document.getElementById('fileInput').value    = '';
        document.getElementById('filesvnm').value     = '';
        document.getElementById('filepath').value      = '';
        document.getElementById('filePreview').classList.remove('show');
    }

    // ── 업무일지 등록 ──────────────────────────────────────────
    function saveDailyReport() {
        const userId     = document.getElementById('userId').value;
        const userName   = document.getElementById('userNameView').value;
        const writeDate  = document.getElementById('writeDate').value;
        const position   = document.getElementById('position').value;
        const department = document.getElementById('department').value;
        const wkcd       = document.getElementById('wkcd').value;
        const actcd      = document.getElementById('actcd').value;
        const actnm      = document.getElementById('actnm').value;
        const frtime     = document.getElementById('frtime').value;
        const totime     = document.getElementById('totime').value;
        const equpcd     = document.getElementById('equpcd').value;
        const equpnm     = document.getElementById('equpnm').value;
        const remark     = document.getElementById('remark').value;
        const filesvnm   = document.getElementById('filesvnm').value;
        const filepath   = document.getElementById('filepath').value;

        const statusEl = document.getElementById('fileStatus');
        if (statusEl.classList.contains('uploading')) {
            Alert.alert('', '파일 업로드가 완료될 때까지 기다려주세요.');
            return;
        }

        if (!writeDate) { Alert.alert('', '작성일자를 선택해주세요.'); return; }
        if (!wkcd)      { Alert.alert('', '구분을 선택해주세요.');     return; }
        if (!actcd)     { Alert.alert('', '행선지를 선택해주세요.');   return; }

        let url = '/api/daily_report/save';
        let data = {
            'userId'     : userId,
            'userName'   : userName,
            'writeDate'  : writeDate,
            'position'   : position,
            'department' : department,
            'wkcd'       : wkcd,
            'actcd'      : actcd,
            'actnm'      : actnm,
            'frtime'     : frtime ? frtime.replace(':', '') : '',
            'totime'     : totime ? totime.replace(':', '') : '',
            'equpcd'     : equpcd,
            'equpnm'     : equpnm,
            'remark'     : remark,
            'filesvnm'   : filesvnm,
            'filepath'   : filepath
        };

        let fnsuccess = function (result) {
            if (result != null) {
                if (result.success) {
                    Alert.alert('', result.message, function () {
                        window.location.href = window.CTX_PATH + '/mobile/request/daily_status';
                    });
                } else {
                    Alert.alert('', '업무일지 등록에 실패하였습니다.');
                }
            } else {
                Alert.alert('', '오류가 발생하였습니다.');
            }
        };
        AjaxUtil.postAsyncData(url, data, fnsuccess);
    }

</script>
