<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
    /* ── 상단 요약바 ── */
    .wr-topbar { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-bottom:1px solid #ddd; background:#fff; }
    .wr-summary { display:flex; gap:20px; font-size:13px; }
    .wr-kt-area { display:flex; align-items:center; gap:8px; }
    .wr-kt-area input { padding:4px 6px; border:1px solid #ccc; border-radius:4px; font-size:12px; }
    .wr-kt-area .lbl { font-size:12px; color:#555; }
    #elevNo { width:140px; padding:4px 8px; }
    #apiId  { width:90px; }
    #apiPw  { width:80px; }
    .btn-elev  { background:#1a73e8; color:#fff; border:none; border-radius:4px; padding:4px 12px; cursor:pointer; }
    .btn-phone { background:#17a2b8; color:#fff; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:14px; }
    #ktStatusDot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ccc; }
    #ktStatusTxt { font-size:12px; color:#888; }

    /* ── 전화 수신 토스트 ── */
    #callToast { display:none; position:fixed; top:60px; right:20px; z-index:9999; background:#fff; border:2px solid #1a73e8; border-radius:8px; padding:14px 20px; box-shadow:0 4px 16px rgba(0,0,0,0.18); min-width:280px; }
    .toast-title  { font-size:13px; font-weight:bold; color:#1a73e8; margin-bottom:6px; }
    #toastCaller  { font-size:18px; font-weight:bold; }
    #toastStatus  { font-size:12px; color:#888; margin-top:4px; }
    .toast-btns   { margin-top:10px; display:flex; gap:8px; }
    .btn-toast-apply { flex:1; padding:6px; background:#1a73e8; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .btn-toast-close { flex:1; padding:6px; background:#eee; border:none; border-radius:4px; cursor:pointer; }

    /* ── 3단 레이아웃 ── */
    .wr-body { display:flex; height:calc(100vh - 130px); overflow:hidden; }

    /* ── 좌측 목록 ── */
    .wr-left { width:260px; flex-shrink:0; border-right:1px solid #ddd; display:flex; flex-direction:column; background:#f8f8f8; }
    .wr-left .panel-title { padding:8px 10px; font-weight:bold; font-size:14px; background:#fff; border-bottom:1px solid #ddd; }
    .wr-left .list-filter { padding:8px 10px; background:#fff; border-bottom:1px solid #eee; display:flex; flex-direction:column; gap:4px; }
    .wr-left .date-row { display:flex; align-items:center; gap:4px; }
    .wr-left .date-row input { flex:1; min-width:0; width:0; box-sizing:border-box; padding:3px 5px; font-size:12px; border:1px solid #ccc; border-radius:3px; }
    .wr-left .date-row span { font-size:12px; flex-shrink:0; }
    .wr-left .search-row { display:flex; gap:4px; }
    .wr-left .search-row input { flex:1; padding:3px 6px; font-size:12px; border:1px solid #ccc; border-radius:3px; }
    .wr-left .search-row button { padding:3px 10px; background:#1a73e8; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:12px; }
    #cardList { flex:1; overflow-y:auto; padding:6px; }
    .card-empty { text-align:center; padding:30px; color:#bbb; font-size:13px; }

    /* ── 카드 ── */
    .req-card { display:flex; align-items:stretch; border:1px solid #e0e0e0; border-radius:5px; margin-bottom:5px; cursor:pointer; background:#fff; font-size:12px; overflow:hidden; }
    .req-card:hover { border-color:#1a73e8; }
    .req-card.active { border-color:#1a73e8; background:#eef4ff; }
    .req-card .card-icon { width:36px; background:#1a73e8; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:bold; gap:1px; padding:4px 0; }
    .req-card .card-body { flex:1; padding:5px 7px; overflow:hidden; }
    .req-card .card-time  { color:#888; font-size:11px; }
    .req-card .card-actnm { font-weight:bold; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .req-card .card-desc  { color:#555; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .req-card .card-tel   { padding:5px 7px; color:#1a73e8; font-size:11px; display:flex; align-items:center; white-space:nowrap; }

    /* ── 중앙 폼 ── */
    .wr-center { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .wr-center .center-topbar { display:flex; justify-content:flex-end; gap:6px; padding:8px 10px; border-bottom:1px solid #ddd; background:#fff; }
    .wr-center .form-scroll { flex:1; overflow-y:auto; padding:12px 16px; }
    .form-section-title { font-size:14px; font-weight:bold; margin-bottom:10px; }
    .wr-center .center-bottom { display:flex; justify-content:center; gap:8px; padding:10px; border-top:1px solid #ddd; background:#fff; }

    /* ── 접수 테이블 ── */
    .recv-table { width:100%; border-collapse:collapse; font-size:13px; }
    .recv-table th { padding:6px 8px; background:#f5f5f5; border:1px solid #ddd; text-align:left; white-space:nowrap; }
    .recv-table td { padding:6px 8px; border:1px solid #ddd; }
    .recv-table .th-sm { font-size:11px; }
    .input-row { display:flex; align-items:center; gap:4px; }
    .input-row input, .recv-table input[type=text], .recv-table input[type=date],
    .recv-table input[type=time] { flex:1; padding:3px 6px; border:1px solid #ccc; border-radius:3px; font-size:13px; box-sizing:border-box; }
    .recv-table input[type=text].full, .recv-table input[type=time].full { width:100%; flex:none; }
    .recv-table textarea { width:100%; padding:4px 6px; border:1px solid #ccc; border-radius:3px; resize:vertical; font-size:13px; box-sizing:border-box; }
    .input-row .readonly { background:#fafafa; }
    .btn-icon { padding:3px 8px; border:1px solid #ccc; border-radius:3px; cursor:pointer; background:#fff; }
    .btn-now  { padding:2px 6px; font-size:11px; border:1px solid #ccc; border-radius:3px; background:#f5f5f5; cursor:pointer; }

    /* ── 중앙 하단 버튼 ── */
    .btn-sms    { padding:6px 20px; background:#1a73e8; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .btn-del    { padding:6px 20px; background:#e74c3c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .btn-new    { padding:6px 20px; background:#3498db; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .btn-save   { padding:6px 20px; background:#f39c12; color:#fff; border:none; border-radius:4px; cursor:pointer; }

    /* ── 우측 메모 ── */
    .wr-right { width:300px; flex-shrink:0; border-left:1px solid #ddd; display:flex; flex-direction:column; background:#fff; }
    .wr-right .memo-title { padding:8px 12px; font-weight:bold; font-size:14px; background:#2c3e50; color:#fff; text-align:center; }
    .wr-right .memo-form  { padding:10px 12px; border-bottom:1px solid #eee; overflow-y:auto; }
    .memo-table { width:100%; border-collapse:collapse; font-size:12px; }
    .memo-table th { padding:5px 6px; background:#f5f5f5; border:1px solid #ddd; text-align:left; width:70px; white-space:nowrap; }
    .memo-table td { padding:5px 6px; border:1px solid #ddd; }
    .memo-table th.vtop { vertical-align:top; }
    .memo-table input, .memo-table textarea { width:100%; padding:2px 4px; border:1px solid #ccc; border-radius:3px; font-size:12px; box-sizing:border-box; }
    .memo-table textarea { resize:vertical; }
    .memo-btns { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid #eee; }
    .memo-btns button { flex:1; padding:6px; border:none; border-radius:4px; cursor:pointer; font-size:13px; color:#fff; }
    .btn-memo-del  { background:#7f8c8d; }
    .btn-memo-new  { background:#17a2b8; }
    .btn-memo-save { background:#2c3e50; }
    .memo-search { padding:8px 12px; border-bottom:1px solid #eee; display:flex; gap:4px; align-items:center; }
    .memo-search input[type=date] { flex:1; padding:3px 5px; font-size:12px; border:1px solid #ccc; border-radius:3px; }
    .memo-search input[type=text] { width:70px; padding:3px 5px; font-size:12px; border:1px solid #ccc; border-radius:3px; }
    .btn-memo-search { padding:3px 10px; background:#2c3e50; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:12px; }
    #memoList { flex:1; overflow-y:auto; font-size:12px; }
  </style>
</head>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/approve_box :: approve_box"></th:block>
  <th:block th:replace="common/popup_select_user_code :: popup_select_user_code"></th:block>

  <script type="text/javascript">

    var _spjangcd     = sessionStorage.getItem('spjangcd') || '';
    var _actListCache = [];
    var _equpCache    = [];
    var _smsPage      = 1;
    var _smsTotalPage = 1;
    var _ktStompClient = null;
    var _ktUserId      = '';
    var _lastCallData  = null;

    /* ── KT 전화 연동 ── */
    function ktLogin() {
      const userId   = document.getElementById('apiId').value.trim();
      const password = document.getElementById('apiPw').value.trim();
      if (!userId || !password) { Alert.alert('', 'KT API ID와 비밀번호를 입력해주세요.'); return; }
      AjaxUtil.postAsyncData('/api/kt-call/login', { userId, password }, function(result) {
        if (result && result.success) {
          _ktUserId = userId;
          setKtStatus(true);
          connectKtWebSocket();
          Alert.alert('', 'KT 통화매니저 연결되었습니다.');
        } else {
          Alert.alert('', (result && result.message) || 'KT 로그인 실패');
        }
      });
    }

    function ktLogout() {
      if (!_ktUserId) return;
      AjaxUtil.postAsyncData('/api/kt-call/logout', { userId: _ktUserId }, function() {});
      if (_ktStompClient) { _ktStompClient.disconnect(); _ktStompClient = null; }
      _ktUserId = '';
      setKtStatus(false);
      Alert.alert('', 'KT 통화매니저 연결이 해제되었습니다.');
    }

    function connectKtWebSocket() {
      const socket = new SockJS('/ws/kt-call');
      _ktStompClient = Stomp.over(socket);
      _ktStompClient.debug = null;
      _ktStompClient.connect({}, function(frame) {
        _ktStompClient.subscribe('/topic/kt-call', function(message) {
          onIncomingCall(JSON.parse(message.body));
        });
      }, function(error) {
        setKtStatus(false);
        setTimeout(function() { if (_ktUserId) connectKtWebSocket(); }, 5000);
      });
    }

    function onIncomingCall(data) {
      _lastCallData = data;
      document.getElementById('toastCaller').textContent = formatPhoneNum(data.caller || '');
      document.getElementById('toastStatus').textContent = (data.callDate||'') + ' ' + (data.callTime||'') + '  [' + (data.status||'') + ']';
      document.getElementById('callToast').style.display = 'block';
      showBrowserNotification(data);
      playRingSound();
      const cnt = parseInt(document.getElementById('cntRecv').textContent || '0');
      document.getElementById('cntRecv').textContent = cnt + 1;
      setTimeout(closeCallToast, 10000);
    }

    function showBrowserNotification(data) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const noti = new Notification('📞 수신 전화', {
        body: formatPhoneNum(data.caller||'') + '\n' + (data.callDate||'') + ' ' + (data.callTime||'') + '  [' + (data.status||'') + ']',
        icon: '/images/phone_icon.png',
        requireInteraction: true,
        tag: 'kt-incoming-call'
      });
      noti.onclick = function() { window.focus(); noti.close(); };
    }

    function applyCallToMemo() {
      if (!_lastCallData) return;
      const hh = String(new Date().getHours()).padStart(2,'0');
      const mi = String(new Date().getMinutes()).padStart(2,'0');
      document.getElementById('memoRecedate').value = _lastCallData.callDate || new Date().toISOString().split('T')[0];
      document.getElementById('memoRecetime').value = _lastCallData.callTime || (hh+':'+mi);
      document.getElementById('memoCustel').value   = _lastCallData.caller   || '';
      document.getElementById('memoCusnm').value    = '';
      document.getElementById('memoContent').value  = '수신전화: ' + formatPhoneNum(_lastCallData.caller||'');
      closeCallToast();
    }

    function closeCallToast() { document.getElementById('callToast').style.display = 'none'; }

    function setKtStatus(connected) {
      const dot = document.getElementById('ktStatusDot');
      const txt = document.getElementById('ktStatusTxt');
      dot.style.background = connected ? '#22b04b' : '#ccc';
      txt.textContent      = connected ? '연결됨' : '미연결';
      txt.style.color      = connected ? '#22b04b' : '#888';
    }

    function formatPhoneNum(num) {
      if (!num) return '';
      const n = num.replace(/\D/g,'');
      if (n.length===11) return n.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
      if (n.length===10) return n.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
      return num;
    }

    function playRingSound() {
      try {
        const ctx  = new (window.AudioContext||window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 480;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.8);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.8);
      } catch(e) {}
    }

    /* ── 초기화 ── */
    document.readyState === 'complete' ? init() : window.onload = init;

    function init() {
      const today = new Date();
      const yyyy  = today.getFullYear();
      const mm    = String(today.getMonth()+1).padStart(2,'0');
      const dd    = String(today.getDate()).padStart(2,'0');
      const todayStr = `${yyyy}-${mm}-${dd}`;

      document.getElementById('listFromDate').value = `${yyyy}-${mm}-01`;
      document.getElementById('listToDate').value   = todayStr;
      document.getElementById('recedate').value     = todayStr;
      document.getElementById('recetime').value     = nowTimeStr();
      document.getElementById('hitchdate').value    = todayStr;
      document.getElementById('hitchhour').value    = nowTimeStr();
      document.getElementById('memoSrchDate').value = todayStr;
      document.getElementById('memoRecedate').value = todayStr;

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      loadSummary();
      searchList();
    }

    function nowTimeStr() {
      const n = new Date();
      return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    }

    /* ── 요약 카운트 ── */
    function loadSummary() {
      AjaxUtil.getAsyncData('/api/web_request/summary', {}, function(result) {
        if (result && result.data) {
          const d = result.data;
          document.getElementById('cntRecv').textContent     = d.cntRecv     || 0;
          document.getElementById('cntRece').textContent     = d.cntRece     || 0;
          document.getElementById('cntCallback').textContent = d.cntCallback || 0;
          document.getElementById('cntToday').textContent    = d.cntToday    || 0;
        }
      });
    }

    /* ── 목록 조회 ── */
    function searchList() {
      const fromDate = document.getElementById('listFromDate').value.replaceAll('-','');
      const toDate   = document.getElementById('listToDate').value.replaceAll('-','');
      const actnm    = document.getElementById('listActnm').value.trim();
      AjaxUtil.getAsyncData('/api/web_request/read', { fromDate, toDate, actnm }, function(result) {
        renderCardList(result && result.data ? result.data : []);
      });
    }

    function renderCardList(list) {
      const wrap = document.getElementById('cardList');
      if (!list || !list.length) {
        wrap.innerHTML = '<div style="text-align:center;padding:30px;color:#bbb;font-size:13px;">조회된 데이터가 없습니다.</div>';
        return;
      }
      wrap.innerHTML = list.map(function(item) {
        const dateStr = (item.recedate||'').replace(/(\d{4})(\d{2})(\d{2})/,'$2/$3');
        return `<div class="req-card" onclick="selectCard(this,${JSON.stringify(item).replace(/"/g,'&quot;')})">
          <div class="card-icon"><span>고장</span><span>접수</span></div>
          <div class="card-body">
            <div class="card-time">${dateStr}(${fmtTime(item.recetime)})</div>
            <div class="card-actnm">${esc(item.actnm||'')}</div>
            <div class="card-desc">${esc(item.contents||'')}</div>
          </div>
          <div class="card-tel">${esc(item.tel||'')}</div>
        </div>`;
      }).join('');
    }

    function selectCard(el, item) {
      document.querySelectorAll('.req-card').forEach(function(c){ c.classList.remove('active'); });
      el.classList.add('active');
      bindForm(item);
    }

    /* ── 폼 바인딩 ── */
    function bindForm(item) {
      document.getElementById('hidRecedate').value = item.recedate || '';
      document.getElementById('hidRecenum').value  = item.recenum  || '';
      document.getElementById('recedate').value    = fmtDate(item.recedate);
      document.getElementById('recetime').value    = fmtTime(item.recetime);
      document.getElementById('hitchdate').value   = fmtDate(item.hitchdate);
      document.getElementById('hitchhour').value   = fmtTime(item.hitchhour);
      document.getElementById('actcd').value       = item.actcd    || '';
      document.getElementById('actnm').value       = item.actnm    || '';
      document.getElementById('equpcd').value      = item.equpcd   || '';
      document.getElementById('equpnm').value      = item.equpnm   || '';
      document.getElementById('perid').value       = item.perid    || '';
      document.getElementById('pernm').value       = item.pernm    || '';
      document.getElementById('reperid').value     = item.reperid  || '';
      document.getElementById('contents').value    = item.contents || '';
      document.getElementById('remark').value      = item.remark   || '';
      document.getElementById('bigo').value        = item.bigo     || '';
    }

    /* ── 신규 / 저장 / 삭제 ── */
    function newForm() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('hidRecedate').value = '';
      document.getElementById('hidRecenum').value  = '';
      ['actcd','actnm','equpcd','equpnm','perid','pernm','reperid','contents','remark','bigo']
        .forEach(function(id){ document.getElementById(id).value = ''; });
      document.getElementById('recedate').value  = today;
      document.getElementById('recetime').value  = nowTimeStr();
      document.getElementById('hitchdate').value = today;
      document.getElementById('hitchhour').value = nowTimeStr();
      document.querySelectorAll('.req-card').forEach(function(c){ c.classList.remove('active'); });
    }

    function saveData() {
      const recedate = document.getElementById('recedate').value;
      const actcd    = document.getElementById('actcd').value;
      if (!recedate) { Alert.alert('', '접수일자를 입력해주세요.'); return; }
      if (!actcd)    { Alert.alert('', '현장을 선택해주세요.'); return; }
      const data = {
        recedate  : recedate.replaceAll('-',''),
        recenum   : document.getElementById('hidRecenum').value,
        recetime  : document.getElementById('recetime').value.replaceAll(':',''),
        hitchdate : document.getElementById('hitchdate').value.replaceAll('-',''),
        hitchhour : document.getElementById('hitchhour').value.replaceAll(':',''),
        actcd, actnm : document.getElementById('actnm').value,
        equpcd : document.getElementById('equpcd').value,
        equpnm : document.getElementById('equpnm').value,
        perid  : document.getElementById('perid').value,
        reperid: document.getElementById('reperid').value,
        contents: document.getElementById('contents').value,
        remark  : document.getElementById('remark').value,
      };
      Alert.confirm('', '저장하시겠습니까?', function() {
        AjaxUtil.postAsyncData('/api/web_request/save', data, function(result) {
          if (result && result.success) {
            Alert.alert('', result.message || '저장되었습니다.', function() { searchList(); });
          } else {
            Alert.alert('', (result && result.message) || '저장 중 오류가 발생하였습니다.');
          }
        });
      });
    }

    function deleteData() {
      const recedate = document.getElementById('hidRecedate').value;
      const recenum  = document.getElementById('hidRecenum').value;
      if (!recedate || !recenum) { Alert.alert('', '삭제할 항목을 선택해주세요.'); return; }
      Alert.confirm('', '삭제하시겠습니까?', function() {
        AjaxUtil.postAsyncData('/api/web_request/delete', { recedate, recenum }, function(result) {
          if (result && result.success) {
            Alert.alert('', result.message || '삭제되었습니다.', function() { newForm(); searchList(); });
          } else {
            Alert.alert('', (result && result.message) || '삭제 중 오류가 발생하였습니다.');
          }
        });
      });
    }

    /* ── 현장 팝업 (PopupDraggable + wijmo) ── */
    function openActPopup() {
      let selectedItem = null;
      let actGrid = null;

      let $content = $(tmpl('actPopupTemplate', {}));
      let popContainer = new PopupDraggable('현장 선택');
      popContainer.open({ width: 700, height: 480, $content });

      let $searchCode = $content.find('#actSearchCode');
      let $searchName = $content.find('#actSearchName');

      function fetchActList() {
        AjaxUtil.getAsyncData('/api/web_request/read_act', {}, function(r) {
          let data = (r && r.data) ? r.data : [];
          _actListCache = (r && r.data) ? r.data : _actListCache;
          let code = $searchCode.val().trim();
          let name = $searchName.val().trim();
          if (code) data = data.filter(function(i){ return (i.actcd||'').includes(code); });
          if (name) data = data.filter(function(i){ return (i.actnm||'').includes(name); });
          if (actGrid) actGrid.itemsSource = new wijmo.collections.CollectionView(data);
        });
      }

      actGrid = new wijmo.grid.FlexGrid('#act-grid', {
        autoGenerateColumns: false, showMarquee: true, isReadOnly: true,
        columns: [
          { binding: 'actcd', header: '현장코드', width: 120, align: 'center' },
          { binding: 'actnm', header: '현장명',   width: '*',  align: 'left'   },
        ],
        itemsSource: null
      });
      actGrid.rowHeaders.columns.splice(0, 1);

      fetchActList();

      $content.find('#btnActSearch').click(function() { fetchActList(); });
      $searchCode.add($searchName).on('keydown', function(e) { if (e.keyCode===13) fetchActList(); });

      actGrid.selectionChanged.addHandler(function(s) { selectedItem = s.collectionView.currentItem; });
      actGrid.hostElement.addEventListener('dblclick', function() {
        if (actGrid.selectedItems && actGrid.selectedItems.length) {
          selectAct(actGrid.selectedItems[0]); popContainer.close();
        }
      });

      $content.find('#btnActSelect').click(function() {
        if (selectedItem) { selectAct(selectedItem); popContainer.close(); }
        else { Alert.alert('', '현장을 선택해주세요.'); }
      });
    }

    function selectAct(item) {
      document.getElementById('actcd').value  = item.actcd || '';
      document.getElementById('actnm').value  = item.actnm || '';
      document.getElementById('equpcd').value = '';
      document.getElementById('equpnm').value = '';
      _equpCache = [];
    }

    /* ── 호기 팝업 (PopupDraggable + wijmo) ── */
    function openEqupPopup() {
      const actcd = document.getElementById('actcd').value;
      if (!actcd) { Alert.alert('', '현장을 먼저 선택해주세요.'); return; }

      let selectedItem = null;
      let equpGrid = null;

      let $content = $(tmpl('equpPopupTemplate', {}));
      let popContainer = new PopupDraggable('호기 선택');
      popContainer.open({ width: 500, height: 440, $content });

      AjaxUtil.getAsyncData('/api/web_request/read_equp', { actcd }, function(r) {
        _equpCache = (r && r.data) ? r.data : [];
        equpGrid = new wijmo.grid.FlexGrid('#equp-grid', {
          autoGenerateColumns: false, showMarquee: true, isReadOnly: true,
          columns: [
            { binding: 'equpcd', header: '호기코드', width: 100, align: 'center' },
            { binding: 'equpnm', header: '호기명',   width: '*',  align: 'left'   },
          ],
          itemsSource: new wijmo.collections.CollectionView(_equpCache)
        });
        equpGrid.rowHeaders.columns.splice(0, 1);
        equpGrid.selectionChanged.addHandler(function(s) { selectedItem = s.collectionView.currentItem; });
        equpGrid.hostElement.addEventListener('dblclick', function() {
          if (equpGrid.selectedItems && equpGrid.selectedItems.length) {
            selectEqup(equpGrid.selectedItems[0]); popContainer.close();
          }
        });
      });

      $content.find('#btnEqupSelect').click(function() {
        if (selectedItem) { selectEqup(selectedItem); popContainer.close(); }
        else { Alert.alert('', '호기를 선택해주세요.'); }
      });
    }

    function selectEqup(item) {
      document.getElementById('equpcd').value = item.equpcd || '';
      document.getElementById('equpnm').value = item.equpnm || '';
    }

    /* ── 기타 팝업 (구현 예정) ── */
    function openRepericPopup() { Alert.alert('', '담당기사 알림 팝업 (구현 예정)'); }
    function openContentsSearch(){ Alert.alert('', '고장내용 검색 팝업 (구현 예정)'); }
    function openCallbackList()  { Alert.alert('', '콜백리스트 팝업 (구현 예정)'); }
    function openPhoneBook()     { Alert.alert('', '전화번호부 팝업 (구현 예정)'); }
    function openSiteSearch()    { Alert.alert('', '보수현장조회 팝업 (구현 예정)'); }
    function searchElev()        { Alert.alert('', '승강기번호조회 (구현 예정)'); }

    /* ── 문자전송 ── */
    function sendSms() {
      const recedate = document.getElementById('hidRecedate').value;
      if (!recedate) { Alert.alert('', '접수 항목을 선택해주세요.'); return; }
      Alert.confirm('', '문자를 전송하시겠습니까?', function() {
        AjaxUtil.postAsyncData('/api/web_request/send_sms', {
          recedate, recenum: document.getElementById('hidRecenum').value
        }, function(result) {
          Alert.alert('', (result && result.message) || '전송 완료');
        });
      });
    }

    /* ── 우측 메모 ── */
    function newMemo() {
      const today = new Date().toISOString().split('T')[0];
      ['memoCusnm','memoCustel','memoCallback','memoCalltime','memoCallmemo','memoContent','memoProcess']
        .forEach(function(id){ document.getElementById(id).value = ''; });
      document.getElementById('memoRecedate').value = today;
      document.getElementById('memoRecetime').value = '';
    }

    function saveMemo() {
      const data = {
        recedate : document.getElementById('memoRecedate').value.replaceAll('-',''),
        recetime : document.getElementById('memoRecetime').value,
        cusnm    : document.getElementById('memoCusnm').value,
        custel   : document.getElementById('memoCustel').value,
        callback : document.getElementById('memoCallback').value,
        calltime : document.getElementById('memoCalltime').value,
        callmemo : document.getElementById('memoCallmemo').value,
        content  : document.getElementById('memoContent').value,
        process  : document.getElementById('memoProcess').value,
      };
      AjaxUtil.postAsyncData('/api/web_request/save_memo', data, function(result) {
        Alert.alert('', (result && result.message) || '등록되었습니다.', function() { searchMemo(); });
      });
    }

    function deleteMemo() { Alert.confirm('', '삭제하시겠습니까?', function() { Alert.alert('', '삭제되었습니다.'); }); }

    function searchMemo() {
      const date  = document.getElementById('memoSrchDate').value.replaceAll('-','');
      const cusnm = document.getElementById('memoSrchCusnm').value.trim();
      AjaxUtil.getAsyncData('/api/web_request/read_memo', { recedate: date, cusnm }, function(result) {
        renderMemoList(result && result.data ? result.data : []);
      });
    }

    function renderMemoList(list) {
      const wrap = document.getElementById('memoList');
      if (!list || !list.length) {
        wrap.innerHTML = '<div style="padding:10px;color:#bbb;font-size:12px;text-align:center;">내역 없음</div>';
        return;
      }
      wrap.innerHTML = list.map(function(item) {
        return `<div style="padding:6px 10px;border-bottom:1px solid #f0f0f0;font-size:12px;cursor:pointer;"
                     onclick="bindMemo(${JSON.stringify(item).replace(/"/g,'&quot;')})">
          <span style="color:#888;">${esc(item.recedate||'')}</span>
          <strong style="margin-left:6px;">${esc(item.cusnm||'')}</strong>
          <span style="color:#555;margin-left:6px;">${esc(item.content||'')}</span>
        </div>`;
      }).join('');
    }

    function bindMemo(item) {
      document.getElementById('memoRecedate').value = fmtDate(item.recedate);
      document.getElementById('memoRecetime').value = item.recetime  || '';
      document.getElementById('memoCusnm').value    = item.cusnm     || '';
      document.getElementById('memoCustel').value   = item.custel    || '';
      document.getElementById('memoCallback').value = item.callback  || '';
      document.getElementById('memoCalltime').value = item.calltime  || '';
      document.getElementById('memoCallmemo').value = item.callmemo  || '';
      document.getElementById('memoContent').value  = item.content   || '';
      document.getElementById('memoProcess').value  = item.process   || '';
    }

    /* ── 유틸 ── */
    function setNowTime(id) { document.getElementById(id).value = nowTimeStr(); }

    function fmtDate(val) {
      if (!val) return '';
      const s = String(val).replaceAll('-','');
      if (s.length < 8) return val;
      return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
    }

    function fmtTime(val) {
      if (!val) return '';
      const s = String(val).replaceAll(':','');
      if (s.length < 4) return val;
      return s.slice(0,2)+':'+s.slice(2,4);
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    $(document).ready(function() {
      $('#listActnm').on('keypress', function(e) { if (e.keyCode===13) searchList(); });
    });

  </script>
</th:block>
