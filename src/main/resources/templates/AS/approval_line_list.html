<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>결재라인현황</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>결재라인관리</li>
        <li>결재라인현황</li>
      </ul>
    </div>

    <div class="tab-wrap">
      <div class="tab-contents">
        <section class="tab-item">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label for="comcd">문서코드</label></dt>
                <dd>
                  <select id="comcd">
                    <option value=""></option>
                  </select>
                </dd>
              </dl>
            </div>
          </div>
          <div class="row">
            <div class="wp30 mg-r10">
              <div class="container-fluid col">
                <div id="theGrid" style="height:600px;"></div>
              </div>
            </div>
            <div class="col wp68">
              <div class="section">
                <div class="container-fluid col">
                  <div id="theGrid2" style="height:600px;"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <footer style="margin-top:12px;"><p>Copyrightⓒ corp. All rights reserved.</p></footer>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
    class ApprovalLineListPage {
      constructor() {
        this.theGrid  = null;
        this.theGrid2 = null;
        this.viewData  = new wijmo.collections.CollectionView();
        this.viewData2 = new wijmo.collections.CollectionView();
        this.selectedPerid   = null;
        this.selectedPapercd = null;
        this.init();
      }

      init() {
        // 왼쪽 그리드 — 사원별 문서 목록
        this.theGrid = new wijmo.grid.FlexGrid('#theGrid', {
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          selectionMode: wijmo.grid.SelectionMode.Row,
          formatItem: (s, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader)
              e.cell.style.textAlign = 'center';
          },
          columns: [
            { binding: 'perid',  header: '사원코드', width: '*', minWidth: 105, align: 'center' },
            { binding: 'pernm',  header: '사원명',   width: '*', minWidth: 105, align: 'center' },
            { binding: 'papernm',header: '문서명',   width: '*', minWidth: 105, align: 'center' },
            { binding: 'papercd',header: '문서코드', visible: false }
          ],
          itemsSource: this.viewData
        });
        this.theGrid.rowHeaders.columns.splice(0, 1);
        new FlexGridContextMenu(this.theGrid);
        this.theGrid.downloadFileName = '결재라인현황';

        // 더블클릭 — 오른쪽 그리드 로드
        this.theGrid.hostElement.addEventListener('dblclick', (e) => {
          let items = this.theGrid.selectedItems;
          if (!items.length) return;
          let item = items[0];
          if (!item || !item.perid) return;
          this.selectedPerid   = item.perid;
          this.selectedPapercd = item.papercd;
          this.fetchListData2(this.selectedPerid, this.selectedPapercd);
        });

        // 오른쪽 그리드 — 결재자 상세
        this.theGrid2 = new wijmo.grid.FlexGrid('#theGrid2', {
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          selectionMode: wijmo.grid.SelectionMode.Row,
          formatItem: (s, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader)
              e.cell.style.textAlign = 'center';
          },
          columns: [
            { binding: 'no',        header: 'No',    width: 80,  align: 'center' },
            { binding: 'kcpersonid',header: '결재자코드', width: '*', minWidth: 105, align: 'center' },
            { binding: 'kcpernm',   header: '결재자명',  width: '*', minWidth: 105, align: 'center' },
            { binding: 'gubunnm',   header: '구분',     width: '*', minWidth: 105, align: 'center' },
            { binding: 'seq',       header: '결재순서',  width: '*', minWidth: 105, align: 'center' },
            { binding: 'remark',    header: '비고',     width: '*', minWidth: 105, align: 'center' }
          ],
          itemsSource: this.viewData2
        });
        this.theGrid2.rowHeaders.columns.splice(0, 1);
        new FlexGridContextMenu(this.theGrid2);
        this.theGrid2.downloadFileName = '결재자상세';

        // 빈 행 초기화
        let emptyRows = [];
        while (emptyRows.length < 14) emptyRows.push({});
        this.viewData2 = new wijmo.collections.CollectionView(emptyRows);
        this.theGrid2.itemsSource = this.viewData2;
      }

      fetchListData() {
        AjaxUtil.getAsyncData('/api/AS/daily_approval/line/list', { comcd: $('#comcd').val() }, (result) => {
          if (result) {
            let rows = result.data || [];
            while (rows.length < 14) rows.push({});
            this.viewData = new wijmo.collections.CollectionView(rows);
            this.theGrid.itemsSource = this.viewData;
          }
        });
      }

      fetchListData2(perid, papercd) {
        AjaxUtil.getAsyncData('/api/AS/daily_approval/line/list_detail', { perid: perid, comcd: papercd }, (result) => {
          if (result) {
            let rows = result.data || [];
            while (rows.length < 14) rows.push({});
            this.viewData2 = new wijmo.collections.CollectionView(rows);
            this.theGrid2.itemsSource = this.viewData2;
          }
        });
      }

      changeComcdSelect() {
        this.selectedPerid = null;
        this.fetchListData();
        let emptyRows = [];
        while (emptyRows.length < 14) emptyRows.push({});
        this.viewData2 = new wijmo.collections.CollectionView(emptyRows);
        this.theGrid2.itemsSource = this.viewData2;
      }
    }

    let page = null;
    $(document).ready(function() {
      page = new ApprovalLineListPage();
      AjaxUtil.fillSelectOptions($('#comcd'), 'appr_doc', 'all', false, 'appr_doc');
      page.fetchListData();
      $('#comcd').on('change', function() { page.changeComcdSelect(); });
    });
  </script>
</th:block>
</html>
