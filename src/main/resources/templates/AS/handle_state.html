<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
    .wj-header { text-align: center !important; }

    /* 월별 표 — 건수 있는 칸만 눈에 띄게, 0 은 흐리게 */
    #monthGrid .wj-cell.month-has { color: #c0392b; font-weight: 600; }
    #monthGrid .wj-cell.month-zero { color: #b5b9c0; }
    #monthGrid .wj-cell.month-total { background: #f4f6f9; font-weight: 600; }
    #monthGrid .wj-colheaders .wj-cell { background: #e6ebf2; font-weight: 600; }

    .chart-summary {
      margin: 4px 0 10px;
      color: #666;
      font-size: 13px;
    }

    #monthlyChart {
      height: 490px;
    }

    #monthlyChartEmpty {
      display: none;
      height: 560px;
      line-height: 560px;
      text-align: center;
      color: #999;
    }
  </style>
</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <!-- Page Title -->
    <div class="page-title-wrap">
      <div class="left">
        <h2>고장처리현황</h2>
        <a title="북마크" class="bookmark toggle">내메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img src="/images/icon/ico-nav-home.svg" alt="홈아이콘"></li>
        <li>고장관리</li>
        <li>고장처리현황</li>
      </ul>
    </div>

    <div class="tab-wrap">
      <ul class="tab-links">
        <li><a href="#tabList" title="처리목록" id="listTabLink">처리목록</a></li>
        <li><a href="#tabMonthGrid" title="월별 호기별 현황" id="monthGridTabLink">월별 호기별 현황</a></li>
        <li><a href="#tabChart" title="현황 그래프" id="chartTabLink">현황 그래프</a></li>
      </ul>

      <div class="tab-contents">
        <!-- ── 탭 1: 처리목록 (기존 화면) ── -->
        <section class="tab-item" id="tabList">
          <section class="section">
            <div class="section-top">
              <div class="search-wrap">
                <!-- 조회기간 -->
                <dl>
                  <dt><label>조회기간</label></dt>
                  <dd>
                    <div class="srch-box" style="display: flex; align-items: center; gap: 5px;">
                      <input type="date" id="startDate" class="form-control2" style="width: 140px;">
                      <span>~</span>
                      <input type="date" id="endDate" class="form-control2" style="width: 140px;">
                    </div>
                  </dd>
                </dl>
                <!-- 현장명 -->
                <dl>
                  <dt><label>현장명</label></dt>
                  <dd>
                    <div class="srch-box">
                      <input type="text" id="txtActnm" class="form-control2" placeholder="현장명 검색"/>
                    </div>
                  </dd>
                </dl>
                <!-- 검색버튼 -->
                <dl>
                  <dt><span class="eq"></span></dt>
                  <dd>
                    <li>
                      <a class="btn btn-delete" title="검색" id="btnSearch">
                        <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                        검색
                      </a>
                    </li>
                  </dd>
                </dl>
              </div>
            </div>

            <div class="container-fluid">
              <div id="theGrid" style="height: 600px;"></div>
            </div>
          </section>
        </section>

        <!-- ── 탭 2: 월별 호기별 고장처리 건수 표 ── -->
        <section class="tab-item" id="tabMonthGrid">
          <section class="section">
            <div class="section-top">
              <div class="search-wrap">
                <dl>
                  <dt><label for="gridFromDate">조회기간</label></dt>
                  <dd>
                    <div class="srch-box" style="display: flex; align-items: center; gap: 5px;">
                      <input type="date" id="gridFromDate" class="form-control2" style="width: 140px;">
                      <span>~</span>
                      <input type="date" id="gridToDate" class="form-control2" style="width: 140px;">
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt><label for="txtGridActnm">현장명</label></dt>
                  <dd>
                    <div class="srch-box">
                      <input type="text" id="txtGridActnm" class="form-control2" placeholder="현장명 검색"/>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt><label for="txtGridEqupnm">호기명</label></dt>
                  <dd>
                    <div class="srch-box">
                      <input type="text" id="txtGridEqupnm" class="form-control2" placeholder="호기명 검색"/>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt><span class="eq"></span></dt>
                  <dd>
                    <li>
                      <a class="btn btn-delete" title="검색" id="btnGridSearch">
                        <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                        검색
                      </a>
                    </li>
                  </dd>
                </dl>
              </div>
            </div>

            <div class="container-fluid">
              <p class="chart-summary" id="gridSummary"></p>
              <div id="monthGrid" style="height: 600px;"></div>
            </div>
          </section>
        </section>

        <!-- ── 탭 3: 월별 호기별 고장처리 건수 그래프 ── -->
        <section class="tab-item" id="tabChart">
          <section class="section">
            <div class="section-top">
              <div class="search-wrap">
                <dl>
                  <dt><label for="chartFromDate">조회기간</label></dt>
                  <dd>
                    <div class="srch-box" style="display: flex; align-items: center; gap: 5px;">
                      <input type="date" id="chartFromDate" class="form-control2" style="width: 140px;">
                      <span>~</span>
                      <input type="date" id="chartToDate" class="form-control2" style="width: 140px;">
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt><label for="txtChartActnm">현장명</label></dt>
                  <dd>
                    <div class="srch-box">
                      <input type="text" id="txtChartActnm" class="form-control2" placeholder="현장명 검색"/>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt><label for="txtChartEqupnm">호기명</label></dt>
                  <dd>
                    <div class="srch-box">
                      <input type="text" id="txtChartEqupnm" class="form-control2" placeholder="호기명 검색"/>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt><span class="eq"></span></dt>
                  <dd>
                    <li>
                      <a class="btn btn-delete" title="검색" id="btnChartSearch">
                        <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                        검색
                      </a>
                    </li>
                  </dd>
                </dl>
              </div>
            </div>

            <div class="container-fluid">
              <p class="chart-summary" id="chartSummary"></p>
              <div id="monthlyChart"></div>
              <div id="monthlyChartEmpty">조회된 고장처리 내역이 없습니다.</div>
            </div>
          </section>
        </section>
      </div>
    </div>
  </div>

  <footer style="margin-top: 24px;">
    <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
  </footer>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/columns_setting :: columns_setting"></th:block>
  <script type="text/javascript">

    var theGrid;
    var viewdata;

    let columns = [
      {binding: 'compdate',   header: '완료일자', width: 110, align: 'center',
        cellTemplate: function(ctx) {
          const v = ctx.value == null ? '' : String(ctx.value);
          return v.length === 8 ? `${v.substring(0,4)}.${v.substring(4,6)}.${v.substring(6,8)}` : v;
        }
      },
      {binding: 'comptime',   header: '완료시간', width: 90, align: 'center',
        cellTemplate: function(ctx) {
          const v = ctx.value == null ? '' : String(ctx.value).replace(/:/g,'');
          return v.length >= 4 ? `${v.substring(0,2)}:${v.substring(2,4)}` : v;
        }
      },
      {binding: 'recpernm',   header: '통보자',       width: 80,  align: 'center'},
      {binding: 'delpernm',   header: '접수자',       width: 80,  align: 'center'},
      {binding: 'actpernm',   header: '처리자',       width: 80,  align: 'center'},
      {binding: 'mgrpernm',   header: '담당자',       width: 80,  align: 'center'},
      {binding: 'actnm',      header: '현장명',       width: 160, align: 'left'},
      {binding: 'equpnm',     header: '호기명',       width: 110, align: 'left'},
      {binding: 'contremark', header: '고장부위',     width: 120, align: 'left'},
      {binding: 'customer',   header: '처리내용',     width: '*', align: 'left'},
      {binding: 'remark',     header: '처리결과',     width: 120, align: 'left'},
    ];

    document.readyState === 'complete' ? init() : window.onload = init;

    function init() {
      // 기본 조회기간: 이번 달 1일 ~ 오늘
      const today = new Date();
      const yyyy  = today.getFullYear();
      const mm    = String(today.getMonth() + 1).padStart(2, '0');
      const dd    = String(today.getDate()).padStart(2, '0');
      document.getElementById('startDate').value = `${yyyy}-${mm}-01`;
      document.getElementById('endDate').value   = `${yyyy}-${mm}-${dd}`;

      // 그리드 초기화
      viewdata = new wijmo.collections.CollectionView([]);
      theGrid  = new wijmo.grid.FlexGrid('#theGrid', {
        autoGenerateColumns: false,
        showMarquee: true,
        columns: columns,
        isReadOnly: true,
        itemsSource: viewdata
      });
      theGrid.rowHeaders.columns.splice(0, 1);
      new FlexGridContextMenu(theGrid);
      theGrid.downloadFileName = '고장처리현황';

      // 월별 표·그래프 탭 조회기간: 기본 올해 1월 1일 ~ 오늘
      $('#gridFromDate, #chartFromDate').val(`${yyyy}-01-01`);
      $('#gridToDate, #chartToDate').val(`${yyyy}-${mm}-${dd}`);

      searchMainData();
    }

    function searchMainData() {
      const startDate = document.getElementById('startDate').value.replaceAll('-', '');
      const endDate   = document.getElementById('endDate').value.replaceAll('-', '');
      const actnm     = document.getElementById('txtActnm').value.trim();

      if (!startDate || !endDate) {
        Alert.alert('', '조회기간을 입력해주세요.');
        return;
      }

      const data = {
        fromDate : startDate,
        toDate   : endDate,
        actnm    : actnm,
        spjangcd : sessionStorage.getItem('spjangcd')
      };

      AjaxUtil.getAsyncData('/api/AS/web_handle/comp_list', data, function (result) {
        if (result != null) {
          gridBinding(result.data);
        } else {
          Alert.alert('', '조회 중 오류가 발생하였습니다.');
        }
      });
    }

    function gridBinding(data) {
      theGrid.columns.clear();
      theGrid.autoGenerateColumns = false;
      columns.forEach(function(colDef) {
        theGrid.columns.push(new wijmo.grid.Column(colDef));
      });
      viewdata = new wijmo.collections.CollectionView(data || []);
      theGrid.itemsSource = viewdata;
      theGrid.refresh();
    }

    // ───────────────────────────────────────────────────────────
    //  탭 2 — 월별 호기별 고장처리 건수
    //
    //  X축은 조회기간에 걸친 월, 호기마다 한 계열로 쌓은 막대. 막대 전체 높이가 그 달의 합계다.
    //  한 해에 호기가 150개가 넘어(경기 2026년 157개) 계열을 다 그리면 읽을 수 없으므로
    //  건수가 많은 호기부터 CHART_TOP_N 개만 따로 그리고 나머지는 '기타'로 묶는다.
    //  현장명·호기명으로 좁히면 그 안에서 같은 규칙을 적용한다.
    // ───────────────────────────────────────────────────────────
    const CHART_TOP_N = 10;
    let monthlyChart = null;

    // 조회기간 입력 → {from, to, label} (yyyyMMdd). 잘못됐으면 알리고 null
    function readPeriod(fromSel, toSel) {
      const from = ($(fromSel).val() || '').replaceAll('-', '');
      const to   = ($(toSel).val() || '').replaceAll('-', '');
      if (from.length !== 8 || to.length !== 8) { Alert.alert('', '조회기간을 입력해주세요.'); return null; }
      if (from > to) { Alert.alert('', '조회기간 시작일이 종료일보다 늦습니다.'); return null; }
      const fmt = s => `${s.substring(0, 4)}.${s.substring(4, 6)}.${s.substring(6, 8)}`;
      return {from: from, to: to, label: fmt(from) + ' ~ ' + fmt(to)};
    }

    // 조회기간에 걸친 월 목록. 한 해 안이면 '3월', 해를 넘기면 '25.12월' 처럼 연도를 붙인다
    function monthsOf(period) {
      const list = [];
      let y = Number(period.from.substring(0, 4)), m = Number(period.from.substring(4, 6));
      const ey = Number(period.to.substring(0, 4)), em = Number(period.to.substring(4, 6));
      const sameYear = y === ey;
      while (y < ey || (y === ey && m <= em)) {
        const ym = String(y) + String(m).padStart(2, '0');
        list.push({ym: ym, label: sameYear ? m + '월' : String(y).substring(2) + '.' + m + '월'});
        m++;
        if (m > 12) { m = 1; y++; }
      }
      return list;
    }

    function ensureChart() {
      if (monthlyChart) return monthlyChart;

      monthlyChart = new wijmo.chart.FlexChart('#monthlyChart', {
        chartType: wijmo.chart.ChartType.Column,
        stacking: wijmo.chart.Stacking.Stacked,
        bindingX: 'month',
        legend: { position: wijmo.chart.Position.Right },
        axisX: { title: '월' },
        axisY: { title: '처리건수', format: 'n0', min: 0 },
        tooltip: { content: '<b>{seriesName}</b><br/>{x} : {y}건' },
        palette: ['#2f6fdd', '#e8793b', '#3aa37a', '#c94c7c', '#8a63d2',
                  '#d9a520', '#2aa6b8', '#b5553c', '#5f7d2f', '#6b7a99', '#b8bec9']
      });
      return monthlyChart;
    }

    function searchChartData() {
      const period = readPeriod('#chartFromDate', '#chartToDate');
      if (!period) return;
      const data = {
        fromDate : period.from,
        toDate   : period.to,
        actnm    : $('#txtChartActnm').val().trim(),
        equpnm   : $('#txtChartEqupnm').val().trim(),
        spjangcd : sessionStorage.getItem('spjangcd')
      };

      AjaxUtil.getAsyncData('/api/AS/web_handle/monthly_equp', data, function (result) {
        if (!result || result.success === false) {
          Alert.alert('', (result && result.message) || '조회 중 오류가 발생하였습니다.');
          return;
        }
        drawChart(period, result.data || []);
      });
    }

    function drawChart(period, rows) {
      const chart = ensureChart();
      const months = monthsOf(period);
      const monthIndex = new Map(months.map((mo, i) => [mo.ym, i]));

      // 호기(현장+호기코드)별로 월별 건수를 모은다
      const equpMap = new Map();
      rows.forEach(r => {
        const key = (r.actcd || '') + '|' + (r.equpcd || '');
        if (!equpMap.has(key)) {
          const equp = r.equpnm || r.equpcd || '(호기 없음)';
          equpMap.set(key, {name: (r.actnm || '') + ' / ' + equp, months: new Array(months.length).fill(0), total: 0});
        }
        const e = equpMap.get(key);
        const i = monthIndex.get(String(r.ym));
        const c = Number(r.cnt) || 0;
        if (i !== undefined) {
          e.months[i] += c;
          e.total += c;
        }
      });

      const equps = Array.from(equpMap.values()).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
      const total = equps.reduce((s, e) => s + e.total, 0);

      if (equps.length === 0) {
        $('#monthlyChart').hide();
        $('#monthlyChartEmpty').show();
        $('#chartSummary').text(period.label);
        return;
      }
      $('#monthlyChartEmpty').hide();
      $('#monthlyChart').show();

      const shown = equps.slice(0, CHART_TOP_N);
      const others = equps.slice(CHART_TOP_N);

      // FlexChart 에 넣을 월별 행 (조회기간에 걸친 달마다 하나)
      const items = [];
      for (let i = 0; i < months.length; i++) {
        const item = {month: months[i].label};
        shown.forEach((e, idx) => { item['s' + idx] = e.months[i]; });
        if (others.length > 0) {
          item.etc = others.reduce((s, e) => s + e.months[i], 0);
        }
        items.push(item);
      }

      // 건수가 작으면 0.5 같은 눈금이 생겨 1 단위로 고정하고, 크면 차트가 알아서 정하게 둔다
      const maxMonth = Math.max(...items.map(it =>
        Object.keys(it).filter(k => k !== 'month').reduce((s, k) => s + (it[k] || 0), 0)));

      chart.beginUpdate();
      chart.axisY.majorUnit = maxMonth <= 10 ? 1 : null;
      chart.series.clear();
      shown.forEach((e, idx) => {
        chart.series.push(new wijmo.chart.Series({name: e.name + ' (' + e.total + ')', binding: 's' + idx}));
      });
      if (others.length > 0) {
        const etcTotal = others.reduce((s, e) => s + e.total, 0);
        chart.series.push(new wijmo.chart.Series({name: '기타 호기 ' + others.length + '개 (' + etcTotal + ')', binding: 'etc'}));
      }
      chart.itemsSource = items;
      chart.endUpdate();
      chart.invalidate();   // '조회 내역 없음'에서 다시 보일 때 크기를 다시 잰다

      $('#chartSummary').text(
        period.label + ' 고장처리 ' + total.toLocaleString() + '건 · 호기 ' + equps.length + '개' +
        (others.length > 0 ? ' (건수 상위 ' + CHART_TOP_N + '개 호기만 따로 표시)' : ''));
    }

    // ───────────────────────────────────────────────────────────
    //  탭 2 — 월별 호기별 고장처리 건수 표
    //  행 = 호기(현장+호기), 열 = 조회기간에 걸친 월 + 합계, 맨 아래 합계 행. 그래프 탭과 같은 API 를 쓴다.
    //  월 열은 조회할 때마다 기간에 맞춰 다시 만든다 (m + yyyyMM).
    // ───────────────────────────────────────────────────────────
    let monthGrid = null;

    function monthGridColumns(months) {
      const cols = [
        {binding: 'no',     header: 'No',     width: 55,  align: 'center', allowSorting: false},
        {binding: 'actnm',  header: '현장명', width: 260, align: 'left'},
        {binding: 'equpnm', header: '호기명', width: 120, align: 'center'}
      ];
      months.forEach(mo => {
        cols.push({binding: 'm' + mo.ym, header: mo.label, width: mo.label.length > 3 ? 74 : 62, align: 'center',
                   dataType: wijmo.DataType.Number, format: 'n0', aggregate: 'Sum'});
      });
      cols.push({binding: 'total', header: '합계', width: 80, align: 'center', dataType: wijmo.DataType.Number,
                 format: 'n0', aggregate: 'Sum'});
      return cols;
    }

    function ensureMonthGrid() {
      if (monthGrid) return monthGrid;

      monthGrid = new wijmo.grid.FlexGrid('#monthGrid', {
        autoGenerateColumns: false,
        isReadOnly: true,
        selectionMode: wijmo.grid.SelectionMode.Row,
        showMarquee: true,
        frozenColumns: 3,
        columns: monthGridColumns([]),
        itemsSource: new wijmo.collections.CollectionView([]),
        formatItem: function (s, e) {
          if (e.panel !== s.cells && e.panel !== s.columnFooters) return;
          // 셀 DOM 이 다른 열에 재사용되므로 붙였다 뗐다를 매번 모두 한다
          const binding = s.columns[e.col].binding;
          const isMonth = /^m\d+$/.test(binding);
          const v = Number(e.panel.getCellData(e.row, e.col, false)) || 0;
          wijmo.toggleClass(e.cell, 'month-total', binding === 'total');
          wijmo.toggleClass(e.cell, 'month-has', isMonth && v > 0);
          wijmo.toggleClass(e.cell, 'month-zero', isMonth && v === 0);
        }
      });
      monthGrid.rowHeaders.columns.splice(0, 1);
      monthGrid.columnFooters.rows.push(new wijmo.grid.GroupRow());
      monthGrid.columnFooters.setCellData(0, 1, '합계');
      new FlexGridContextMenu(monthGrid);
      return monthGrid;
    }

    function searchMonthGrid() {
      const period = readPeriod('#gridFromDate', '#gridToDate');
      if (!period) return;
      const data = {
        fromDate : period.from,
        toDate   : period.to,
        actnm    : $('#txtGridActnm').val().trim(),
        equpnm   : $('#txtGridEqupnm').val().trim(),
        spjangcd : sessionStorage.getItem('spjangcd')
      };

      AjaxUtil.getAsyncData('/api/AS/web_handle/monthly_equp', data, function (result) {
        if (!result || result.success === false) {
          Alert.alert('', (result && result.message) || '조회 중 오류가 발생하였습니다.');
          return;
        }
        drawMonthGrid(period, result.data || []);
      });
    }

    function drawMonthGrid(period, rows) {
      const grid = ensureMonthGrid();
      const months = monthsOf(period);

      const equpMap = new Map();
      rows.forEach(r => {
        const key = (r.actcd || '') + '|' + (r.equpcd || '');
        if (!equpMap.has(key)) {
          const item = {actnm: r.actnm || '', equpnm: r.equpnm || r.equpcd || '(호기 없음)', total: 0};
          months.forEach(mo => { item['m' + mo.ym] = 0; });
          equpMap.set(key, item);
        }
        const item = equpMap.get(key);
        const field = 'm' + r.ym;
        const c = Number(r.cnt) || 0;
        if (field in item) {
          item[field] += c;
          item.total += c;
        }
      });

      const items = Array.from(equpMap.values())
        .sort((a, b) => a.actnm.localeCompare(b.actnm) || a.equpnm.localeCompare(b.equpnm, undefined, {numeric: true}));
      items.forEach((it, i) => { it.no = i + 1; });

      // 기간에 맞춰 월 열을 다시 만든다
      grid.beginUpdate();
      grid.columns.clear();
      monthGridColumns(months).forEach(def => grid.columns.push(new wijmo.grid.Column(def)));
      grid.itemsSource = new wijmo.collections.CollectionView(items);
      grid.endUpdate();
      grid.columnFooters.setCellData(0, 1, '합계');
      grid.downloadFileName = '월별_호기별_고장처리현황_' + period.from + '_' + period.to;

      const total = items.reduce((s, it) => s + it.total, 0);
      $('#gridSummary').text(period.label + ' 고장처리 ' + total.toLocaleString() + '건 · 호기 ' + items.length + '개');
    }

    $(document.body).ready(function () {
      $('#btnSearch').click(function () { searchMainData(); });
      $('#txtActnm').on('keypress', function (e) {
        if (e.keyCode === 13) searchMainData();
      });

      $('#btnGridSearch').click(function () { searchMonthGrid(); });
      $('#txtGridActnm, #txtGridEqupnm').on('keypress', function (e) {
        if (e.keyCode === 13) searchMonthGrid();
      });

      // 숨은 탭에서는 그리드 크기를 잴 수 없어 탭이 보인 뒤에 만들거나 다시 맞춘다
      let monthGridLoaded = false;
      $('#monthGridTabLink').click(function () {
        setTimeout(function () {
          if (!monthGridLoaded) {
            monthGridLoaded = true;
            searchMonthGrid();
          } else if (monthGrid) {
            monthGrid.invalidate();
          }
        }, 0);
      });

      $('#btnChartSearch').click(function () { searchChartData(); });
      $('#txtChartActnm, #txtChartEqupnm').on('keypress', function (e) {
        if (e.keyCode === 13) searchChartData();
      });

      // 숨겨진 탭 안에서는 차트 크기를 잴 수 없어 탭이 보인 뒤에 그리거나 다시 맞춘다
      let chartLoaded = false;
      $('#chartTabLink').click(function () {
        setTimeout(function () {
          if (!chartLoaded) {
            chartLoaded = true;
            searchChartData();
          } else if (monthlyChart) {
            monthlyChart.invalidate();
          }
        }, 0);
      });
    });

  </script>
</th:block>
