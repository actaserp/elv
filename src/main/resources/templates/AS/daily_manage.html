<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .wj-header { text-align: center !important; }

        /* ── 작성현황 달력 테이블 ── */
        #statusTable {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
            table-layout: fixed;
        }
        #statusTable th, #statusTable td {
            border: 1px solid #ccc;
            text-align: center;
            vertical-align: middle;
            padding: 3px 2px;
            white-space: nowrap;
            overflow: hidden;
        }
        .col-no     { width: 34px; }
        .col-dept   { width: 80px; }
        .col-name   { width: 68px; }
        .col-rank   { width: 54px; }
        .col-day    { width: 24px; }
        .col-summary{ width: 44px; }

        #statusTable thead tr:first-child th { background: #dce6f1; font-weight: 700; }
        #statusTable thead tr:last-child  th { background: #eaf0f8; }

        .col-sun { color: #cc0000 !important; }
        .col-sat { color: #2255cc !important; }

        .val-x { color: #cc0000; font-weight: 700; }
        .val-0 { color: #444;    font-weight: 400; }

        .row-total td { background: #f0f0f0; font-weight: 700; }

        .fixed-col  { position: sticky; background: #fff; z-index: 2; }
        .fixed-no   { left: 0px;   width: 34px; }
        .fixed-dept { left: 34px;  width: 80px; }
        .fixed-name { left: 114px; width: 68px; }
        .fixed-rank { left: 182px; width: 54px; }

        .table-scroll-wrap {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 600px;
            border: 1px solid #ccc;
            margin-top: 8px;
        }

        #statusTable thead tr:first-child th           { position: sticky; top: 0;    z-index: 3; }
        #statusTable thead tr:first-child th.fixed-col { z-index: 5; }
        #statusTable thead tr:last-child th            { position: sticky; top: 48px; z-index: 3; }
        #statusTable thead tr:last-child th.fixed-col  { z-index: 5; }

        .row-total td              { position: sticky; bottom: 0; z-index: 2; }
        .row-total td.fixed-col    { z-index: 4; background: #f0f0f0; }

        /* ── 좌우 분할 레이아웃 ── */
        .grid-split-wrap {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .grid-split-wrap .grid-left {
            flex: 0 0 420px;
        }
        .grid-split-wrap .grid-right {
            flex: 1;
            border-left: 2px solid #4472c4;
            padding-left: 12px;
        }
        .detail-label {
            font-size: 13px;
            font-weight: 700;
            color: #4472c4;
            padding: 0 0 6px 0;
        }
    </style>
</head>

<th:block layout:fragment="scripts">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="text/javascript">

        const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

        var selectedDetail = null;

        document.readyState === 'complete' ? init() : window.onload = init;

        function init() {
            initTab1();
            initTab2();
            applyUserGroupUi();
        }

        // User 그룹이면 관리자 전용 UI(부서별업무보고 버튼) 숨김
        function applyUserGroupUi() {
            AjaxUtil.getAsyncData('/api/AS/daily_manage/user_group', {}, function (result) {
                if (result && result.data && result.data.isUserGroup) {
                    const btn = document.getElementById('btnDeptReport');
                    if (btn) btn.closest('dl').style.display = 'none';
                }
            });
        }

        /* ═══════════════════════════════════════════
           TAB 1 — 업무일지 현황
        ═══════════════════════════════════════════ */
        var headGrid, headData, detailGrid, detailData;

        const headColumns = [
            {binding: 'rptdate', header: '작성일자', width: 110, align: 'center'},
            {binding: 'pernm',   header: '사원명',   width: 100, align: 'center'},
            {binding: 'clanm',   header: '직위',     width: 100, align: 'center'},
            {binding: 'divinm',  header: '부서',     width: '*', align: 'center'},
            {binding: 'rptcnt',  header: '작성건수', width:  80, align: 'center'},
        ];

        const detailColumns = [
            {binding: 'rptnum',   header: '순번',     width:  60, align: 'center'},
            {binding: 'businm',   header: '구분',     width: 100, align: 'center'},
            {binding: 'actnm',    header: '행선지',   width: 150, align: 'left'},
            {binding: 'remark',   header: '세부내용', width: '*', align: 'left'},
            {binding: 'frtime',   header: '도착시간', width:  90, align: 'center'},
            {binding: 'totime',   header: '완료시간', width:  90, align: 'center'},
            {binding: 'equpnm',   header: '호기명',   width: 150, align: 'left'},
            {binding: 'filesvnm', header: '첨부파일', width: 120, align: 'center'},
            {binding: 'filepath', visible: false},
        ];

        function initTab1() {
            const today = new Date();
            document.getElementById('manageYear').value  = today.getFullYear();
            document.getElementById('manageMonth').value = String(today.getMonth() + 1).padStart(2, '0');

            headData = new wijmo.collections.CollectionView([]);
            headGrid = new wijmo.grid.FlexGrid('#headGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                columns: headColumns,
                isReadOnly: true,
                itemsSource: headData,
                formatItem: function(s, e) {
                    if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
                    const col = s.columns[e.col];
                    if (col.binding === 'rptdate') {
                        const val = s.getCellData(e.row, e.col, false);
                        if (val && String(val).length === 8) {
                            const v = String(val);
                            e.cell.textContent = `${v.substring(0,4)}.${v.substring(4,6)}.${v.substring(6,8)}`;
                        }
                    }
                }
            });
            headGrid.rowHeaders.columns.splice(0, 1);

            headGrid.selectionChanged.addHandler(function (s, e) {
                const row = s.selectedRows[0];
                if (row && row.dataItem) {
                    const d = row.dataItem;
                    loadDetailData(d.custcd, d.spjangcd, d.rptdate, d.perid, d.pernm);
                }
            });

            detailData = new wijmo.collections.CollectionView([]);
            detailGrid = new wijmo.grid.FlexGrid('#detailGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                columns: detailColumns,
                isReadOnly: true,
                itemsSource: detailData,
                formatItem: function(s, e) {
                    if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
                    const col = s.columns[e.col];
                    if (col.binding === 'frtime' || col.binding === 'totime') {
                        const val = s.getCellData(e.row, e.col, false);
                        if (val && String(val).length >= 4) {
                            const v = String(val).replace(':', '');
                            e.cell.textContent = `${v.substring(0,2)}:${v.substring(2,4)}`;
                        }
                    }
                    if (col.binding === 'filesvnm') {
                        const item     = s.rows[e.row].dataItem;
                        const filesvnm = item && item.filesvnm ? item.filesvnm.trim() : '';
                        const filepath = item && item.filepath  ? item.filepath.trim()  : '';
                        if (filesvnm) {
                            const url = withCtx('/api/daily_report/download')
                                + '?filepath=' + encodeURIComponent(filepath)
                                + '&filesvnm=' + encodeURIComponent(filesvnm);
                            e.cell.innerHTML = `<a href="${url}" target="_blank"
                                style="color:#4472c4; text-decoration:underline; font-size:12px;">
                                📎 다운로드</a>`;
                        } else {
                            e.cell.innerHTML = '';
                        }
                    }
                }
            });
            detailGrid.rowHeaders.columns.splice(0, 1);

            detailGrid.selectionChanged.addHandler(function (s, e) {
                const row = s.selectedRows[0];
                selectedDetail = (row && row.dataItem) ? row.dataItem : null;
            });

            $('#btnSearch1').click(function () { searchManageData(); });
            $('#txtPernm').on('keypress', function (e) {
                if (e.keyCode === 13) searchManageData();
            });
            $('#btnDel').click(function () { deleteReport(); });

            searchManageData();
        }

        function searchManageData() {
            const year  = document.getElementById('manageYear').value;

        function renderTable(rows, year, month) {
            const daysInMonth = new Date(year, month, 0).getDate();
            const head = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            head.innerHTML = '';
            body.innerHTML = '';

            let tr1 = `<tr>
                <th class="col-no   fixed-col fixed-no"   rowspan="2">No</th>
                <th class="col-dept fixed-col fixed-dept" rowspan="2">부서명</th>
                <th class="col-name fixed-col fixed-name" rowspan="2">사원명</th>
                <th class="col-rank fixed-col fixed-rank" rowspan="2">직위</th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(year, month - 1, d).getDay();
                const cls = dow === 0 ? 'col-sun' : (dow === 6 ? 'col-sat' : '');
                tr1 += `<th class="col-day ${cls}">${d}일</th>`;
            }
            tr1 += `<th class="col-summary" rowspan="2">작성일</th>
                    <th class="col-summary" rowspan="2">미작성</th></tr>`;
            head.innerHTML += tr1;

            let tr2 = '<tr>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(year, month - 1, d).getDay();
                const cls = dow === 0 ? 'col-sun' : (dow === 6 ? 'col-sat' : '');
                tr2 += `<th class="col-day ${cls}">${DAY_NAMES[dow]}</th>`;
            }
            tr2 += '</tr>';
            head.innerHTML += tr2;

            if (!rows || rows.length === 0) {
                body.innerHTML = `<tr><td colspan="${4 + daysInMonth + 2}"
                    style="padding:20px; color:#999;">조회된 데이터가 없습니다.</td></tr>`;
                return;
            }

            const writtenMap  = {};
            const personMap   = {};
            const personOrder = [];
            rows.forEach(function (r) {
                if (!personMap[r.perid]) {
                    personMap[r.perid]  = { perid: r.perid, pernm: r.pernm, clanm: r.clanm, divinm: r.divinm };
                    writtenMap[r.perid] = new Set();
                    personOrder.push(r.perid);
                }
                if (r.rptdate) {
                    writtenMap[r.perid].add(parseInt(r.rptdate.substring(6, 8)));
                }
            });

            const dayTotal = new Array(daysInMonth + 1).fill(0);
            let totalWritten = 0, totalNotWritten = 0;

            personOrder.forEach(function (perid, idx) {
                const person  = personMap[perid];
                const written = writtenMap[perid];

                let workdays = 0, writtenCnt = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dow = new Date(year, month - 1, d).getDay();
                    if (dow !== 0 && dow !== 6) workdays++;
                    if (written.has(d)) { writtenCnt++; dayTotal[d]++; }
                }
                const notWritten = Math.max(workdays - writtenCnt, 0);
                totalWritten    += writtenCnt;
                totalNotWritten += notWritten;

                let row = `<tr>
                    <td class="fixed-col fixed-no">${idx + 1}</td>
                    <td class="fixed-col fixed-dept" title="${esc(person.divinm)}">${esc(person.divinm)}</td>
                    <td class="fixed-col fixed-name" title="${esc(person.pernm)}">${esc(person.pernm)}</td>
                    <td class="fixed-col fixed-rank">${esc(person.clanm)}</td>`;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dow = new Date(year, month - 1, d).getDay();
                    if (written.has(d))              row += `<td class="val-x">√</td>`;
                    else if (dow === 0 || dow === 6) row += `<td></td>`;
                    else                             row += `<td class="val-0">0</td>`;
                }
                row += `<td>${writtenCnt}</td><td>${notWritten}</td></tr>`;
                body.innerHTML += row;
            });

            let totalRow = `<tr class="row-total">
                <td class="fixed-col fixed-no col-no" colspan="4"
                    style="text-align:center; left:0; width:236px;">합 계</td>`;
            for (let d = 1; d <= daysInMonth; d++) {
                totalRow += `<td>${dayTotal[d] > 0 ? dayTotal[d] : ''}</td>`;
            }
            totalRow += `<td>${totalWritten}</td><td>${totalNotWritten}</td></tr>`;
            body.innerHTML += totalRow;
        }

            sel.innerHTML = '<option value="">-- 선택 --</option>';
            if (!actcd) return;
            AjaxUtil.getAsyncData('/api/AS/daily_manage/read_equp', { actcd: actcd }, function (r) {
                (r && r.data ? r.data : []).forEach(function (e) {
                    sel.innerHTML += `<option value="${esc(e.equpcd)}">${esc(e.equpnm)}</option>`;
                });
            });
        }

        function uploadRegFile() {
            const fileInput = document.getElementById('regFile');
            if (!fileInput.files || fileInput.files.length === 0) { _regFile = null; return; }
            const fd = new FormData();
            fd.append('file', fileInput.files[0]);
            document.getElementById('regFileInfo').textContent = '업로드 중...';
            $.ajax({
                url: withCtx('/api/AS/daily_manage/upload_file'),
                type: 'POST',
                data: fd,
                processData: false,
                contentType: false,
                headers: { 'X-CSRF-Token': $('[name=_csrf]').val() },
                success: function (res) {
                    if (res && res.success && res.data) {
                        _regFile = { filesvnm: res.data.filesvnm, filepath: res.data.filepath };
                        document.getElementById('regFileInfo').textContent = '첨부됨: ' + (res.data.fileornm || '');
                    } else {
                        _regFile = null;
                        document.getElementById('regFileInfo').textContent = '';
                        Alert.alert('', (res && res.message) || '파일 업로드 실패');
                    }
                },
                error: function () {
                    _regFile = null;
                    document.getElementById('regFileInfo').textContent = '';
                    Alert.alert('', '파일 업로드 중 오류가 발생하였습니다.');
                }
            });
        }

        function saveReport() {
            const writeDate = document.getElementById('regDate').value;
            const wkcd      = document.getElementById('regGubun').value;
            const destSel   = document.getElementById('regDest');
            const actcd     = destSel.value;
            const actnm     = destSel.selectedOptions[0] ? (destSel.selectedOptions[0].getAttribute('data-actnm') || '') : '';
            const equpcd    = document.getElementById('regEqup').value;
            const frtime    = document.getElementById('regFrtime').value.replace(':', '');
            const totime    = document.getElementById('regTotime').value.replace(':', '');
            const remark    = document.getElementById('regRemark').value;

            if (!writeDate) { Alert.alert('', '작성일자를 선택해주세요.'); return; }
            if (!actcd)     { Alert.alert('', '행선지를 선택해주세요.'); return; }

            const btn = document.getElementById('regSaveBtn');
            btn.disabled = true;

            const done = function (result) {
                btn.disabled = false;
                if (result && result.success) {
                    Alert.alert('', result.message, function () {
                        closeRegModal();
                        searchManageData();
                    });
                } else {
                    Alert.alert('', (result && result.message) || '처리 중 오류가 발생하였습니다.');
                }
            };

            if (_regEditKey) {
                // 수정
                AjaxUtil.postAsyncData('/api/AS/daily_manage/update_status', {
                    custcd   : _regEditKey.custcd,
                    spjangcd : _regEditKey.spjangcd,
                    rptdate  : _regEditKey.rptdate,
                    perid    : _regEditKey.perid,
                    rptnum   : _regEditKey.rptnum,
                    wkcd     : wkcd,
                    actcd    : actcd,
                    actnm    : actnm,
                    equpcd   : equpcd,
                    frtime   : frtime,
                    totime   : totime,
                    remark   : remark
                }, done);
            } else {
                // 등록
                AjaxUtil.postAsyncData('/api/AS/daily_manage/save', {
                    writeDate : writeDate,
                    wkcd      : wkcd,
                    actcd     : actcd,
                    actnm     : actnm,
                    equpcd    : equpcd,
                    frtime    : frtime,
                    totime    : totime,
                    remark    : remark,
                    filesvnm  : _regFile ? _regFile.filesvnm : '',
                    filepath  : _regFile ? _regFile.filepath : ''
                }, done);
            }
        }

        function esc(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

    </script>
</th:block>
</html>
