<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .wj-header { text-align: center !important; }

        /* ── 좌우 분할 ── */
        .handle-split-wrap {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .handle-left  { flex: 0 0 55%; min-width: 0; }
        .handle-right { flex: 0 0 45%; min-width: 0; padding-left: 14px; }

        /* ── 선택된 접수 정보 배너 ── */
        .selected-banner {
            display: none;
            background: #eef3ff;
            border: 1.5px solid #4472c4;
            border-radius: 6px;
            padding: 8px 14px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #333;
        }
        .selected-banner .banner-title {
            font-weight: 700;
            font-size: 14px;
            color: #2c4f9e;
            margin-bottom: 4px;
        }
        .selected-banner .banner-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .selected-banner .banner-item { color: #555; }
        .selected-banner .banner-label { color: #999; margin-right: 4px; }

        /* ── 폼 테이블 ── */
        .write-table td input[type="text"],
        .write-table td input[type="date"],
        .write-table td input[type="time"],
        .write-table td textarea {
            width: 100%;
            box-sizing: border-box;
        }
        .write-table td textarea { resize: vertical; min-height: 54px; }
        .write-table td input[readonly] { background: #f5f5f5; cursor: pointer; }

        /* ── 팝업 그리드 높이 ── */
        #popActGrid, #popEqupGrid, #popPernmGrid { height: 320px; }

        textarea{
            height: 51px;
        }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">

        <!-- Page Title -->
        <div class="page-title-wrap">
            <div class="left">
                <h2>고장처리등록</h2>
                <a title="북마크" class="bookmark toggle">내메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>고장관리</li>
                <li>고장처리등록</li>
            </ul>
        </div>

        <div class="handle-split-wrap">

            <!-- ════════════════════════
                 LEFT : 고장접수 목록 + 처리목록
            ════════════════════════ -->
            <section class="section handle-left">
                <div class="section-top">
                    <div class="search-wrap">
                        <dl>
                            <dt><label>기간</label></dt>
                            <dd>
                                <div class="srch-box" style="display:flex; align-items:center; gap:4px;">
                                    <input type="date" id="fromDate" class="form-control2" style="width:130px;">
                                    <span>~</span>
                                    <input type="date" id="toDate"   class="form-control2" style="width:130px;">
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dt><label>현장명</label></dt>
                            <dd>
                                <div class="srch-box">
                                    <input type="text" id="srchActnm" class="form-control2"
                                           placeholder="현장명" style="width:110px;">
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dt><label>접수자</label></dt>
                            <dd>
                                <div class="srch-box">
                                    <input type="text" id="srchRepernm" class="form-control2"
                                           placeholder="접수자명" style="width:90px;">
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dt><label>전체조회</label></dt>
                            <dd>
                                <div class="srch-box" style="display:flex; align-items:center; height:100%;">
                                    <input type="checkbox" id="chkShowAll" style="width:18px; height:18px; cursor:pointer;">
                                    <label for="chkShowAll" style="margin-left:4px; font-size:12px; color:#666; cursor:pointer;">전체 접수건</label>
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dt><span class="eq"></span></dt>
                            <dd>
                                <li>
                                    <a class="btn btn-delete" title="검색" id="btnSearch">
                                        <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                        검색
                                    </a>
                                </li>
                            </dd>
                        </dl>
                    </div>
                </div>
                <div style="margin-bottom:6px; font-weight:700; color:#2c4f9e; font-size:13px;">▶ 고장접수 목록</div>
                <div class="container-fluid" style="margin-bottom:16px;">
                    <div id="requestGrid" style="height:280px;"></div>
                </div>
                <div style="margin-bottom:6px; font-weight:700; color:#2c4f9e; font-size:13px;">▶ 고장처리 목록</div>
                <div class="container-fluid">
                    <div id="compGrid" style="height:280px;"></div>
                </div>
            </section>

            <!-- ════════════════════════
                 RIGHT : 고장처리 등록 폼
            ════════════════════════ -->
            <section class="section handle-right">
                <div class="section-top">
                    <div class="button-wrap">
                        <ul>
                            <li>
                                <button type="button" class="btn-excell btn-default" id="btnNew"
                                        style="height:36px; width:100px;">
                                    <i class="fas fa-plus"></i> 신규
                                </button>
                            </li>
                            <li>
                                <button type="button" class="btn-edit btn-default" id="btnSave"
                                        style="height:36px; width:100px;">
                                    <i class="fas fa-save"></i> 저장
                                </button>
                            </li>
                            <li>
                                <button type="button" class="btn-delete btn-danger" id="btnDel"
                                        style="height:36px; width:100px;">
                                    <i class="fas fa-trash"></i> 삭제
                                </button>
                            </li>
                        </ul>
                    </div>

                    <!-- 선택된 고장접수 배너 -->
                    <div class="selected-banner" id="selectedBanner">
                        <div class="banner-title" id="bannerActnm"></div>
                        <div class="banner-row">
                            <span class="banner-item"><span class="banner-label">접수일자</span><span id="bannerRecedate"></span></span>
                            <span class="banner-item"><span class="banner-label">호기</span><span id="bannerEqupnm"></span></span>
                            <span class="banner-item"><span class="banner-label">고장내용</span><span id="bannerContents"></span></span>
                        </div>
                    </div>

                    <!-- hidden 필드 -->
                    <input type="hidden" id="hidCompdate">
                    <input type="hidden" id="hidCompnum">
                    <input type="hidden" id="hidRecedate">
                    <input type="hidden" id="hidRecenum">
                    <input type="hidden" id="hidActcd">
                    <input type="hidden" id="hidEqupcd">
                    <input type="hidden" id="hidPerid">
                    <input type="hidden" id="hidMgrPerid">

                    <div class="table-wrap" style="overflow-x:auto; margin-top:6px;">
                        <table class="write-table" style="width:100%; border-collapse:collapse; table-layout:fixed;">
                            <caption style="text-align:left; margin-bottom:6px;">고장처리등록</caption>
                            <colgroup>
                                <col style="width:120px;">
                                <col>
                                <col style="width:120px;">
                                <col>
                            </colgroup>
                            <tbody>

                            <tr>
                                <th><label>완료일자</label></th>
                                <td><input type="date" id="regCompdate"></td>
                                <th><label>완료시간</label></th>
                                <td><input type="time" id="regComptime"></td>
                            </tr>

                            <tr>
                                <th><label>도착일자</label></th>
                                <td><input type="date" id="regArrivdate"></td>
                                <th><label>도착시간</label></th>
                                <td><input type="time" id="regArrivtime"></td>
                            </tr>

                            <tr>
                                <th><label>접수일자</label></th>
                                <td><input type="date" id="regRecedate2"></td>
                                <th><label>접수시간</label></th>
                                <td><input type="time" id="regRecetime"></td>
                            </tr>

                            <tr>
                                <th><label>현장명</label></th>
                                <td><input type="text" id="regActnm" placeholder="현장 선택" readonly onclick="openActPopup()"></td>
                                <th><label>호기명</label></th>
                                <td><input type="text" id="regEqupnm" placeholder="호기 선택" readonly onclick="openEqupPopup()"></td>
                            </tr>

                            <tr>
                                <th><label>고장부위</label></th>
                                <td>
                                    <input type="text" id="regContremark" placeholder="고장부위 선택" readonly onclick="openGreginmPopup()">
                                    <input type="hidden" id="regGregicd">
                                </td>
                                <th><label>고장부위상세</label></th>
                                <td>
                                    <input type="text" id="regReginm" placeholder="고장부위 먼저 선택" readonly onclick="openReginmPopup()">
                                    <input type="hidden" id="regRegicd">
                                </td>
                            </tr>

                            <tr>
                                <th style="display:none;"><label>고장요인</label></th>
                                <td style="display:none;">
                                    <input type="text" id="regRemonm" placeholder="고장요인 선택" readonly onclick="openRemonmPopup()">
                                    <input type="hidden" id="regRemocd">
                                </td>
                                <th><label>고장원인</label></th>
                                <td>
                                    <input type="text" id="regFacnm" placeholder="고장원인 선택" readonly onclick="openFacnmPopup()">
                                    <input type="hidden" id="regFaccd">
                                </td>
                            </tr>

                            <tr>
                                <th><label>고장원인상세</label></th>
                                <td colspan="3"><textarea id="regRemoremark" placeholder="고장원인상세 입력"></textarea></td>
                            </tr>

                            <tr>
                                <th><label>처리내용</label></th>
                                <td>
                                    <input type="text" id="regResunm" placeholder="처리내용 선택" readonly onclick="openResunmPopup()">
                                    <input type="hidden" id="regResucd">
                                </td>
                                <th><label>처리결과</label></th>
                                <td>
                                    <input type="text" id="regResultnm" placeholder="처리결과 선택" readonly onclick="openResultnmPopup()">
                                    <input type="hidden" id="regResultcd">
                                </td>
                            </tr>

                            <tr>
                                <th><label>처리상세</label></th>
                                <td colspan="3"><textarea id="regResuremark" placeholder="처리상세 입력"></textarea></td>
                            </tr>

                            <tr>
                                <th><label>사후관리사항</label></th>
                                <td colspan="3"><textarea id="regCustomer" placeholder="사후관리사항 입력"></textarea></td>
                            </tr>

                            <tr>
                                <th><label>처리자</label></th>
                                <td colspan="1">
                                    <input type="text" id="regPernm" placeholder="처리자 선택 (팝업)"
                                           readonly onclick="openPernmPopup()">
                                </td>
                                <th><label>담당자</label></th>
                                <td colspan="1">
                                    <input type="text" id="regMgrPernm" placeholder="현장 선택 시 자동 (클릭하여 변경)"
                                           readonly onclick="openMgrPernmPopup()">
                                </td>
                            </tr>

                            <tr>
                                <th><label>파일 첨부</label></th>
                                <td colspan="3">
                                    <input type="file" id="regFileInput" style="display:none"
                                           accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
                                    <input type="hidden" id="regFilesvnm">
                                    <input type="hidden" id="regFilepath">
                                    <div onclick="document.getElementById('regFileInput').click()"
                                         style="border:2px dashed #ddd; border-radius:8px; padding:12px; text-align:center; cursor:pointer; background:#fafafa; font-size:13px; color:#888;">
                                        📎 클릭하여 파일 선택
                                    </div>
                                    <div id="regFilePreview" style="display:none; margin-top:8px; padding:8px 12px; background:#f5f5f5; border-radius:6px; font-size:13px; color:#444; align-items:center; justify-content:space-between;">
                                        <span id="regFileNameDisplay" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
                                        <span id="regFileStatus" style="font-size:12px; white-space:nowrap; margin-left:8px;"></span>
                                        <button onclick="removeHandleFile()" style="background:none; border:none; font-size:18px; color:#aaa; cursor:pointer; margin-left:8px;">×</button>
                                    </div>
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div><!-- //handle-split-wrap -->

    </div><!--//layout-contents-->

    <footer style="margin-top:24px;">
        <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
    </footer>
</th:block>

<!-- ════════════════════════════════════════
     팝업 템플릿
════════════════════════════════════════ -->
<th:block layout:fragment="scripts">

    <!-- 현장 팝업 템플릿 -->
    <script type="text/template" id="actPopupTemplate">
        <div style="padding:10px;">
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <input type="text" id="popActKeyword" class="form-control2"
                       placeholder="현장명 검색" style="flex:1;">
                <button type="button" class="btn btn-delete" id="popActSearch">검색</button>
            </div>
            <div id="popActGrid"></div>
        </div>
    </script>

    <!-- 호기 팝업 템플릿 -->
    <script type="text/template" id="equpPopupTemplate">
        <div style="padding:10px;">
            <div id="popEqupGrid"></div>
        </div>
    </script>

    <!-- 처리자 팝업 템플릿 -->
    <script type="text/template" id="pernmPopupTemplate">
        <div style="padding:10px;">
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <input type="text" id="popPernmKeyword" class="form-control2"
                       placeholder="사원명 검색" style="flex:1;">
                <button type="button" class="btn btn-delete" id="popPernmSearch">검색</button>
            </div>
            <div id="popPernmGrid"></div>
        </div>
    </script>

    <script type="text/javascript">

        var _spjangcd    = sessionStorage.getItem('spjangcd') || '';
        var requestGrid, requestData;
        var _selectedRow = null; // 현재 선택된 고장접수 행

        /* ════════════════════════════════════
           초기화
        ════════════════════════════════════ */
        document.readyState === 'complete' ? init() : window.onload = init;

        function init() {
            // 기간 기본값: 당월 1일 ~ 오늘
            var today    = new Date().toISOString().split('T')[0];
            var firstDay = today.substring(0, 7) + '-01';
            document.getElementById('fromDate').value = firstDay;
            document.getElementById('toDate').value   = today;

            // 폼 기본값
            setFormDefaults();

            // 좌측 그리드 초기화
            requestData = new wijmo.collections.CollectionView([]);
            requestGrid = new wijmo.grid.FlexGrid('#requestGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                isReadOnly: true,
                columns: [
                    {binding: 'recedate', header: '접수일자', width:  92, align: 'center'},
                    {binding: 'pernm',    header: '통보자',   width:  70, align: 'center'},
                    {binding: 'repernm',  header: '접수자',   width:  70, align: 'center'},
                    {binding: 'actnm',    header: '현장명',   width: 120, align: 'left'},
                    {binding: 'equpnm',   header: '호기명',   width: 100, align: 'left'},
                    {binding: 'contnm',   header: '고장내용', width: 100, align: 'left'},
                    {binding: 'contents', header: '상세내용', width: '*',  align: 'left'},
                    {binding: 'resultck', header: '처리',     width:  50, align: 'center',
                        cellTemplate: function(ctx) {
                            return ctx.value ? '<span style="color:#1a7a3a;">✔</span>' : '<span style="color:#cc4400;">-</span>';
                        }
                    }
                ],
                itemsSource: requestData,
                formatItem: function(s, e) {
                    if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
                    var col = s.columns[e.col];
                    if (col.binding === 'recedate') {
                        var val = s.getCellData(e.row, e.col, false);
                        if (val && String(val).length === 8) {
                            var v = String(val);
                            e.cell.textContent = v.substring(0,4) + '.' + v.substring(4,6) + '.' + v.substring(6,8);
                        }
                    }
                }
            });
            requestGrid.rowHeaders.columns.splice(0, 1);

            // 고장접수 행 클릭 → 신규 등록 모드
            requestGrid.selectionChanged.addHandler(function (s, e) {
                var row = s.selectedRows[0];
                if (row && row.dataItem) {
                    _selectedRow = row.dataItem;
                    bindRequestToForm(_selectedRow);
                }
            });

            // compGrid 초기화
            initCompGrid();

            // 고장처리 행 클릭 → 수정/삭제 모드 (단건 조회 API 로 폼 채움)
            compGrid.selectionChanged.addHandler(function (s, e) {
                var row = s.selectedRows[0];
                if (row && row.dataItem) {
                    loadCompDetail(row.dataItem);
                }
            });

            // 버튼 이벤트
            $('#btnSearch').click(function () {
                searchRequestList();
                searchCompList();
            });
            $('#srchActnm').on('keypress', function (e) {
                if (e.keyCode === 13) searchRequestList();
            });
            $('#srchRepernm').on('keypress', function (e) {
                if (e.keyCode === 13) searchRequestList();
            });
            $('#chkShowAll').on('change', function () { searchRequestList(); });
            $('#btnNew').click(function () { resetForm(); });
            $('#btnSave').click(function () {
                Alert.confirm('', '저장하시겠습니까?', function () { saveComp(); });
            });
            $('#btnDel').click(function () {
                Alert.confirm('', '삭제하시겠습니까?', function () { deleteComp(); });
            });

            // 초기 조회
            searchRequestList();
            searchCompList();
        }

        /* ════════════════════════════════════
           고장처리 목록 조회 (TB_E411)
        ════════════════════════════════════ */
        var compGrid, compData;

        function initCompGrid() {
            compData = new wijmo.collections.CollectionView([]);
            compGrid = new wijmo.grid.FlexGrid('#compGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                isReadOnly: true,
                columns: [
                    {binding: 'compdate',  header: '완료일자', width:  92, align: 'center'},
                    {binding: 'actnm',     header: '현장명',   width: 120, align: 'left'},
                    {binding: 'equpnm',    header: '호기명',   width: 100, align: 'left'},
                    {binding: 'actpernm',  header: '처리자',   width:  80, align: 'center'},
                    {binding: 'contremark',header: '고장부위', width: 100, align: 'left'},
                    {binding: 'customer',  header: '처리내용', width: '*',  align: 'left'},
                ],
                itemsSource: compData,
                formatItem: function(s, e) {
                    if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
                    var col = s.columns[e.col];
                    if (col.binding === 'compdate') {
                        var val = s.getCellData(e.row, e.col, false);
                        if (val && String(val).length === 8) {
                            var v = String(val);
                            e.cell.textContent = v.substring(0,4) + '.' + v.substring(4,6) + '.' + v.substring(6,8);
                        }
                    }
                }
            });
            compGrid.rowHeaders.columns.splice(0, 1);
        }

        function searchCompList() {
            if (!compGrid) initCompGrid();
            var fromDate = document.getElementById('fromDate').value.replaceAll('-', '');
            var toDate   = document.getElementById('toDate').value.replaceAll('-', '');
            var actnm    = document.getElementById('srchActnm').value.trim();

            AjaxUtil.getAsyncData('/api/AS/web_handle/comp_list', {
                fromDate : fromDate,
                toDate   : toDate,
                actnm    : actnm,
                spjangcd : _spjangcd
            }, function (result) {
                var data = (result && result.data) ? result.data : [];
                compData = new wijmo.collections.CollectionView(data);
                compGrid.itemsSource = compData;
                compGrid.refresh();
            });
        }

        /* ════════════════════════════════════
           좌측 그리드 조회
        ════════════════════════════════════ */
        function searchRequestList() {
            var fromDate = document.getElementById('fromDate').value.replaceAll('-', '');
            var toDate   = document.getElementById('toDate').value.replaceAll('-', '');
            var actnm    = document.getElementById('srchActnm').value.trim();
            var repernm  = document.getElementById('srchRepernm').value.trim();
            var showAll  = document.getElementById('chkShowAll').checked ? '1' : '0';

            AjaxUtil.getAsyncData('/api/AS/web_handle/list', {
                fromDate : fromDate,
                toDate   : toDate,
                actnm    : actnm,
                repernm  : repernm,
                showAll  : showAll,
                spjangcd : _spjangcd
            }, function (result) {
                var data = (result && result.data) ? result.data : [];
                requestData = new wijmo.collections.CollectionView(data);
                requestGrid.itemsSource = requestData;
                requestGrid.refresh();
            });
        }

        /* ════════════════════════════════════
           고장처리 선택 → 폼 바인딩 (수정/삭제 모드)
        ════════════════════════════════════ */
        /* ════════════════════════════════════
           고장처리 단건 조회 → 폼 바인딩
           목록 데이터는 표시용이라 폼에 필요한 코드/명칭이 없으므로
           접수목록 클릭과 동일하게 단건 조회 API 를 사용한다
        ════════════════════════════════════ */
        function loadCompDetail(item) {
            AjaxUtil.getAsyncData('/api/AS/web_handle/comp_by_receive', {

        document.getElementById('regFileInput').addEventListener('change', function () {

        function handleHandleFileSelect(file) {
            var preview  = document.getElementById('regFilePreview');
            var nameEl   = document.getElementById('regFileNameDisplay');
            var statusEl = document.getElementById('regFileStatus');

            nameEl.textContent   = file.name;
            statusEl.textContent = '업로드 중...';
            statusEl.style.color = '#f0a500';
            preview.style.display = 'flex';

            document.getElementById('regFilesvnm').value = '';
            document.getElementById('regFilepath').value  = '';

            var csrfToken = document.querySelector('input[name="_csrf"]').value;
            var formData  = new FormData();
            formData.append('file', file);

            fetch(withCtx('api/daily_report/upload_file'), {
                method: 'POST',
                headers: { 'X-CSRF-TOKEN': csrfToken },
                body: formData
            })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                if (result.success && result.data) {
                    document.getElementById('regFilesvnm').value = result.data.filesvnm;
                    document.getElementById('regFilepath').value  = result.data.filepath;
                    statusEl.textContent = '✓ 업로드 완료';
                    statusEl.style.color = '#2a9d2a';
                } else {
                    statusEl.textContent = '✗ 업로드 실패';
                    statusEl.style.color = '#cc3333';
                    Alert.alert('', result.message || '파일 업로드에 실패하였습니다.');
                }
            })
            .catch(function() {
                statusEl.textContent = '✗ 업로드 실패';
                statusEl.style.color = '#cc3333';
                Alert.alert('', '파일 업로드 중 오류가 발생하였습니다.');
            });
        }

        var _codeCache = {};

        function openCodePopup(popupId, apiUrl, listId, codeKey, nameKey, keywordId, onSelect) {
            if (_codeCache[popupId]) {
                renderCodeList(listId, _codeCache[popupId], nameKey, onSelect, popupId);
                return;
            }
            AjaxUtil.getAsyncData(apiUrl, {}, function(result) {
                if (result && result.data) {
                    _codeCache[popupId] = result.data;
                    renderCodeList(listId, result.data, nameKey, onSelect, popupId);
                }
            });
        }

        function renderCodeList(listId, data, nameKey, onSelect, popupId) {
            var tmplId = popupId + 'Template';
            var content = '<div style="padding:10px;"><input type="text" id="' + listId + 'Kwd" class="form-control2" placeholder="검색" style="width:100%; margin-bottom:8px;"><div id="' + listId + '" style="height:300px;"></div></div>';
            var $c = $(content);
            var popContainer = new PopupDraggable('선택');
            popContainer.open({ width: 400, height: 420, $content: $c });

            var grid = new wijmo.grid.FlexGrid('#' + listId, {
                autoGenerateColumns: false,
                showMarquee: true,
                isReadOnly: true,
                columns: [
                    {binding: nameKey, header: '명칭', width: '*', align: 'left'}
                ],
                itemsSource: new wijmo.collections.CollectionView(data)
            });
            grid.rowHeaders.columns.splice(0, 1);

            $c.find('#' + listId + 'Kwd').on('input', function() {
                var kwd = this.value;
                var filtered = data.filter(function(item) { return (item[nameKey] || '').includes(kwd); });
                grid.itemsSource = new wijmo.collections.CollectionView(filtered);
            });

            grid.hostElement.addEventListener('dblclick', function() {
                var item = grid.selectedItems[0];
                if (!item) return;
                onSelect(item);
                popContainer.close();
            });
        }

        function saveComp() {
            var compdate    = document.getElementById('regCompdate').value;
            var actcd       = document.getElementById('hidActcd').value;
            var hidCompdate = document.getElementById('hidCompdate').value;
            var hidCompnum  = document.getElementById('hidCompnum').value;
            var isEdit      = hidCompdate !== '' && hidCompnum !== '';

            if (!compdate) { Alert.alert('', '완료일자를 입력해주세요.'); return; }
            if (!actcd)    { Alert.alert('', '고장접수를 선택하거나 현장을 선택해주세요.'); return; }

            var url  = isEdit ? '/api/AS/web_handle/update' : '/api/AS/web_handle/save';
            var data = {
                spjangcd   : _spjangcd,
                compdate   : isEdit ? hidCompdate : compdate.replaceAll('-', ''),
                compnum    : hidCompnum,
                comptime   : document.getElementById('regComptime').value.replaceAll(':', ''),
                recedate   : document.getElementById('regRecedate2').value.replaceAll('-', ''),
                recenum    : document.getElementById('hidRecenum').value,
                recetime   : document.getElementById('regRecetime').value.replaceAll(':', ''),
                arrivdate  : document.getElementById('regArrivdate').value.replaceAll('-', ''),
                arrivtime  : document.getElementById('regArrivtime').value.replaceAll(':', ''),
                actcd      : actcd,
                actnm      : document.getElementById('regActnm').value,
                equpcd     : document.getElementById('hidEqupcd').value,
                equpnm     : document.getElementById('regEqupnm').value,
                contremark : document.getElementById('regContremark').value,
                gregicd    : document.getElementById('regGregicd').value,
                regicd     : document.getElementById('regRegicd').value,
                remocd     : document.getElementById('regRemocd').value,
                faccd      : document.getElementById('regFaccd').value,
                remoremark : document.getElementById('regRemoremark').value,
                resucd     : document.getElementById('regResucd').value,
                resuremark : document.getElementById('regResuremark').value,
                resultcd   : document.getElementById('regResultcd').value,
                remark     : document.getElementById('regResultnm').value,
                customer   : document.getElementById('regCustomer').value,
                perid      : document.getElementById('hidPerid').value,
                actperid   : document.getElementById('hidMgrPerid').value,
                filesvnm   : document.getElementById('regFilesvnm').value,
                filepath   : document.getElementById('regFilepath').value
            };

            AjaxUtil.postAsyncData(url, data, function (result) {
                if (result && result.success) {
                    Alert.alert('', result.message, function () {
                        searchRequestList();
                        searchCompList();
                        resetForm();
                    });
                } else {
                    Alert.alert('', (result && result.message) || '저장 중 오류가 발생하였습니다.');
                }
            });
        }

                    {binding: 'pernm',  header: '사원명', width: 120, align: 'center'},
                    {binding: 'divinm', header: '부서',   width: '*',  align: 'left'}
                ],
                itemsSource: popPernmData
            });
            popPernmGrid.rowHeaders.columns.splice(0, 1);

            function fetchPernm() {
                AjaxUtil.getAsyncData('/api/AS/web_handle/popup/pernm', {
                    spjangcd : _spjangcd,
                    pernm    : $c.find('#popPernmKeyword').val()
                }, function (res) {
                    popPernmData = new wijmo.collections.CollectionView(res.data || []);
                    popPernmGrid.itemsSource = popPernmData;
                    popPernmGrid.refresh();
                });
            }

            $c.find('#popPernmSearch').click(function () { fetchPernm(); });
            $c.find('#popPernmKeyword').on('keypress', function (e) {
                if (e.keyCode === 13) fetchPernm();
            });

            popPernmGrid.hostElement.addEventListener('dblclick', function () {
                var item = popPernmGrid.selectedItems[0];
                if (!item) return;
                document.getElementById('hidPerid').value = (item.perid || '').replace(/^p/, '');
                document.getElementById('regPernm').value = item.pernm || '';
                popContainer.close();
            });

            fetchPernm();
        }

        /* ════════════════════════════════════
           팝업 — 담당자 (현장 담당자, 수동 변경용)
        ════════════════════════════════════ */
        function openMgrPernmPopup() {
            var content = tmpl('pernmPopupTemplate', {});
            var $c      = $(content);
            var popContainer = new PopupDraggable('담당자 선택');
            popContainer.open({ width: 480, height: 440, $content: $c });

            var grid = new wijmo.grid.FlexGrid('#popPernmGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                isReadOnly: true,
                columns: [
                    {binding: 'perid',  header: '사번',   width: 100, align: 'center'},
                    {binding: 'pernm',  header: '사원명', width: 120, align: 'center'},
                    {binding: 'divinm', header: '부서',   width: '*',  align: 'left'}
                ],
                itemsSource: new wijmo.collections.CollectionView([])
            });
            grid.rowHeaders.columns.splice(0, 1);

            function fetchMgr() {
                AjaxUtil.getAsyncData('/api/AS/web_handle/popup/pernm', {
                    spjangcd : _spjangcd,
                    pernm    : $c.find('#popPernmKeyword').val()
                }, function (res) {
                    grid.itemsSource = new wijmo.collections.CollectionView(res.data || []);
                    grid.refresh();
                });
            }

            $c.find('#popPernmSearch').click(function () { fetchMgr(); });
            $c.find('#popPernmKeyword').on('keypress', function (e) {
                if (e.keyCode === 13) fetchMgr();
            });

            grid.hostElement.addEventListener('dblclick', function () {
                var item = grid.selectedItems[0];
                if (!item) return;
                document.getElementById('hidMgrPerid').value  = (item.perid || '').replace(/^p/, '');
                document.getElementById('regMgrPernm').value  = item.pernm || '';
                popContainer.close();
            });

            fetchMgr();
        }

        /* ── 현장 선택 시 담당자 자동 바인드 (TB_E601.perid) ──
           PB 규격: 고장처리 담당자는 현장 마스터의 점검자(정)에서 유래.
           자동 세팅 후 사용자가 팝업으로 변경 가능 */
        function bindActManager(actcd) {
            if (!actcd) {
                document.getElementById('hidMgrPerid').value = '';
                document.getElementById('regMgrPernm').value = '';
                return;
            }
            AjaxUtil.getAsyncData('/api/AS/web_handle/act_manager', {
                spjangcd : _spjangcd,
                actcd    : actcd
            }, function (res) {
                if (res && res.data) {
                    document.getElementById('hidMgrPerid').value = res.data.perid || '';
                    document.getElementById('regMgrPernm').value = res.data.pernm || '';
                }
            });
        }

        /* ════════════════════════════════════
           날짜/시간 유틸
        ════════════════════════════════════ */
        function fmtDateInput(d) {
            if (!d) return '';
            var s = String(d);
            return s.substring(0,4) + '-' + s.substring(4,6) + '-' + s.substring(6,8);
        }
        function fmtDate(d) {
            if (!d) return '';
            var s = String(d);
            return s.substring(0,4) + '.' + s.substring(4,6) + '.' + s.substring(6,8);
        }
        function fmtTime(t) {
            if (!t) return '';
            var s = String(t).replace(':','').padStart(4,'0');
            return s.substring(0,2) + ':' + s.substring(2,4);
        }

    </script>
</th:block>
</html>
