<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">

<th:block layout:fragment="content">
  <style>
    .db-wrap { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 200px); min-height: 0; }
    .db-row  { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .db-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 14px 16px; display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
    .db-card-title { font-size: 14px; font-weight: 700; color: #2c4f9e; border-bottom: 2px solid #2c4f9e; padding-bottom: 6px; margin-bottom: 10px; flex-shrink: 0; }
    .badge-row { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
    .count-badge { flex: 1; border-radius: 8px; padding: 10px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .count-badge .label { font-size: 12px; opacity: 0.85; }
    .count-badge .value { font-size: 24px; font-weight: 700; line-height: 1; }
    .count-badge .unit  { font-size: 11px; opacity: 0.7; }
    .cb-blue   { background: #2c4f9e; color: #fff; }
    .cb-orange { background: #e65100; color: #fff; }
    .cb-green  { background: #2e7d32; color: #fff; }
    .cb-gray   { background: #546e7a; color: #fff; }
    .cb-red    { background: #c62828; color: #fff; }
    .cb-sky    { background: #0277bd; color: #fff; }
    .db-grid { flex: 1; min-height: 0; }
    .wj-header { text-align: center !important; }
  </style>

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left"><h2>현장관리 대시보드</h2></div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>대시보드</li>
        <li>현장관리</li>
      </ul>
    </div>

    <div class="db-wrap">
      <!-- 상단 row: 계약현황 (전체 너비) -->
      <div class="db-row">
        <div class="db-card">
          <div class="db-card-title">계약현황</div>
          <div class="badge-row">
            <div class="count-badge cb-blue">
              <span class="label">전체현장</span>
              <span class="value" id="contractTotalCnt">-</span>
              <span class="unit">곳</span>
            </div>
            <div class="count-badge cb-green">
              <span class="label">계약중</span>
              <span class="value" id="contractCnt">-</span>
              <span class="unit">곳</span>
            </div>
            <div class="count-badge cb-gray">
              <span class="label">해지</span>
              <span class="value" id="cancelCnt">-</span>
              <span class="unit">곳</span>
            </div>
            <div class="count-badge cb-red">
              <span class="label">만료</span>
              <span class="value" id="contractExpiredCnt">-</span>
              <span class="unit">곳</span>
            </div>
            <div class="count-badge cb-orange">
              <span class="label">30일이내만료임박</span>
              <span class="value" id="contractSoonCnt">-</span>
              <span class="unit">곳</span>
            </div>
          </div>
          <div class="db-grid" id="contractGrid"></div>
        </div>
      </div>

      <!-- 하단 row: 유지보수만료현황 + 관리대수현황 -->
      <div class="db-row">
        <!-- 유지보수만료현황 -->
        <div class="db-card">
          <div class="db-card-title">유지보수만료현황</div>
          <div class="badge-row">
            <div class="count-badge cb-red">
              <span class="label">만료</span>
              <span class="value" id="expiredCnt">-</span>
              <span class="unit">건</span>
            </div>
            <div class="count-badge cb-orange">
              <span class="label">30일이내만료임박</span>
              <span class="value" id="soonCnt">-</span>
              <span class="unit">건</span>
            </div>
            <div class="count-badge cb-blue">
              <span class="label">계약중전체</span>
              <span class="value" id="expireTotalCnt">-</span>
              <span class="unit">건</span>
            </div>
          </div>
          <div class="db-grid" id="expireGrid"></div>
        </div>

        <!-- 관리대수현황 -->
        <div class="db-card">
          <div class="db-card-title">관리대수현황</div>
          <div class="badge-row">
            <div class="count-badge cb-blue">
              <span class="label">계약중현장</span>
              <span class="value" id="contractSite">-</span>
              <span class="unit">곳</span>
            </div>
            <div class="count-badge cb-gray">
              <span class="label">해지현장</span>
              <span class="value" id="cancelSite">-</span>
              <span class="unit">곳</span>
            </div>
            <div class="count-badge cb-green">
              <span class="label">계약대수</span>
              <span class="value" id="contractEqup">-</span>
              <span class="unit">대</span>
            </div>
            <div class="count-badge cb-sky">
              <span class="label">전체대수</span>
              <span class="value" id="totalEqup">-</span>
              <span class="unit">대</span>
            </div>
          </div>
          <div class="db-grid" id="manageGrid"></div>
        </div>
      </div>
    </div>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/columns_setting :: columns_setting"></th:block>
  <script type="text/javascript" th:inline="none">

    let contractGrid, expireGrid, manageGrid;

    document.readyState === 'complete' ? init() : window.onload = init;

    function init() {
      var spjangcd = sessionStorage.getItem('spjangcd') || '';
      loadContract(spjangcd);
      loadExpire(spjangcd);
      loadManage(spjangcd);
    }

    // ── 계약현황 ─────────────────────────────────────────────
    function loadContract(spjangcd) {
      AjaxUtil.getAsyncData('/api/dash_comp/contract_count', { spjangcd: spjangcd }, function(res) {
        if (res && res.data) {
          var d = res.data;
          document.getElementById('contractTotalCnt').textContent   = d.totalCnt    || 0;
          document.getElementById('contractCnt').textContent        = d.contractCnt || 0;
          document.getElementById('cancelCnt').textContent          = d.cancelCnt   || 0;
          document.getElementById('contractExpiredCnt').textContent = d.expiredCnt  || 0;
          document.getElementById('contractSoonCnt').textContent    = d.soonCnt     || 0;
        }
      });
      AjaxUtil.getAsyncData('/api/dash_comp/contract_list', { spjangcd: spjangcd }, function(res) {
        var data = (res && res.data) ? res.data : [];
        var view = new wijmo.collections.CollectionView(data);
        if (!contractGrid) {
          contractGrid = new wijmo.grid.FlexGrid('#contractGrid', {
            autoGenerateColumns: false, isReadOnly: true, showMarquee: true,
            columns: [
              { binding: 'actnm',            header: '현장명',   align: 'left',   width: '*'  },
              { binding: 'tel',              header: '전화번호', align: 'center', width: 110 },
              { binding: 'stdate',           header: '계약시작', align: 'center', width: 90  },
              { binding: 'enddate',          header: '계약만료', align: 'center', width: 90  },
              { binding: 'actpernm',         header: '담당자',   align: 'center', width: 70  },
              { binding: 'equpCnt',          header: '관리대수', align: 'center', width: 70  },
              { binding: 'actgubunNm',       header: '계약구분', align: 'center', width: 70  },
              { binding: 'contractStatusNm', header: '상태',     align: 'center', width: 70  },
            ],
            itemsSource: view
          });
          contractGrid.rowHeaders.columns.splice(0, 1);
          contractGrid.formatItem.addHandler(function(s, e) {
            if (e.panel === s.columnHeaders) { e.cell.style.textAlign = 'center'; return; }
            if (e.panel === s.cells) {
              var item = s.rows[e.row].dataItem;
              if (!item) return;
              if (item.contractStatusNm === '만료') {
                e.cell.style.color = '#c62828'; e.cell.style.fontWeight = '600';
              } else if (item.contractStatusNm === '만료임박') {
                e.cell.style.color = '#e65100'; e.cell.style.fontWeight = '600';
              } else if (item.contractStatusNm === '해지') {
                e.cell.style.color = '#546e7a';
              }
            }
          });
        } else {
          contractGrid.itemsSource = view;
        }
      });
    }

    // ── 유지보수만료현황 ─────────────────────────────────────
    function loadExpire(spjangcd) {
      AjaxUtil.getAsyncData('/api/dash_comp/expire_count', { spjangcd: spjangcd }, function(res) {
        if (res && res.data) {
          var d = res.data;
          document.getElementById('expiredCnt').textContent     = d.expiredCnt || 0;
          document.getElementById('soonCnt').textContent        = d.soonCnt    || 0;
          document.getElementById('expireTotalCnt').textContent = d.totalCnt   || 0;
        }
      });
      AjaxUtil.getAsyncData('/api/dash_comp/expire_list', { spjangcd: spjangcd }, function(res) {
        var data = (res && res.data) ? res.data : [];
        var view = new wijmo.collections.CollectionView(data);
        if (!expireGrid) {
          expireGrid = new wijmo.grid.FlexGrid('#expireGrid', {
            autoGenerateColumns: false, isReadOnly: true, showMarquee: true,
            columns: [
              { binding: 'actnm',          header: '현장명',   align: 'left',   width: '*'  },
              { binding: 'tel',            header: '전화번호', align: 'center', width: 110 },
              { binding: 'enddate',        header: '만료일',   align: 'center', width: 90  },
              { binding: 'actpernm',       header: '담당자',   align: 'center', width: 70  },
              { binding: 'expireStatusNm', header: '상태',     align: 'center', width: 70  },
            ],
            itemsSource: view
          });
          expireGrid.rowHeaders.columns.splice(0, 1);
          expireGrid.formatItem.addHandler(function(s, e) {
            if (e.panel === s.columnHeaders) { e.cell.style.textAlign = 'center'; return; }
            if (e.panel === s.cells) {
              var item = s.rows[e.row].dataItem;
              if (!item) return;
              if (item.expireStatusNm === '만료') {
                e.cell.style.color = '#c62828'; e.cell.style.fontWeight = '600';
              } else if (item.expireStatusNm === '만료임박') {
                e.cell.style.color = '#e65100'; e.cell.style.fontWeight = '600';
              }
            }
          });
        } else {
          expireGrid.itemsSource = view;
        }
      });
    }

    // ── 관리대수현황 ─────────────────────────────────────────
    function loadManage(spjangcd) {
      AjaxUtil.getAsyncData('/api/dash_comp/manage_count', { spjangcd: spjangcd }, function(res) {
        if (res && res.data) {
          var d = res.data;
          document.getElementById('contractSite').textContent = d.contractSite || 0;
          document.getElementById('cancelSite').textContent   = d.cancelSite   || 0;
          document.getElementById('contractEqup').textContent = d.contractEqup || 0;
          document.getElementById('totalEqup').textContent    = d.totalEqup    || 0;
        }
      });
      AjaxUtil.getAsyncData('/api/dash_comp/manage_list', { spjangcd: spjangcd }, function(res) {
        var data = (res && res.data) ? res.data : [];
        var view = new wijmo.collections.CollectionView(data);
        if (!manageGrid) {
          manageGrid = new wijmo.grid.FlexGrid('#manageGrid', {
            autoGenerateColumns: false, isReadOnly: true, showMarquee: true,
            columns: [
              { binding: 'actnm',      header: '현장명',   align: 'left',   width: '*'  },
              { binding: 'tel',        header: '전화번호', align: 'center', width: 110 },
              { binding: 'actpernm',   header: '담당자',   align: 'center', width: 70  },
              { binding: 'equpCnt',    header: '관리대수', align: 'center', width: 70  },
              { binding: 'actgubunNm', header: '계약구분', align: 'center', width: 70  },
            ],
            itemsSource: view
          });
          manageGrid.rowHeaders.columns.splice(0, 1);
          manageGrid.formatItem.addHandler(function(s, e) {
            if (e.panel === s.columnHeaders) e.cell.style.textAlign = 'center';
          });
        } else {
          manageGrid.itemsSource = view;
        }
      });
    }

  </script>
</th:block>
</html>
