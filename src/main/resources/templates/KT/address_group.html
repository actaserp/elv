<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>KT 주소록 그룹</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>KT API</li>
        <li>주소록</li>
        <li>그룹</li>
      </ul>
    </div>

    <div class="tab-wrap">
      <div class="tab-contents">
        <section class="tab-item">

          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label for="agType">구분</label></dt>
                <dd>
                  <select id="agType">
                    <option value="2">개인</option>
                    <option value="3">공유</option>
                    <option value="6">회사</option>
                  </select>
                </dd>
              </dl>
            </div>
            <div class="btn-wrap">
              <a class="btn btn-search" id="btnSearch">조회</a>
              <a class="btn btn-add"    id="btnNew">신규</a>
              <a class="btn btn-save"   id="btnSave">저장</a>
              <a class="btn btn-delete" id="btnDelete">삭제</a>
            </div>
          </div>

          <div class="row">
            <div class="wp55 mg-r10">
              <div class="container-fluid col">
                <div id="groupGrid" style="height:560px;"></div>
              </div>
            </div>

            <div class="col wp43">
              <div class="section">
                <div class="container-fluid col">
                  <table class="table-write">
                    <colgroup><col style="width:30%"><col></colgroup>
                    <tbody>
                      <tr><th>그룹명 <span class="required">*</span></th>
                          <td><input type="text" id="f_name" maxlength="40"></td></tr>
                      <tr><th>상위 그룹</th>
                          <td><select id="f_parent"><option value="">(최상위)</option></select></td></tr>
                    </tbody>
                  </table>

                  <p class="txt-guide" id="guide" style="margin-top:10px; color:#888; line-height:1.6;">
                    왼쪽에서 그룹을 고르면 이름을 고칠 수 있습니다.<br>
                    [신규] 를 누르면 비워지고, 채워서 [저장] 하면 새로 만들어집니다.<br><br>
                    그룹을 지우면 그 안의 주소록 항목이 어떻게 되는지는 KT 가 정합니다.
                    지우기 전에 항목을 다른 그룹으로 옮겨두는 편이 안전합니다.
                  </p>
                </div>
              </div>
            </div>
          </div>

        </section>
      </div>
    </div>
  </div>
  <footer style="margin-top:12px;"><p>Copyrightⓒ corp. All rights reserved.</p></footer>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
    /*
     * KT 주소록 그룹
     *
     * 주소록 화면과 같은 길을 쓴다 — 화면에서 KT 를 직접 못 부르므로
     * 전화 받는 PC 의 전화연동 프로그램을 거친다.
     *
     * 구분(cAgType)에 따라 할 수 있는 일이 다르다. 규격서 7.1.3 기준으로
     * 신규는 개인(2)·회사(6)만 되고, 공유(3)는 조회와 수정만 된다.
     */
    class KtAddressGroupPage {
      constructor() {
        this.grid    = null;
        this.view    = new wijmo.collections.CollectionView();
        this.rows    = [];
        this.current = null;
        this.busy    = false;
        this.init();
      }

      init() {
        this.grid = new wijmo.grid.FlexGrid('#groupGrid', {
          autoGenerateColumns: false,
          isReadOnly: true,
          selectionMode: wijmo.grid.SelectionMode.Row,
          formatItem: (s, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader)
              e.cell.style.textAlign = 'center';
          },
          columns: [
            { binding: 'name',     header: '그룹명',    width: '*', minWidth: 140 },
            { binding: 'parentNm', header: '상위 그룹', width: '*', minWidth: 140 },
            { binding: 'dbid',     header: '코드',      width: 120, align: 'center' },
            { binding: 'pdbid',    visible: false }
          ],
          itemsSource: this.view
        });
        this.grid.rowHeaders.columns.splice(0, 1);
        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = 'KT주소록그룹';

        this.grid.selectionChanged.addHandler(() => {
          const g = this.grid.selectedItems[0];
          if (!g || !g.dbid) return;
          this.current = g;
          $('#f_name').val(g.name || '');
          $('#f_parent').val(g.pdbid || '');
        });
      }

      // ── KT 호출 ─────────────────────────────────────────

      call(fn, args, done) {
        if (this.busy) return;
        this.busy = true;
        this.lock(true);

        AjaxUtil.postAsyncData('/api/AS/cti/call', {
          fn: fn, args: JSON.stringify(args || {})
        }, (res) => {
          this.busy = false;
          this.lock(false);

          if (!res || !res.success) {
            Alert.alert('', (res && res.message) ? res.message : '전화 프로그램과 통신하지 못했습니다.');
            return;
          }

          let payload = null;
          if (res.data) {
            try { payload = JSON.parse(res.data); }
            catch (e) { Alert.alert('', '응답을 읽지 못했습니다.'); return; }
          }
          done(payload);
        });
      }

      lock(on) {
        ['btnSearch','btnNew','btnSave','btnDelete'].forEach(function (id) {
          const el = document.getElementById(id);
          if (!el) return;
          el.style.pointerEvents = on ? 'none' : '';
          el.style.opacity       = on ? '0.5' : '';
        });
      }

      type() { return parseInt($('#agType').val(), 10); }

      /** 공유(3)는 새로 만들 수 없다 — 규격서 7.1.3. 눌리고 나서 거절하면 헷갈리니 미리 잠근다. */
      applyTypeRule() {
        const canAdd = this.type() !== 3;
        const el = document.getElementById('btnNew');
        el.style.pointerEvents = canAdd ? '' : 'none';
        el.style.opacity       = canAdd ? '' : '0.4';
        el.title = canAdd ? '' : '공유 주소록에는 그룹을 새로 만들 수 없습니다. (KT 제한)';
      }

      // ── 조회 ────────────────────────────────────────────

      load() {
        this.call('address.groupList', { type: this.type(), pdbid: '' }, (list) => {
          this.rows = list || [];

          // 상위 그룹 이름을 코드로 찾아 붙인다 — 코드만 보여주면 알아볼 수 없다
          const byId = {};
          this.rows.forEach(function (g) { byId[g.dbid] = g.name; });
          this.rows.forEach(function (g) {
            g.parentNm = g.pdbid ? (byId[g.pdbid] || g.pdbid) : '';
          });

          this.view = new wijmo.collections.CollectionView(this.rows);
          this.grid.itemsSource = this.view;

          this.fillParentOptions();
          this.clear();
        });
      }

      /** 상위 그룹 후보. 자기 자신은 뺀다 — 자기 밑에 자기를 넣을 수는 없다. */
      fillParentOptions() {
        const sel  = $('#f_parent');
        const keep = sel.val();
        const mine = this.current ? this.current.dbid : null;

        sel.empty().append($('<option>').val('').text('(최상위)'));
        this.rows.forEach(function (g) {
          if (g.dbid === mine) return;
          sel.append($('<option>').val(g.dbid).text(g.name));
        });
        sel.val(keep);
      }

      clear() {
        this.current = null;
        $('#f_name').val('');
        $('#f_parent').val('');
      }

      // ── 저장 / 삭제 ─────────────────────────────────────

      save() {
        const name = ($('#f_name').val() || '').trim();
        if (!name) { Alert.alert('', '그룹명을 넣어주세요.'); $('#f_name').focus(); return; }

        const args = { type: this.type(), name: name, pdbid: $('#f_parent').val() || '' };

        if (this.current && this.current.dbid) {
          args.dbid = this.current.dbid;
          this.call('address.groupEdit', args, () => {
            Alert.alert('', '저장했습니다.');
            this.load();
          });
          return;
        }

        if (this.type() === 3) {
          Alert.alert('', '공유 주소록에는 그룹을 새로 만들 수 없습니다.\nKT 통화매니저에서 만들어주세요.');
          return;
        }

        this.call('address.groupNew', args, () => {
          Alert.alert('', '만들었습니다.');
          this.load();
        });
      }

      remove() {
        if (!this.current || !this.current.dbid) { Alert.alert('', '지울 그룹을 골라주세요.'); return; }

        // 하위 그룹이 딸려 있으면 먼저 알려준다 — 지운 뒤에 알면 늦다
        const kids = this.rows.filter((g) => g.pdbid === this.current.dbid).length;
        const warn = kids ? '\n\n이 그룹 아래에 ' + kids + '개의 하위 그룹이 있습니다.' : '';

        Alert.confirm('', (this.current.name || '') + ' 그룹을 지웁니다.' + warn +
                          '\n\nKT 주소록에서 지워지며 되돌릴 수 없습니다.', () => {
          this.call('address.groupDel', { type: this.type(), dbid: this.current.dbid }, () => {
            Alert.alert('', '지웠습니다.');
            this.load();
          });
        });
      }
    }

    let page = null;
    $(document).ready(function () {
      page = new KtAddressGroupPage();
      page.applyTypeRule();
      page.load();

      $('#btnSearch').on('click', function () { page.load(); });
      $('#btnNew').on('click',    function () { page.clear(); $('#f_name').focus(); });
      $('#btnSave').on('click',   function () { page.save(); });
      $('#btnDelete').on('click', function () { page.remove(); });

      $('#agType').on('change', function () {
        page.applyTypeRule();
        page.load();
      });
    });
  </script>
</th:block>
</html>
