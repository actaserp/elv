<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>미지급금 잔액 명세서</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>입금관리</li>
        <li>미지급금 잔액 명세서</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl id="searchComArea">
            <dt>
              거래처
            </dt>
            <dd>
              <input type="text" id="btnCompanySearch" name="btnCompanySearch" placeholder="해당 칸을 클릭해서 검색하세요.">
              <input type="hidden" id="cboCompanyHidden">
              <input type="hidden" id="spjangcdHidden">
            </dd>
          </dl>
          <dl>
            <dt>매입구분</dt>
            <dd>
              <select class="form-control2" id="gubun" name="gubun"></select>
            </dd>
          </dl>
          <dl>
            <dt>
              조회기간<span class="eq">*</span>
            </dt>
            <dd>
              <ul class="date-box">
                <li>
                  <input type="date" id="srchStartDt" name="srchStartDt">
                  <label for="srchStartDt" class="hide">시작일</label>
                </li>
                <li>
                  <input type="date" id="srchEndDt" name="srchEndDt">
                  <label for="srchEndDt" class="hide">종료일</label>
                </li>
              </ul>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
      </div>
      <div class="container-fluid">
        <div id="theGrid" style="height: 650px;" ></div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <!--<th:block th:replace="common/columns_setting :: columns_setting"></th:block>-->
  <th:block th:replace="common/multiform_material :: multiform_material"></th:block>
  <!-- 거래처는 사업체 DB(TB_XCLIENT) 기준 -->
  <th:block th:replace="common/popup_client :: popup_client"></th:block>
  <script type="text/javascript">
    class VendorBalanceDetailPage {
      constructor() {
        this.grid = null;
        this.grid3 = null;
        this.$btnEdit = $('#btnEdit');
        this.$btnAddNew = $('#btnAddNew');
        this.spjangcd = $('#spjangcdHidden');
        this.viewData = new wijmo.collections.CollectionView();
        this.init();
      }

      init() {
        let _this = this;
        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            const col = sender.columns[e.col];
            const item = sender.rows[e.row]?.dataItem;
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
            // ✅ 날짜 셀 커스터마이징
            if (e.panel.cellType === wijmo.grid.CellType.Cell && col.binding === 'misdate') {
              if (item?.summary === '전잔액') {
                e.cell.textContent = '전잔액';  // 전잔액 줄은 일자가 없다
                e.cell.style.textAlign = 'center';
                e.cell.style.fontWeight = 'bold';
                e.cell.style.color = '#444';
              }
            }
          },
          columns: [
            {binding: 'cltcd', header: '거래처코드', width: 100, align: 'center'},
            {binding: 'cltnm', header: '거래처명', width: 200, align: 'left'},
            {binding: 'misdate', header: '일자', width: 110, align: 'center'},
            {binding: 'misnum', header: '전표번호', width: 90, align: 'center'},
            {binding: 'summary', header: '구분', width: 90, align: 'center'},
            {binding: 'misamt', header: '매입금액', width: 130, align: 'right'},
            {binding: 'rcvamt', header: '지급액', width: 130, align: 'right'},
            {binding: 'balance', header: '잔액', width: 130, align: 'right'},
            {binding: 'remark', header: '적요', width: '*', align: 'left'}
          ],
          itemsSource: this.viewData, // 데이터를 설정할 배열
        });
        // ✅ Footer 패널 사용 설정
        this.grid.columnFooters.rows.push(new wijmo.grid.Row());
        this.grid.bottomLeftCells.setCellData(0, 0, '총합');

        // ✅ Footer 합계 값 설정 (수동)
        this.grid.loadedRows.addHandler(() => {
          const rows = this.grid.rows;
          const footer = this.grid.columnFooters.rows[0];

          const getSum = (field) => rows.map(r => +r.dataItem[field] || 0).reduce((a, b) => a + b, 0);

          footer.dataItem = {
            cltnm: "합계",
            misamt: getSum('misamt'),
            rcvamt: getSum('rcvamt'),
          };
        });

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '거래처잔액명세 집계';

      }

      searchMainData() {
        let _this = this;
        let url = '/api/transaction/vendor_balance_detail/read'
        let data = {
          'cltcd': $("#cboCompanyHidden").val(),
          'srchStartDt': $("#srchStartDt").val(),
          'srchEndDt': $("#srchEndDt").val(),
          'gubun': $("#gubun").val() || '',
          spjangcd: this.spjangcd.val()
        }
        let fnsuccess = function (result) {
          if (result != null) {
            _this.viewData.sourceCollection = result.data;
          }
        };
        AjaxUtil.getAsyncData(url, data, fnsuccess);
      }
    }
    let page = null;

    $(document).ready(function (e) {

      const spjangcd = sessionStorage.getItem('spjangcd');
      if (spjangcd) {
        $('#spjangcdHidden').val(spjangcd);  // hidden input이 있어야 함
      }
      page = new VendorBalanceDetailPage();

      // 매입구분 = TB_CA510 com_cls '113'
      AjaxUtil.fillSelectOptions($('#gubun'), 'purchase_gubun', 'all', false);

      $('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
      $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

      page.searchMainData();

      // 검색
      $('#btnSearch').click(function (e) {
        page.searchMainData();
      });

      $('#btnGridSetting').click(function (e) {
        let _this = this;
        let fix_cols = page.grid_config.frozenColumnIndex;
        page.popColSetting.show(gui.gui_code, gui.template_key, 'grid', page.grid_config.columns, page.grid, { 'order_fix':false,  'fix_cols' : fix_cols });
      });

      $('#btnCompanySearch').click(function () {
        clientPopupOpen('btnCompanySearch', 'cboCompanyHidden');
      });
      $('#btnCompanySearch').on('input', function () {
        const val = $(this).val();
        if (val === '') {
          $('#cboCompanyHidden').val('');
        }
      });
      $('#cboCompany').on('input', function () {
        const val = $(this).val();
        if (val === '') {
          $('#cboCompanyHidden').val('');
        }
      });
      // .btn-clear 클릭 후 input 이벤트 강제 발생
      $(document).on('click', '.btn-clear', function () {
        const $input = $(this).siblings('input[type="text"]');
        $input.val('');
        $input.trigger('input'); // 🔥 input 이벤트 강제 발생
      });
      // 초기화 버튼 클릭 이벤트
      $('#btnClear').click(function () {

        document.getElementById('btnCompanySearch').value = '';
        document.getElementById('cboCompanyHidden').value = '';
      });

    })
  </script>

</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
