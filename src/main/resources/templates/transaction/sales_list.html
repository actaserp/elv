<html layout:decorate="~{layout_page}">
<head>
  <style>
    /* 왼쪽 매출구분 체크박스 그리드 + 오른쪽 명세 그리드 (파워빌더 화면 배치와 동일) */
    .dep-row { display: flex; align-items: stretch; gap: 8px; flex-wrap: nowrap; }
    .dep-col-gubun { width: 190px; flex: 0 0 auto; }
    .dep-col-grid  { flex: 1 1 auto; min-width: 0; }
    #gubunGrid, #theGrid { height: 660px; }
  </style>
</head>

<th:block layout:fragment="content">

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>매출현황</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>매출관리</li>
        <li>매출현황</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>입금일자<span class="eq">*</span></dt>
            <dd>
              <ul class="date-box">
                <li>
                  <input type="date" id="srchStartDt" name="srchStartDt">
                  <label for="srchStartDt" class="hide">시작일</label>
                </li>
                <li>
                  <input type="date" id="srchEndDt" name="srchEndDt">
                  <label for="srchEndDt" class="hide">종료일</label>
                </li>
              </ul>
            </dd>
          </dl>

          <dl>
            <dt>거래처/현장</dt>
            <dd>
              <!-- 파워빌더도 자유입력이다. 서버가 거래처코드·거래처명·현장코드·현장명 넷에 LIKE 를 건다. -->
              <input type="text" id="txtCltcd" name="txtCltcd" placeholder="거래처 또는 현장 (코드/명칭)" style="width:200px">
            </dd>
          </dl>

          <dl>
            <dt><label for="cboChk">입금형태</label></dt>
            <dd>
              <select style="width: 110px;" id="cboChk" name="cboChk">
                <option value="">전체</option>
                <option value="현금">현금</option>
                <option value="예금">예금</option>
                <option value="지로">지로</option>
                <option value="CMS">CMS</option>
                <option value="어음">어음</option>
                <option value="수표">수표</option>
                <option value="카드">카드</option>
                <option value="D/C">D/C</option>
                <option value="선수금">선수금</option>
                <option value="기타">기타</option>
              </select>
            </dd>
          </dl>

          <dl>
            <dt><label for="cboAccyn">전표발행</label></dt>
            <dd>
              <!-- 파워빌더 검색조건 DataWindow 의 accyn 코드테이블 그대로 -->
              <select style="width: 100px;" id="cboAccyn" name="cboAccyn">
                <option value="%">전체</option>
                <option value="0">미발행</option>
                <option value="1">발행</option>
              </select>
            </dd>
          </dl>

          <dl>
            <dt><label for="cboBank">은 행</label></dt>
            <dd>
              <select style="width: 170px;" id="cboBank" name="cboBank"></select>
            </dd>
          </dl>

          <dl>
            <dt>담당자</dt>
            <dd>
              <!-- 파워빌더는 서버 재조회가 아니라 조회 결과에 필터를 건다 (dw_1.SetFilter) -->
              <input type="text" id="txtPernm" name="txtPernm" placeholder="담당자" style="width:110px">
            </dd>
          </dl>

          <dl>
            <dt>부서</dt>
            <dd>
              <input type="text" id="divinm" placeholder="부서 선택" readonly
                     style="width:130px; cursor:pointer; background:#fff;">
              <input type="hidden" id="divicd">
              <button type="button" class="btn-default" id="btnDiviClear">전체</button>
            </dd>
          </dl>

          <dl>
            <dt>적요</dt>
            <dd>
              <input type="text" id="txtRemark" name="txtRemark" placeholder="적요" style="width:140px">
            </dd>
          </dl>

          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
      </div>

      <div class="container-fluid">
        <div class="row dep-row">
          <div class="dep-col-gubun">
            <div id="gubunGrid"></div>
          </div>
          <div class="dep-col-grid">
            <div id="theGrid"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/multiform_material :: multiform_material"></th:block>
  <th:block th:replace="common/popup_code :: popup_code"></th:block>
  <script type="text/javascript">
    // 매출현황 — 파워빌더 w_input_da026w 이식
    //   · 왼쪽 매출구분 체크박스(TB_DA020)에서 고른 값이 gubun IN (...) 으로 넘어간다
    //   · 담당자는 서버 조건이 아니라 그리드 필터다 (파워빌더 dw_1.SetFilter 와 동일)
    class SalesListPage {

      static fmtDate(v) {
        if (!v) return '';
        const s = String(v).trim();
        if (s.length !== 8) return s;
        return s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6, 8);
      }

      constructor() {
        this.spjangcd = sessionStorage.getItem('spjangcd');
        this.viewData  = new wijmo.collections.CollectionView();
        this.gubunData = new wijmo.collections.CollectionView();
        this.initGubunGrid();
        this.initGrid();
      }

      /** 왼쪽 매출구분 체크박스 그리드. 파워빌더는 전부 체크된 상태로 띄운다. */
      initGubunGrid() {
        this.gubunGrid = new wijmo.grid.FlexGrid('#gubunGrid', {
          autoGenerateColumns: false,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          selectionMode: wijmo.grid.SelectionMode.Row,
          columns: [
            {binding: 'cnam', header: '매출구분', width: '*', align: 'left',   isReadOnly: true},
            {binding: 'chk',  header: '체크',     width: 55,  align: 'center', dataType: wijmo.DataType.Boolean}
          ],
          itemsSource: this.gubunData
        });
        this.gubunGrid.rowHeaders.columns.splice(0, 1);
        // 체크를 바꾸면 바로 재조회 (파워빌더도 itemchanged 에서 ue_retrieve 를 부른다)
        this.gubunGrid.cellEditEnded.addHandler(() => this.searchMainData());
      }

      initGrid() {
        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (s, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
              return;
            }
            if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
            const col = s.columns[e.col], item = s.rows[e.row]?.dataItem;
            if (!item) return;
            if (col.binding === 'rcvdate' || col.binding === 'misdate') {
              e.cell.textContent = SalesListPage.fmtDate(item[col.binding]);
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            {binding: 'rcvdate',  header: '입금일자', width: 110, align: 'center'},
            {binding: 'rcvnum',   header: '순번',     width: 70,  align: 'center'},
            {binding: 'cltnm',    header: '거래처명', width: 220, align: 'left'},
            {binding: 'rcvamt',   header: '입금액',   width: 130, align: 'right', format: 'n0', aggregate: 'Sum'},
            {binding: 'remark',   header: '적요',     width: '*', align: 'left'},
            {binding: 'chk',      header: '입금형태', width: 130, align: 'center'},
            {binding: 'accyn',    header: '전표발행', width: 90,  align: 'center'},
            {binding: 'actnm',    header: '현장명',   width: 200, align: 'left'},
            {binding: 'bankcd',   header: '계좌',     width: 100, align: 'center'},
            {binding: 'misdate',  header: '매출일자', width: 110, align: 'center'},
            {binding: 'misnum',   header: '매출순번', width: 80,  align: 'center'},
            {binding: 'misamt',   header: '매출액',   width: 130, align: 'right', format: 'n0'},
            {binding: 'differamt',header: '차액',     width: 120, align: 'right', format: 'n0'},
            {binding: 'pernm',    header: '담당자',   width: 90,  align: 'center'},
            {binding: 'divinm',   header: '부서',     width: 110, align: 'center'}
          ],
          itemsSource: this.viewData
        });

        this.grid.columnFooters.rows.push(new wijmo.grid.GroupRow());
        this.grid.bottomLeftCells.setCellData(0, 0, '총 계');

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '매출현황';
      }

      /** 체크된 매출구분 코드 목록 */
      checkedGubun() {
        const src = this.gubunData.sourceCollection || [];
        return src.filter(r => r.chk === true || r.chk === '1' || r.chk === 1).map(r => r.code);
      }

      /** 담당자 — 서버가 아니라 그리드에서 거른다 (파워빌더와 동일) */
      applyPernmFilter() {
        const kw = ($('#txtPernm').val() || '').trim();
        this.viewData.filter = kw === '' ? null
            : (item) => (item.pernm || '').indexOf(kw) >= 0;
        this.viewData.refresh();
      }

      loadGubun(after) {
        let _this = this;
        AjaxUtil.getAsyncData('/api/sales/list/gubunList',
            {spjangcd: _this.spjangcd}, function (res) {
              const rows = (res && res.data) ? res.data : [];
              rows.forEach(r => r.chk = true);   // 파워빌더 기본값: 전부 체크
              _this.gubunData.sourceCollection = rows;
              if (after) after();
            });
      }

      loadBank() {
        AjaxUtil.getAsyncData('/api/sales/list/bankList',
            {spjangcd: this.spjangcd}, function (res) {
              const $sel = $('#cboBank').empty().append('<option value="%">전체</option>');
              ((res && res.data) ? res.data : []).forEach(function (b) {
                const nm = (b.bankgrpnm || '') + (b.banknm ? ' ' + b.banknm : '');
                $sel.append('<option value="' + b.code + '">' + (nm.trim() || b.code) + '</option>');
              });
            });
      }

      searchMainData() {
        let _this = this;
        let data = {
          'srchStartDt': $('#srchStartDt').val(),
          'srchEndDt':   $('#srchEndDt').val(),
          'cltcd':       $('#txtCltcd').val(),
          'accyn':       $('#cboAccyn').val(),
          'bankcd':      $('#cboBank').val(),
          'divicd':      $('#divicd').val(),
          'chk':         $('#cboChk').val(),
          'remark':      $('#txtRemark').val(),
          'gubun':       _this.checkedGubun(),
          'spjangcd':    _this.spjangcd
        };

        AjaxUtil.getAsyncData('/api/sales/list/read', data, function (res) {
          if (res == null) return;
          _this.viewData.sourceCollection = (res.data || []);
          _this.applyPernmFilter();
        });
      }
    }

    let page = null;

    $(document).ready(function (e) {

      page = new SalesListPage();

      $('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
      $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

      page.loadBank();
      // 매출구분을 먼저 받아야 체크 목록이 채워진 상태로 조회할 수 있다
      page.loadGubun(function () { page.searchMainData(); });

      $('#btnSearch').click(function () { page.searchMainData(); });

      $('#cboChk, #cboAccyn, #cboBank').change(function () { page.searchMainData(); });

      // 담당자는 입력 즉시 그리드 필터만 다시 건다 (서버 재조회 없음)
      $('#txtPernm').on('input', function () { page.applyPernmFilter(); });

      $('#txtCltcd, #txtRemark').on('keydown', function (ev) {
        if (ev.keyCode === 13) page.searchMainData();
      });

      // 부서 코드도움 (TB_JC002)
      $('#divinm').click(function () {
        codePopupOpen('divinm', 'divicd', 'divicd', '부서 검색');
      });
      $('#btnDiviClear').click(function () {
        $('#divinm').val('');
        $('#divicd').val('');
        page.searchMainData();
      });

    })
  </script>

</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
