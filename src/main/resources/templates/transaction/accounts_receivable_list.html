<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>미수금 현황</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>입금관리</li>
        <li>미수금 현황</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl id="searchComArea">
            <dt>
              거래처
            </dt>
            <dd>
              <input type="text" id="cboCompany" name="cboCompany" placeholder="해당 칸을 클릭해서 검색하세요.">
              <input type="hidden" id="cboCompanyHidden">
              <input type="hidden" id="spjangcdHidden">
              <input type="hidden" id="clientFlag">
              &nbsp;
             <!-- <a class="btn btn-delete" title="검색" id="btnCompanySearch">
                <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                업체 검색
              </a>-->
            </dd>
          </dl>
          <dl>
            <dt>
              조회기간<span class="eq">*</span>
            </dt>
            <dd>
              <ul class="date-box">
                <li>
                  <input type="date" id="srchStartDt" name="srchStartDt">
                  <label for="srchStartDt" class="hide">시작일</label>
                </li>
                <li>
                  <input type="date" id="srchEndDt" name="srchEndDt">
                  <label for="srchEndDt" class="hide">종료일</label>
                </li>
              </ul>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-search" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
      </div>
      <div class="tab-wrap">
        <ul class="tab-links">
          <li><a href="#tabs_total" style="border-radius: 6px 0 0 0;">집계</a></li>
          <li><a href="#tabs_sales_details" style="border-radius: 0 6px 0 0;">상세</a></li>
        </ul>
        <div>
          <section class="tab-item" id="tabs_total" style="border-top-left-radius: 0;">
            <div class="container-fluid">
              <div id="theGrid" style="height: 730px;"></div>
            </div>
          </section>
          <section class="tab-item" id="tabs_sales_details" style="border-top-left-radius: 0;">
            <div class="container-fluid">
              <div id="sales-details" style="height: 730px;"></div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <!--<th:block th:replace="common/columns_setting :: columns_setting"></th:block>-->
  <th:block th:replace="common/multiform_material :: multiform_material"></th:block>
  <!-- 파워빌더와 동일하게 TB_XCLIENT 기준 거래처 팝업을 쓴다 (cltcd 반환) -->
  <th:block th:replace="common/popup_client :: popup_client"></th:block>
  <script type="text/javascript">
    class AccountsReceivableListPage {
      constructor() {
        this.grid = null;
        this.grid3 = null;
        this.$btnEdit = $('#btnEdit');
        this.$btnAddNew = $('#btnAddNew');
        this.spjangcd = $('#spjangcdHidden');
        this.viewData = new wijmo.collections.CollectionView();
        this.init();
      }

      init() {
        let _this = this;
        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            // 파워빌더 미수금현황 그리드와 동일한 구성
            {binding: 'cltcd',   header: '거래처코드', width: 110, align: 'center'},
            {binding: 'cltnm',   header: '거래처명',   width: 300, align: 'left'},
            {binding: 'beamt',   header: '전일미수',   width: 150, align: 'right', format: 'n0'},
            {binding: 'misamt',  header: '매출액',     width: 140, align: 'right', format: 'n0'},
            {binding: 'rcvamt',  header: '입금액',     width: 140, align: 'right', format: 'n0'},
            {binding: 'resuamt', header: '미수잔액',   width: 150, align: 'right', format: 'n0'},
            {binding: 'remark',  header: '비고',       width: 120, align: 'center'},
            {binding: 'saupnum', header: '사업자번호', width: 140, align: 'center'}
          ],
          itemsSource: this.viewData, // 데이터를 설정할 배열
        });

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '미수금 집계 현황';
        this.grid.hostElement.addEventListener('dblclick', function (e) {
          let selectedItem = _this.grid.selectedItems[0];

          if (!selectedItem) {
            console.warn('선택된 항목이 없습니다.');
            return;
          }

          const code = selectedItem.cltcd;
          const name = selectedItem.cltnm;
          if (!code) return;   // 총합계 행 더블클릭 방지

          // ✅ input에 값 설정
          document.getElementById('cboCompanyHidden').value = code;
          document.getElementById('cboCompany').value = name;

          // 상세 데이터 다시 조회
          _this.loadDetailData(code);

          // 탭 전환
          _this.switchToDetailTab();
        });
        // ✅ Footer 패널 사용 설정
        this.grid.columnFooters.rows.push(new wijmo.grid.Row());
        this.grid.bottomLeftCells.setCellData(0, 0, '합 계');

        // ✅ Footer 합계 값 설정 (수동)
        this.grid.loadedRows.addHandler(() => {
          const rows = this.grid.rows;
          const footerTotal = this.grid.columnFooters.rows[0];

          const getSum = (field) => rows.map(r => +r.dataItem[field] || 0).reduce((a, b) => a + b, 0);
          footerTotal.dataItem = {
            cltcd: '총합계',
            cltnm: rows.length + '건',
            beamt:   getSum('beamt'),
            misamt:  getSum('misamt'),
            rcvamt:  getSum('rcvamt'),
            resuamt: getSum('resuamt'),
          };
        });

        this.grid3 = new wijmo.grid.FlexGrid('#sales-details', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            const col = sender.columns[e.col];
            const item = sender.rows[e.row]?.dataItem;

            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
            // 전일잔액 / 월계 / 누계 행은 파워빌더처럼 강조한다
            if (e.panel.cellType === wijmo.grid.CellType.Cell && item?._kind && item._kind !== 'row') {
              e.cell.style.fontWeight = 'bold';
              e.cell.style.color = (item._kind === 'open') ? '#444' : '#1a56a8';
              e.cell.style.background = '#f6f8fb';
            }
          },
          columns: [
            // 파워빌더 상세팝업과 동일한 구성 (전일잔액 → 매출 → 입금 순, 월계/누계 포함)
            {binding: 'misdate', header: '발생일자', width: 110, align: 'center'},
            {binding: 'misnum',  header: '번호',     width:  80, align: 'center'},
            {binding: 'actnm',   header: '현장',     width: 180, align: 'left'},
            {binding: 'remark',  header: '적요',     width: '*', align: 'left'},
            {binding: 'misamt',  header: '발생금액', width: 140, align: 'right', format: 'n0'},
            {binding: 'rcvamt',  header: '입금액',   width: 140, align: 'right', format: 'n0'},
            {binding: 'resuamt', header: '미수금',   width: 150, align: 'right', format: 'n0'}
          ],
          itemsSource: this.viewData, // 데이터를 설정할 배열
        });

        new FlexGridContextMenu(this.grid3);
        this.grid3.downloadFileName = '미수금 상세현황';
        // ✅ Footer 패널 사용 설정
        this.grid3.columnFooters.rows.push(new wijmo.grid.Row());
        this.grid3.bottomLeftCells.setCellData(0, 0, '매출계');
        this.grid3.columnFooters.rows.push(new wijmo.grid.Row());
        this.grid3.bottomLeftCells.setCellData(0, 0, '입금계');

        // ✅ Footer 합계 값 설정 (수동)
        this.grid3.loadedRows.addHandler(() => {
          const rows = this.grid3.rows;
          const SalesTotal = this.grid3.columnFooters.rows[0];
          const DepositTotal = this.grid3.columnFooters.rows[1];

          // 실거래 행(_kind === 'row')만 합산한다. 월계/누계 행은 이미 소계라 중복이 된다.
          const getSum = (field) =>
            rows
              .filter(r => r.dataItem?._kind === 'row')
              .map(r => +r.dataItem[field] || 0)
              .reduce((a, b) => a + b, 0);

          SalesTotal.dataItem = {
            remark: '합 계',
            misamt: getSum('misamt'),
            rcvamt: getSum('rcvamt')
          };

          // 마지막 누계 = 최종 미수금 잔액
          const lastRow = rows[rows.length - 1]?.dataItem;
          DepositTotal.dataItem = {
            remark: '미수금 잔액',
            resuamt: lastRow ? (+lastRow.resuamt || 0) : 0
          };
        });
      }

      searchMainData() {
        let _this = this;
        let url = '/api/transaction/AccRList'
        let param = {
          'srchStartDt': $("#srchStartDt").val(),
          'srchEndDt': $("#srchEndDt").val(),
          'cltcd': $("#cboCompanyHidden").val(),
          spjangcd: this.spjangcd.val()
        }
        // 집계 데이터 조회
        AjaxUtil.getAsyncData(url + '/TotalList', param, function (result) {
          if (result != null && result.data) {
            _this.grid.itemsSource = result.data; // 집계 grid에 바인딩
          }
        });
      }

      loadDetailData(code) {
        let _this = this;
        let url = '/api/transaction/AccRList/DetailList';
        let param = {
          'srchStartDt': $("#srchStartDt").val(),
          'srchEndDt': $("#srchEndDt").val(),
          'cltcd': code,
          spjangcd: this.spjangcd.val()
        };

        AjaxUtil.getAsyncData(url, param, function (result) {
          if (result != null && result.data) {
            _this.grid3.itemsSource = buildDetailRows(result.data);
          } else {
            _this.grid3.itemsSource = []; // 데이터 없으면 초기화
          }
        });
      }

      switchToDetailTab() {
        $('a[href="#tabs_sales_details"]').click();
      }
    }

    /**
     * 상세 팝업 행 구성 — 파워빌더 DataWindow 가 계산하던 부분.
     * 서버는 전일잔액(sort 0) / 매출(sort 1) / 입금(sort 2) 행만 내려주므로
     * 여기서 잔액을 누적하고 월계·누계 행을 끼워 넣는다.
     */
    function buildDetailRows(rows) {
      const out = [];
      const num = (v) => Number(v) || 0;

      // 전일잔액
      let running = rows.filter(r => String(r.sort) === '0')
                        .reduce((a, r) => a + num(r.resuamt), 0);
      out.push({remark: '전일잔액', misamt: null, rcvamt: null, resuamt: running, _kind: 'open'});

      // 거래 내역 (일자, 번호 순)
      const txns = rows.filter(r => String(r.sort) !== '0')
              .sort((a, b) => String(a.misdate || '').localeCompare(String(b.misdate || ''))
                      || String(a.misnum || '').localeCompare(String(b.misnum || '')));

      let curMon = null, monMis = 0, monRcv = 0;

      const flushMonth = () => {
        if (curMon === null) return;
        out.push({remark: '월 계', misamt: monMis, rcvamt: monRcv, resuamt: monMis - monRcv, _kind: 'msum'});
        out.push({remark: '누 계', misamt: null, rcvamt: null, resuamt: running, _kind: 'tsum'});
        monMis = 0;
        monRcv = 0;
      };

      txns.forEach(r => {
        const mon = r.mismon || String(r.misdate || '').substring(0, 6);
        if (curMon !== null && mon !== curMon) flushMonth();
        curMon = mon;

        const mis = num(r.misamt), rcv = num(r.rcvamt);
        running += mis - rcv;
        monMis += mis;
        monRcv += rcv;

        out.push(Object.assign({}, r, {resuamt: running, _kind: 'row'}));
      });
      flushMonth();

      return out;
    }

    let page = null;

    $(document).ready(function (e) {
      const spjangcd = sessionStorage.getItem('spjangcd');
      if (spjangcd) {
        $('#spjangcdHidden').val(spjangcd);  // hidden input이 있어야 함
      }
      page = new AccountsReceivableListPage();

      // company 콤보는 팝업(PopCompComponent)으로 선택 - ComboService 호출 제거

      let today = new Date();
      let monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

      $('#srchStartDt').val(CommonUtil.formatYYYYMMDD(monthStart));
      $('#srchEndDt').val(CommonUtil.formatYYYYMMDD(today));

      page.searchMainData();

      // 검색
      $('#btnSearch').click(function (e) {
        const companyCode = $('#cboCompanyHidden').val();

        if (companyCode === '' && $('#cboCompany').val() !== '') {
          Alert.alert('', '업체명은 업체검색 버튼을 통해서 \n 검색해주세요');
          return;
        }
        // 집계 조회
        page.searchMainData();
        //상세 데이터도 같이 조회
        if (companyCode !== '') {
          page.loadDetailData(companyCode);
        } else {
          // 회사 선택 안 된 경우 상세 그리드 초기화
          page.grid3.itemsSource = [];
        }
      });
      $('#btnGridSetting').click(function (e) {
        let _this = this;
        let fix_cols = page.grid_config.frozenColumnIndex;
        page.popColSetting.show(gui.gui_code, gui.template_key, 'grid', page.grid_config.columns, page.grid, {
          'order_fix': false,
          'fix_cols': fix_cols
        });
      });

   /*   $('#cboCompany').on('keydown', function(e){
        if(e.key === 'Enter' || e.keyCode === 13){
          companyPopupOpenCustom('cboCompany', 'cboCompanyHidden', 'clientFlag');
        }
      });*/

      $('#cboCompany').click(function () {
        // TB_XCLIENT 기준 팝업 — cltcd(문자 코드)를 hidden 에 담는다
        let poppage = new PopClientComponent();
        poppage.focusAfterClose = document.getElementById('cboCompany');
        poppage.show(function (item) {
          if (!item) return;
          document.getElementById('cboCompany').value = item.cltnm || '';
          document.getElementById('cboCompanyHidden').value = item.cltcd || '';
        });
      });

      $('#cboCompany').on('input', function () {
        const val = $(this).val();
        if (val === '') {
          $('#cboCompanyHidden').val('');
        }
      });
      // .btn-clear 클릭 후 input 이벤트 강제 발생
      $(document).on('click', '.btn-clear', function () {
        const $input = $(this).siblings('input[type="text"]');
        $input.val('');
        $input.trigger('input'); // 🔥 input 이벤트 강제 발생
      });
      // 초기화 버튼 클릭 이벤트
      $('#btnClear').click(function () {

        document.getElementById('cboCompany').value = '';
        document.getElementById('cboCompanyHidden').value = '';
      });

    })
  </script>

</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
