<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .wj-header {
            text-align: center !important;
        }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <!-- Page Title -->
        <div class="page-title-wrap">
            <div class="left">
                <h2>공지사항 등록</h2>
                <a title="북마크" class="bookmark toggle">
                    내메뉴
                </a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>시스템관리</li>
                <li>공지사항 등록</li>
            </ul>
        </div>
        <section class="section">
            <div class="section-top">
                <form id="searchForm">
                    <div class="search-wrap">
                        <dl>
                            <dt>
                                작성일<span class="eq"></span>
                            </dt>
                            <dd>
                                <ul class="date-box">
                                    <li>
                                        <input class="tac w150 date_from " type="date" id="srchStartDt"
                                               name="srchStartDt"/>
                                        <label for="srchStartDt" class="hide">시작일</label>
                                    </li>
                                    <li>
                                        <input class="tac w150 date_to" type="date" id="srchEndDt" name="srchEndDt"/>
                                        <label for="srchEndDt" class="hide">종료일</label>
                                    </li>
                                </ul>
                            </dd>
                        </dl>

                        <dl>
                            <dt>
                                <label for="keyword">
                                    공지 제목<span class="eq"></span>
                                </label>
                            </dt>
                            <dd>
                                <div class="srch-box">
                                    <input type="text" class="form-control2" id="keyword" name="keyword"
                                           style="border-radius: 5px 5px 5px 5px;">
                                </div>
                            </dd>
                        </dl>

                        <dl>
                            <dt><span class="eq"></span></dt>
                            <dd>
                                <li>
                                    <a class="btn btn-delete" title="검색" id="btnSearch">
                                        <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                        검색
                                    </a>
                                </li>
                            </dd>
                        </dl>
                    </div>
                </form>
                <!--//section-top end -->

                <div class="button-wrap">
                    <ul>
                        <li>
                            <a class="btn btn-excell" title="신규등록" id="btnNew">
                                <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                                신규등록
                            </a>
                            <!-- <button type="button" class="btn btn-excel" id="btnNew" name="btnNew" title="신규">
                                 <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                                 신규</button>-->
                        </li>
                        <li>
                            <a class="btn btn-edit" id="btnUpdate" title="수정">
                                <img th:src="@{/images/icon/ico-save.svg}" alt="수정 아이콘">
                                수정
                            </a>
                        </li>
                        <!-- <button type="button" class="btn btn-edit" id="btnSave"  title="저장">
                             <img th:src="@{/images/icon/ico-save.svg}" alt="저장 아이콘">저장</button>-->
                        <li>
                            <a class="btn btn-delete y_write_auth" title="삭제" id="btnDel">
                                <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘">
                                삭제
                            </a>
                            <!-- <button type="button" class="btn btn-delete" id="btnDel" title="삭제">
                                 <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘">
                                 삭제</button>-->
                        </li>
                    </ul>
                </div>
            </div>
            <div class="container-fluid">
                <div id="theGrid"></div>
            </div>
            <div class="btn-wrap">
            </div>
        </section>
    </div> <!--//layout-contents end -->

    <footer style="margin-top: 24px;">
        <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
    </footer>

    <!--공지사항 등록 스크립트-->
    <script type="text/x-tmpl" id="noticeTmpl">
        <div class="content_wrap popup">
            <div class="table-wrap">
                <form id="editorForm">
                    <table class="write-table">
                          <input type="hidden" id="id" name="id" value="{%=o.id%}">
                        <caption>주문등록 테이블</caption>
                        <tbody>
                            <tr>
                                <th style="text-align: center">
                                    <label for="title">공지제목</label>
                                </th>
                                <td colspan="4">
                                       <input class="form-control2" id="title" name="title" value="{%=o.title%}" disabled style="width:100%;" />
                                </td>
                            </tr>

                            <tr>
                                <th style="text-align: center">
                                    <label for="notice_yn">공지여부</label>
                                </th>
                                <td>
                                     <select style="width:100%" class="form-control2" id="notice_yn" name="notice_yn" disabled >
                                        <option value="Y">예</option>
                                        <option value="N" selected>아니오</option>
                                     </select>
                                </td>
                                <th style="text-align: center">
                                    <label for="notice_end_date">공지 기간</label>
                                </th>
                                <td style="text-align: center">
                                    <input style="width:100%" class="form-control2 tac" type="date" id="notice_from_date" name="notice_from_date"  value="{%=o.notice_from_date%}" disabled />
                                </td>

                                <td style="text-align: center">
                                    <input style="width:100%" class="form-control2 tac" type="date" id="notice_end_date" name="notice_end_date"  value="{%=o.notice_end_date%}" disabled />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                        <div class="textarea_group" id="divContent">
                           <textarea id="content" name="content" style="width:100%" >{%=o.content%}</textarea>
                        </div>
                </form>
                <div class="grid_box" id='image_upload'></div>
            </div>

            <div class="popup-button">
              <button type="button" class="btn-popup y_write_auth" id="btn_modal_save" ><span data-labelCd="저장">저장</span></button>
              <button type="button" class="btn-popup" id="modal-close-button"><span data-labelCd="닫기">닫기</span></button>
            </div>
        </div>
    </script>

</th:block>
<th:block layout:fragment="scripts">
    <script type="text/javascript" th:src="@{/js/fileupload.js}"></script>
    <th:block th:replace="common/approve_box :: approve_box"></th:block>
    <th:block th:replace="common/ax5_uploader :: ax5_uploader"></th:block>
    <th:block th:replace="common/upload_one_image_box :: upload_one_image_box"></th:block>
    <th:block th:replace="common/popup_select_user_code :: popup_select_user_code"></th:block>

    <script type="text/javascript">
        var oEditors = [];
        var theGrid;
        var viewdata;

        function formatDate(d) {
            if (!d || d.length < 8) return d || '';
            return d.substring(0, 4) + '-' + d.substring(4, 6) + '-' + d.substring(6, 8);
        }

        let columns = [
            {binding: 'id', header: '번호', width: 80, align: 'center'},
            {binding: 'title', header: '제목', width: '*', align: 'left'},
            {binding: 'write_date_time', header: '작성일', width: 120, align: 'center'},
            {binding: 'notice_from_date', header: '공지시작일', width: 120, align: 'center'},
            {binding: 'notice_end_date', header: '공지종료일', width: 120, align: 'center'},
            {binding: 'notice_yn', header: '공지여부', width: 90, align: 'center'},
        ];

        function edit() {
            nhn.husky.EZCreator.createInIFrame({
                oAppRef: oEditors,
                elPlaceHolder: 'content', //textarea id
                sSkinURI: withCtx('/resource/se2/SmartEditor2Skin.html'),
                htParams: {
                    bUseToolbar: true,				// 툴바 사용 여부 (true:사용/ false:사용하지 않음)
                    bUseVerticalResizer: true,		// 입력창 크기 조절바 사용 여부 (true:사용/ false:사용하지 않음)
                    bUseModeChanger: true,			// 모드 탭(Editor | HTML | TEXT) 사용 여부 (true:사용/ false:사용하지 않음)
                    //bSkipXssFilter : true,		// client-side xss filter 무시 여부 (true:사용하지 않음 / 그외:사용)
                    //aAdditionalFontList : aAdditionalFontSet,		// 추가 글꼴 목록
                    fOnBeforeUnload: function () {
                        Alert.alert('',"완료!");
                    }
                }, //boolean
                fOnAppLoad: function () {

                    //예제 코드
                    //oEditors.getById["content"].exec("PASTE_HTML", ["/*dfdfd*/"]);

                    //초기 readonly 시키는 부분
                    //var editor = oEditors.getById["content"];
                    //editor.exec("DISABLE_WYSIWYG");
                    //editor.exec("DISABLE_ALL_UI");
                    //page.searchMain();
                },
                fCreator: 'createSEditor2'
            });
        };


        document.readyState === 'complete' ? init() : window.onload = init;

        function init() {
            viewdata = new wijmo.collections.CollectionView([]);
            theGrid = new wijmo.grid.FlexGrid('#theGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                columns: columns,
                isReadOnly: true,
                itemsSource: viewdata
            });
            theGrid.rowHeaders.columns.splice(0, 1);

            searchMain(); // 초기 데이터 로드
        }

        function searchMain() {
            let keyword = $('#keyword').val();
            let srchStartDt = $('#srchStartDt').val();
            let srchEndDt = $('#srchEndDt').val();

            $.ajax({
                url: withCtx('/api/support/notice/read'),
                type: 'GET',
                data: { 'keyword': keyword, 'srchStartDt': srchStartDt, 'srchEndDt': srchEndDt },
                async: false,
                success: function (result) {
                    if (result.success) {
                        grid_binding(result.data);
                    }
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.error('Error:', textStatus, errorThrown);
                }
            });
        }

        function grid_binding(data) {
            if (!Array.isArray(data)) {
                console.error('데이터가 배열 형식이 아닙니다:', data);
                return;
            }

            let menulogData = data.map(item => ({
                id: item.id,
                title: item.title,
                write_date_time: formatDate(item.write_date_time),
                notice_from_date: formatDate(item.notice_from_date),
                notice_end_date: formatDate(item.notice_end_date),
                notice_yn: item.notice_yn || 'N'
            }));

            if (typeof theGrid === 'undefined' || typeof viewdata === 'undefined') {
                console.error('theGrid 또는 viewdata가 정의되지 않았습니다.');
                return;
            }

            theGrid.columns.clear();
            theGrid.autoGenerateColumns = false;

            // columns 배열이 정의되어 있는지 확인
            if (typeof columns === 'undefined' || !Array.isArray(columns)) {
                console.error('columns 배열이 정의되지 않았습니다.');
                return;
            }

            columns.forEach(columnDef => {
                var col = new wijmo.grid.Column(columnDef);
                theGrid.columns.push(col);
            });

            viewdata = new wijmo.collections.CollectionView(menulogData);

            theGrid.itemsSource = viewdata;
            theGrid.refresh();
        }

        //모달
        function showNoticeEdit(data) {
            let _this = this;
            let content = tmpl('noticeTmpl', data);
            let $content = $(content);
            let modalContainer;
            if (!data.id) {	//if (!data.id) {
                modalContainer = new PopupDraggable('공지 사항 등록');
            } else {
                modalContainer = new PopupDraggable('공지 사항 수정');
            }
            modalContainer.open({width: 1010, height: 670, $content});
            edit();

            // 초기 날짜 설정
            let today = new Date();
            let todayStr = today.toISOString().split('T')[0];
            let plus7 = new Date(today);
            plus7.setDate(plus7.getDate() + 7);
            let plus7Str = plus7.toISOString().split('T')[0];

            // notice_yn 초기 상태에 따라 날짜 활성/비활성
            function applyNoticeYn(yn) {
                if (yn === 'Y') {
                    $content.find('#notice_from_date').prop('disabled', false);
                    $content.find('#notice_end_date').prop('disabled', false);
                    if (!$content.find('#notice_from_date').val()) {
                        $content.find('#notice_from_date').val(todayStr);
                    }
                    if (!$content.find('#notice_end_date').val()) {
                        $content.find('#notice_end_date').val(plus7Str);
                    }
                } else {
                    $content.find('#notice_from_date').prop('disabled', true);
                    $content.find('#notice_end_date').prop('disabled', true);
                }
            }

            // 초기 적용
            applyNoticeYn(data.notice_yn || 'N');

            // change 이벤트
            $content.find('#notice_yn').on('change', function () {
                applyNoticeYn($(this).val());
            });

            $content.find('#btn_modal_save').off('click').on('click', function () {
                let $form = $content.find('#editorForm');
                saveData($form, modalContainer);
            });

        }

        //저장
        function saveData($form, modalContainer) {
            oEditors.getById["content"].exec("UPDATE_CONTENTS_FIELD", []);
            let url = '/api/support/notice/save';

            let data = FormUtil.extractForm($('#editorForm'));
            data['title'] = $("#title").val();
            data['fileId'] = $("#srchFileId").val();

            if (!data.title) {
                Alert.alert('', '제목을 입력해주세요.');
                return false;
            }
            if (!data.notice_yn) {
                Alert.alert('', "공지여부를 선택하세요.");
                return false;
            }

            if (data.notice_yn === 'y') {
                if (!data.notice_from_date) {
                    Alert.alert('', "공지시작일을 설정하세요.");
                    return false;
                }

                if (!data.notice_end_date) {
                    Alert.alert('', "공지종료일을 설정하세요.");
                    return false;
                }
            }

            Alert.confirm('', '저장하시겠습니까?', function () {
                let fnSuccess = function (result) {
                    if (result.success) {
                        function afterSave() {
                            Alert.alert('', '저장되었습니다');
                            modalContainer.close();
                            searchMain();
                            oEditors.getById["content"].exec("SET_IR", [""]);
                        }
                        // 선택된 파일이 있으면 실제 bbsseq로 업로드 후 완료 처리
                        // 파일이 없으면 afterSave() 즉시 실행
                        if (uploader) {
                            uploader.uploadNow(result.data, afterSave);
                        } else {
                            afterSave();
                        }
                    } else {
                        Alert.alert('저장 실패', result.message);
                        console.error('저장 실패:', result.message);
                    }
                };

                // 본문 저장 요청
                AjaxUtil.postAsyncData(url, data, fnSuccess);
            });


        }

        //삭제
        function deleteData(id) {
            let url = '/api/support/notice';
            let data = {'id': id};
            let fnSuccess = function () {
                Alert.alert('', '삭제되었습니다');
                searchMain();
            }
            AjaxUtil.postAsyncData(url + '/delete', data, fnSuccess);
        }



        function setUploader(id) {
            let _this = this;
            // 파일 업로드에 관련된 권한처리는 나중에 적용
            $('#addFile').prop('disabled', false);

            let accept_files = 'hwp,doc,docx,ppt,pptx,xls,xlsx,jpg,jpeg,gif,mbp,png,txt,zip,pdf';

            let uploader = new ax5FileUploadClass('image_upload', id,
                {
                    table_name: 'NOTICE',
                    attach_name: 'basic',
                    accept_files: accept_files,
                    multiple: true,
                    max_count: 5,
                    file_size: 20,
                    manual_upload: true, // 저장 시점에 업로드 (신규 동시성 문제 방지)
                    upload_callback: function (param) { return; },
                    delete_callback: function (param) { return; },
                    file_click_callback: function (file_id) { return; },
                    can_write: userinfo.can_write(),
                });
            _this.uploader = uploader;
        }


        $(document).ready(function () {



            const currentDate = new Date();
            // 오늘 날짜를 'YYYY-MM-DD' 형식으로 변환
            const today = currentDate.toISOString().split('T')[0];

            // 1개월 전 날짜 계산
            const oneMonthAgo = new Date(currentDate);
            oneMonthAgo.setMonth(currentDate.getMonth() - 1); // 한 달 전으로 설정
            const oneMonthAgoFormatted = oneMonthAgo.toISOString().split('T')[0];

            // 기본값 설정
            $('.date_from').val(oneMonthAgoFormatted);
            $('.date_to').val(today);

            //검색버튼클릭
            $("#btnSearch").click(function (e) {
                searchMain();
            });

            $('#keyword').on('keypress', function (e) {
                if (e.keyCode == 13) {  // 'event' 대신 'e' 사용
                    e.preventDefault(); // 기본 동작(폼 제출) 방지
                    searchMain();
                }
            });

            //신규버튼
            $("#btnNew").click(function (e) {
                let today_string = CommonUtil.getYYYYMMDD();
                let data = {
                    'id': '',
                    'notice_end_date': today_string,
                    'title': '',
                    'content': '',
                };
                showNoticeEdit(data);
                setUploader();
                uploader.mode = 'active';
                $("#title").prop('disabled', false);
                $("#notice_yn").prop('disabled', false);
                $('#notice_end_date').val(CommonUtil.getYYYYMMDD()+7);
                $('#srchFileId').val('');
            });

            //수정 공통 함수
            function doUpdate() {
                let selectedRow  = theGrid.selection.row;
                let selectedItem = theGrid.rows[selectedRow]?.dataItem;

                if (selectedItem) {
                    let id = selectedItem.id;
                    data = AjaxUtil.getSyncData('/api/support/notice/detail', {'id': id});
                    showNoticeEdit(data.data);
                    setUploader(id);
                    uploader.mode = 'active';
                    $("#title").prop('disabled', false);
                    $("#notice_yn").prop('disabled', false);
                    $("#notice_end_date").prop('disabled', false);
                    $('#notice_yn').val(data.data.notice_yn).prop('selected', true);

                    // notice_end_date: DB는 yyyyMMdd, input[type=date]는 yyyy-MM-dd 필요
                    let endDate = data.data.notice_end_date;
                    if (endDate && endDate.length === 8) {
                        endDate = endDate.substring(0,4) + '-' + endDate.substring(4,6) + '-' + endDate.substring(6,8);
                    }
                    $('#notice_end_date').val(endDate || '');

                    // 파일 조회: setUploader(id) init() 내부에서 getAttachFiles() 자동 호출됨
                } else {
                    Alert.alert('', '수정할 공지를 선택해 주세요');
                }
            }

            //수정버튼
            $("#btnUpdate").click(function (e) {
                doUpdate();
            });

            //그리드 더블클릭 = 수정
            $('#theGrid').on('dblclick', function () {
                doUpdate();
            });

            //삭제버튼
            $("#btnDel").click(function (e) {
                let selectedRow = theGrid.selection.row;
                if (selectedRow >= 0) {
                    let selectedItem = theGrid.rows[selectedRow].dataItem;
                    let id = selectedItem.id;
                    Alert.confirm('', '삭제하시겠습니까?', function () {
                        deleteData(id);
                    });
                } else {
                    Alert.alert('', "삭제할 공지를 선택해 주세요.")
                }
            });

        });

    </script>
</th:block>

</html>
