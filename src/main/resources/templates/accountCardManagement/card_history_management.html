<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
    .wj-header { text-align: center !important; }
    .card-guide { margin: 4px 0 8px; color: #777; font-size: 13px; }
    .row-done { background: #f3f6f9 !important; color: #667; }
  </style>
</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>카드내역</h2>
        <a title="북마크" class="bookmark toggle">내메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>계좌·카드 관리</li>
        <li>카드내역</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt><label>거래기간</label></dt>
            <dd>
              <div class="srch-box" style="display:flex; align-items:center; gap:5px;">
                <input id="searchfrdate" type="date" class="form-control2"/>
                <span>~</span>
                <input id="searchtodate" type="date" class="form-control2"/>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboCard">카드</label></dt>
            <dd><select id="cboCard" class="form-control2" style="width:260px;"></select></dd>
          </dl>
          <dl>
            <dt><label for="cboFlag">처리구분</label></dt>
            <dd>
              <select id="cboFlag" class="form-control2" style="width:100px;">
                <option value="">전체</option>
                <option value="0" selected>미처리</option>
                <option value="1">처리</option>
              </select>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <ul>
                <li>
                  <a class="btn btn-delete" id="btnSearch" title="검색">
                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘"> 검색
                  </a>
                </li>
                <li>
                  <a class="btn btn-excell" id="btnSetting" title="카드내역 수집">
                    <img th:src="@{/images/icon/ico-plus.svg}" alt="수집 아이콘"> 카드내역 수집
                  </a>
                </li>
              </ul>
            </dd>
          </dl>
        </div>
        <div class="button-wrap" style="border-top:none; text-align:right;">
          <ul>
            <li>
              <a class="btn btn-edit y_write_auth" id="btnSaveInfo" title="입력내용 저장">
                <img th:src="@{/images/icon/ico-save.svg}" alt="저장 아이콘"> 입력내용 저장
              </a>
            </li>
            <li>
              <a class="btn btn-excell y_write_auth" id="btnProcess" title="비용처리">비용처리</a>
            </li>
            <li>
              <a class="btn btn-delete y_write_auth" id="btnCancel" title="비용취소">비용취소</a>
            </li>
          </ul>
        </div>
      </div>

      <div class="container-fluid">
        <p class="card-guide">
          ※ 비용항목·계정·거래처·부서·세액공제·제목·적요를 입력하고 <b>입력내용 저장</b> 후, 선택해서 <b>비용처리</b> 하면 매입(매입카드)이 만들어집니다.
          계정·거래처 칸은 더블클릭해서 고르세요. 처리된 건은 수정할 수 없습니다.
        </p>
        <div id="theGrid" style="height: 620px;"></div>
      </div>
    </section>
  </div>

  <!-- 바로빌 카드내역 수집 팝업 -->
  <script type="text/x-tmpl" id="cardSettingTemplate">
    <div class="content_wrap popup">
      <section class="section">
        <div class="title-box">
          <ul>
            <span style="float:left; line-height:3; color:tomato;">
              바로빌 연동 카드 목록을 조회한 후 선택한 카드의 사용내역을 수집합니다.
            </span>
          </ul>
          <ul>
            <li class="right_align rpt" style="margin:10px 5px;">
              <a class="btn btn-excell" title="카드목록조회" id="btnLoadBaroCardList">카드목록 조회</a>
            </li>
          </ul>
        </div>
        <div class="title-box">
          <ul style="display:flex; align-items:center; list-style:none; padding:0; margin:0; width:100%;">
            <li><span style="margin-right:5px;">거래수집기간</span></li>
            <li>
              <input type="date" id="cardCollectFrDate" /> ~
              <input type="date" id="cardCollectToDate" />
            </li>
            <li><span style="color:tomato; margin-left:5px;">* 최대 200일</span></li>
            <li class="right_align rpt" style="margin:10px 0px; margin-left:auto;">
              <a class="btn btn-excell" title="카드내역수집" id="btnRequestSelectedCardHistory">선택카드 내역수집</a>
            </li>
          </ul>
        </div>
        <div id="cardSettingGrid" style="height:350px;"></div>
      </section>
    </div>
  </script>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/popup_client :: popup_client"></th:block>
  <th:block th:replace="common/popup_acccd :: popup_acccd"></th:block>

  <script type="text/javascript">

    /**
     * 카드내역 — 파워빌더 카드내역가져오기(w_input_da026_card_list) + 카드거래정보등록(w_input_da026_card_01)
     *
     * 조회 → 입력칸(비용항목·계정·거래처 등) 저장 → 선택 후 비용처리(매입 생성) / 비용취소.
     * 비용처리는 서버가 DB 에 저장된 입력값으로 만들기 때문에, 고친 칸이 있으면 먼저 저장한다.
     */
    class CardHistoryPage {

      constructor() {
        this.url = '/api/account_management/card_history';
        this.viewData = new wijmo.collections.CollectionView([]);
        this.cardViewData = new wijmo.collections.CollectionView([]);
        this.cardSettingPopup = null;
        this.init();
      }

      init() {
        const _this = this;

        const taxRows = AjaxUtil.getSelectDataWithNull('tax_deduct', 'choose');
        const artRows = AjaxUtil.getSelectDataWithNull('expense_art', 'choose');
        const deptRows = AjaxUtil.getSelectDataWithNull('depart', 'choose');
        this.taxMap = new wijmo.grid.DataMap(taxRows, 'value', 'text');

        const numCol = (binding, header, width) =>
          ({binding, header, width, align: 'right', format: 'n0', aggregate: 'Sum', isReadOnly: true});

        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          autoGenerateColumns: false,
          selectionMode: wijmo.grid.SelectionMode.Row,
          showMarquee: true,
          itemsSource: this.viewData,
          frozenColumns: 3,
          columns: [
            {binding: 'chk', header: '선택', width: 50, dataType: wijmo.DataType.Boolean},
            {binding: 'flagnm', header: '처리', width: 55, align: 'center', isReadOnly: true},
            {binding: 'apv_dt_fmt', header: '승인일자', width: 95, align: 'center', isReadOnly: true},
            {binding: 'card_no', header: '카드번호', width: 140, align: 'center', isReadOnly: true},
            {binding: 'cardnm', header: '카드명', width: 90, align: 'center', isReadOnly: true},
            {binding: 'apv_no', header: '승인번호', width: 90, align: 'center', isReadOnly: true},
            {binding: 'card_tpbz_nm', header: '승인구분', width: 70, align: 'center', isReadOnly: true},
            {binding: 'mest_nm', header: '가맹점명', width: 160, isReadOnly: true},
            {binding: 'mest_biz_no', header: '사업자번호', width: 105, align: 'center', isReadOnly: true},
            numCol('buy_sum', '승인금액', 100),
            numCol('sply_amt', '공급금액', 100),
            numCol('vat_amt', '부가세', 85),
            numCol('curr_amt', '할인금액', 85),
            {binding: 'taxreclafi', header: '세액공제', width: 110, dataMap: this.taxMap},
            {binding: 'artcd', header: '비용항목', width: 130, dataMap: new wijmo.grid.DataMap(artRows, 'value', 'text')},
            {binding: 'accnm', header: '계정', width: 120, isReadOnly: true},
            {binding: 'cltnm', header: '거래처', width: 140, isReadOnly: true},
            {binding: 'spitemnm', header: '매입거래처명', width: 130},
            {binding: 'divicd', header: '부서', width: 110, dataMap: new wijmo.grid.DataMap(deptRows, 'value', 'text')},
            {binding: 'subject', header: '제목', width: 160},
            {binding: 'summy', header: '적요', width: 180},
            {binding: 'mijinfo', header: '매입일자-번호', width: 115, align: 'center', isReadOnly: true},
            {binding: 'mest_repr_nm', header: '대표자명', width: 80, align: 'center', isReadOnly: true},
            {binding: 'mest_tel_no', header: '전화번호', width: 110, align: 'center', isReadOnly: true},
            numCol('srv_fee', '봉사료', 80),
            numCol('comm', '수수료', 80)
          ],
          formatItem: (s, e) => {
            if (e.panel === s.cells) {
              const item = s.rows[e.row].dataItem;
              if (item && item.flag === '1') wijmo.addClass(e.cell, 'row-done');
            }
          }
        });
        this.grid.rowHeaders.columns.splice(0, 1);
        this.grid.columnFooters.rows.push(new wijmo.grid.GroupRow());
        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '카드내역';

        // 처리된 건은 선택 외에는 고치지 못한다
        this.grid.beginningEdit.addHandler((s, e) => {
          const item = s.rows[e.row].dataItem;
          const binding = s.columns[e.col].binding;
          if (binding !== 'chk' && item.flag === '1') e.cancel = true;
        });

        this.grid.cellEditEnded.addHandler((s, e) => {
          const item = s.rows[e.row].dataItem;
          const binding = s.columns[e.col].binding;
          if (binding === 'chk') return;
          if (binding === 'taxreclafi') item.taxrenm = _this.taxMap.getDisplayValue(item.taxreclafi) || '';
          item._dirty = true;
        });

        // 계정·거래처는 더블클릭으로 팝업에서 고른다
        this.grid.hostElement.addEventListener('dblclick', (e) => {
          const ht = _this.grid.hitTest(e);
          if (ht.cellType !== wijmo.grid.CellType.Cell) return;
          const item = _this.grid.rows[ht.row].dataItem;
          const binding = _this.grid.columns[ht.col].binding;
          if (!item || item.flag === '1') return;

          if (binding === 'accnm') {
            new PopAccountCodeComponent().show(function (sel) {
              if (!sel) return;
              item.acccd = sel.acccd; item.accnm = sel.accnm; item._dirty = true;
              _this.grid.invalidate();
            });
          } else if (binding === 'cltnm') {
            new PopClientComponent().show(function (sel) {
              if (!sel) return;
              item.cltcd = sel.cltcd; item.cltnm = sel.cltnm;
              if (!item.spitemnm) item.spitemnm = sel.cltnm;
              item._dirty = true;
              _this.grid.invalidate();
            });
          }
        });
      }

      loadCards() {
        AjaxUtil.getAsyncData(this.url + '/cards', {spjangcd: getSpjangcdFromSession()}, function (result) {
          const $sel = $('#cboCard').empty().append($('<option>').val('').text('전체'));
          ((result && result.data) || []).forEach(c => {
            const label = c.cardnum + '  ' + (c.cardnm || c.cardconm || '') + (c.cardperson ? ' / ' + c.cardperson : '')
              + (c.useyn === '1' ? '' : ' (미사용)');
            $sel.append($('<option>').val(c.cardnum).text(label));
          });
        });
      }

      searchMainData() {
        const _this = this;
        const data = {
          frdate: $('#searchfrdate').val(),
          todate: $('#searchtodate').val(),
          cardnum: $('#cboCard').val() || '',
          flag: $('#cboFlag').val() || '',
          spjangcd: getSpjangcdFromSession()
        };
        if (!data.frdate || !data.todate) {
          Alert.alert('', '거래기간을 입력해주세요.');
          return;
        }

        AjaxUtil.getAsyncData(this.url + '/read', data, function (result) {
          const rows = (result && Array.isArray(result.data)) ? result.data : [];
          rows.forEach(r => {
            r.chk = false;
            r._dirty = false;
            r.flagnm = r.flag === '1' ? '처리' : '';
            r.mijinfo = r.mijdate ? (r.mijdate.substring(0, 4) + '-' + r.mijdate.substring(4, 6) + '-' + r.mijdate.substring(6, 8) + ' / ' + r.mijnum) : '';
            r.apv_ym = (r.apv_dt || '').substring(0, 4) + '년 ' + (r.apv_dt || '').substring(4, 6) + '월';
          });
          const view = new wijmo.collections.CollectionView(rows);
          // 파워빌더처럼 승인월로 묶어 소계를 보여준다
          view.groupDescriptions.push(new wijmo.collections.PropertyGroupDescription('apv_ym'));
          _this.viewData = view;
          _this.grid.itemsSource = view;
        });
      }

      rowsOf(filter) {
        return (this.viewData.sourceCollection || []).filter(filter);
      }

      keyOf(r) {
        return {bnkcode: r.bnkcode, biz_no: r.biz_no, apv_no: r.apv_no};
      }

      post(path, items, done) {
        AjaxUtil.postAsyncData(this.url + path,
          {spjangcd: getSpjangcdFromSession(), items: JSON.stringify(items)},
          function (result) {
            if (result && result.success) {
              done ? done(result) : Notify.success(result.message);
            } else {
              Alert.alert('', (result && result.message) || '처리 중 오류가 발생했습니다.');
            }
          });
      }

      infoPayload(r) {
        return Object.assign(this.keyOf(r), {
          taxreclafi: r.taxreclafi || '', taxrenm: r.taxrenm || '', artcd: r.artcd || '',
          acccd: r.acccd || '', cltcd: r.cltcd || '', spitemnm: r.spitemnm || '',
          subject: r.subject || '', summy: r.summy || '', divicd: r.divicd || ''
        });
      }

      saveInfo() {
        const _this = this;
        const dirty = this.rowsOf(r => r._dirty && r.flag !== '1');
        if (dirty.length === 0) {
          Alert.alert('', '고친 내역이 없습니다.');
          return;
        }
        this.post('/saveInfo', dirty.map(r => this.infoPayload(r)), function (result) {
          Notify.success(result.message);
          _this.searchMainData();
        });
      }

      process() {
        const _this = this;
        const picked = this.rowsOf(r => r.chk);
        if (picked.length === 0) {
          Alert.alert('', '비용처리할 내역을 선택해주세요.');
          return;
        }
        if (picked.some(r => r.flag === '1')) {
          Alert.alert('', '이미 비용처리된 내역이 선택되어 있습니다.');
          return;
        }

        Alert.confirm('', picked.length + '건을 비용처리(매입 등록)하시겠습니까?', function () {
          const run = () => _this.post('/process', picked.map(r => _this.keyOf(r)), function (result) {
            Alert.alert('', result.message);
            _this.searchMainData();
          });
          // 고친 칸이 있으면 먼저 저장해야 서버가 그 값으로 매입을 만든다
          const dirty = picked.filter(r => r._dirty);
          if (dirty.length > 0) {
            _this.post('/saveInfo', dirty.map(r => _this.infoPayload(r)), run);
          } else {
            run();
          }
        });
      }

      cancel() {
        const _this = this;
        const picked = this.rowsOf(r => r.chk);
        if (picked.length === 0) {
          Alert.alert('', '비용취소할 내역을 선택해주세요.');
          return;
        }
        if (picked.some(r => r.flag !== '1')) {
          Alert.alert('', '비용처리되지 않은 내역이 선택되어 있습니다.');
          return;
        }
        Alert.confirm('', picked.length + '건의 비용처리를 취소하시겠습니까?\n만들어진 매입이 삭제됩니다.', function () {
          _this.post('/cancel', picked.map(r => _this.keyOf(r)), function (result) {
            Alert.alert('', result.message);
            _this.searchMainData();
          });
        });
      }

      // ── 바로빌 카드내역 수집 ─────────────────────────────
      openCardSettingPopup() {
        const _this = this;
        const $content = $(tmpl('cardSettingTemplate', {}));

        this.cardSettingPopup = new PopupDraggable('카드 연동 설정');
        this.cardSettingPopup.open({width: 950, height: 500, $content: $content});

        this.cardViewData = new wijmo.collections.CollectionView([]);
        this.cardSettingGrid = new wijmo.grid.FlexGrid('#cardSettingGrid', {
          autoGenerateColumns: false,
          showMarquee: true,
          selectionMode: wijmo.grid.SelectionMode.Row,
          columns: [
            {binding: 'selected', header: '선택', width: 70, dataType: wijmo.DataType.Boolean},
            {binding: 'cardnum', header: '카드번호', width: '*', align: 'center', isReadOnly: true},
            {binding: 'cardnm', header: '카드명', width: 180, isReadOnly: true},
            {binding: 'cardco', header: '카드사', width: 120, align: 'center', isReadOnly: true},
            {binding: 'baroid', header: '바로빌ID', width: '*', align: 'center', isReadOnly: true}
          ],
          itemsSource: this.cardViewData
        });

        $('#btnLoadBaroCardList').off('click').on('click', () => _this.loadBaroCardList());
        $('#btnRequestSelectedCardHistory').off('click').on('click', () => _this.requestSelectedCardHistory());

        const adjusted = CommonUtil.adjustMax200Days($('#searchfrdate').val(), $('#searchtodate').val());
        $('#cardCollectFrDate').val(adjusted.frDate);
        $('#cardCollectToDate').val(adjusted.toDate);
        if (adjusted.adjusted) {
          Alert.alert('', '조회 기간은 최대 200일까지 가능합니다. 시작일을 자동 조정했습니다.');
        }
        this.loadBaroCardList();
      }

      loadBaroCardList() {
        const _this = this;
        AjaxUtil.getAsyncData(this.url + '/baroCardList', {}, function (res) {
          const list = (res && Array.isArray(res.data)) ? res.data : [];
          _this.cardViewData = new wijmo.collections.CollectionView(list.map(item => ({
            selected: false,
            cardnum: item.cardnum || '',
            cardnm: item.cardnm || '',
            cardco: item.cardco || '',
            baroid: item.baroid || ''
          })));
          _this.cardSettingGrid.itemsSource = _this.cardViewData;
        });
      }

      requestSelectedCardHistory() {
        const _this = this;
        const frDate = ($('#cardCollectFrDate').val() || '').replaceAll('-', '');
        const toDate = ($('#cardCollectToDate').val() || '').replaceAll('-', '');
        if (!frDate || !toDate) {
          Alert.alert('', '수집기간을 입력해주세요.');
          return;
        }
        const fr = new Date(frDate.slice(0, 4), frDate.slice(4, 6) - 1, frDate.slice(6, 8));
        const to = new Date(toDate.slice(0, 4), toDate.slice(4, 6) - 1, toDate.slice(6, 8));
        if (Math.floor((to - fr) / 86400000) > 199) {
          Alert.alert('', '수집기간은 최대 200일까지 가능합니다.');
          return;
        }

        const cards = this.cardViewData.items.filter(item => item.selected === true);
        if (cards.length === 0) {
          Alert.alert('', '선택된 카드가 없습니다.');
          return;
        }

        AjaxUtil.postAsyncData(this.url + '/requestCardHistory', {
          searchfrdate: frDate,
          searchtodate: toDate,
          cards: JSON.stringify(cards.map(c => ({cardnum: c.cardnum, baroid: c.baroid})))
        }, function (res) {
          if (res && res.success) {
            Notify.success(res.message || '카드내역 수집이 완료되었습니다.');
            if (_this.cardSettingPopup && _this.cardSettingPopup.close) _this.cardSettingPopup.close();
            _this.searchMainData();
          } else {
            Alert.alert('', (res && res.message) || '카드내역 수집 중 오류가 발생했습니다.');
          }
        });
      }
    }

    let page = null;

    $(document).ready(function () {
      const today = new Date();
      $('#searchfrdate').val(CommonUtil.formatYYYYMMDD(new Date(today.getFullYear(), today.getMonth(), 1)));
      $('#searchtodate').val(CommonUtil.formatYYYYMMDD(today));

      page = new CardHistoryPage();
      page.loadCards();

      $('#btnSearch').click(() => page.searchMainData());
      $('#btnSetting').click(() => page.openCardSettingPopup());
      $('#btnSaveInfo').click(() => page.saveInfo());
      $('#btnProcess').click(() => page.process());
      $('#btnCancel').click(() => page.cancel());
      $('#cboCard, #cboFlag').on('change', () => page.searchMainData());

      page.searchMainData();
    });
  </script>
</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
