<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
    .wj-header { text-align: center !important; }
    #payForm th { text-align: center; width: 12%; }
    #payForm td input[type="text"], #payForm td input[type="date"], #payForm td select { width: 100%; }
    #payForm td input.num { text-align: right; }
    .pay-guide { margin: 4px 0 8px; color: #777; font-size: 13px; }
    .pay-sub { display: flex; gap: 8px; margin-top: 10px; }
    .pay-sub > div { flex: 1; }
    .pay-sub h4 { margin: 4px 0; font-size: 14px; }
  </style>
</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>카드지급</h2>
        <a title="북마크" class="bookmark toggle">내메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>계좌·카드 관리</li>
        <li>카드지급</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt><label for="cboCardco">카드사</label></dt>
            <dd><select id="cboCardco" class="form-control2" style="width:140px;"></select></dd>
          </dl>
          <dl>
            <dt><label>미지급기간</label></dt>
            <dd>
              <div class="srch-box" style="display:flex; align-items:center; gap:5px;">
                <input id="stdate" type="date" class="form-control2"/>
                <span>~</span>
                <input id="enddate" type="date" class="form-control2"/>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd><label><input type="checkbox" id="chkOnlyBalance" checked/> 잔액 있는 건만</label></dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <a class="btn btn-delete" id="btnSearch" title="검색">
                <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘"> 검색
              </a>
            </dd>
          </dl>
        </div>
        <div class="button-wrap" style="border-top:none; text-align:right;">
          <ul>
            <li><a class="btn btn-excell" id="btnAuto" title="자동계산">자동계산</a></li>
            <li><a class="btn btn-excell" id="btnManual" title="수동계산">수동계산</a></li>
            <li>
              <a class="btn btn-edit y_write_auth" id="btnSave" title="지급저장">
                <img th:src="@{/images/icon/ico-save.svg}" alt="저장 아이콘"> 지급저장
              </a>
            </li>
            <li>
              <a class="btn btn-delete y_write_auth" id="btnDelete" title="지급취소">
                <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘"> 지급취소
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="table-wrap">
        <table class="view-table" id="payForm">
          <caption>지급 내용</caption>
          <tbody>
          <tr>
            <th><label for="snddate">지급일자</label></th>
            <td><input type="date" id="snddate"/></td>
            <th><label for="hamt">현금금액</label></th>
            <td><input type="text" id="hamt" class="num" value="0"/></td>
            <th><label for="bamt">예금금액</label></th>
            <td><input type="text" id="bamt" class="num" value="0"/></td>
            <th><label>합계금액</label></th>
            <td><input type="text" id="totamt" class="num" readonly/></td>
          </tr>
          <tr>
            <th><label for="bankcd">지급은행</label></th>
            <td colspan="3"><select id="bankcd" class="form-control2"></select></td>
            <th><label for="bmar">예금수수료</label></th>
            <td><input type="text" id="bmar" class="num" value="0"/></td>
            <th><label>수수료구분</label></th>
            <td>
              <label><input type="radio" name="bmarflag" value="1" checked/> 포함</label>
              <label style="margin-left:12px"><input type="radio" name="bmarflag" value="0"/> 없음</label>
            </td>
          </tr>
          <tr>
            <th><label for="remark">적요</label></th>
            <td colspan="7"><input type="text" id="remark" maxlength="100"/></td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="container-fluid">
        <p class="pay-guide">
          ※ <b>자동계산</b>은 잔액 있는 미지급을 위에서부터, <b>수동계산</b>은 체크한 건만 대상으로 현금 → 예금 순서로 나눕니다.
          <b>지급저장</b> 때 서버가 같은 방식으로 다시 계산하며, 지급액이 대상 잔액보다 크면 저장되지 않습니다.
        </p>
        <div id="gridUnpaid" style="height: 330px;"></div>

        <div class="pay-sub">
          <div style="flex: 2">
            <h4>지급 목록</h4>
            <div id="gridPayments" style="height: 240px;"></div>
          </div>
          <div style="flex: 3">
            <h4>지급 상세</h4>
            <div id="gridPaymentDetail" style="height: 240px;"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">

    /**
     * 카드지급 — 파워빌더 w_tb_ca642_01_card
     * 카드내역 비용처리로 생긴 매입(지급처 = 카드사)의 대금을 치른다. 지급 한 건 = 매입마다 한 줄(TB_CA642).
     */
    class CardPaymentPage {

      constructor() {
        this.url = '/api/account_management/card_assignment';
        this.mode = null;              // 마지막으로 누른 계산 방식 (auto / manual)
        this.selectedPayment = null;   // 지급 목록에서 고른 지급
        this.init();
      }

      init() {
        const _this = this;
        const money = (binding, header, width) => ({binding, header, width, align: 'right', format: 'n0', aggregate: 'Sum', isReadOnly: true});

        this.gridUnpaid = new wijmo.grid.FlexGrid('#gridUnpaid', {
          autoGenerateColumns: false,
          selectionMode: wijmo.grid.SelectionMode.Row,
          showMarquee: true,
          columns: [
            {binding: 'chk', header: '선택', width: 50, dataType: wijmo.DataType.Boolean},
            {binding: 'mijdate_fmt', header: '미지급일자', width: 100, align: 'center', isReadOnly: true},
            {binding: 'mijnum', header: '번호', width: 60, align: 'center', isReadOnly: true},
            {binding: 'cltnm', header: '발생거래처', width: 160, isReadOnly: true},
            {binding: 'remark', header: '적요', width: '*', isReadOnly: true},
            {binding: 'cardnum', header: '카드번호', width: 140, align: 'center', isReadOnly: true},
            money('mijamt', '발생금액', 110),
            money('inamt', '기지급액', 110),
            money('janamt', '미지급잔액', 110),
            money('whamt', '현금', 100),
            money('wbamt', '예금', 100),
            money('winamt', '지급예정액', 110)
          ]
        });
        this.gridUnpaid.rowHeaders.columns.splice(0, 1);
        this.gridUnpaid.columnFooters.rows.push(new wijmo.grid.GroupRow());
        new FlexGridContextMenu(this.gridUnpaid);
        this.gridUnpaid.downloadFileName = '카드지급_미지급목록';

        this.gridPayments = new wijmo.grid.FlexGrid('#gridPayments', {
          autoGenerateColumns: false,
          selectionMode: wijmo.grid.SelectionMode.Row,
          isReadOnly: true,
          columns: [
            {binding: 'snddate_fmt', header: '지급일자', width: 100, align: 'center'},
            {binding: 'sndnum', header: '지급번호', width: 70, align: 'center'},
            {binding: 'cnt', header: '건수', width: 50, align: 'right'},
            money('hamt', '현금', 95),
            money('bamt', '예금', 95),
            money('bmar', '수수료', 80),
            money('totamt', '지급액', 105),
            {binding: 'remark', header: '적요', width: '*'}
          ]
        });
        this.gridPayments.rowHeaders.columns.splice(0, 1);
        this.gridPayments.columnFooters.rows.push(new wijmo.grid.GroupRow());
        this.gridPayments.selectionChanged.addHandler((s) => {
          const item = s.selectedItems && s.selectedItems[0];
          _this.selectedPayment = item || null;
          if (item) _this.loadPaymentDetail(item);
        });

        this.gridPaymentDetail = new wijmo.grid.FlexGrid('#gridPaymentDetail', {
          autoGenerateColumns: false,
          isReadOnly: true,
          columns: [
            {binding: 'sndseq', header: '순번', width: 50, align: 'center'},
            {binding: 'mijdate_fmt', header: '발생일자', width: 95, align: 'center'},
            {binding: 'mijnum', header: '발생번호', width: 70, align: 'center'},
            {binding: 'cltnm', header: '발생거래처', width: 130},
            money('mijamt', '발생금액', 100),
            money('hamt', '현금', 90),
            money('bamt', '예금', 90),
            money('totamt', '처리금액', 100)
          ]
        });
        this.gridPaymentDetail.rowHeaders.columns.splice(0, 1);
        this.gridPaymentDetail.columnFooters.rows.push(new wijmo.grid.GroupRow());

        $('#hamt, #bamt').on('input', () => _this.refreshTotal());
      }

      cardco() {
        return $('#cboCardco').val() || '';
      }

      header() {
        const n = id => Number(String($(id).val() || '0').replace(/,/g, '')) || 0;
        const $bank = $('#bankcd option:selected');
        return {
          snddate: $('#snddate').val(),
          hamt: n('#hamt'), bamt: n('#bamt'), eamt: 0, samt: 0, damt: 0, gamt: 0,
          bmar: n('#bmar'),
          bmarflag: $('input[name="bmarflag"]:checked').val() || '',
          bankcd: $('#bankcd').val() || '',
          bankno: $('#bankcd').val() ? ($bank.data('accnum') || '') : '',
          remark: $('#remark').val() || ''
        };
      }

      refreshTotal() {
        const h = this.header();
        $('#totamt').val((h.hamt + h.bamt).toLocaleString('ko-KR'));
      }

      search() {
        const _this = this;
        if (!this.cardco()) {
          Alert.alert('', '카드사를 선택해주세요.');
          return;
        }
        const base = {cardco: this.cardco(), stdate: $('#stdate').val(), enddate: $('#enddate').val(), spjangcd: getSpjangcdFromSession()};

        AjaxUtil.getAsyncData(this.url + '/unpaid', Object.assign({onlyBalance: $('#chkOnlyBalance').is(':checked') ? '1' : '0'}, base), function (result) {
          const rows = (result && Array.isArray(result.data)) ? result.data : [];
          rows.forEach(r => Object.assign(r, {chk: false, whamt: 0, wbamt: 0, winamt: 0}));
          _this.gridUnpaid.itemsSource = new wijmo.collections.CollectionView(rows);
        });

        AjaxUtil.getAsyncData(this.url + '/payments', base, function (result) {
          _this.selectedPayment = null;
          _this.gridPaymentDetail.itemsSource = new wijmo.collections.CollectionView([]);
          _this.gridPayments.itemsSource = new wijmo.collections.CollectionView((result && result.data) || []);
        });
      }

      loadPaymentDetail(p) {
        const _this = this;
        AjaxUtil.getAsyncData(this.url + '/payment_detail',
          {cardco: this.cardco(), snddate: p.snddate, sndnum: p.sndnum, spjangcd: getSpjangcdFromSession()},
          function (result) {
            _this.gridPaymentDetail.itemsSource = new wijmo.collections.CollectionView((result && result.data) || []);
          });
      }

      unpaidRows() {
        const view = this.gridUnpaid.itemsSource;
        return view ? (view.sourceCollection || []) : [];
      }

      /** 자동/수동계산 미리보기 — 서버의 같은 배분 계산을 부른다 */
      calculate(mode) {
        const _this = this;
        const h = this.header();
        if (h.hamt + h.bamt <= 0) {
          Alert.alert('', '지급할 금액을 입력해주세요.');
          return;
        }
        const all = this.unpaidRows();
        const targets = mode === 'manual' ? all.filter(r => r.chk) : all.filter(r => Number(r.janamt) > 0);
        if (mode === 'manual' && targets.length === 0) {
          Alert.alert('', '선택된 자료가 없습니다!');
          return;
        }

        $.ajax({
          url: this.url + '/allocate',
          type: 'POST',
          contentType: 'application/json',
          headers: {'X-CSRF-Token': $('[name=_csrf]').val()},
          data: JSON.stringify({header: h, rows: targets.map(r => ({mijdate: r.mijdate, mijnum: r.mijnum, janamt: r.janamt}))}),
          success: function (result) {
            if (!result || result.success === false) {
              Alert.alert('', (result && result.message) || '계산 중 오류가 발생했습니다.');
              return;
            }
            const byKey = {};
            (result.data.rows || []).forEach(a => { byKey[a.mijdate + '|' + a.mijnum] = a; });
            all.forEach(r => {
              const a = byKey[r.mijdate + '|' + r.mijnum];
              r.whamt = a ? a.hamt : 0;
              r.wbamt = a ? a.bamt : 0;
              r.winamt = a ? a.total : 0;
              if (mode === 'auto') r.chk = !!a;
            });
            _this.mode = mode;
            _this.gridUnpaid.itemsSource.refresh();
            if (result.data.remain > 0) {
              Alert.alert('', '지급액이 대상 미지급잔액보다 ' + Number(result.data.remain).toLocaleString('ko-KR') + '원 큽니다.');
            }
          }
        });
      }

      save() {
        const _this = this;
        const h = this.header();
        if (!h.snddate) {
          Alert.alert('', '지급일자를 입력해주세요.');
          return;
        }
        if (h.hamt + h.bamt <= 0) {
          Alert.alert('', '지급할 금액을 확인하십시요!');
          return;
        }
        if (h.bamt > 0 && !h.bankcd) {
          Alert.alert('', '예금 지급은 지급은행을 선택해주세요.');
          return;
        }
        const picked = this.unpaidRows().filter(r => r.chk);
        // 계산 버튼을 안 눌렀으면 체크한 건이 있을 때 수동, 없으면 자동으로 본다
        const mode = this.mode || (picked.length > 0 ? 'manual' : 'auto');
        if (mode === 'manual' && picked.length === 0) {
          Alert.alert('', '선택된 자료가 없습니다!');
          return;
        }

        Alert.confirm('', (h.hamt + h.bamt).toLocaleString('ko-KR') + '원을 지급 저장하시겠습니까?', function () {
          $.ajax({
            url: _this.url + '/save',
            type: 'POST',
            contentType: 'application/json',
            headers: {'X-CSRF-Token': $('[name=_csrf]').val()},
            data: JSON.stringify({
              spjangcd: getSpjangcdFromSession(),
              cardco: _this.cardco(),
              stdate: $('#stdate').val(),
              enddate: $('#enddate').val(),
              mode: mode,
              header: h,
              keys: picked.map(r => ({mijdate: r.mijdate, mijnum: r.mijnum}))
            }),
            success: function (result) {
              if (result && result.success) {
                Alert.alert('', result.message + ' (지급번호 ' + result.data.snddate + '-' + result.data.sndnum + ')');
                $('#hamt, #bamt, #bmar').val(0);
                $('#remark').val('');
                _this.mode = null;
                _this.refreshTotal();
                _this.search();
              } else {
                Alert.alert('', (result && result.message) || '지급 저장에 실패했습니다.');
              }
            },
            error: function (xhr) {
              Alert.alert('에러', '서버 오류 발생: ' + xhr.statusText);
            }
          });
        });
      }

      remove() {
        const _this = this;
        const p = this.selectedPayment;
        if (!p) {
          Alert.alert('', '아래 지급 목록에서 취소할 지급을 선택해주세요.');
          return;
        }
        Alert.confirm('', '지급번호 : ' + p.sndnum + '\n지급일자 : ' + p.snddate_fmt + '\n삭제하시겠습니까?', function () {
          AjaxUtil.postAsyncData(_this.url + '/delete',
            {cardco: _this.cardco(), snddate: p.snddate, sndnum: p.sndnum, spjangcd: getSpjangcdFromSession()},
            function (result) {
              if (result && result.success) {
                Alert.alert('', result.message);
                _this.search();
              } else {
                Alert.alert('', (result && result.message) || '지급 취소에 실패했습니다.');
              }
            });
        });
      }
    }

    let page = null;

    $(document).ready(function () {
      const today = new Date();
      $('#stdate').val(CommonUtil.formatYYYYMMDD(new Date(today.getFullYear() - 1, today.getMonth(), 1)));
      $('#enddate').val(CommonUtil.formatYYYYMMDD(today));
      $('#snddate').val(CommonUtil.formatYYYYMMDD(today));

      page = new CardPaymentPage();

      AjaxUtil.fillSelectOptions($('#bankcd'), 'deposit_bank', 'choose', false);
      AjaxUtil.getAsyncData(page.url + '/cardcos', {}, function (result) {
        const $sel = $('#cboCardco').empty().append($('<option>').val('').text('선택'));
        ((result && result.data) || []).forEach(c => $sel.append($('<option>').val(c.value).text(c.text)));
      });

      $('#btnSearch').click(() => page.search());
      $('#cboCardco, #chkOnlyBalance').on('change', () => { if (page.cardco()) page.search(); });
      $('#btnAuto').click(() => page.calculate('auto'));
      $('#btnManual').click(() => page.calculate('manual'));
      $('#btnSave').click(() => page.save());
      $('#btnDelete').click(() => page.remove());
      page.refreshTotal();
    });
  </script>
</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
