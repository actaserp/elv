<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
    .wj-header {
      text-align: center !important;
    }

    /* 조정일 −/+ 단추.
       Wijmo 의 셀 편집(더블클릭·타이핑)이 이 화면에서 끝까지 열리지 않아
       셀 안의 단추를 눌러 0.5 씩 고치는 방식으로 바꿨다. (2026-11-10) */
    .adj-dec, .adj-inc {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 15px;
      margin: 0 1px;
      cursor: pointer;
      border: 1px solid #b9c2cc;
      border-radius: 3px;
      background: #fff;
      color: #33475b;
      text-align: center;
      font-weight: bold;
      user-select: none;
    }

    .adj-dec:hover, .adj-inc:hover {
      background: #e8f0fb;
      border-color: #2a6ebb;
    }

    .adj-val {
      display: inline-block;
      min-width: 24px;
      text-align: center;
    }

    /* 생성방식 선택 (PB w_pb209_card 대응) */
    #createModeDim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      z-index: 10000;
    }

    #createModeBox {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
      padding: 22px 24px 18px;
    }

    #createModeBox h3 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    #createModeBox .desc {
      font-size: 13px;
      color: #666;
      margin: 0 0 16px;
    }

    #createModeBox label {
      display: block;
      padding: 9px 4px;
      font-size: 14px;
      cursor: pointer;
    }

    #createModeBox label span {
      display: block;
      margin-left: 22px;
      font-size: 12px;
      color: #888;
    }

    #createModeBox .btns {
      margin-top: 18px;
      text-align: right;
    }

    #createModeBox .btns a {
      display: inline-block;
      min-width: 76px;
      padding: 7px 14px;
      margin-left: 6px;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    #createModeOk {
      background: #2d6cdf;
      color: #fff;
    }

    #createModeCancel {
      background: #eee;
      color: #333;
    }
  </style>

</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <!-- Page Title -->
    <div class="page-title-wrap">
      <div class="left">
        <h2>연차관리</h2>
        <a title="북마크" class="bookmark toggle">
          내메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>근태현황</li>
        <li>연차관리</li>
      </ul>
    </div>

    <section class="section" style="">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>
              <label>조회년도</label>
            </dt>
            <dd>
              <select id="year" name="year">
              </select>
            </dd>
          </dl>

          <dl>
            <dt>
              <label>기준일자</label>
            </dt>
            <dd>
              <div class="srch-box">
                <input type="month" class="form-control2" id="startdate" name="startdate">
              </div>
            </dd>
          </dl>

          <dl>
            <dt>
              <label for="rtflag">재직구분</label>
            </dt>
            <dd>
              <select style="width: 150px;" id="rtflag" name="rtflag"></select>
            </dd>
          </dl>

          <dl>
            <dt>
              <label>사원명</label>
            </dt>
            <dd>
              <input type="text" class="form-control2" id="name" name="name">
            </dd>
          </dl>

          <dl>
            <dt><span class="eq"></span></dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
        <div class="button-wrap">
          <ul>
            <li>
              <a class="btn btn-excell" title="연차생성" id="btnyearCreate">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="연차생성 아이콘">
                연차생성
              </a>
            </li>
            <li>
              <a class="btn btn-excell" title="저장" id="btnSave">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="저장 아이콘">
                저장
              </a>
            </li>
          </ul>
        </div>
      </div> <!--//section-top end -->
      <p id="basisNotice" style="margin: 0 0 8px; font-size: 13px;"></p>
      <p id="previewNotice" style="display: none; margin: 0 0 8px; padding: 8px 10px; font-size: 13px;
                                   background: #fff4d6; border: 1px solid #e0c060; border-radius: 4px;"></p>
           <div class="container-fluid" style="flex-direction: row; gap: 5px">
        <div style="flex: 0 0 50%; max-width: 50%;">
          <p id="selectedItem1"></p>
          <div id="member-grid" style="height: 100%;"></div>
        </div>

        <div style="flex: 0 0 50%; max-width: 50%;">
          <p id="selectedItem2" style="margin: 0 0 6px; font-size: 13px;"></p>
          <div id="list-grid" style="height: 100%;"></div>
        </div>
      </div>
    </section>
  </div> <!--//layout-contents end -->

  <!-- 생성방식 선택 -->
  <div id="createModeDim">
    <div id="createModeBox">
      <h3 id="createModeTitle">연차생성</h3>
      <p class="desc" id="createModeDesc"></p>
      <!-- 기본은 '1'(다시 계산). 1년 미만 직원의 월차가 매월 늘어나므로 평소에 쓰는 쪽이다.
           '2'(신규만)를 기본으로 두면 이미 발생행이 있는 직원을 건너뛰어 월차가 멈춘다.
           저장 전 미리보기가 있어 잘못 골라도 숫자를 보고 되돌릴 수 있다 -->
      <label>
        <input type="radio" name="createMode" value="1" checked> 기존 생성분까지 다시 계산
        <span>발생일수를 다시 계산합니다. 조정일·이력은 남습니다.</span>
      </label>
      <label>
        <input type="radio" name="createMode" value="2"> 신규 대상자만 생성
        <span>이미 생성된 직원은 건너뜁니다.</span>
      </label>

      <!-- 이월 여부. 기본은 '1'(전액) — 종전 동작이다.
           '0' 을 고르면 직전 연도 미사용분이 소멸한다. 근로기준법 제60조 ⑦ 에 따라
           소멸한 연차는 수당 지급 대상이므로 설명에 적어 둔다 -->
      <p style="margin: 14px 0 6px; font-size: 13px; font-weight: bold; border-top: 1px solid #ddd; padding-top: 12px;">
        직전 연도 미사용분 이월
      </p>
      <label>
        <input type="radio" name="carryMode" value="1" checked> 전액 이월
        <span>직전 연도 잔여를 전액 가져옵니다.</span>
      </label>
      <label>
        <input type="radio" name="carryMode" value="0"> 이월하지 않음
        <span>이월일을 0으로 둡니다. <b style="color:#c0392b;">미사용분은 소멸하며 수당 지급 대상입니다.</b></span>
      </label>

      <div class="btns">
        <a id="createModeCancel">취소</a>
        <a id="createModeOk">생성</a>
      </div>
    </div>
  </div>

  <footer style="margin-top: 24px;">
    <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
  </footer>

</th:block>
<th:block layout:fragment="scripts">
  <script th:inline="javascript">
    /* 사업체별 연차 산정기준 (tb_tenant_db.annual_basis).
       'F' 회계연도(매년 1/1 일괄) / 'E' 입사일(사원별 입사 기념일).
       설정이 없으면 회계연도로 본다 — 기존 사업체의 동작이 바뀌지 않아야 한다.
       생성 결과를 가르는 건 서버(ClockYearlyService) 이고, 여기서는 안내에만 쓴다. */
    var ANNUAL_BASIS = /*[[${annual_basis}]]*/ 'F';
  </script>
  <th:block th:replace="common/columns_setting :: columns_setting"></th:block>
  <script type="text/javascript">
    class YearlyPage {
      constructor() {
        this.viewData = new wijmo.collections.CollectionView();
        this.viewData2 = new wijmo.collections.CollectionView();
        this.grid = null;
        this.grid2 = null;
        this.adjustSnapshot = {};   // perid → 불러왔을 때의 조정일
        this.preview = null;        // 저장 전 생성 미리보기 {params, count, changed}
        this.init();
      }

      init() {
        let _this = this;

        // 조정일(monthnum)만 편집할 수 있다. 나머지는 생성 결과라 손대지 않는다.
        // 소수점 1자리로 보여줄 칸. 날짜는 서버(/read)가 yyyy-MM-dd 로 내려주므로 여기서 손대지 않는다
        const NUM_COLS = ['ewolnum', 'holinum', 'monthnum', 'daynum', 'restnum'];

        this.grid = new wijmo.grid.FlexGrid('#member-grid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: false,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
            //소수점1자리까지만
            if (e.panel.cellType === wijmo.grid.CellType.Cell) {
              const col = sender.columns[e.col];
              /* Wijmo 는 셀 DOM 을 재사용한다. 앞서 칠한 색을 지우지 않으면
                 미리보기를 걷어낸 뒤에도 색이 그대로 남는다 */
              e.cell.style.backgroundColor = '';
              e.cell.style.fontWeight = '';
              /* 조정일은 cellTemplate(−/+ 단추)이 칸을 그리므로 건드리지 않는다.
                 innerHTML 을 덮어쓰면 단추가 사라진다 */
              if (NUM_COLS.indexOf(col.binding) >= 0 && col.binding !== 'monthnum') {
                const value = sender.getCellData(e.row, e.col, false);
                if (typeof value === 'number') {
                  e.cell.innerHTML = (value % 1 === 0) ? value.toString() : value.toFixed(1);
                }
              }
              // 고친 칸은 눈에 띄게 둔다. 미리보기 중이면 잠겨 있으니 회색으로 보여 준다
              if (col.binding === 'monthnum') {
                if (_this.preview) {
                  e.cell.style.backgroundColor = '#ededed';
                  e.cell.style.color = '#999';
                  e.cell.style.opacity = '0.45';   // −/+ 단추도 같이 흐려진다
                } else {
                  e.cell.style.color = '';
                  e.cell.style.opacity = '';
                  const item = sender.rows[e.row] ? sender.rows[e.row].dataItem : null;
                  if (item && _this.isAdjustChanged(item)) {
                    e.cell.style.backgroundColor = '#fff4d6';
                    e.cell.style.fontWeight = 'bold';
                  }
                }
              }
              // 저장 전 미리보기에서 값이 달라지는 칸
              if (col.binding === 'ewolnum' || col.binding === 'holinum'
                || col.binding === 'enddate') {
                const item = sender.rows[e.row] ? sender.rows[e.row].dataItem : null;
                if (item && item.__changed) {
                  e.cell.style.backgroundColor = '#ffe9c7';
                  e.cell.style.fontWeight = 'bold';
                }
              }
            }
          },
          columns: [
            {binding: 'perid', header: '사번', width: 80, align: 'center', isReadOnly: true},
            {binding: 'person_name', header: '사원명', width: 100, align: 'center', isReadOnly: true},
            {binding: 'RSPNM', header: '직위', width: 90, align: 'center', isReadOnly: true},
            {binding: 'rtdate', header: '입사일', width: 110, align: 'center', isReadOnly: true},
            /* 연차 만료일 — 입사일 기준은 사람마다 달라서 "언제까지 쓰나" 를 자주 묻는다.
               회계연도 기준이면 전원 12/31 이라 아래에서 감춘다.
               기간시작은 입사일의 월·일에 조회년도를 붙인 값이라 옆 칸과 겹쳐서 뺐다 */
            {binding: 'enddate', header: '만료일', width: 103, align: 'center', isReadOnly: true},
            {binding: 'ewolnum', header: '이월일', width: 80, align: 'center', isReadOnly: true},
            {binding: 'holinum', header: '연차일수', width: 90, align: 'center', isReadOnly: true},
            /* 조정일 — 셀 안의 −/+ 로 0.5 씩 고친다.
               Wijmo 의 셀 편집(더블클릭·타이핑)이 이 화면에서는 끝까지 열리지 않았다.
               단추는 그냥 DOM 클릭이라 Wijmo 편집 로직을 타지 않는다.
               편집기를 쓰지 않으므로 칸 자체는 읽기전용으로 둔다. (2026-11-10) */
            {binding: 'monthnum', header: '조정일', width: 100, align: 'center', isReadOnly: true,
             cellTemplate: '<span class="adj-dec" title="0.5 줄이기">&minus;</span>'
                         + '<span class="adj-val">${text}</span>'
                         + '<span class="adj-inc" title="0.5 늘리기">+</span>'},
            {binding: 'daynum', header: '사용일', width: 80, align: 'center', isReadOnly: true},
            {binding: 'restnum', header: '잔여일', width: 80, align: 'center', isReadOnly: true},
          ],
          itemsSource: this.viewData, // 데이터를 설정할 배열
        });



        /* 조정일 −/+ 단추.
           Wijmo 의 셀 편집기를 쓰지 않는다 — 이 화면에서는 더블클릭·타이핑으로
           편집이 끝까지 열리지 않았다. 단추 클릭은 그냥 DOM 이벤트라 확실히 동작한다.
           한 번에 0.5 씩 — 반차가 0.5 일이라 연차 조정의 최소 단위다. (2026-11-10) */
        this.grid.hostElement.addEventListener('click', function (ev) {
          const t = ev.target;
          if (!t || !t.classList) return;
          const dec = t.classList.contains('adj-dec');
          const inc = t.classList.contains('adj-inc');
          if (!dec && !inc) return;

          ev.preventDefault();
          ev.stopPropagation();

          if (_this.preview) {
            Alert.alert('', '미리보기 중에는 조정일을 고칠 수 없습니다. [검색]을 누르면 풀립니다.');
            return;
          }

          const ht = _this.grid.hitTest(ev);
          const gr = (ht && ht.row >= 0) ? _this.grid.rows[ht.row] : null;
          const item = gr ? gr.dataItem : null;
          if (!item) return;

          let v = _this.num(item.monthnum) + (inc ? 0.5 : -0.5);
          v = Math.round(v * 10) / 10;
          if (v > 999.9) v = 999.9;
          if (v < -999.9) v = -999.9;

          item.monthnum = v;
          _this.recalcRest(item);
          _this.grid.invalidate();
        });


        this.grid.hostElement.addEventListener('dblclick', (e) => {
          /* Wijmo 는 더블클릭으로 셀 편집기를 연다. 그게 열린 채로 여기서 동기 AJAX 로
             상세를 읽고 그리드를 다시 그리면 편집기가 사라진다 —
             조정일이 "클릭해도 안 고쳐진다" 던 원인이다.

             칸 번호(hitTest.col)로 가리지 않는다. 만료일(enddate)이 숨은 컬럼이라
             보이는 순서와 columns 의 번호가 한 칸 어긋날 수 있고, 그러면 조정일을
             연차일수로 잘못 보아 그대로 상세를 읽어 버린다.
             "편집이 시작됐는가" 로 보는 쪽이 어긋날 일이 없다. (2026-11-10) */
          if (this.grid.activeEditor) return;

          // 조정일 −/+ 를 연달아 누르면 더블클릭이 된다. 그때 상세를 읽지 않는다
          const t = e.target;
          if (t && t.classList && (t.classList.contains('adj-dec') || t.classList.contains('adj-inc'))) return;

          let hitTest = this.grid.hitTest(e);
          if (hitTest.cellType === wijmo.grid.CellType.Cell) {
            let gr = this.grid.rows[hitTest.row];
            let selectedItem = gr ? gr.dataItem : null;
            if (selectedItem && selectedItem.id != null) {
              _this.showDetail(selectedItem);
            } else {
              /* id 는 person.id 다. 사번(TB_JA001.perid)과 person.Code 가 안 맞으면
                 비어 있고, 그러면 상세를 읽을 수 없다 */
              $('#selectedItem2').html('<span style="color:#c0392b;">이 사원은 상세를 읽을 수 없습니다 (사원 연결 없음).</span>');
              _this.viewData2.sourceCollection = [];
            }
          }
        });

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '연차현황';


        this.grid2 = new wijmo.grid.FlexGrid('#list-grid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
            if (e.panel.cellType === wijmo.grid.CellType.Cell) {
              const col = sender.columns[e.col];
              /* 발생행의 신청일은 yyyy0000 이다 — 날짜가 아니라 "그 해" 라는 뜻이라
                 서버가 포맷을 건너뛴다. 그대로 두면 2026-00-00 처럼 보여서 비워 둔다 */
              if (col.binding === 'reqdate') {
                const d = sender.getCellData(e.row, e.col, false);
                if (typeof d === 'string' && d.endsWith('0000')) e.cell.textContent = '';
              }
              if (col.binding === 'daynum') {
                const v = sender.getCellData(e.row, e.col, false);
                if (typeof v === 'number') {
                  e.cell.textContent = (v % 1 === 0) ? v.toString() : v.toFixed(1);
                }
              }
              // 맨 아래 합계 줄
              const gr = sender.rows[e.row];
              if (gr && gr.dataItem && gr.dataItem.__total) {
                e.cell.style.backgroundColor = '#eef3fa';
                e.cell.style.fontWeight = 'bold';
              } else {
                e.cell.style.backgroundColor = '';
                e.cell.style.fontWeight = '';
              }
            }
          },
          columns: [
            {binding: 'rownum', header: '순번', width: 70, align: 'center'},
            {binding: 'worknm', header: '구분', width: 110, align: 'center'},
            {binding: 'reqdate', header: '신청일', width: 110, align: 'center'},
            {binding: 'frdate', header: '시작일', width: 110, align: 'center'},
            {binding: 'todate', header: '종료일', width: 110, align: 'center'},
            {binding: 'daynum', header: '기간', width: 80, align: 'center'},
            {binding: 'ewolnum', header: '이월일', width: 80, align: 'center'},
            {binding: 'holinum', header: '생성일', width: 80, align: 'center'},
            {binding: 'restnum', header: '잔여일', width: 80, align: 'center'},
            {binding: 'remark', header: '조정 이력', width: '*', minWidth: 200},
          ],
          itemsSource: this.viewData2, // 데이터를 설정할 배열
        });



        new FlexGridContextMenu(this.grid2);
        this.grid2.downloadFileName = '연차내역';
      }

      searchMainData() {
        let _this = this;

        let url = '/api/clock/Yearly/read'
        let data = {
          'year': $('#year').val(),
          'name': $('#name').val(),
          'rtflag': $('#rtflag').val(),
          spjangcd: sessionStorage.getItem('spjangcd'),
        }

        let result = AjaxUtil.getSyncData(url, data);
        let rows = (result && result.data) ? result.data : [];

        // 조정일을 고쳤는지 비교하려고 불러온 값을 따로 기억해 둔다
        _this.adjustSnapshot = {};
        rows.forEach(function (d) {
          d.monthnum = _this.num(d.monthnum);
          _this.adjustSnapshot[d.perid] = d.monthnum;
        });

        _this.viewData.sourceCollection = rows;
        _this.viewData2.sourceCollection = [];
        $('#selectedItem2').html('');
        _this.clearPreview();
      }//searchMainData

      /** 저장 전 미리보기를 걷어낸다 */
      clearPreview() {
        this.preview = null;
        $('#previewNotice').hide().html('');
        // 다시 그리지 않으면 회색 표시와 색칠이 그대로 남는다
        try { this.grid.invalidate(); } catch (e) { /* 그리드를 못 찾으면 그냥 둔다 */ }
      }

      num(v) {
        let n = Number(v);
        return isNaN(n) ? 0 : n;
      }

      /**
       * 상세 내역 맨 아래에 합계 줄을 붙인다.
       *
       * Wijmo 의 columnFooters + GroupRow 는 쓰지 않는다 — 이 버전에서 그리는 도중
       * dataItem 오류로 터져 상세가 통째로 안 보였다. 그냥 자료에 한 줄 더하는 쪽이
       * 안전하다. 합계는 「기간」만 낸다 — 이월일·생성일은 발생행 한 줄에만 들어 있어
       * 합계가 그 값과 같고, 잔여일은 줄마다 "그 신청까지 쓰고 남은 수" 라서
       * 더하면 틀린 숫자가 된다. (2026-11-10)
       */
      withDetailTotal(rows) {
        if (!rows || !rows.length) return rows || [];
        let used = 0;
        for (let i = 0; i < rows.length; i++) used += this.num(rows[i].daynum);
        let out = rows.slice();
        out.push({
          rownum: '', worknm: '합계', reqdate: '', frdate: '', todate: '',
          daynum: used, ewolnum: null, holinum: null, restnum: null, remark: '',
          __total: true
        });
        return out;
      }

      /**
       * yyyyMMdd 로 맞춘다.
       * /read 는 서버에서 yyyy-MM-dd 로 포맷해 내려오지만 /Create(생성 결과)는 원본
       * yyyyMMdd 그대로다. 형을 맞추지 않으면 값이 같은데도 전원 "변경" 으로 잡힌다
       */
      ymd(v) {
        if (v == null) return '';
        return String(v).replace(/[^0-9]/g, '').substring(0, 8);
      }

      /** yyyyMMdd → yyyy-MM-dd. 8자리가 아니면 그대로 둔다 */
      dash(v) {
        const s = this.ymd(v);
        if (s.length !== 8) return v;
        return s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6, 8);
      }

      /** 저장하지 않은 조정일이 있는 행인가 */
      isAdjustChanged(item) {
        if (!item || item.perid == null) return false;
        let before = this.adjustSnapshot ? this.num(this.adjustSnapshot[item.perid]) : 0;
        return this.num(item.monthnum) !== before;
      }

      /** 잔여 = 이월 + 연차 + 조정 − 사용 */
      recalcRest(item) {
        if (!item) return;
        item.monthnum = this.num(item.monthnum);
        item.restnum = this.num(item.ewolnum) + this.num(item.holinum)
                     + item.monthnum - this.num(item.daynum);
      }

      changedAdjustRows() {
        let _this = this;
        let rows = this.viewData.items || [];
        return rows.filter(function (item) { return _this.isAdjustChanged(item); });
      }

      /** 조정일수 저장 */
      saveAdjust() {
        let _this = this;

        let changed = this.changedAdjustRows();
        if (changed.length === 0) {
          Alert.alert('', '변경된 조정일이 없습니다.');
          return;
        }

        let over = changed.filter(function (i) { return Math.abs(_this.num(i.monthnum)) > 999.9; });
        if (over.length > 0) {
          Alert.alert('', '조정일은 -999.9 ~ 999.9 사이로 입력해 주세요.');
          return;
        }

        Alert.confirm('', changed.length + '명의 조정일을 저장하시겠습니까?', function () {
          let data = {
            year: $('#year').val(),
            spjangcd: sessionStorage.getItem('spjangcd'),
            saveList: changed.map(function (i) {
              return {perid: i.perid, person_name: i.person_name, monthnum: _this.num(i.monthnum)};
            })
          };

          AjaxUtil.postJsonData('/api/clock/Yearly/saveAdjust', data, function (res) {
            if (res && res.success) {
              Alert.alert('', res.message || '저장되었습니다.');
              _this.searchMainData();
            } else {
              Alert.alert('', (res && res.message) ? res.message : '저장에 실패했습니다.');
            }
          });
        });
      }

      /**
       * 생성 미리보기를 목록에 얹는다. 아직 저장된 값이 아니다.
       *
       * 생성 결과에는 사용일이 없고(발생분만 계산한다) 조정일도 0 으로 온다. 조정일은 실제
       * 저장에서 보존되므로 0 을 그대로 보여주면 날아가는 것처럼 보인다. 그래서 조회해 둔
       * 값에서 조정일·사용일을 가져와 채우고 잔여일을 다시 계산한다.
       *
       * 생성 대상만 바꿔 끼우고 나머지 사원은 조회 결과를 그대로 둔다 —
       * 생성방식 '2'(신규만)로 두 명만 대상일 때 목록이 두 줄로 줄어들면 비교가 안 된다.
       */
      applyPreview(params, rows) {
        let _this = this;

        if (!rows || !rows.length) {
          Alert.alert('', '생성 대상이 없습니다.');
          return;
        }

        let base = (this.viewData.items || []).map(function (d) { return Object.assign({}, d); });
        let idx = {};
        base.forEach(function (d, i) { idx[d.perid] = i; });

        /* 어느 칸 때문에 달라지는지 따로 센다. 숫자만 "N명 변경" 으로 보여 주면
           무엇이 바뀌는지 알 수 없어 저장을 결정하기 어렵다 */
        let changed = 0;
        let diff = {neu: 0, ewolnum: 0, holinum: 0, enddate: 0};

        rows.forEach(function (r) {
          let i = idx[r.perid];
          let b = (i == null) ? null : base[i];

          r.monthnum = b ? _this.num(b.monthnum) : _this.num(r.monthnum);
          r.daynum   = b ? _this.num(b.daynum)   : 0;
          r.restnum  = _this.num(r.ewolnum) + _this.num(r.holinum) + r.monthnum - r.daynum;

          if (!b) {
            diff.neu++;
            r.__changed = true;
          } else {
            /* 조회로 받은 값과 생성 결과를 비교한다.
               같은 칸이라도 한쪽이 숫자, 한쪽이 문자열로 올 수 있어 형을 맞춰서 본다.
               날짜는 yyyyMMdd 문자열이지만 앞뒤 공백이 섞이는 경우가 있어 잘라낸다 */
            let dE = _this.num(b.ewolnum) !== _this.num(r.ewolnum);
            let dH = _this.num(b.holinum) !== _this.num(r.holinum);
            let dD = _this.ymd(b.enddate) !== _this.ymd(r.enddate);
            if (dE) diff.ewolnum++;
            if (dH) diff.holinum++;
            if (dD) diff.enddate++;
            r.__changed = dE || dH || dD;
          }
          if (r.__changed) changed++;

          /* 생성 결과의 날짜는 원본 yyyyMMdd 다. 조회 행과 섞어 놓으면 한 칸에서
             2027-05-22 와 20270522 가 같이 보이므로 표기를 맞춘다 */
          r.rtdate  = _this.dash(r.rtdate);
          r.enddate = _this.dash(r.enddate);

          if (b) { base[i] = r; } else { base.push(r); }
        });

        this.viewData.sourceCollection = base;
        this.viewData2.sourceCollection = [];
        $('#selectedItem2').html('');
        this.preview = {params: params, count: rows.length, changed: changed};

        /* 미리보기 중에는 조정일을 못 고치게 한다 — [저장] 하나가 두 가지를 하면 헷갈린다.
           막는 일은 −/+ 클릭 핸들러가 하고, 여기서는 회색으로 보이도록 다시 그린다 */
        this.grid.invalidate();

        let how = ('2' === String(params.createFlag) ? '신규 대상자만' : '기존 생성분까지 다시 계산')
                + ' / ' + ('0' === String(params.carryFlag) ? '<b style="color:#c0392b;">이월하지 않음</b>' : '전액 이월');

        /* 1년이 되는 해에 1년 미만 월차 잔여분을 더한 인원 (회계연도 기준에서만 생긴다).
           숫자가 갑자기 15일보다 커지는 이유를 화면에서 바로 알 수 있게 적어 준다 */
        let extraCnt = 0, extraSum = 0, firstYear = 0;
        rows.forEach(function (r) {
          let e = _this.num(r.extramonths);
          if (e > 0) { extraCnt++; extraSum += e; }
          if (_this.num(r.tenure) === 0) firstYear++;
        });

        let note = [];
        let why = [];
        if (diff.neu > 0)      why.push('신규 ' + diff.neu);
        if (diff.ewolnum > 0)  why.push('이월일 ' + diff.ewolnum);
        if (diff.holinum > 0)  why.push('연차일수 ' + diff.holinum);
        if (diff.enddate > 0)  why.push('만료일 ' + diff.enddate);
        if (why.length) note.push('달라지는 칸: ' + why.join(' / '));
        note.push('<b style="color:#c0392b;">미리보기 중에는 조정일을 고칠 수 없습니다. [검색]을 누르면 풀립니다.</b>');
        if (firstYear > 0) note.push('월차 ' + firstYear + '명');
        if (extraCnt > 0)  note.push('월차 잔여분 가산 ' + extraCnt + '명 ' + extraSum + '일');
        if (ANNUAL_BASIS === 'E') {
          let one = rows.filter(function (r) { return _this.num(r.tenure) === 1; }).length;
          if (one > 0) note.push('1년 경과 ' + one + '명은 직전 연도도 생성해야 월차 확정');
        }
        note = note.length ? '<br>' + note.join(' / ') : '';

        $('#previewNotice').html(
          '<b>저장 전 미리보기</b> — 대상 ' + rows.length + '명 중 <b>' + changed
          + '명</b> 변경(색칠된 칸). <b>[저장]</b>을 눌러야 반영됩니다.'
          + '<br>' + how + note
        ).show();

        try { this.grid.invalidate(); } catch (e) { /* 그리드를 못 찾으면 그냥 둔다 */ }
      }

      /** 미리보기로 띄운 생성 결과를 저장한다. 서버가 같은 조건으로 다시 계산해서 넣는다 */
      saveGenerated() {
        let _this = this;
        let p = this.preview;
        if (!p) return;

        // 미리보기를 띄운 뒤 조회년도를 바꿔도 저장되는 것은 미리보기 때의 연도다.
        // 화면에 보이는 숫자와 저장되는 값이 어긋나지 않도록 연도를 함께 묻는다
        let msg = (p.params.year || '') + '년도 생성 결과 ' + p.count + '명을 저장하시겠습니까?';
        if ('0' === String(p.params.carryFlag)) {
          msg += '\n\n이월하지 않도록 선택하셨습니다. 직전 연도 미사용분은 0이 됩니다.';
        }
        Alert.confirm('', msg, function () {
          AjaxUtil.postJsonData('/api/clock/Yearly/CreateSave', p.params, function (res) {
            if (res && res.success) {
              Alert.alert('', res.message || '저장되었습니다.');
              _this.searchMainData();
            } else {
              Alert.alert('', (res && res.message) ? res.message : '저장에 실패했습니다.');
            }
          });
        });
      }

      /** [저장] — 미리보기 중이면 생성 결과를, 아니면 조정일을 저장한다 */
      save() {
        if (this.preview) return this.saveGenerated();
        return this.saveAdjust();
      }

      /**
       * 연차생성 — 근속 1년 이상(연차)과 1년 미만(월차)을 한 번에 계산한다.
       * 예전에는 버튼이 둘이어서 전원 생성에 두 번 눌러야 했다.
       * 산정기준(회계연도/입사일)은 사업체 설정을 따르고 서버가 판단한다.
       *
       * <b>여기서는 저장하지 않는다.</b> 결과를 목록에 얹어 보여주고({@link #applyPreview})
       * [저장] 을 눌러야 반영된다. 생성방식 '1' 은 기존 발생일수를 덮어쓰므로,
       * 잘못 눌렀을 때 되돌릴 수 없는 것을 막으려고 두 단계로 나눴다.
       */
      generate() {
        let _this = this;

        let year = $('#year').val();
        if (!year) {
          Alert.alert('', '조회년도를 선택하세요.');
          return;
        }
        // 생성하면 목록을 다시 그리므로, 저장 안 한 조정일은 사라진다
        if (this.changedAdjustRows().length > 0) {
          Alert.alert('', '저장하지 않은 조정일이 있습니다. 먼저 저장하거나 다시 조회한 뒤 생성해 주세요.');
          return;
        }
        if (this.preview) {
          Alert.alert('', '저장하지 않은 생성 결과가 있습니다. 먼저 저장하거나 다시 조회해 주세요.');
          return;
        }

        // 다이얼로그는 .text() 로 넣으므로 태그를 쓰지 않는다
        let desc = year + '년도 연차를 계산해 미리 보여줍니다. 아직 저장하지 않습니다. '
                 + '근속 1년 이상은 근속연수로, 1년 미만은 기준일자('
                 + ($('#startdate').val() || '-') + ')까지 채운 개월수로 함께 계산합니다.';

        let name = ($('#name').val() || '').trim();
        if (name) {
          desc += ' 사원명 "' + name + '" 에 해당하는 직원만 생성합니다.';
        }

        CreateModeDialog.open('연차생성', desc, function (createFlag, carryFlag) {
          let url = '/api/clock/Yearly/Create';
          let data = {
            year: year,
            startdate: $('#startdate').val(),
            name: name,
            rtflag: $('#rtflag').val(),
            createFlag: createFlag,
            carryFlag: carryFlag,
            spjangcd: sessionStorage.getItem('spjangcd'),
          };

          AjaxUtil.postJsonData(url, data, function (res) {
            if (res && res.success) {
              // 저장하지 않는다. 목록에 얹어 보여주고 [저장] 을 기다린다
              _this.applyPreview(data, (res.data && res.data.rows) ? res.data.rows : []);
            } else {
              Alert.alert('', (res && res.message) ? res.message : '생성에 실패했습니다.');
            }
          });
        });
      }

      showDetail(item) {
        let _this = this;
        let data = {
          'id': item.id,
          year: $('#year').val(),
          spjangcd: sessionStorage.getItem('spjangcd'),
        };
        let result = AjaxUtil.getSyncData('/api/clock/Yearly/detail', data);

        let rows = (result && result.data != null) ? result.data : [];
        _this.viewData2.sourceCollection = _this.withDetailTotal(rows);
        $('#selectedItem2').html(
          rows.length ? '<b>' + (item.person_name || '') + '</b> 연차 내역'
                      : (item.person_name || '') + ' — 내역이 없습니다.'
        );
      }


    }

    /** 생성방식 선택 팝업 (PB w_pb201_card / w_pb209_card 대응) */
    const CreateModeDialog = {
      callback: null,
      open(title, desc, callback) {
        this.callback = callback;
        $('#createModeTitle').text(title);
        $('#createModeDesc').text(desc);
        // 열 때마다 기본값으로 되돌린다 — 지난번 선택이 남아 있으면 모르고 누른다
        $('input[name="createMode"][value="1"]').prop('checked', true);
        $('input[name="carryMode"][value="1"]').prop('checked', true);
        $('#createModeDim').show();
      },
      close() {
        $('#createModeDim').hide();
        this.callback = null;
      },
      confirm() {
        let flag = $('input[name="createMode"]:checked').val();
        let carry = $('input[name="carryMode"]:checked').val();
        let cb = this.callback;
        this.close();
        if (cb) cb(flag, carry);
      }
    };

    let page = null;

    $(document).ready(function (e) {
      yullinAuth.removeWriteButton();
      page = new YearlyPage();

      // 산정기준은 본사 관리 화면(사업장 DB 관리)에서 정한다.
      // 고객사 담당자는 그 화면을 볼 수 없어 지금 어느 기준으로 도는지 알 수 없으니 적어 준다.
      (function () {
        const entry = (ANNUAL_BASIS === 'E');
        $('#basisNotice').html(
          '산정기준: <b style="color:#2a6ebb;">'
          + (entry ? '입사일 기준' : '회계연도 기준') + '</b>'
          + '<span style="font-size:12px; color:#777;"> — '
          + (entry ? '사원별 입사 기념일에 발생합니다.' : '매년 1월 1일에 일괄 발생합니다.')
          + '</span>'
          + '<span style="font-size:12px; color:#aaa;"> (변경은 본사 관리자에게 요청하세요)</span>'
        );
      })();

      // 회계연도 기준이면 기간이 전원 똑같아서 자리만 차지한다
      try {
        if (ANNUAL_BASIS !== 'E') {
          const c = page.grid.columns.getColumn('enddate');
          if (c) c.visible = false;
        }
      } catch (e) { /* 그리드를 못 찾으면 그냥 보이게 둔다 */ }

      // 쓰기 권한이 없으면 조정일도 고칠 수 없게 한다.
      // 연차생성도 데이터를 바꾸므로 같이 감춘다
      try {
        if (typeof userinfo !== 'undefined' && userinfo.can_write && !userinfo.can_write()) {
          page.grid.isReadOnly = true;
          $('#btnSave').hide();
          $('#btnyearCreate').hide();
        }
      } catch (e) { /* 권한 정보를 못 읽으면 기존처럼 둔다 */ }

      AjaxUtil.fillSelectOptions($('#rtflag'), 'system_code', 'choose', '0', 'rtflag_type');

      const todayYM = CommonUtil.getYYYYMMDD().substring(0, 7);
      $('#startdate').val(todayYM);

      let select = document.getElementById('year');
      let thisYear = new Date().getFullYear();
      for (let y = thisYear; y > thisYear - 5; y--) {
        let opt = document.createElement('option');
        opt.value = y;
        opt.text = y;
        select.appendChild(opt);
      }

      select.addEventListener('change', function () {
        // 조회년도를 바꾸면 기준일자의 연도도 같이 맞춘다
        let currentMonth = ($('#startdate').val() || '').substring(5, 7) || '12';
        $('#startdate').val(this.value + '-' + currentMonth);
      });

      $('#btnSearch').click(function (ex) {
        // 미리보기를 띄운 채 조회하면 저장하지 않은 생성 결과가 사라진다
        if (page.preview) {
          Alert.confirm('', '저장하지 않은 생성 결과가 있습니다. 조회하면 사라집니다. 계속하시겠습니까?',
            function () { page.searchMainData(); });
          return;
        }
        page.searchMainData();
      });

      $('#btnyearCreate').click(function (ex) {
        page.generate();
      });
      $('#btnSave').click(function (ex) {
        page.save();
      });

      $('#createModeOk').click(function () {
        CreateModeDialog.confirm();
      });
      $('#createModeCancel').click(function () {
        CreateModeDialog.close();
      });
      $('#createModeDim').click(function (ev) {
        if (ev.target === this) CreateModeDialog.close();
      });

      page.searchMainData();
    });
  </script>

</th:block>
</html>
